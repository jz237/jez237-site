    .ops-hero {
      position: relative;

      min-height: 430px;
      display: grid;
      place-items: center;
      padding: clamp(42px,7vw,76px) clamp(18px,5vw,70px);

    }
    .ops-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 28%, rgba(41,201,255,0.18), transparent 36%),
        linear-gradient(90deg, rgba(5,14,28,0.78), transparent 45%, rgba(5,14,28,0.74));
      pointer-events: none;

    .ops-hero > * { position: relative; z-index: 1; }
    .construction-icon {
      width: 64px;
      height: 64px;
      display: inline-grid;
      place-items: center;
      margin: 0 auto 18px;
      color: #29c9ff;
      background: rgba(5,20,40,0.78);
      border: 1px solid rgba(64,164,255,0.52);
      border-radius: 18px;
      text-align: center;
      animation: uc-bob 3s ease-in-out infinite;
    }
    .construction-icon svg { width: 36px; height: 36px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes uc-bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
    .uc-actions { display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px; }
    .uc-actions a { padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:500;transition:transform 0.3s var(--ease-out), box-shadow 0.3s ease; }
    .uc-actions a:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,0.3); }
    .uc-actions a.primary { background:linear-gradient(120deg,rgba(41,201,255,0.96),rgba(141,241,79,0.88));color:#03111f !important; }
    .uc-actions a.secondary { background:rgba(255,255,255,0.06);color:var(--ink-hi) !important;border:1px solid rgba(64,164,255,0.36); }
