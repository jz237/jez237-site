<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rotating Globe Experiment</title>
  <meta name="description" content="A standalone rotating digital globe experiment." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="../../assets/brand.svg" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #01060a;
      --cyan: #45e7ff;
      --blue: #0096ff;
      --mist: #f0eff4;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 52%, rgba(22, 176, 255, 0.11), transparent 34%),
        radial-gradient(circle at 50% 108%, rgba(0, 92, 67, 0.28), transparent 48%),
        linear-gradient(180deg, #02080e 0%, #010408 48%, #020705 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.016;
      background-image:
        linear-gradient(rgba(120, 238, 255, 0.34) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120, 238, 255, 0.34) 1px, transparent 1px);
      background-size: 12px 12px;
      mix-blend-mode: screen;
      z-index: 2;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 50%, transparent 50%);
      background-size: 100% 3px;
      z-index: 2;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      cursor: grab;
      touch-action: none;
      z-index: 1;
    }

    #scene:active {
      cursor: grabbing;
    }

    @media (prefers-reduced-motion: reduce) {
      #scene {
        cursor: default;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <h1 class="visually-hidden">Rotating globe</h1>
  <canvas id="scene" aria-label="Rotating digital globe with glowing connection arcs"></canvas>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const canvas = document.querySelector("#scene");
    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true,
      preserveDrawingBuffer: true,
      powerPreference: "high-performance"
    });
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.82;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02070c, 0.018);
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    camera.position.set(0, 0.22, 7.4);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.enableZoom = true;
    controls.zoomSpeed = 0.82;
    controls.rotateSpeed = 0.42;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.9;

    const world = new THREE.Group();
    world.rotation.set(0.06, -0.55, 0);
    scene.add(world);

    const globeRadius = 2.35;
    const clock = new THREE.Clock();
    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin("anonymous");

    function loadGlobeTexture(url, colorSpace = THREE.SRGBColorSpace) {
      const texture = textureLoader.load(url, (loadedTexture) => {
        loadedTexture.colorSpace = colorSpace;
        loadedTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        loadedTexture.wrapS = THREE.RepeatWrapping;
        loadedTexture.wrapT = THREE.ClampToEdgeWrapping;
      });
      texture.colorSpace = colorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    const dayTexture = loadGlobeTexture("https://unpkg.com/three-globe@2.31.0/example/img/earth-blue-marble.jpg");
    const nightTexture = loadGlobeTexture("https://unpkg.com/three-globe@2.31.0/example/img/earth-night.jpg");
    const topologyTexture = loadGlobeTexture("https://unpkg.com/three-globe@2.31.0/example/img/earth-topology.png");
    const waterTexture = loadGlobeTexture("https://unpkg.com/three-globe@2.31.0/example/img/earth-water.png", THREE.NoColorSpace);
    const sunDirection = new THREE.Vector3(-0.92, 0.22, -0.32).normalize();

    const globe = new THREE.Mesh(
      new THREE.SphereGeometry(globeRadius, 128, 64),
      new THREE.ShaderMaterial({
        uniforms: {
          dayMap: { value: dayTexture },
          nightMap: { value: nightTexture },
          topologyMap: { value: topologyTexture },
          waterMap: { value: waterTexture },
          sunDirection: { value: sunDirection }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vWorldPosition;
          varying vec3 vWorldNormal;

          void main() {
            vUv = uv;
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            vWorldNormal = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * worldPosition;
          }
        `,
        fragmentShader: `
          uniform sampler2D dayMap;
          uniform sampler2D nightMap;
          uniform sampler2D topologyMap;
          uniform sampler2D waterMap;
          uniform vec3 sunDirection;
          varying vec2 vUv;
          varying vec3 vWorldPosition;
          varying vec3 vWorldNormal;

          float luma(vec3 color) {
            return dot(color, vec3(0.299, 0.587, 0.114));
          }

          float hash21(vec2 p) {
            p = fract(p * vec2(123.34, 345.45));
            p += dot(p, p + 34.345);
            return fract(p.x * p.y);
          }

          float noise2(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(hash21(i + vec2(0.0, 0.0)), hash21(i + vec2(1.0, 0.0)), u.x),
              mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
              u.y
            );
          }

          float fbm(vec2 p) {
            float value = 0.0;
            float amplitude = 0.5;
            for (int octave = 0; octave < 5; octave += 1) {
              value += noise2(p) * amplitude;
              p = p * 2.03 + vec2(17.1, 9.2);
              amplitude *= 0.5;
            }
            return value;
          }

          float oceanMaskAt(vec2 uv) {
            uv.x = fract(uv.x);
            uv.y = clamp(uv.y, 0.0, 1.0);
            vec3 dayColor = texture2D(dayMap, uv).rgb;
            float waterSignal = texture2D(waterMap, uv).r;
            float oceanFromColor = smoothstep(0.02, 0.18, dayColor.b - max(dayColor.r, dayColor.g) * 0.78);
            float oceanFromMask = smoothstep(0.16, 0.58, waterSignal);
            float snowMask = smoothstep(0.58, 0.82, min(min(dayColor.r, dayColor.g), dayColor.b));
            return max(oceanFromColor, oceanFromMask) * (1.0 - snowMask * 0.92);
          }

          void main() {
            vec3 normalDirection = normalize(vWorldNormal);
            vec3 sun = normalize(sunDirection);
            float sunAmount = dot(normalDirection, sun);
            float daylight = smoothstep(-0.18, 0.30, sunAmount);
            float nightSide = 1.0 - daylight;

            vec3 rawDayColor = texture2D(dayMap, vUv).rgb;
            vec3 nightColor = texture2D(nightMap, vUv).rgb;
            vec3 topoColor = texture2D(topologyMap, vUv).rgb;
            float waterSignal = texture2D(waterMap, vUv).r;
            float topoSignal = max(max(topoColor.r, topoColor.g), topoColor.b);
            float oceanFromColor = smoothstep(0.02, 0.18, rawDayColor.b - max(rawDayColor.r, rawDayColor.g) * 0.78);
            float oceanFromMask = smoothstep(0.16, 0.58, waterSignal);
            float snowMask = smoothstep(0.58, 0.82, min(min(rawDayColor.r, rawDayColor.g), rawDayColor.b));
            float polarIce = snowMask * smoothstep(0.18, 0.34, abs(vUv.y - 0.5));
            float oceanMask = max(oceanFromColor, oceanFromMask) * (1.0 - polarIce * 0.94);
            float landMask = clamp((1.0 - oceanMask) * (1.0 - snowMask * 0.45), 0.0, 1.0);

            vec3 dayColor = clamp(pow(max(rawDayColor, vec3(0.0)), vec3(0.74)) * 1.08, 0.0, 1.25);
            vec3 greenLand = vec3(dayColor.r * 0.82 + 0.015, dayColor.g * 1.30 + 0.025, dayColor.b * 0.76);
            vec3 dryLand = vec3(dayColor.r * 1.13 + 0.025, dayColor.g * 1.04, dayColor.b * 0.78);
            float dryMask = landMask * smoothstep(0.02, 0.22, dayColor.r - dayColor.g * 0.74);
            dayColor = mix(dayColor, greenLand, landMask * (1.0 - dryMask) * 0.44);
            dayColor = mix(dayColor, dryLand, dryMask * 0.34);
            vec3 snowColor = mix(vec3(0.78, 0.88, 0.94), vec3(1.0, 0.98, 0.92), smoothstep(0.66, 0.95, rawDayColor.r));
            dayColor = mix(dayColor, rawDayColor * 1.05, snowMask * 0.50);
            dayColor = mix(dayColor, snowColor, polarIce * 0.82);

            float dayFill = smoothstep(0.18, 0.76, daylight);
            float terrainRelief = smoothstep(0.08, 0.56, topoSignal) * landMask * (1.0 - snowMask * 0.6);
            float terrainValley = (1.0 - smoothstep(0.14, 0.48, topoSignal)) * landMask * (1.0 - snowMask) * dayFill;
            float dayTextureDetail = smoothstep(0.08, 0.58, luma(rawDayColor));
            float dayDetailGain = mix(0.86, 1.22, dayTextureDetail);
            dayColor *= mix(1.0, dayDetailGain, landMask * dayFill * 0.38);
            float reliefContrast = mix(0.88, 1.16, terrainRelief);
            dayColor *= mix(1.0, reliefContrast, landMask * dayFill * 0.62);
            float landShadow = landMask * (1.0 - snowMask) * (1.0 - smoothstep(0.10, 0.30, luma(dayColor)));
            dayColor += vec3(0.040, 0.060, 0.035) * landShadow * dayFill;
            dayColor -= vec3(0.035, 0.040, 0.026) * terrainValley;
            dayColor += vec3(0.18, 0.155, 0.105) * terrainRelief * (0.26 + daylight * 1.05);
            dayColor += vec3(0.012, 0.026, 0.020) * landMask * smoothstep(0.18, 0.52, luma(dayColor));
            dayColor = max(dayColor, vec3(0.068, 0.088, 0.062) * landMask * dayFill);
            dayColor = clamp(dayColor, 0.0, 1.35);

            float cityLightLevel = max(max(nightColor.r, nightColor.g), nightColor.b);
            float cityFine = pow(smoothstep(0.022, 0.34, cityLightLevel), 1.45);
            float cityCore = pow(smoothstep(0.13, 0.58, cityLightLevel), 1.08);
            float cityMask = clamp(cityFine * 0.62 + cityCore * 1.18, 0.0, 1.0);
            float cityVisibility = 0.52 + nightSide * 1.78;

            float oceanBrightness = luma(rawDayColor);
            float oceanBlueBias = clamp(rawDayColor.b - rawDayColor.r * 0.42, 0.0, 1.0);
            float depthTone = clamp(oceanBrightness * 2.15 + oceanBlueBias * 0.38 + waterSignal * 0.08, 0.0, 1.0);
            float nearbyWater = min(
              min(oceanMaskAt(vUv + vec2(0.0022, 0.0)), oceanMaskAt(vUv - vec2(0.0022, 0.0))),
              min(oceanMaskAt(vUv + vec2(0.0, 0.0022)), oceanMaskAt(vUv - vec2(0.0, 0.0022)))
            );
            float diagonalWater = min(
              min(oceanMaskAt(vUv + vec2(0.0035, 0.0020)), oceanMaskAt(vUv - vec2(0.0035, 0.0020))),
              min(oceanMaskAt(vUv + vec2(0.0020, -0.0035)), oceanMaskAt(vUv - vec2(0.0020, -0.0035)))
            );
            float shorelineProximity = 1.0 - min(nearbyWater, diagonalWater);
            float coastShelf = oceanMask * pow(smoothstep(0.36, 0.92, shorelineProximity), 2.0);
            float shelfByColor = oceanMask * smoothstep(
              0.30,
              0.72,
              rawDayColor.g * 0.86 + rawDayColor.b * 0.56 - rawDayColor.r * 0.32
            );
            float shelf = clamp(max(coastShelf * 0.62, shelfByColor * 0.36), 0.0, 1.0);
            float deepWater = oceanMask * (1.0 - smoothstep(0.105, 0.31, oceanBrightness));
            float seafloorFine = fbm(vec2(vUv.x * 46.0, vUv.y * 23.0));
            float seafloorBroad = fbm(vec2(vUv.x * 9.0 + 12.4, vUv.y * 5.4 - 3.8));
            float ridgeWave = sin((vUv.x + seafloorBroad * 0.032) * 83.0 + sin(vUv.y * 21.0) * 1.55);
            float ridgeLines = pow(1.0 - abs(ridgeWave), 5.0) * smoothstep(0.18, 0.92, seafloorBroad);
            float bathyRelief = oceanMask * (
              (seafloorFine - 0.5) * 0.18 +
              (seafloorBroad - 0.5) * 0.26 +
              smoothstep(0.08, 0.58, topoSignal) * 0.20 +
              ridgeLines * 0.15
            );
            vec3 rawOceanTone = clamp(pow(max(rawDayColor, vec3(0.0)), vec3(0.78)) * vec3(0.70, 1.10, 1.48), 0.0, 1.32);
            vec3 deepOcean = vec3(0.004, 0.034, 0.118);
            vec3 basinOcean = vec3(0.006, 0.082, 0.235);
            vec3 midOcean = vec3(0.018, 0.180, 0.430);
            vec3 shelfOcean = vec3(0.038, 0.430, 0.780);
            vec3 oceanDay = mix(deepOcean, basinOcean, smoothstep(0.04, 0.22, depthTone));
            oceanDay = mix(oceanDay, midOcean, smoothstep(0.20, 0.56, depthTone));
            oceanDay = mix(oceanDay, shelfOcean, shelf * 0.58);
            oceanDay = mix(oceanDay, rawOceanTone, 0.52 + shelf * 0.22);
            oceanDay += vec3(0.000, 0.105, 0.215) * bathyRelief;
            oceanDay += vec3(0.010, 0.120, 0.210) * coastShelf * 0.22;
            oceanDay -= vec3(0.000, 0.022, 0.066) * deepWater * (1.0 - shelf * 0.45);
            oceanDay += vec3(0.000, 0.052, 0.105) * smoothstep(0.34, 0.82, daylight) * oceanMask;
            oceanDay = clamp(oceanDay, vec3(0.004, 0.030, 0.090), vec3(0.12, 0.62, 1.0));

            vec3 oceanNight = mix(vec3(0.003, 0.022, 0.070), vec3(0.008, 0.064, 0.165), depthTone);
            oceanNight = mix(oceanNight, oceanDay * 0.42, shelf * 0.38);
            oceanNight += vec3(0.000, 0.034, 0.090) * bathyRelief;

            vec3 landDark = dayColor * vec3(0.20, 0.22, 0.21) + vec3(0.0, 0.012, 0.020);
            vec3 landLit = dayColor * vec3(0.92, 1.06, 1.00) + vec3(0.018, 0.025, 0.018) * landMask;
            landDark = mix(landDark, snowColor * vec3(0.36, 0.38, 0.40), polarIce * 0.86);
            landLit = mix(landLit, snowColor * vec3(1.08, 1.05, 0.98), polarIce * 0.92);
            vec3 darkSurface = mix(landDark, oceanNight, oceanMask);
            vec3 litSurface = mix(landLit, oceanDay, oceanMask);
            vec3 warmCities = (
              nightColor * vec3(2.35, 1.52, 0.62) +
              vec3(0.12, 0.055, 0.012) * cityCore
            ) * cityMask * cityVisibility * 10.2;

            vec3 viewDirection = normalize(cameraPosition - vWorldPosition);
            float edge = 1.0 - abs(dot(normalDirection, viewDirection));
            float rim = pow(smoothstep(0.18, 1.0, edge), 2.1);
            float terminator = smoothstep(-0.12, 0.05, sunAmount) * (1.0 - smoothstep(0.05, 0.24, sunAmount));

            vec3 color = mix(darkSurface, litSurface, daylight);
            float sunlitLand = landMask * (1.0 - snowMask) * smoothstep(-0.04, 0.24, sunAmount);
            float sunlitShadow = sunlitLand * (1.0 - smoothstep(0.09, 0.25, luma(color)));
            color += vec3(0.032, 0.046, 0.030) * sunlitShadow;
            color = max(color, vec3(0.066, 0.086, 0.058) * sunlitLand);
            color += warmCities;
            color += vec3(0.02, 0.14, 0.22) * rim * 0.32;
            color += vec3(0.10, 0.27, 0.32) * terminator * 0.22;

            gl_FragColor = vec4(color, 1.0);
          }
        `
      })
    );
    globe.rotation.y = -Math.PI / 2;
    world.add(globe);

    const waterSheen = new THREE.Mesh(
      new THREE.SphereGeometry(globeRadius * 1.003, 128, 64),
      new THREE.MeshBasicMaterial({
        color: 0x2fb8ff,
        alphaMap: waterTexture,
        transparent: true,
        opacity: 0.06,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    waterSheen.rotation.copy(globe.rotation);
    world.add(waterSheen);

    const topology = new THREE.Mesh(
      new THREE.SphereGeometry(globeRadius * 1.007, 128, 64),
      new THREE.MeshBasicMaterial({
        color: 0xd8ead8,
        alphaMap: topologyTexture,
        transparent: true,
        opacity: 0.084,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    topology.rotation.copy(globe.rotation);
    world.add(topology);

    function makeCityLightMaterial(lightColor, opacity, gain) {
      return new THREE.ShaderMaterial({
        uniforms: {
          nightMap: { value: nightTexture },
          sunDirection: { value: sunDirection },
          lightColor: { value: new THREE.Color(lightColor) },
          opacity: { value: opacity },
          gain: { value: gain }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vWorldNormal;

          void main() {
            vUv = uv;
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldNormal = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * worldPosition;
          }
        `,
        fragmentShader: `
          uniform sampler2D nightMap;
          uniform vec3 sunDirection;
          uniform vec3 lightColor;
          uniform float opacity;
          uniform float gain;
          varying vec2 vUv;
          varying vec3 vWorldNormal;

          void main() {
            vec3 normalDirection = normalize(vWorldNormal);
            float daylight = smoothstep(-0.08, 0.22, dot(normalDirection, normalize(sunDirection)));
            float nightSide = 1.0 - daylight;
            vec3 nightColor = texture2D(nightMap, vUv).rgb;
            float lightLevel = max(max(nightColor.r, nightColor.g), nightColor.b);
            float fineLights = pow(smoothstep(0.022, 0.34, lightLevel), 1.55);
            float hotLights = pow(smoothstep(0.14, 0.62, lightLevel), 1.05);
            float lightMask = clamp(fineLights * 0.58 + hotLights * 1.16, 0.0, 1.0);
            float lightVisibility = 0.46 + nightSide * 1.64;
            float colorBoost = 0.88 + nightSide * 1.78;
            float alpha = lightMask * lightVisibility * opacity;
            gl_FragColor = vec4(lightColor * nightColor * gain * colorBoost, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
    }

    const cityLights = new THREE.Mesh(
      new THREE.SphereGeometry(globeRadius * 1.008, 128, 64),
      makeCityLightMaterial(0xffe2a2, 1.24, 13.0)
    );
    cityLights.rotation.copy(globe.rotation);
    cityLights.renderOrder = 6;
    world.add(cityLights);

    const cityBloom = new THREE.Mesh(
      new THREE.SphereGeometry(globeRadius * 1.011, 128, 64),
      makeCityLightMaterial(0x7eeaff, 0.065, 1.5)
    );
    cityBloom.rotation.copy(globe.rotation);
    cityBloom.renderOrder = 6.2;
    world.add(cityBloom);

    function makeCloudTexture() {
      const width = 1024;
      const height = 512;
      const cloudCanvas = document.createElement("canvas");
      cloudCanvas.width = width;
      cloudCanvas.height = height;
      const ctx = cloudCanvas.getContext("2d");

      function clamp01(value) {
        return Math.min(1, Math.max(0, value));
      }

      function smoothstep(edge0, edge1, value) {
        const t = clamp01((value - edge0) / (edge1 - edge0));
        return t * t * (3 - 2 * t);
      }

      function hash2(x, y) {
        const value = Math.sin(x * 127.1 + y * 311.7 + 93237.17) * 43758.5453123;
        return value - Math.floor(value);
      }

      function valueNoise(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = x - ix;
        const fy = y - iy;
        const ux = fx * fx * (3 - 2 * fx);
        const uy = fy * fy * (3 - 2 * fy);
        const a = hash2(ix, iy);
        const b = hash2(ix + 1, iy);
        const c = hash2(ix, iy + 1);
        const d = hash2(ix + 1, iy + 1);
        return (a * (1 - ux) + b * ux) * (1 - uy) + (c * (1 - ux) + d * ux) * uy;
      }

      function fbm2(x, y, octaves) {
        let value = 0;
        let amplitude = 0.5;
        let total = 0;
        for (let octave = 0; octave < octaves; octave += 1) {
          value += valueNoise(x, y) * amplitude;
          total += amplitude;
          x = x * 2.04 + 19.7;
          y = y * 2.01 - 7.3;
          amplitude *= 0.52;
        }
        return value / total;
      }

      const image = ctx.createImageData(width, height);
      const data = image.data;
      for (let y = 0; y < height; y += 1) {
        const v = y / height;
        const lat = (0.5 - v) * Math.PI;
        const equatorFade = Math.pow(Math.cos(lat), 0.42);
        const polarFade = smoothstep(0.05, 0.22, v) * (1 - smoothstep(0.78, 0.95, v));
        const jetNorth = Math.exp(-Math.pow((v - 0.34) / 0.07, 2));
        const jetSouth = Math.exp(-Math.pow((v - 0.67) / 0.075, 2));
        const tropical = Math.exp(-Math.pow((v - 0.51) / 0.12, 2));

        for (let x = 0; x < width; x += 1) {
          const u = x / width;
          const shear = Math.sin(v * Math.PI * 7.0 + u * Math.PI * 2.0) * 0.13;
          const broad = fbm2(u * 5.1 + shear, v * 3.1, 5);
          const wisps = fbm2(u * 18.0 + broad * 2.8, v * 9.0 + shear, 4);
          const fine = fbm2(u * 46.0 + wisps * 1.7, v * 22.0, 3);
          const streaks = Math.pow(smoothstep(0.40, 0.82, wisps), 1.45);
          const broken = Math.pow(smoothstep(0.34, 0.92, fine), 1.9);
          const bands = jetNorth * 0.24 + jetSouth * 0.22 + tropical * 0.16;
          const cover = broad * 0.58 + streaks * 0.35 + broken * 0.18 + bands - 0.50;
          let alpha = smoothstep(0.04, 0.31, cover) * polarFade * (0.54 + equatorFade * 0.46);

          const index = (y * width + x) * 4;
          const white = Math.round(214 + alpha * 41);
          data[index] = white;
          data[index + 1] = white;
          data[index + 2] = white;
          data[index + 3] = Math.round(clamp01(alpha) * 255);
        }
      }

      texture.colorSpace = THREE.NoColorSpace;

    function makeCloudMaterial(cloudTexture) {

        vertexShader: `
          varying vec2 vUv;
          varying vec3 vWorldPosition;
          varying vec3 vWorldNormal;

          void main() {
            vUv = uv;
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            vWorldNormal = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * worldPosition;

          uniform sampler2D cloudMap;

          uniform float opacity;
          varying vec2 vUv;
          varying vec3 vWorldPosition;
          varying vec3 vWorldNormal;

          void main() {
            vec3 normalDirection = normalize(vWorldNormal);
            vec3 sun = normalize(sunDirection);
            float daylight = smoothstep(-0.14, 0.36, dot(normalDirection, sun));
            vec3 viewDirection = normalize(cameraPosition - vWorldPosition);
            float rim = pow(smoothstep(0.38, 1.0, 1.0 - abs(dot(normalDirection, viewDirection))), 1.7);
            vec4 cloud = texture2D(cloudMap, vUv);
            float coverage = smoothstep(0.04, 0.72, cloud.a);
            float alpha = coverage * opacity * (0.42 + daylight * 0.62) * (0.86 + rim * 0.42);
            vec3 cloudColor = mix(vec3(0.45, 0.56, 0.62), vec3(1.0, 0.98, 0.92), daylight);
            cloudColor += vec3(0.08, 0.18, 0.20) * rim;
            gl_FragColor = vec4(cloudColor, alpha);

      const color = new THREE.Color(hexColor);
      const rgb = `${Math.round(color.r * 255)}, ${Math.round(color.g * 255)}, ${Math.round(color.b * 255)}`;
      const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      gradient.addColorStop(0, `rgba(${rgb}, 1)`);
      gradient.addColorStop(0.12, `rgba(${rgb}, 0.88)`);
      gradient.addColorStop(0.32, `rgba(${rgb}, 0.22)`);
      gradient.addColorStop(1, `rgba(${rgb}, 0)`);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      const texture = new THREE.CanvasTexture(textureCanvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;

      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (!reduceMotion) {

          controls.autoRotateSpeed,
          targetAutoRotateSpeed,

      for (const marker of markers) {

        item.arc.material.opacity = item.arc.userData.baseOpacity + Math.sin(elapsed * 1.55 + item.phase) * 0.065;
        item.arc.material.dashOffset = -elapsed * item.arc.userData.dashSpeed;

        ring.rotation.z += delta * ring.userData.speed;
        ring.material.opacity = ring.userData.baseOpacity + Math.sin(elapsed * 0.9 + ring.userData.phase) * 0.01;

        const t = (runner.userData.offset + elapsed * runner.userData.speed) % 1;

        runner.scale.setScalar(runner.userData.baseScale * (0.46 + 0.88 * taper));
        runner.material.opacity = 0.22 + 0.7 * taper;

      stars.rotation.y = elapsed * 0.006;
      stars.rotation.x = Math.sin(elapsed * 0.08) * 0.018;

      controls.update();
      renderer.render(scene, camera);
