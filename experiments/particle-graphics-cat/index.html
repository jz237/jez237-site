<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Particle Graphics Cat</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f1e8;
      --muted: #beb8af;
      --panel: rgba(14, 17, 22, 0.72);
      --line: rgba(255, 255, 255, 0.12);
      --aqua: #66dfd0;
      --gold: #f6c85f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0f1218;
      color: var(--ink);
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #scene:active {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      inset: 18px 20px auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .title {
      max-width: min(430px, 58vw);
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 3rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .title p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(0.82rem, 1.6vw, 1rem);
      line-height: 1.5;
    }

    .controls {
      width: min(392px, 44vw);
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.32);
      pointer-events: auto;
    }

    .controls summary {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--ink);
      cursor: pointer;
      list-style: none;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .controls summary::-webkit-details-marker {
      display: none;
    }

    .controls summary::after {
      content: "+";
      width: 22px;
      height: 22px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      color: var(--aqua);
      font-size: 1rem;
      line-height: 1;
    }

    .controls[open] summary {
      margin-bottom: 12px;
    }

    .controls[open] summary::after {
      content: "-";
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      color: #10151a;
      background: var(--aqua);
      border-color: transparent;
    }

    .field {
      display: grid;
      grid-template-columns: 74px 1fr 42px;
      align-items: center;
      min-height: 32px;
      gap: 10px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--gold);
    }

    output {
      color: var(--ink);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .stats {
      position: fixed;
      left: 20px;
      bottom: 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: none;
    }

    .stat {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(14, 17, 22, 0.6);
      color: var(--muted);
      backdrop-filter: blur(12px);
      font-size: 0.78rem;
    }

    .stat strong {
      color: var(--ink);
      font-weight: 700;
    }

    .credit {
      position: fixed;
      right: 18px;
      bottom: 16px;
      color: rgba(247, 241, 232, 0.5);
      font-size: 0.74rem;
      pointer-events: none;
    }

    @media (max-width: 720px) {
      .hud {
        inset: 12px 12px auto;
        flex-direction: column;
      }

      .title {
        max-width: 100%;
      }

      .title p {
        display: none;
      }

      .controls {
        width: 100%;
        padding: 10px;
      }

      .field {
        grid-template-columns: 62px 1fr 36px;
      }

      button {
        font-size: 0.82rem;
      }

      .stats {
        left: 12px;
        right: 12px;
        bottom: 12px;
      }

      .credit {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Animated particle cat demo"></canvas>

  <main class="hud">
    <section class="title" aria-label="Demo title">
      <h1>Particle Graphics Cat</h1>
      <p>A playful particle cat with big blinking muppet eyes, pale pink ears, whiskers, paws, and a dark crown marking.</p>
    </section>

    <details class="controls" aria-label="Particle controls">
      <summary>Controls</summary>
      <div class="button-row">
        <button id="pause" type="button" aria-pressed="false" title="Pause or resume animation">Pause</button>
        <button id="spin" type="button" aria-pressed="true" title="Toggle automatic turntable">Spin</button>
        <button id="walk" type="button" aria-pressed="true" title="Toggle walking motion">Walk</button>
        <button id="glow" type="button" aria-pressed="false" title="Toggle stronger particle glow">Glow</button>
      </div>
      <label class="field">
        Speed
        <input id="speed" type="range" min="0.1" max="2.4" value="1" step="0.05" />
        <output id="speedValue">1.00</output>
      </label>
      <label class="field">
        Size
        <input id="size" type="range" min="0.45" max="1.65" value="0.74" step="0.01" />
        <output id="sizeValue">0.74</output>
      </label>
      <label class="field">
        Zoom
        <input id="zoom" type="range" min="8.5" max="32" value="18.8" step="0.1" />
        <output id="zoomValue">18.8</output>
      </label>
      <label class="field">
        Hue
        <input id="hue" type="range" min="-180" max="180" value="0" step="1" />
        <output id="hueValue">0</output>
      </label>
      <label class="field">
        Patch
        <input id="patch" type="range" min="0" max="2.2" value="1.45" step="0.05" />
        <output id="patchValue">1.45</output>
      </label>
    </details>
  </main>

  <aside class="stats" aria-label="Particle statistics">
    <span class="stat"><strong id="particleCount">0</strong> particles</span>
    <span class="stat"><strong>GPU</strong> animated</span>
    <span class="stat"><strong>3D</strong> orbit</span>
  </aside>

  <div class="credit">drag to orbit | pinch or wheel to zoom</div>

  <script type="module">
    import * as THREE from "./three.module.js";

    const canvas = document.querySelector("#scene");
    const pauseButton = document.querySelector("#pause");
    const spinButton = document.querySelector("#spin");
    const walkButton = document.querySelector("#walk");
    const glowButton = document.querySelector("#glow");
    const speedInput = document.querySelector("#speed");
    const sizeInput = document.querySelector("#size");
    const zoomInput = document.querySelector("#zoom");
    const hueInput = document.querySelector("#hue");
    const patchInput = document.querySelector("#patch");
    const speedValue = document.querySelector("#speedValue");
    const sizeValue = document.querySelector("#sizeValue");
    const zoomValue = document.querySelector("#zoomValue");
    const hueValue = document.querySelector("#hueValue");
    const patchValue = document.querySelector("#patchValue");
    const particleCount = document.querySelector("#particleCount");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1218);
    scene.fog = new THREE.Fog(0x0f1218, 18, 44);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    camera.position.set(11, 6.6, 12);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(86, 86),
      new THREE.MeshBasicMaterial({ color: 0x171c23, transparent: true, opacity: 0.86 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -2.92;
    scene.add(floor);

    const grid = new THREE.GridHelper(42, 42, 0x2fd8c5, 0x27323a);
    grid.position.y = -2.9;
    scene.add(grid);

    const palette = {
      fur: new THREE.Color(0xf4f0ea),
      furLight: new THREE.Color(0xfffcf5),
      furShadow: new THREE.Color(0xd8d4cc),
      white: new THREE.Color(0xfbF8f1),
      eyeWhite: new THREE.Color(0xfffbef),
      cream: new THREE.Color(0xe8e0d2),
      crown: new THREE.Color(0x24272a),
      pink: new THREE.Color(0xe8b4ae),
      nose: new THREE.Color(0xc99a9a),
      noseDark: new THREE.Color(0x3a2325),
      eye: new THREE.Color(0xa7b29b),
      eyeDark: new THREE.Color(0x111719),
      whisker: new THREE.Color(0xfffbf0),
      collar: new THREE.Color(0xbec8ba),
      bell: new THREE.Color(0xdfc27b),
      yarn: new THREE.Color(0x9d9182),
      spark: new THREE.Color(0xcfc7b8)
    };

    function mulberry32(seed) {
      return function random() {
        let t = seed += 0x6d2b79f5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const rand = mulberry32(982451653);
    const positions = [];
    const colors = [];
    const sizes = [];
    const regions = [];
    const seeds = [];

    function pushPoint(x, y, z, color, size, region, jitter = 0) {
      if (jitter > 0) {
        x += (rand() - 0.5) * jitter;
        y += (rand() - 0.5) * jitter;
        z += (rand() - 0.5) * jitter;
      }
      positions.push(x, y, z);
      const c = color.clone();
      const lift = (rand() - 0.5) * 0.18;
      c.offsetHSL(0, 0, lift);
      colors.push(c.r, c.g, c.b);
      sizes.push(size * (0.72 + rand() * 0.62));
      regions.push(region);
      seeds.push(rand() * 1000);
    }

    function surfacePointOnEllipsoid(center, radius) {
      const u = rand();
      const v = rand();
      const theta = Math.PI * 2 * u;
      const phi = Math.acos(2 * v - 1);
      const x = Math.sin(phi) * Math.cos(theta);
      const y = Math.cos(phi);
      const z = Math.sin(phi) * Math.sin(theta);
      return [
        center[0] + x * radius[0],
        center[1] + y * radius[1],
        center[2] + z * radius[2],
        x,
        y,
        z
      ];
    }

    function addEllipsoid(center, radius, count, region, colorFn, size = 18, jitter = 0.045) {
      for (let i = 0; i < count; i++) {
        const p = surfacePointOnEllipsoid(center, radius);
        pushPoint(p[0], p[1], p[2], colorFn(p[0], p[1], p[2], p[3], p[4], p[5]), size, region, jitter);
      }
    }

    function addFilledEllipsoid(center, radius, count, region, color, size = 16, jitter = 0.02) {
      for (let i = 0; i < count; i++) {
        const p = surfacePointOnEllipsoid([0, 0, 0], [1, 1, 1]);
        const scale = Math.cbrt(rand());
        pushPoint(
          center[0] + p[0] * radius[0] * scale,
          center[1] + p[1] * radius[1] * scale,
          center[2] + p[2] * radius[2] * scale,
          color,
          size,
          region,
          jitter
        );
      }
    }

    function addLine(from, to, count, region, color, size = 11, jitter = 0.025) {
      for (let i = 0; i < count; i++) {
        const t = count === 1 ? 0 : i / (count - 1);
        pushPoint(
          from[0] + (to[0] - from[0]) * t,
          from[1] + (to[1] - from[1]) * t,
          from[2] + (to[2] - from[2]) * t,
          color,
          size,
          region,
          jitter
        );
      }
    }

    function addTriangleSurface(a, b, c, count, region, colorFn, size = 17, jitter = 0.035) {
      for (let i = 0; i < count; i++) {
        let r1 = rand();
        let r2 = rand();
        if (r1 + r2 > 1) {
          r1 = 1 - r1;
          r2 = 1 - r2;
        }
        const r3 = 1 - r1 - r2;
        const x = a[0] * r1 + b[0] * r2 + c[0] * r3;
        const y = a[1] * r1 + b[1] * r2 + c[1] * r3;
        const z = a[2] * r1 + b[2] * r2 + c[2] * r3;
        pushPoint(x, y, z, colorFn(x, y, z), size, region, jitter);
      }
    }

    function organicFurColor(x, y, z) {
      const belly = y < -0.95 && Math.abs(z) < 0.82;
      const flankShadow = Math.abs(z) > 1.05 || y < -0.55;
      if (belly || rand() > 0.78) return palette.white;
      if (flankShadow && rand() > 0.46) return palette.furShadow;
      if (rand() > 0.5) return palette.furLight;
      return palette.fur;
    }

    function addOrganicBody() {
      const count = 82000;
      for (let i = 0; i < count; i++) {
        const t = rand();
        const x = -4.15 + t * 7.25;
        const ring = rand() * Math.PI * 2;
        const shoulder = Math.exp(-Math.pow((t - 0.78) / 0.18, 2));
        const haunch = Math.exp(-Math.pow((t - 0.18) / 0.2, 2));
        const taper = Math.sin(Math.PI * Math.max(0.04, Math.min(0.96, t)));
        const ry = 0.72 + 0.45 * taper + 0.22 * shoulder + 0.28 * haunch;
        const rz = 0.58 + 0.62 * taper + 0.18 * shoulder + 0.24 * haunch;
        const centerY = -0.06 + 0.28 * Math.sin(Math.PI * t) + 0.1 * shoulder - 0.06 * haunch;
        const backLift = Math.max(0, Math.sin(ring)) * (0.32 + 0.18 * shoulder);
        const bellyDrop = Math.max(0, -Math.sin(ring)) * (0.12 + 0.08 * haunch);
        const y = centerY + Math.sin(ring) * ry + backLift - bellyDrop;
        const z = Math.cos(ring) * rz * (0.92 + 0.08 * Math.sin(t * Math.PI * 2));
        pushPoint(x, y, z, organicFurColor(x, y, z), 17, 1, 0.045);
      }

      addEllipsoid([-2.65, 0.2, 0], [1.05, 1.3, 1.2], 15000, 1, organicFurColor, 17, 0.04);
      addEllipsoid([2.55, 0.32, 0], [1.05, 1.32, 1.16], 15500, 1, organicFurColor, 17, 0.04);
      addEllipsoid([3.32, 0.72, 0], [0.74, 0.78, 0.88], 8500, 1, organicFurColor, 16, 0.035);
    }

    function addOrganicLeg(x, z, phase, front = false) {
      const hipY = front ? -0.55 : -0.48;
      const pawX = x + (front ? 0.34 : 0.26);
      const pawZ = z + (z > 0 ? 0.08 : -0.08);
      for (let i = 0; i < 9500; i++) {
        const t = rand();
        const ring = rand() * Math.PI * 2;
        const bend = Math.sin(t * Math.PI);
        const legX = x + (front ? 0.16 : -0.12) * t + Math.sin(t * Math.PI * 0.8) * (front ? 0.2 : -0.16);
        const legY = hipY - t * 1.95 + bend * 0.18;
        const radius = 0.34 - t * 0.13 + (front ? 0.02 : 0.05);
        pushPoint(
          legX + Math.cos(ring) * radius * 0.62,
          legY + Math.sin(ring) * radius,
          z + Math.cos(ring + Math.PI / 2) * radius * 0.7,
          t > 0.8 || rand() > 0.35 ? palette.white : palette.furShadow,
          15,
          5 + phase,
          0.026
        );
      }
      addFilledEllipsoid([pawX + 0.08, -2.78, pawZ], [0.72, 0.13, 0.3], 4300, 5 + phase, palette.white, 15, 0.012);
      for (const toe of [-0.15, 0, 0.15]) {
        addFilledEllipsoid([pawX + 0.52, -2.86, pawZ + toe], [0.062, 0.03, 0.045], 190, 5 + phase, palette.pink, 13, 0.004);
      }
    }

    function addFaceEye(side) {
      const z = side * 0.31;
      addFilledEllipsoid([5.86, 1.22, z], [0.24, 0.38, 0.058], 1650, 6, palette.eyeDark, 23, 0.003);
      addFilledEllipsoid([5.93, 1.22, z], [0.2, 0.32, 0.045], 2850, 6, palette.eyeWhite, 23, 0.003);
      addFilledEllipsoid([6.07, 1.1, z + side * 0.012], [0.07, 0.16, 0.018], 980, 6, palette.eyeDark, 22, 0.002);
      addFilledEllipsoid([6.1, 1.19, z - side * 0.004], [0.025, 0.043, 0.008], 180, 6, palette.white, 20, 0.001);
    }

    function addOrganicHead() {
      addEllipsoid([4.48, 1.25, 0], [1.16, 1.0, 1.04], 33000, 2, headColor, 16, 0.035);
      addEllipsoid([4.98, 0.96, -0.55], [0.44, 0.38, 0.38], 7000, 2, () => palette.white, 15, 0.024);
      addEllipsoid([4.98, 0.96, 0.55], [0.44, 0.38, 0.38], 7000, 2, () => palette.white, 15, 0.024);
      addEllipsoid([5.48, 0.72, 0], [0.54, 0.34, 0.62], 12000, 2, () => palette.white, 15, 0.028);
      addFilledEllipsoid([5.88, 0.78, 0], [0.14, 0.085, 0.19], 1100, 2, palette.nose, 16, 0.014);
      addFilledEllipsoid([5.98, 0.7, 0], [0.052, 0.052, 0.08], 320, 2, palette.noseDark, 17, 0.005);
      addFaceEye(-1);
      addFaceEye(1);

      const earL = [[3.72, 1.95, -0.64], [4.34, 3.62, -0.98], [5.02, 1.92, -1.06]];
      const earR = [[3.72, 1.95, 0.64], [4.34, 3.62, 0.98], [5.02, 1.92, 1.06]];
      addTriangleSurface(...earL, 15000, 3, () => rand() > 0.7 ? palette.furShadow : palette.white, 16, 0.032);
      addTriangleSurface(...earR, 15000, 3, () => rand() > 0.7 ? palette.furShadow : palette.white, 16, 0.032);
      addTriangleSurface([3.95, 2.1, -0.78], [4.42, 3.18, -0.94], [4.84, 2.08, -0.96], 5800, 3, () => palette.pink, 15, 0.022);
      addTriangleSurface([3.95, 2.1, 0.78], [4.42, 3.18, 0.94], [4.84, 2.08, 0.96], 5800, 3, () => palette.pink, 15, 0.022);
    }

    function addTail() {
      const steps = 36000;
      for (let i = 0; i < steps; i++) {
        const t = rand();
        const angle = t * Math.PI * 1.2;
        const center = [
          -4.02 - t * 1.68 + Math.sin(t * Math.PI) * 0.42,
          -0.08 + Math.sin(t * Math.PI * 0.72) * 2.35,
          0.08 + Math.sin(angle) * 0.48
        ];
        const ring = rand() * Math.PI * 2;
        const tube = 0.3 - t * 0.08 + 0.08 * Math.sin(t * Math.PI);
        const x = center[0] + Math.cos(ring) * tube * 0.58;
        const y = center[1] + Math.sin(ring) * tube;
        const z = center[2] + Math.cos(ring + Math.PI / 2) * tube;
        const color = rand() > 0.78 ? palette.furShadow : rand() > 0.46 ? palette.furLight : palette.fur;
        pushPoint(x, y, z, color, 17, 4, 0.035);
      }
    }

    function addYarn() {
      addFilledEllipsoid([5.45, -2.28, -3.55], [0.7, 0.7, 0.7], 4200, 0, palette.yarn, 16, 0.02);
      for (let i = 0; i < 1100; i++) {
        const t = i / 1099;
        const angle = t * Math.PI * 11;
        const r = 0.72 + Math.sin(t * 21) * 0.08;
        pushPoint(
          5.45 + Math.cos(angle) * r,
          -2.28 + Math.sin(t * Math.PI * 4) * 0.44,
          -3.55 + Math.sin(angle) * r,
          i % 2 ? palette.pink : palette.nose,
          13,
          0,
          0.018
        );
      }
      addLine([5.2, -2.45, -3.0], [4.7, -2.56, -1.1], 420, 0, palette.pink, 10, 0.03);
    }

    function addSparkles() {
      for (let i = 0; i < 760; i++) {
        pushPoint(
          (rand() - 0.5) * 26,
          rand() * 11 + 0.2,
          (rand() - 0.5) * 22,
          palette.spark,
          5 + rand() * 8,
          0,
          0
        );
      }
    }

    function furColor(x, y, z, nx, ny, nz) {
      const underside = y < -0.86 && Math.abs(z) < 0.78 && x > -3.1;
      const softShadow = y < -0.42 || Math.abs(z) > 1.18;
      if (underside || rand() > 0.76) return palette.white;
      if (softShadow && rand() > 0.56) return palette.furShadow;
      if (rand() > 0.55) return palette.furLight;
      return palette.fur;
    }

    function headColor(x, y, z) {
      const muzzleZone = x > 4.9 && y < 1.05 && Math.abs(z) < 0.88;
      if (muzzleZone) return palette.white;
      if (rand() > 0.72) return palette.white;
      if (rand() > 0.54) return palette.furLight;
      return palette.fur;
    }

    function addCrownPatch() {
      const center = [4.34, 1.18, 0];
      const radius = [1.35, 1.18, 1.22];
      const addSurfacePatch = (offsetX, offsetZ, widthX, widthZ, count, size) => {
        for (let i = 0; i < count; i++) {
          const angle = rand() * Math.PI * 2;
          const spread = Math.sqrt(rand());
          const x = center[0] + offsetX + Math.cos(angle) * widthX * spread;
          const z = center[2] + offsetZ + Math.sin(angle) * widthZ * spread;
          const nx = (x - center[0]) / radius[0];
          const nz = (z - center[2]) / radius[2];
          const cap = Math.max(0.08, 1 - nx * nx - nz * nz);
          const y = center[1] + Math.sqrt(cap) * radius[1] + 0.075;
          pushPoint(x, y, z, palette.crown, size, 8, 0.018);
        }
      };

      addSurfacePatch(0.02, 0, 0.72, 0.48, 9200, 19);
      addSurfacePatch(0.44, -0.22, 0.35, 0.23, 2600, 18);
      addSurfacePatch(-0.42, 0.24, 0.36, 0.23, 2400, 18);
      addSurfacePatch(0.22, 0.18, 0.38, 0.24, 2600, 18);
      addFilledEllipsoid([4.36, 2.22, 0], [0.64, 0.08, 0.42], 2600, 8, palette.crown, 18, 0.008);
    }

    function buildCat() {
      addOrganicBody();
      addOrganicHead();
      addCrownPatch();
      addOrganicLeg(2.72, -0.82, 0.0, true);
      addOrganicLeg(2.72, 0.82, 0.25, true);
      addOrganicLeg(-2.55, -0.88, 0.5, false);
      addOrganicLeg(-2.55, 0.88, 0.75, false);

      addTail();

      for (const side of [-1, 1]) {
        addLine([5.74, 0.72, side * 0.34], [6.92, 0.82, side * 1.55], 620, 7, palette.whisker, 7, 0.008);
        addLine([5.74, 0.62, side * 0.38], [7.02, 0.62, side * 1.68], 620, 7, palette.whisker, 7, 0.008);
      }

      for (let z = -0.74; z <= 0.74; z += 0.035) {
        pushPoint(3.28, 0.12, z, palette.collar, 18, 0, 0.006);
      }
      addFilledEllipsoid([3.42, -0.1, 0], [0.12, 0.12, 0.12], 900, 0, palette.bell, 17, 0.01);

      addYarn();
      addSparkles();
    }

    buildCat();

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
    geometry.setAttribute("aSize", new THREE.Float32BufferAttribute(sizes, 1));
    geometry.setAttribute("aRegion", new THREE.Float32BufferAttribute(regions, 1));
    geometry.setAttribute("aSeed", new THREE.Float32BufferAttribute(seeds, 1));

    const uniforms = {
      uTime: { value: 0 },
      uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
      uSizeScale: { value: Number(sizeInput.value) },
      uPausedMix: { value: 1 },
      uGlow: { value: 0.16 },
      uHueShift: { value: 0 },
      uPatchStrength: { value: Number(patchInput.value) },
      uWalkStrength: { value: 1 }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      transparent: true,
      depthTest: true,
      depthWrite: true,
      blending: THREE.NormalBlending,
      vertexColors: true,
      vertexShader: `
        attribute float aSize;
        attribute float aRegion;
        attribute float aSeed;
        varying vec3 vColor;
        varying float vRegion;
        uniform float uTime;
        uniform float uPixelRatio;
        uniform float uSizeScale;
        uniform float uWalkStrength;

        mat2 rot(float a) {
          float s = sin(a);
          float c = cos(a);
          return mat2(c, -s, s, c);
        }

        void main() {
          vec3 p = position;
          float t = uTime;
          float wave = sin(t * 3.2 + aSeed);
          float gait = t * 4.8;
          float shimmer = sin(t * 7.0 + aSeed * 1.7) * 0.016;

          if (aRegion < 2.0) {
            float stride = sin(gait);
            p.y *= 1.0 + stride * 0.012 * uWalkStrength;
            p.y += sin(gait * 0.5) * 0.06 * uWalkStrength;
            p.x += sin(gait + p.x * 0.35) * 0.025 * uWalkStrength;
          } else if (aRegion < 3.0) {
            p.y += sin(gait * 0.5 + 0.7) * 0.085 * uWalkStrength;
            p.zx = rot(sin(t * 1.4) * 0.04 + sin(gait) * 0.025 * uWalkStrength) * p.zx;
          } else if (aRegion < 4.0) {
            p.x += sin(t * 5.4 + aSeed) * 0.025;
            p.y += sin(t * 5.1 + aSeed) * 0.035;
          } else if (aRegion < 5.0) {
            float f = clamp((-p.x - 3.7) / 4.5, 0.0, 1.0);
            p.z += sin(t * 2.1 + f * 4.2 + aSeed * 0.02) * f * (0.34 + 0.18 * uWalkStrength);
            p.y += cos(t * 1.7 + f * 3.2) * f * (0.18 + 0.08 * uWalkStrength);
          } else if (aRegion < 6.0) {
            float legPhase = fract(aRegion) * 8.97598;
            float lower = smoothstep(-1.15, -2.75, p.y);
            float lift = max(0.0, sin(gait + legPhase));
            float reach = cos(gait + legPhase);
            p.x += reach * lower * 0.34 * uWalkStrength;
            p.y += lift * lower * 0.28 * uWalkStrength;
            p.z += sin(gait + legPhase) * lower * 0.035 * uWalkStrength;
          } else if (aRegion < 7.0) {
            float blink = pow(max(0.0, sin(t * 2.7 - 1.2)), 28.0);
            p.y = mix(p.y, 1.18, blink * 0.88);
            p.x += blink * 0.035;
          } else if (aRegion < 8.0) {
            p.x += sin(t * 1.8 + aSeed) * 0.035;
            p.z += sin(t * 2.2 + aSeed) * 0.025;
          }

          p += normalize(vec3(sin(aSeed), cos(aSeed * 1.3), sin(aSeed * 0.7))) * shimmer;
          vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          gl_PointSize = aSize * uSizeScale * uPixelRatio * (8.0 / max(3.0, -mvPosition.z));
          vColor = color;
          vRegion = aRegion;
        }
      `,
      fragmentShader: `
      varying vec3 vColor;
      varying float vRegion;
      uniform float uGlow;
      uniform float uHueShift;
      uniform float uPatchStrength;

      vec3 hueShift(vec3 color, float angle) {
        vec3 axis = normalize(vec3(1.0, 1.0, 1.0));
        float s = sin(angle);
        float c = cos(angle);
        return color * c + cross(axis, color) * s + axis * dot(axis, color) * (1.0 - c);
      }

      void main() {
        vec2 uv = gl_PointCoord - vec2(0.5);
        float d = length(uv);
        if (d > 0.5) discard;
        float core = smoothstep(0.5, 0.04, d);
        float halo = smoothstep(0.5, 0.18, d) * uGlow;
        vec3 shiftedColor = clamp(hueShift(vColor, uHueShift), 0.0, 1.0);
        vec3 glowColor = shiftedColor * (1.0 + halo * 0.45);
        float alpha = core * (0.72 + halo * 0.12);
        if (vRegion >= 8.0 && vRegion < 9.0) {
          alpha *= uPatchStrength;
          glowColor = mix(vec3(0.08, 0.08, 0.08), glowColor, min(uPatchStrength, 1.0));
        }
        if (alpha < 0.18) discard;
        gl_FragColor = vec4(glowColor, alpha);
      }
      `
    });

    const catCloud = new THREE.Points(geometry, material);
    catCloud.renderOrder = 1;
    scene.add(catCloud);

    function filteredGeometry(predicate) {
      const filteredPositions = [];
      const filteredColors = [];
      const filteredSizes = [];
      const filteredRegions = [];
      const filteredSeeds = [];

      for (let i = 0; i < regions.length; i++) {
        if (!predicate(regions[i], colors[i * 3], colors[i * 3 + 1], colors[i * 3 + 2])) continue;
        filteredPositions.push(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
        filteredColors.push(colors[i * 3], colors[i * 3 + 1], colors[i * 3 + 2]);
        filteredSizes.push(sizes[i] * 1.18);
        filteredRegions.push(regions[i]);
        filteredSeeds.push(seeds[i]);
      }

      const detailGeometry = new THREE.BufferGeometry();
      detailGeometry.setAttribute("position", new THREE.Float32BufferAttribute(filteredPositions, 3));
      detailGeometry.setAttribute("color", new THREE.Float32BufferAttribute(filteredColors, 3));
      detailGeometry.setAttribute("aSize", new THREE.Float32BufferAttribute(filteredSizes, 1));
      detailGeometry.setAttribute("aRegion", new THREE.Float32BufferAttribute(filteredRegions, 1));
      detailGeometry.setAttribute("aSeed", new THREE.Float32BufferAttribute(filteredSeeds, 1));
      return detailGeometry;
    }

    const detailGeometry = filteredGeometry((region, r, g, b) => {
      const isEyeOrWhisker = region >= 6;
      const isWarmAccent = r > 0.82 && g < 0.82;
      const isBrightWhisker = r > 0.88 && g > 0.82 && b > 0.72;
      const isCollar = g > 0.72 && b > 0.62 && r < 0.55;
      return isEyeOrWhisker || isWarmAccent || isBrightWhisker || isCollar;
    });
    const detailMaterial = material.clone();
    detailMaterial.uniforms = uniforms;
    detailMaterial.depthTest = true;
    detailMaterial.depthWrite = false;
    detailMaterial.transparent = true;
    detailMaterial.blending = THREE.NormalBlending;
    const detailCloud = new THREE.Points(detailGeometry, detailMaterial);
    detailCloud.renderOrder = 2;
    scene.add(detailCloud);

    particleCount.textContent = positions.length / 3 > 0 ? (positions.length / 3).toLocaleString() : "0";

    const clock = new THREE.Clock();
    let targetYaw = 0.62;
    let targetPitch = 0.42;
    let yaw = targetYaw;
    let pitch = targetPitch;
    const minDistance = Number(zoomInput.min);
    const maxDistance = Number(zoomInput.max);
    let distance = Number(zoomInput.value);
    let dragging = false;
    let pinching = false;
    let pinchStartGap = 0;
    let pinchStartDistance = distance;
    let lastX = 0;
    let lastY = 0;
    let paused = false;
    let autoSpin = true;
    let speed = Number(speedInput.value);
    const activePointers = new Map();

    function setPressed(button, value) {
      button.setAttribute("aria-pressed", String(value));
    }

    function updateCamera() {
      pitch = Math.max(-0.18, Math.min(1.18, pitch));
      distance = Math.max(minDistance, Math.min(maxDistance, distance));
      const cp = Math.cos(pitch);
      camera.position.set(
        Math.sin(yaw) * cp * distance,
        Math.sin(pitch) * distance + 1.7,
        Math.cos(yaw) * cp * distance
      );
      camera.lookAt(0.9, 0.35, 0);
    }

    function setDistance(value) {
      distance = Math.max(minDistance, Math.min(maxDistance, value));
      zoomInput.value = distance.toFixed(1);
      zoomValue.textContent = distance.toFixed(1);
    }

    if (window.innerWidth <= 720) {
      setDistance(25);
    }

    function getPointerGap() {
      const points = [...activePointers.values()];
      if (points.length < 2) return 0;
      return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
    }

    pauseButton.addEventListener("click", () => {
      paused = !paused;
      pauseButton.textContent = paused ? "Play" : "Pause";
      setPressed(pauseButton, paused);
    });

    spinButton.addEventListener("click", () => {
      autoSpin = !autoSpin;
      setPressed(spinButton, autoSpin);
    });

    walkButton.addEventListener("click", () => {
      const walking = uniforms.uWalkStrength.value < 0.5;
      uniforms.uWalkStrength.value = walking ? 1 : 0;
      setPressed(walkButton, walking);
    });

    glowButton.addEventListener("click", () => {
      const on = uniforms.uGlow.value < 0.5;
      uniforms.uGlow.value = on ? 0.85 : 0.16;
      material.blending = THREE.NormalBlending;
      material.needsUpdate = true;
      detailMaterial.blending = THREE.NormalBlending;
      detailMaterial.needsUpdate = true;
      setPressed(glowButton, on);
    });

    speedInput.addEventListener("input", () => {
      speed = Number(speedInput.value);
      speedValue.textContent = speed.toFixed(2);
    });

    sizeInput.addEventListener("input", () => {
      uniforms.uSizeScale.value = Number(sizeInput.value);
      sizeValue.textContent = uniforms.uSizeScale.value.toFixed(2);
    });

    zoomInput.addEventListener("input", () => {
      setDistance(Number(zoomInput.value));
    });

    hueInput.addEventListener("input", () => {
      const degrees = Number(hueInput.value);
      uniforms.uHueShift.value = degrees * Math.PI / 180;
      hueValue.textContent = String(degrees);
    });

    patchInput.addEventListener("input", () => {
      uniforms.uPatchStrength.value = Number(patchInput.value);
      patchValue.textContent = uniforms.uPatchStrength.value.toFixed(2);
    });

    canvas.addEventListener("pointerdown", (event) => {
      activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      lastX = event.clientX;
      lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
      dragging = activePointers.size === 1;
      if (activePointers.size === 2) {
        pinching = true;
        dragging = false;
        pinchStartGap = getPointerGap();
        pinchStartDistance = distance;
      }
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!activePointers.has(event.pointerId)) return;
      activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (activePointers.size >= 2) {
        const gap = getPointerGap();
        if (pinching && gap > 0 && pinchStartGap > 0) {
          setDistance(pinchStartDistance * pinchStartGap / gap);
        }
        return;
      }
      if (!dragging) return;
      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;
      lastX = event.clientX;
      lastY = event.clientY;
      targetYaw -= dx * 0.006;
      targetPitch += dy * 0.0045;
    });

    function endPointer(event) {
      activePointers.delete(event.pointerId);
      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
      pinching = false;
      dragging = activePointers.size === 1;
      const remaining = [...activePointers.values()][0];
      if (remaining) {
        lastX = remaining.x;
        lastY = remaining.y;
      }
    }

    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", endPointer);

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      setDistance(distance + Math.sign(event.deltaY) * 1.1);
    }, { passive: false });

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
      uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio || 1, 2);
    }

    window.addEventListener("resize", resize);
    resize();
    updateCamera();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (!paused) uniforms.uTime.value += delta * speed;
      if (autoSpin && !dragging && !paused) targetYaw += delta * 0.15 * speed;
      yaw += (targetYaw - yaw) * 0.08;
      pitch += (targetPitch - pitch) * 0.08;
      updateCamera();
      catCloud.rotation.y = Math.sin(uniforms.uTime.value * 0.42) * 0.018;
      detailCloud.rotation.y = catCloud.rotation.y;
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
