<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){try{if(localStorage.getItem("theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>Fictional Worlds — GPT Image 2</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/brand.svg">
  <link rel="stylesheet" href="../../assets/styles.css">
  <link rel="stylesheet" href="../../assets/design.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #020813;
      --bg-2: #071629;
      --panel: #f7fbff;
      --text: #123044;
      --muted: #657d8d;
      --accent: #007ab0;
      --accent-strong: #004c7c;
      --line: #d8e8ef;
      --shadow: -10px 14px 18px rgba(0,65,105,.18), inset 0 1px 0 rgba(255,255,255,.68);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 0%, rgba(22,98,214,0.2), transparent 34%),
        radial-gradient(circle at 82% 12%, rgba(0,205,255,0.16), transparent 32%),
        linear-gradient(180deg, var(--bg), var(--bg-2) 64%, var(--bg)) !important;
      color: var(--text) !important;
      line-height: 1.5;
    }
    header#site-nav {
      background: rgba(6,17,24,.88) !important;
      border-bottom: 1px solid rgba(62,121,222,.34) !important;
      box-shadow: 0 14px 34px rgba(0,0,0,.22) !important;
    }
    .hero, main, footer { max-width: 1180px; margin: 0 auto; }
    .hero {
      padding: 46px 22px 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(233,248,252,.88)) !important;
      border: 1px solid rgba(216,232,239,.9) !important;
      border-radius: 0 0 8px 8px;
      box-shadow: var(--shadow);
    }
    h1 {
      margin: 0 0 10px;
      color: var(--accent-strong);
      font-size: clamp(2rem, 5vw, 4.2rem);
      letter-spacing: -.06em;
      line-height: .95;
    }
    .lede { max-width: 760px; color: #4e6f82; font-size: 1.04rem; font-weight: 560; }
    .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .pill {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.82);
      color: var(--accent);
      padding: 8px 11px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(0,65,105,.08);
    }
    main { padding: 26px 22px 70px; }
    .world + .world { margin-top: 34px; }
    .world-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(247,251,255,.95), rgba(231,244,255,.9));
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .world-head h2 {
      margin: 0;
      color: #183b52;
      font-size: clamp(1.5rem, 3vw, 2.6rem);
      letter-spacing: -.04em;
    }
    .world-head p { margin: 8px 0 0; color: var(--muted); max-width: 780px; }
    .world-count { color: var(--muted); white-space: nowrap; }
    .world-note {
      color: #d7e8f6;
      margin: 0 0 16px;
      padding: 0 4px;
    }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(255,255,255,.88), rgba(230,244,255,.82));
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .image-wrap { background: #05070a; aspect-ratio: 1 / 1; display:flex; align-items:center; justify-content:center; }
    .image-wrap.portrait { aspect-ratio: 2 / 3; }
    img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-wrap.portrait img { object-fit: contain; background: #05070a; }
    .content { padding: 18px; background: linear-gradient(180deg, rgba(248,252,255,.97), rgba(231,244,255,.9)); }
    .kicker { color: var(--accent); text-transform: uppercase; font-size: .74rem; letter-spacing: .14em; font-weight: 800; }
    h3 { margin: 7px 0 10px; font-size: 1.28rem; line-height: 1.1; }
    .desc, .tests { color: var(--muted); margin: 0 0 13px; }
    details { border-top: 1px solid var(--line); padding-top: 13px; }
    summary { cursor: pointer; color: var(--text); font-weight: 750; margin-bottom: 10px; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      color: #17334f;
      background: rgba(255,255,255,.62);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .84rem;
    }
    .empty { color: #d7e8f6; padding: 26px 4px; }
    footer { padding: 0 22px 50px; color: #b7c7d9; }
    @media (max-width: 680px) {
      .world-head { display: block; }
      .world-count { display: inline-block; margin-top: 10px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header id="site-nav"></header>
  <header class="hero">
    <h1>Fictional Worlds</h1>
    <p class="lede">Cataloged settings from the GPT Image 2 prompt archive, grouped by world name with their scenes, maps, artifacts, and continuity notes.</p>
    <div class="meta">
      <a class="pill" href="index.html">GPT Image 2 archive</a>
      <a class="pill" href="../../">Home</a>
    </div>
  </header>
  <main id="worlds" aria-live="polite">
    <p class="empty">Loading fictional worlds...</p>
  </main>
  <footer>
    World entries are generated from <code>gallery-data.json</code> entries that include world metadata.
  </footer>

  <script>
    (function () {
      const worldsRoot = document.getElementById('worlds');
      const escapeHtml = (value) => String(value || '').replace(/[&<>'"]/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));

      function cardHtml(item) {
        const world = item.world || {};
        const portrait = String(item.size || '').includes('1536') || String(item.image || '').includes('almanac');
        const description = world.entryDescription || item.tests || '';
        return `
          <article class="card">
            <div class="image-wrap${portrait ? ' portrait' : ''}"><img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}" loading="lazy"></div>
            <div class="content">
              <div class="kicker">${escapeHtml(item.date || '')} · ${escapeHtml(item.slot || '')}</div>
              <h3>${escapeHtml(item.title)}</h3>
              ${description ? `<p class="desc">${escapeHtml(description)}</p>` : ''}
              ${item.tests ? `<p class="tests"><strong>Explores:</strong> ${escapeHtml(item.tests)}</p>` : ''}
              <details>
                <summary>Show prompt</summary>
                <pre>${escapeHtml(item.prompt)}</pre>
              </details>
            </div>
          </article>`;
      }

      function render(items) {
        const groups = new Map();
        items.forEach((item) => {
          const world = item.world || {};
          const name = String(world.name || '').trim();
          if (!name) return;
          if (!groups.has(name)) groups.set(name, { name, description: world.description || '', continuity: world.continuity || '', items: [] });
          const group = groups.get(name);
          if (!group.description && world.description) group.description = world.description;
          if (!group.continuity && world.continuity) group.continuity = world.continuity;
          group.items.push(item);
        });
        if (!groups.size) {
          worldsRoot.innerHTML = '<p class="empty">No fictional world images have been archived yet.</p>';
          return;
        }
        worldsRoot.innerHTML = Array.from(groups.values()).map((world) => `
          <section class="world">
            <div class="world-head">
              <div>
                <h2>${escapeHtml(world.name)}</h2>
                ${world.description ? `<p>${escapeHtml(world.description)}</p>` : ''}
              </div>
              <span class="world-count">${world.items.length} image${world.items.length === 1 ? '' : 's'}</span>
            </div>
            ${world.continuity ? `<p class="world-note"><strong>Continuity:</strong> ${escapeHtml(world.continuity)}</p>` : ''}
            <div class="grid">${world.items.map(cardHtml).join('')}</div>
          </section>
        `).join('');
      }

      fetch('gallery-data.json', { cache: 'no-cache' })
        .then((r) => r.ok ? r.json() : Promise.reject(new Error('Could not load gallery-data.json')))
        .then((items) => render(items.sort((a, b) => String(a.world?.name || '').localeCompare(String(b.world?.name || '')) || String(b.date || '').localeCompare(String(a.date || '')) || String(b.slot || '').localeCompare(String(a.slot || '')))))
        .catch((err) => { worldsRoot.innerHTML = `<p class="empty">${escapeHtml(err.message)}</p>`; });
    })();
  </script>
  <script src="../../assets/nav.js" defer></script>
</body>
</html>
