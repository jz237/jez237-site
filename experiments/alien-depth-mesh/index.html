<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alien 3D Model</title>
  <meta name="description" content="Orbitable alien GLB model generated from a cleaned source image." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="../../assets/brand.svg" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #070707;
      --panel: rgba(9, 9, 9, 0.78);
      --line: rgba(255, 255, 255, 0.16);
      --text: #f5f3ee;
      --muted: #bcb5ad;
      --accent: #df4233;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      cursor: grab;
      touch-action: none;
    }

    #scene:active {
      cursor: grabbing;
    }

    .toolbar {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 24px);
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
    }

    .button {
      display: inline-grid;
      place-items: center;
      min-width: 36px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: #201d1a;
      font: 700 12px/1 system-ui, sans-serif;
      letter-spacing: 0;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
    }

    .button:hover,
    .button:focus-visible {
      outline: none;
      background: #302a25;
    }

    .button[aria-pressed="true"] {
      border-color: rgba(223, 66, 51, 0.82);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(223, 66, 51, 0.28);
    }

    .status {
      position: fixed;
      right: 12px;
      bottom: 12px;
      max-width: min(420px, calc(100vw - 24px));
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel);
      font-size: 12px;
      line-height: 1.35;
      backdrop-filter: blur(10px);
    }

    .status:empty {
      display: none;
    }

    @media (max-width: 520px) {
      .toolbar {
        right: 12px;
        flex-wrap: wrap;
      }

      .button {
        min-width: 34px;
        height: 31px;
        padding: 0 8px;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../blueforest-globe/vendor/three.module.js",
        "three/addons/": "../blueforest-globe/vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <h1 class="visually-hidden">Alien 3D model viewer</h1>
  <canvas id="scene" aria-label="Orbitable alien 3D model"></canvas>
  <nav class="toolbar" aria-label="Viewer controls">
    <button class="button" id="reset" title="Reset camera" type="button">R</button>
    <button class="button" id="walk" title="Toggle walking motion" type="button" aria-pressed="true">M</button>
    <button class="button" id="spin" title="Toggle spin" type="button" aria-pressed="false">S</button>
    <button class="button" id="wire" title="Toggle wireframe" type="button" aria-pressed="false">W</button>
    <a class="button" href="./assets/alien-hunyuan3d.glb" title="Download GLB">GLB</a>
    <a class="button" href="./assets/alien-cutout-source.png" title="Download clean source">PNG</a>
  </nav>
  <div class="status" id="status" role="status">Loading model...</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const canvas = document.querySelector("#scene");
    const status = document.querySelector("#status");
    const resetButton = document.querySelector("#reset");
    const walkButton = document.querySelector("#walk");
    const spinButton = document.querySelector("#spin");
    const wireButton = document.querySelector("#wire");

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      preserveDrawingBuffer: true,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.55;
    renderer.setClearColor(0x070707, 1);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070707);

    const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 100);

    function defaultCameraPosition() {
      const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
      const z = aspect < 0.7 ? 5.4 : aspect < 0.95 ? 4.25 : 3.25;
      return new THREE.Vector3(0.2, 0.18, z);
    }

    camera.position.copy(defaultCameraPosition());

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.05;
    controls.maxDistance = 6.5;
    controls.target.set(0, 0, 0);

    const modelRoot = new THREE.Group();
    scene.add(modelRoot);

    const walkRoot = new THREE.Group();
    modelRoot.add(walkRoot);

    const fill = new THREE.HemisphereLight(0xf2eee6, 0x2a1714, 2.85);
    scene.add(fill);

    const key = new THREE.DirectionalLight(0xffefe0, 4.2);
    key.position.set(-1.9, 2.1, 3.4);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x8296ff, 1.9);
    rim.position.set(2.5, 1.1, -2.6);
    scene.add(rim);

    const redEye = new THREE.PointLight(0xff1919, 2.8, 5);
    redEye.position.set(0, 0.22, 1.2);
    scene.add(redEye);

    let alien = null;
    let spin = false;
    let walk = true;
    let wire = false;
    let initialScale = 1;
    const walkUniforms = [];

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function resetCamera() {
      camera.position.copy(defaultCameraPosition());
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function setWireframe(enabled) {
      wire = enabled;
      wireButton.setAttribute("aria-pressed", String(wire));
      if (!alien) return;
      alien.traverse((node) => {
        if (!node.isMesh) return;
        const materials = Array.isArray(node.material) ? node.material : [node.material];
        materials.forEach((material) => {
          if (material) material.wireframe = wire;
        });
      });
    }

    function normalizeModel(root) {
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxAxis = Math.max(size.x, size.y, size.z) || 1;
      initialScale = 1.75 / maxAxis;
      root.position.sub(center);
      root.scale.setScalar(initialScale);

      const normalizedBox = new THREE.Box3().setFromObject(root);
      const normalizedCenter = normalizedBox.getCenter(new THREE.Vector3());
      root.position.sub(normalizedCenter);
      root.rotation.y = -0.2;
      root.rotation.x = -0.04;
    }

    function prepareMaterials(root) {
      root.traverse((node) => {
        if (!node.isMesh) return;
        node.frustumCulled = false;
        const materials = Array.isArray(node.material) ? node.material : [node.material];
        materials.forEach((material) => {
          if (!material) return;
          material.side = THREE.DoubleSide;
          material.roughness = Math.min(material.roughness ?? 0.45, 0.56);
          material.metalness = Math.max(material.metalness ?? 0.18, 0.2);
          addWalkDeformer(material);
          material.needsUpdate = true;
        });
      });
    }

    function addWalkDeformer(material) {
      const timeUniform = { value: 0 };
      const amountUniform = { value: 1 };
      walkUniforms.push({ time: timeUniform, amount: amountUniform });

      material.onBeforeCompile = (shader) => {
        shader.uniforms.uWalkTime = timeUniform;
        shader.uniforms.uWalkAmount = amountUniform;
        shader.vertexShader = shader.vertexShader.replace(
          "#include <common>",
          `#include <common>
uniform float uWalkTime;
uniform float uWalkAmount;`
        );
        shader.vertexShader = shader.vertexShader.replace(
          "#include <begin_vertex>",
          `vec3 transformed = vec3(position);
float side = position.x < 0.0 ? -1.0 : 1.0;
float outer = smoothstep(0.07, 0.34, abs(position.x));
float low = 1.0 - smoothstep(-0.25, 0.03, position.y);
float high = smoothstep(-0.04, 0.22, position.y);
float tip = smoothstep(0.18, 0.46, abs(position.x));
float phase = uWalkTime * 5.8 + side * 3.14159265 + floor(abs(position.x) * 7.0) * 0.55;
float stride = sin(phase);
float lift = max(0.0, sin(phase + 1.5707963));
float limbMask = outer * (low + high * 0.36);
transformed.x += side * stride * 0.027 * limbMask * uWalkAmount;
transformed.y += lift * 0.055 * limbMask * uWalkAmount;
transformed.z += cos(phase) * 0.052 * limbMask * uWalkAmount;
transformed.y += sin(uWalkTime * 11.6 + abs(position.x) * 5.0) * 0.011 * tip * low * uWalkAmount;
transformed.z += sin(uWalkTime * 7.4 + position.y * 8.0) * 0.016 * outer * uWalkAmount;`
        );
      };
    }

    const loader = new GLTFLoader();
    loader.load(
      "./assets/alien-hunyuan3d.glb",
      (gltf) => {
        alien = gltf.scene;
        prepareMaterials(alien);
        normalizeModel(alien);
        walkRoot.add(alien);
        status.textContent = "";
        resetCamera();
      },
      (event) => {
        if (!event.total) return;
        const percent = Math.round((event.loaded / event.total) * 100);
        status.textContent = `Loading model ${percent}%`;
      },
      (error) => {
        status.textContent = "Model load failed.";
        console.error(error);
      }
    );

    resetButton.addEventListener("click", resetCamera);

    walkButton.addEventListener("click", () => {
      walk = !walk;
      walkButton.setAttribute("aria-pressed", String(walk));
    });

    spinButton.addEventListener("click", () => {
      spin = !spin;
      spinButton.setAttribute("aria-pressed", String(spin));
    });

    wireButton.addEventListener("click", () => {
      setWireframe(!wire);
    });

    window.addEventListener("resize", resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now() * 0.001;
      const walkAmount = alien && walk ? 1 : 0;
      walkUniforms.forEach(({ time: timeUniform, amount }) => {
        timeUniform.value = time;
        amount.value = walkAmount;
      });

      if (alien) {
        const gait = Math.sin(time * 5.8);
        const bounce = Math.abs(gait);
        walkRoot.position.y = bounce * 0.045 * walkAmount;
        walkRoot.position.x = Math.sin(time * 5.8 + 0.7) * 0.018 * walkAmount;
        walkRoot.rotation.x = -0.012 * gait * walkAmount;
        walkRoot.rotation.z = 0.026 * Math.sin(time * 5.8 + 0.45) * walkAmount;
      }

      if (alien && spin) {
        modelRoot.rotation.y += 0.0042;
      }
      redEye.position.x = Math.sin(time * 1.6) * 0.18;
      redEye.intensity = 1.9 + Math.sin(time * 4.0) * 0.5;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
