name: Refresh Stock Market Data

on:
  schedule:
    # Four weekday checks, chosen to stay inside market hours in both EST and EDT.
    - cron: "35 14 * * 1-5"
    - cron: "5 16,18 * * 1-5"
    - cron: "56 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Blobless + sparse: skips the multi-GB media directories; this job
          # only reads scripts/ and reads/writes stock-market/data.
          filter: blob:none
          sparse-checkout: |
            scripts
            stock-market/data

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check market refresh window
        id: market_window
        run: |
          eastern_hour="$(TZ=America/New_York date +%H)"
          eastern_minute="$(TZ=America/New_York date +%M)"
          eastern_total=$((10#$eastern_hour * 60 + 10#$eastern_minute))
          # GitHub's scheduler fires only a few of the scheduled slots per
          # day, at unpredictable times, so accept any weekday run from
          # 9:30 AM Eastern to end of day. Full-vs-intraday is decided by
          # the script itself ("auto") from the age of the last full
          # refresh recorded in stocks.json — pinning the full run to a
          # time band kept missing when fires were dropped or delayed.
          market_start=$((9 * 60 + 30))
          if [ "$eastern_total" -ge "$market_start" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping before 9:30 AM Eastern."
          fi
          mode="auto"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="full"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Refresh mode: $mode"

      - name: Refresh stock market data
        if: steps.market_window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          STOCK_REFRESH_MODE: ${{ steps.market_window.outputs.mode }}
        run: node scripts/refresh_stock_market_data.mjs

      # Pushes made with GITHUB_TOKEN never trigger other workflows, so the
      # data validation runs here instead of relying on a push-triggered run.
      - name: Validate refreshed data
        if: steps.market_window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/validate_stock_market.mjs --data-only

      - name: Commit and push changes (if any)
        id: commit_changes
        if: steps.market_window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase --autostash origin/main
          git add stock-market/data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh stock market data"
            git push || { git pull --rebase --autostash origin main && git push; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
