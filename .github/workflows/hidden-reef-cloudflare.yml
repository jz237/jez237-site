name: Deploy Hidden Reef to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "prototypes/hidden-reef/**"
      - ".github/workflows/hidden-reef-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hidden-reef-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 39a03cfe0f3854622f3a4f72491f48a6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Hidden Reef
        run: |
          npx --yes wrangler@latest pages deploy prototypes/hidden-reef \
            --project-name hidden-reef-demo \
            --branch main
