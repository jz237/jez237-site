name: Refresh AI News Feed

on:
  schedule:
    - cron: "12 9 * * *" # once daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Blobless + sparse: skips the multi-GB media directories; this job
          # only touches ai-news/.
          filter: blob:none
          sparse-checkout: |
            ai-news

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh feed
        run: |
          cd ai-news
          python fetch_ai_news.py

      - name: Commit and push changes (if any)
        id: commit_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase --autostash origin/main
          git add ai-news/data/items.json ai-news/data/image_cache.json ai-news/public/*.json ai-news/public/index.html ai-news/public/thumbnails/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh ai news feed"
            git push || { git pull --rebase --autostash origin main && git push; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
