name: Protect Live Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Blobless guard-only checkout
        env:
          GUARD_SPARSE_CHECKOUT: |
            /content/site.json
            /experiments/image-gen-2-benchmark/index.html
            /games/index.html
            /garden/index.html
            /games/2026-08-20/final-blow/game.js
            /games/2026-08-20/final-blow/index.html
            /games/2026-08-20/final-blow/sw.js
            /games/2026-08-20/final-blow/tests/service-worker-guard.test.mjs
            /scripts/check_games_catalog_syntax.mjs
            /scripts/guard_cloudflare_deploy.mjs
        run: |
          set -euo pipefail

          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          printf '%s\n' "${GUARD_SPARSE_CHECKOUT}" |
            git sparse-checkout set --no-cone --stdin
          git -c protocol.version=2 fetch \
            --depth=1 \
            --filter=blob:none \
            --no-tags \
            origin "${GITHUB_REF}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          du -sh --exclude=.git .
          du -sh .git

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard Final Blow service worker
        run: node --test games/2026-08-20/final-blow/tests/service-worker-guard.test.mjs

      - name: Check GameMaster catalog JavaScript
        run: node scripts/check_games_catalog_syntax.mjs

      - name: Guard against stale production deploys
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/guard_cloudflare_deploy.mjs
