name: Protect Live Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard Final Blow service worker
        run: node --test games/2026-08-20/final-blow/tests/service-worker-guard.test.mjs

      - name: Guard against stale production deploys
        run: node scripts/guard_cloudflare_deploy.mjs
