name: Deploy GitHub Pages Mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Blobless sparse checkout
        env:
          PUBLIC_SPARSE_CHECKOUT: |
            /*
            !/.claude/
            !/.github/
            !/.wrangler/
            !/functions/
            !/scripts/
            !/stock-market-src/
            !/tmp/
            !/workers/
            !/experiments/amiga-mod-player/audio/
            !/experiments/amiga-mod-player/mods/
            !/experiments/image-gen-2-benchmark/__pycache__/
            !/experiments/image-gen-2-benchmark/images/
            !/experiments/image-gen-2-benchmark/thumbs/
            !/experiments/sid-player/files/
            !/experiments/sid-player/sids/
            !/ops/
            !/package.json
            !/package-lock.json
            !/pnpm-lock.yaml
            !/yarn.lock
            !/wrangler.toml
        run: |
          set -euo pipefail

          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          printf '%s\n' "${PUBLIC_SPARSE_CHECKOUT}" |
            git sparse-checkout set --no-cone --stdin
          git -c protocol.version=2 fetch \
            --depth=1 \
            --filter=blob:none \
            --no-tags \
            origin "${GITHUB_REF}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          du -sh --exclude=.git .
          du -sh .git

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Guard Final Blow service worker
        run: node --test games/2026-08-20/final-blow/tests/service-worker-guard.test.mjs

      - name: Prepare GitHub Pages payload
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          # These exclusions intentionally duplicate the sparse-checkout denylist.
          # Keeping them here makes the public boundary explicit and fail-safe.
          tar \
            --exclude='./_site' \
            --exclude='./.claude' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.wrangler' \
            --exclude='./functions' \
            --exclude='./scripts' \
            --exclude='./stock-market-src' \
            --exclude='./tmp' \
            --exclude='./workers' \
            --exclude='./experiments/amiga-mod-player/audio' \
            --exclude='./experiments/amiga-mod-player/mods' \
            --exclude='./experiments/image-gen-2-benchmark/__pycache__' \
            --exclude='./experiments/image-gen-2-benchmark/images' \
            --exclude='./experiments/image-gen-2-benchmark/thumbs' \
            --exclude='./experiments/sid-player/files' \
            --exclude='./experiments/sid-player/sids' \
            --exclude='./ops' \
            --exclude='./package.json' \
            --exclude='./package-lock.json' \
            --exclude='./pnpm-lock.yaml' \
            --exclude='./yarn.lock' \
            --exclude='./wrangler.toml' \
            -cf - . | tar -xf - -C _site

      - name: Report payload size
        run: |
          du -sh _site
          find _site -type f | wc -l
          du -ah _site | sort -h | tail -n 25

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
