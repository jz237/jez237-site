name: Deploy GitHub Pages Mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Guard Final Blow service worker
        run: node --test games/2026-08-20/final-blow/tests/service-worker-guard.test.mjs

      - name: Prepare GitHub Pages payload
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          # The mirror keeps public pages and game assets, but skips source-only
          # files and bulky experiment libraries that make Pages deploys flaky.
          tar \
            --exclude='./_site' \
            --exclude='./.claude' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.wrangler' \
            --exclude='./functions' \
            --exclude='./scripts' \
            --exclude='./stock-market-src' \
            --exclude='./tmp' \
            --exclude='./workers' \
            --exclude='./experiments/amiga-mod-player/audio' \
            --exclude='./experiments/amiga-mod-player/mods' \
            --exclude='./experiments/image-gen-2-benchmark/__pycache__' \
            --exclude='./experiments/image-gen-2-benchmark/images' \
            --exclude='./experiments/image-gen-2-benchmark/thumbs' \
            --exclude='./experiments/sid-player/files' \
            --exclude='./experiments/sid-player/sids' \
            --exclude='./ops' \
            --exclude='./package.json' \
            --exclude='./package-lock.json' \
            --exclude='./pnpm-lock.yaml' \
            --exclude='./yarn.lock' \
            --exclude='./wrangler.toml' \
            -cf - . | tar -xf - -C _site

      - name: Report payload size
        run: |
          du -sh _site
          find _site -type f | wc -l
          du -ah _site | sort -h | tail -n 25

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
