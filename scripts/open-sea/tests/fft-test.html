<!doctype html><meta charset="utf-8"><title>fft test</title>
<canvas id="c" width="64" height="64"></canvas>
<script type="module">
import { initGL, gl, readF32, bindFBO, drawFS } from '/demos/open-sea/js/gl.js';
import { OceanSim } from '/demos/open-sea/js/ocean.js';
window.run = () => {
  initGL(document.getElementById('c'));
  const N = window.N || 64;
  const o = new OceanSim({ N, cascades: 1 });
  // random complex input in A[0] (two complex per texel: rg, ba), A[1] second field
  const inp0 = new Float32Array(N * N * 4), inp1 = new Float32Array(N * N * 4);
  let s = 12345; const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296 - 0.5;
  for (let i = 0; i < inp0.length; i++) { inp0[i] = rnd(); inp1[i] = rnd(); }
  if (window.HERM) { // make channel pair rg Hermitian, ba zero
    for (let v = 0; v < N; v++) for (let u = 0; u < N; u++) {
      const a = (v * N + u) * 4, b = (((N - v) % N) * N + ((N - u) % N)) * 4;
      if (b > a) { inp0[b] = inp0[a]; inp0[b + 1] = -inp0[a + 1]; }
      else if (b === a) inp0[a + 1] = 0;
      inp0[a + 2] = 0; inp0[a + 3] = 0;
    }
  }
  for (const [t, d] of [[o.A[0], inp0], [o.A[1], inp1]]) {
    gl.bindTexture(gl.TEXTURE_2D, t.tex); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, N, N, gl.RGBA, gl.FLOAT, d);
  }
  let sa = o.A, sb = o.B, dst = o.fboB;
  const f = o.progFFT.use().i('uBits', Math.log2(N));
  for (let dir = 0; dir < 2; dir++) for (let st = 0; st < Math.log2(N); st++) {
    f.t('uIn0', 0, sa[0]).t('uIn1', 1, sa[1]).i('uStage', st).i('uDir', dir);
    bindFBO(dst); drawFS();
    dst = dst === o.fboB ? o.fboA : o.fboB; [sa, sb] = [sb, sa];
  }
  // result textures = sa ; read via temp fbo
  const fb = sa === o.A ? o.fboA : o.fboB;
  const out = readF32(fb, 0, 0, N, N);
  // CPU inverse DFT of channel pair (rg) for a few sample points
  let maxErr = 0, maxVal = 0;
  const pts = [[0,0],[1,0],[0,1],[5,7],[33,12],[63,63],[20,50]];
  for (const [x, y] of pts) {
    let re = 0, im = 0;
    for (let v = 0; v < N; v++) for (let u = 0; u < N; u++) {
      const a = inp0[(v * N + u) * 4], b = inp0[(v * N + u) * 4 + 1];
      const ang = 2 * Math.PI * (u * x + v * y) / N;
      re += a * Math.cos(ang) - b * Math.sin(ang); im += a * Math.sin(ang) + b * Math.cos(ang);
    }
    const gr = out[(y * N + x) * 4], gi = out[(y * N + x) * 4 + 1];
    maxErr = Math.max(maxErr, Math.hypot(re - gr, im - gi)); maxVal = Math.max(maxVal, Math.hypot(re, im));
  }
  let maxIm = 0, maxRe = 0;
  for (let i = 0; i < N * N; i++) { maxIm = Math.max(maxIm, Math.abs(out[i * 4 + 1])); maxRe = Math.max(maxRe, Math.abs(out[i * 4])); }
  return { maxErr, maxVal, maxIm, maxRe };
};
window.ready = true;
</script>
