<!doctype html><html lang="en"><meta charset="utf-8"><title>Photo traffic renderer fixture</title>
<link rel="stylesheet" href="../vendor/cesium-1.145.0/Widgets/widgets.css">
<style>html,body,#map{width:100%;height:100%;margin:0}#status{position:absolute;top:8px;left:8px;background:#fff;padding:12px;z-index:5}</style>
<div id="map"></div><output id="status">Loading local 3D road tile</output>
<script>window.CESIUM_BASE_URL='../vendor/cesium-1.145.0/';</script>
<script src="../vendor/cesium-1.145.0/Cesium.js"></script>
<script type="module">
import {createPhotoTraffic} from '../src/photo-traffic.js';
const C=window.Cesium;C.Ion.defaultAccessToken='';
const viewer=new C.Viewer('map',{globe:false,baseLayer:false,geocoder:false,baseLayerPicker:false,
  animation:false,timeline:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,
  fullscreenButton:false,skyBox:false,skyAtmosphere:false});
const center=C.Cartesian3.fromDegrees(-75.164,39.9502,0);
const tile={asset:{version:'1.1'},geometricError:500,root:{
  transform:C.Matrix4.toArray(C.Transforms.eastNorthUpToFixedFrame(center)),
  boundingVolume:{box:[0,0,25,100,0,0,0,100,0,0,0,30]},geometricError:0,
  content:{uri:new URL('../models/traffic-fixture-0.glb',location.href).href}}};
const url=URL.createObjectURL(new Blob([JSON.stringify(tile)],{type:'application/json'}));
const tiles=await C.Cesium3DTileset.fromUrl(url,{enableCollision:true});
viewer.scene.primitives.add(tiles);
let tileError='',tileSeen=0;
tiles.tileFailed.addEventListener(error=>{tileError=error.message;});
tiles.tileVisible.addEventListener(()=>tileSeen++);
viewer.camera.lookAt(C.Cartesian3.fromDegrees(-75.164,39.9502,30),new C.HeadingPitchRange(0,-.55,180));
const traffic=createPhotoTraffic(C,viewer);let start=performance.now();
function frame(now){
  const x=((now-start)/1000*7)%130-65;
  traffic.update([{id:1,lon:-75.164+x/85000,lat:39.9502,angle:Math.PI/2,variant:5,van:false},
    {id:2,lon:-75.164-x/85000,lat:39.9502+.00005,angle:-Math.PI/2,variant:3,van:true}]);
  document.querySelector('#status').textContent=`Local road at 30 m · two cars · travel ${x.toFixed(1)} m`
    +` · tile seen ${tileSeen} · loaded ${tiles.tilesLoaded}`
    +` · height ${viewer.scene.getHeight(C.Cartographic.fromDegrees(-75.164,39.9502),C.HeightReference.RELATIVE_TO_3D_TILE)}`
    +` · ${tileError}`;
  requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></html>
