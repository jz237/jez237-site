<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Open Sea — real-time ocean</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23091520'/%3E%3Cpath d='M8 37 Q20 22 32 37 T56 37 M8 47 Q20 32 32 47 T56 47' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<meta name="description" content="A real-time WebGL2 ocean: FFT wave simulation from glassy calm to storm, physically based sky, volumetric clouds, rain, lightning, a sailing yacht and an underwater view.">
<style>
  :root { color-scheme: dark; --ink: #f3f5f8; --dim: rgba(255,255,255,.62); --line: rgba(255,255,255,.24); --panel: rgba(22,26,33,.84); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas#sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  canvas#sea:active { cursor: grabbing; }
  #hud { position: fixed; left: 14px; top: 14px; width: min(320px, calc(100vw - 28px)); max-height: calc(100vh - 28px); max-height: calc(100dvh - 28px); overflow-y: auto; overscroll-behavior: contain;
         color: var(--ink); background: linear-gradient(180deg, rgba(40,45,55,.86), rgba(20,23,29,.9)); border: 1px solid rgba(255,255,255,.10); border-radius: 16px;
         -webkit-backdrop-filter: blur(18px) saturate(1.1); backdrop-filter: blur(18px) saturate(1.1); box-shadow: 0 12px 44px rgba(0,0,0,.42);
         font: 500 13px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; user-select: none; -webkit-user-select: none; z-index: 5;
         transition: opacity .25s; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
  #hud.hidden { opacity: 0; pointer-events: none; }
  #hud.folded { display: none; }
  #hud .sec { padding: 14px 16px 8px; border-top: 1px solid rgba(255,255,255,.08); }
  #hud .sec:first-child { border-top: 0; padding-top: 16px; }
  #hud .sec:last-child { padding-bottom: 14px; }
  #hud .section-content { padding-top: 2px; }
  #hud summary { cursor: pointer; list-style-position: inside; margin: 0 0 10px; font: 600 10.5px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 9px; }
  .chip { font: inherit; color: var(--ink); background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; transition: background .12s, color .12s, border-color .12s; }
  .chip:hover { border-color: rgba(255,255,255,.55); }
  .chip.on { background: #f4f5f7; color: #12151a; border-color: #f4f5f7; }
  .srow { display: grid; grid-template-columns: 90px 1fr 62px; align-items: center; gap: 8px; height: 30px; color: rgba(255,255,255,.9); }
  .srow output { text-align: right; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer; --v: 50%; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; background: linear-gradient(90deg, rgba(255,255,255,.78) var(--v), rgba(255,255,255,.26) var(--v)); border-radius: 2px; }
  input[type=range]::-moz-range-track { height: 3px; background: rgba(255,255,255,.26); border-radius: 2px; }
  input[type=range]::-moz-range-progress { height: 3px; background: rgba(255,255,255,.78); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; margin-top: -7px; border-radius: 50%; background: #f7f8fa; border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.15); }
  input[type=range]::-moz-range-thumb { width: 17px; height: 17px; border-radius: 50%; background: #f7f8fa; border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  input[type=range]:focus-visible { outline: 1px solid rgba(255,255,255,.6); outline-offset: 2px; border-radius: 4px; }
  .chip:focus-visible, .foldbtn:focus-visible, #hud summary:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  .foldbtn { position: fixed; top: 14px; left: min(342px, calc(100vw - 48px)); width: 30px; height: 30px; padding: 0; border-radius: 50%; z-index: 6; font: 500 16px/1 system-ui, sans-serif; color: var(--ink);
             background: var(--panel); border: 1px solid rgba(255,255,255,.14); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); cursor: pointer; transition: opacity .25s; }
  .foldbtn.closed { left: 14px; }
  .foldbtn.gone { opacity: 0; pointer-events: none; }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); color: #d8d8d8; font: 10.5px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .08em;
          text-shadow: 0 1px 4px rgba(0,0,0,.8); pointer-events: none; transition: opacity 1.2s; white-space: nowrap; z-index: 4; }
  #fail { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #ddd; font: 14px/1.5 system-ui, sans-serif; padding: 24px; }
  .back { position: fixed; right: 10px; top: 10px; z-index: 5; color: var(--ink); text-decoration: none; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; letter-spacing: .04em;
          background: var(--panel); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 8px 12px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: opacity .25s; }
  body.hide-hud .back { opacity: 0; pointer-events: none; }
  @media (max-width: 640px) { #hint { display: none; } }
  @media (max-width: 720px) { .back { top: auto; bottom: 12px; right: 12px; } }
  #fullscreen { position:fixed;right:112px;top:10px;z-index:6;padding:8px 11px;color:var(--ink);background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:10px;font:500 12px system-ui,sans-serif;cursor:pointer; }
  #fullscreen:focus-visible {outline:2px solid #fff;outline-offset:2px;}
  #fullscreen:hover {background:rgba(60,65,72,.9);}
  #board{position:fixed;right:244px;top:10px;z-index:6;padding:8px 13px;color:var(--ink);background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:10px;font:500 12px system-ui,sans-serif;cursor:pointer;}
  #board:focus-visible,#walk-pad:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  #board:hover{background:rgba(60,65,72,.9);}
  #walk-pad{display:none;position:fixed;left:16px;bottom:76px;width:84px;height:84px;border:1px solid rgba(255,255,255,.36);border-radius:50%;z-index:6;background:rgba(22,26,33,.42);touch-action:none;align-items:center;justify-content:center;}
  #walk-pad span{width:32px;height:32px;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(255,255,255,.16);pointer-events:none;}
  #walk-pad::after{content:'WALK';position:absolute;top:90px;color:#ddd;font:9px ui-monospace,monospace;letter-spacing:.16em;text-shadow:0 1px 3px #000;}
  [hidden]{display:none!important;}
  body.hide-hud #board,body.hide-hud #walk-pad{opacity:0;pointer-events:none;}
  @media(pointer:coarse){body.on-deck #walk-pad{display:flex;}}
  body.hide-hud #fullscreen {opacity:0;pointer-events:none;}
  #loading {position:fixed;inset:0;display:grid;place-items:center;color:#ccc;font:12px system-ui,sans-serif;letter-spacing:.12em;pointer-events:none;}
  @media(max-width:720px){#fullscreen{left:12px;right:auto;top:auto;bottom:12px;}}
  @media(max-width:720px){#board{left:50%;right:auto;top:auto;bottom:12px;transform:translateX(-50%);}}
  @media(max-width:640px){body.on-deck #hint{display:block;top:16px;bottom:auto;max-width:230px;white-space:normal;text-align:center;}}
  body.shot #board,body.shot #walk-pad{display:none;}
  body.shot #fullscreen,body.shot #hud, body.shot .foldbtn, body.shot .back, body.shot #hint { display: none; }
</style>

<style>#ocean-update{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:10;color:#eee;background:rgba(20,24,30,.92);border:1px solid #777;border-radius:9px;padding:9px 14px;font:12px system-ui;cursor:pointer}body.shot #ocean-update{display:none}</style>

<body>
<canvas id="sea" tabindex="0" aria-label="Real-time ocean simulation"></canvas>

<button id="board" type="button" aria-label="Land on the yacht and walk on deck" aria-pressed="false">Land</button>
<div id="walk-pad" role="group" aria-label="Walk on deck: drag this pad to move"><span></span></div>
<div id="hud" role="group" aria-label="Ocean controls"></div>
<a class="back" href="../">◂ DEMOS</a>
<div id="hint"></div>
<div id="fail"><div><b>WebGL 2 with float render targets is required.</b><br>Try a recent desktop browser with hardware acceleration enabled.</div></div>
