<style type="text/css" id="skyline-restyle">
  /* ONLY change: show the skyline photo in the empty side areas (left/right
     of the fixed-width content column). The center content column and every
     one of its colors, red fades, strips and borders are left UNTOUCHED. */
  html { background:#000; }
  body {
    background:
      /* Red columns continuing the site's 50px edge strips (which are floats
         that stop partway down the page) to the very bottom. The strips'
         fade tile ends in solid #F00, so the continuation is seamless.
         Positioned so their outer edges sit exactly on the column edges. */
      linear-gradient(#f00,#f00) calc(50% - 365px - var(--bauder-extra, 0px) / 2) top / 50px 100% no-repeat scroll,
      linear-gradient(#f00,#f00) calc(50% + 365px + var(--bauder-extra, 0px) / 2) top / 50px 100% no-repeat scroll,
      /* Continuation of the button sidebar (#div3): 133px wide replica of its
         cross-section — 2px #F00 borders around the #be1d1f fill its fade
         tile ends in — so the column appears to run to the page bottom. */
      linear-gradient(to right, #f00 0 2px, #be1d1f 2px calc(100% - 2px), #f00 calc(100% - 2px) 100%) calc(50% - 268.5px - var(--bauder-extra, 0px) / 2) top / 133px 100% no-repeat scroll,
      /* Black slab under the content column, full page height. This is the
         original black page background the column gaps (below the grid,
         sidebar and footer) always showed through — kept black so the center
         looks IDENTICAL to before. 6px narrower than the column so rounding
         can never let it peek out past the site's edges. */
      linear-gradient(#000,#000) center top / calc(774px + var(--bauder-extra, 0px)) 100% no-repeat scroll,
      /* The skyline photo, visible only OUTSIDE the column (left/right sides).
         Root-relative URL so pages in subfolders resolve it too. */
      url(images/skyline/bg-hero2.jpg) center center / cover no-repeat fixed,
      #000 !important;
    /* The site's CSS gives body its own overflow-y:scroll although the page
       really scrolls via html — that reserves a phantom 16px scrollbar track
       at body's right edge, which shows as a thin dark vertical line over
       the photo. Scrolling still works via html. */
    overflow: visible !important;
    /* The column strips are floats that overflow the 1000px-tall container;
       pages without a cleared footer leave body only 1000px tall, clipping
       the photo partway down. flow-root makes body's box enclose all its
       floats so the background spans the full page height. */
    display: flow-root;
    /* Desktop floor covers elements absolutely positioned just past the
       body box (e.g. contact page's archive link at ~1435px). */
    min-height: max(100vh, 1440px);
  }
  /* The footer is an empty black spacer block spanning the full column width;
     left opaque it would interrupt the red edge columns behind it. The black
     center slab already provides the same look. */
  .DivFooter { background: transparent !important; }
  /* Hide the old dark "blueprint" side strips so the skyline shows there. */
  .bauder-side-blueprint { display:none !important; }

  /* Mobile: fixed backgrounds misbehave on iOS; use scroll there. Per-layer
     positions so only the photo re-anchors — a single value would drag the
     red edge columns to the center of the screen. */
  @media (max-width: 820px) {
    body {
      background-attachment: scroll !important;
      background-position:
        calc(50% - 365px - var(--bauder-extra, 0px) / 2) top,
        calc(50% + 365px + var(--bauder-extra, 0px) / 2) top,
        calc(50% - 268.5px - var(--bauder-extra, 0px) / 2) top,
        center top,
        center top !important;
      min-height: 100vh !important;
    }
  }
</style>

<script type="text/javascript">
//<![CDATA[
(function () {
  var wrapper = document.querySelector(".bauder-side-blueprint");
  var leftStrip = document.querySelector(".bauder-blueprint-strip.left");
  var rightStrip = document.querySelector(".bauder-blueprint-strip.right");
  var container = document.querySelector(".container");
  var leftBar = document.querySelector(".div1");
  var midBar = document.querySelector(".div3");
  var rightBar = document.querySelector(".div5");

  if (!wrapper || !leftStrip || !rightStrip || !container || !leftBar || !midBar || !rightBar) {
    return;
  }

  function syncSideBlueprint() {
    var docEl = document.documentElement;
    var viewportWidth = docEl.clientWidth || window.innerWidth || 0;
    var sideWidth = Math.max(0, Math.floor((viewportWidth - 780) / 2));
    var scrollY = window.pageYOffset || docEl.scrollTop || 0;
    var containerRect = container.getBoundingClientRect();
    var top = Math.floor(containerRect.top + scrollY);
    var leftBottom = leftBar.getBoundingClientRect().bottom + scrollY;
    var midBottom = midBar.getBoundingClientRect().bottom + scrollY;
    var rightBottom = rightBar.getBoundingClientRect().bottom + scrollY;
    var bottom = Math.max(leftBottom, midBottom, rightBottom);
    var height = Math.max(0, Math.ceil(bottom - top));

    wrapper.style.top = top + "px";
    wrapper.style.height = height + "px";

    leftStrip.style.left = "0px";
    leftStrip.style.width = sideWidth + "px";

    rightStrip.style.right = "0px";
    rightStrip.style.width = sideWidth + "px";
  }

  syncSideBlueprint();
  window.addEventListener("load", syncSideBlueprint);
  window.addEventListener("resize", syncSideBlueprint);
  window.addEventListener("orientationchange", syncSideBlueprint);
})();
//]]>
</script>
