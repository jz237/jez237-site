<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>(function(){try{if(localStorage.getItem("theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>Weather Console — Jez237</title>
  <link rel="icon" type="image/svg+xml" href="../assets/brand.svg" />
  <link rel="stylesheet" href="../assets/styles.css" />
  <link rel="stylesheet" href="../assets/site-enhance.css" />
  <link rel="stylesheet" href="../assets/design.css" />
  <link rel="stylesheet" href="../assets/workbench-theme.css?v=20260506-mobile-overflow-fix" />
  <style>
    main.container { max-width: 1200px; margin: 0 auto; padding: 22px clamp(16px,3vw,40px) 80px; }
    .weather-page-intro { margin-bottom: 18px; }
    .weather-page-intro h1 { margin-bottom: 8px; }
    .weather-page-intro p { color: var(--ink-lo); max-width: 760px; }
    .weather-almanac-panel {
      display: grid;
      grid-template-columns: minmax(220px, 0.72fr) minmax(260px, 1fr);
      gap: 18px;
      align-items: stretch;
      margin: 0 0 18px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      background:
        radial-gradient(circle at 18% 16%, rgba(246,216,142,.18), transparent 38%),
        linear-gradient(135deg, rgba(13,19,28,.92), rgba(11,15,20,.78));
      box-shadow: 0 18px 46px rgba(0,0,0,.25);
      overflow: hidden;
    }
    .weather-almanac-art {
      display: block;
      width: 100%;
      height: auto;
      max-height: none;
      object-fit: contain;
      object-position: top center;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
    }
    .weather-almanac-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding: clamp(8px,2vw,22px);
    }
    .weather-almanac-copy > span {
      color: var(--brand-gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .weather-almanac-copy h2 {
      margin: 8px 0 10px;
      font-size: clamp(46px,7vw,88px);
      line-height: .86;
      letter-spacing: -.055em;
    }
    .weather-almanac-copy h2 span { display: block; color: inherit; font: inherit; letter-spacing: inherit; text-transform: none; }
    .weather-almanac-copy p {
      margin: 0;
      max-width: 560px;
      color: var(--ink-lo);
      font-size: 15px;
      line-height: 1.55;
    }
    .weather-almanac-copy a {
      align-self: flex-start;
      margin-top: 18px;
      color: var(--brand-gold);
      font-weight: 800;
      text-decoration: none;
      border-bottom: 1px solid rgba(246,216,142,.45);
    }
    .weather-almanac-zip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      width: min(100%, 360px);
      margin-top: 18px;
    }
    .weather-almanac-zip label {
      grid-column: 1 / -1;
      color: var(--ink-lo);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .weather-almanac-zip input,
    .weather-almanac-zip button {
      min-height: 42px;
      border-radius: 12px;
      font: inherit;
      box-sizing: border-box;
    }
    .weather-almanac-zip input {
      width: 100%;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      color: var(--ink-hi);
      padding: 0 12px;
    }
    .weather-almanac-zip button {
      border: 1px solid rgba(246,216,142,.45);
      background: rgba(246,216,142,.16);
      color: var(--brand-gold);
      font-weight: 800;
      padding: 0 14px;
      cursor: pointer;
    }
    .weather-almanac-zip-status {
      grid-column: 1 / -1;
      min-height: 16px;
      color: var(--ink-lo);
      font-size: 12px;
    }
    @media (max-width: 760px) {
      html, body { width: 100% !important; max-width: 100% !important; overflow-x: hidden !important; }
      main.container.workbench-home { width: 100% !important; padding: 0 !important; max-width: 100% !important; overflow-x: hidden !important; }
      .desktop-hub { width: 100% !important; max-width: 100% !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; min-height: auto !important; overflow-x: hidden !important; }
      .hub-main { width: 100% !important; max-width: 100% !important; padding: 14px 10px 28px !important; overflow-x: hidden !important; }
      .weather-dashboard, #philly-weather-widget, .weather-dashboard-card { width: 100% !important; max-width: 100% !important; min-width: 0 !important; box-sizing: border-box !important; overflow-x: hidden !important; }
      .weather-dashboard-card * { box-sizing: border-box !important; max-width: 100% !important; }
      .weather-page-intro { margin-bottom: 8px !important; }
      .weather-page-intro h1 { font-size: 30px !important; }
      .weather-page-intro p { font-size: 13px !important; line-height: 1.4 !important; }
      .weather-almanac-panel { display: block !important; margin: 0 10px 12px !important; padding: 10px !important; border-radius: 14px !important; }
      .weather-almanac-art { height: auto !important; max-height: none !important; aspect-ratio: 4 / 5 !important; }
      .weather-almanac-copy { padding: 12px 4px 2px !important; }
      .weather-almanac-copy h2 { font-size: 46px !important; line-height: .86 !important; letter-spacing: -.045em !important; }
      .weather-almanac-copy p { font-size: 13px !important; line-height: 1.45 !important; }
      .weather-almanac-zip { width: 100% !important; }
      .topbar-actions { display: none !important; }
      .weather-dashboard { margin-top: 12px !important; }
      .weather-dashboard-card { padding: 12px !important; border-radius: 12px !important; box-shadow: none !important; }
      .weather-dashboard-top { gap: 12px !important; margin-bottom: 12px !important; }
      .weather-dashboard-top h2 { font-size: 30px !important; }
      .weather-dashboard-top p,
      .weather-day-summary,
      .weather-nws-summary { font-size: 13px !important; line-height: 1.45 !important; }
      .weather-now-badge { width: 100% !important; min-width: 0 !important; display: flex !important; align-items: center !important; justify-content: space-between !important; text-align: left !important; }
      .weather-now-badge::after { display: none !important; }
      .weather-now-badge strong { font-size: 38px !important; }
      .weather-dashboard-grid { grid-template-columns: repeat(2, minmax(0,1fr)) !important; gap: 8px !important; }
      .weather-metric { min-height: 88px !important; padding: 10px !important; border-radius: 12px !important; }
      .weather-metric span { font-size: 10px !important; letter-spacing: .08em !important; }
      .weather-metric strong { font-size: 22px !important; line-height: 1.05 !important; }
      .weather-metric em { font-size: 12px !important; }
      .weather-location-form { display: grid !important; grid-template-columns: minmax(0,1fr) auto auto !important; gap: 7px !important; }
      .weather-location-form label { grid-column: 1 / -1 !important; }
      .weather-location-form input { width: 100% !important; min-width: 0 !important; }
      .weather-radar-link a { display: block !important; white-space: normal !important; overflow-wrap: anywhere !important; font-size: 22px !important; }
      .weather-nws-summary,
      .weather-air-detail,
      .weather-alert,
      .weather-stale-banner { padding: 12px !important; border-radius: 12px !important; }
      .weather-timeline-head,
      .weather-five-day-head { align-items: flex-start !important; }
      .weather-timeline-head h3,
      .weather-five-day-head h3 { font-size: 28px !important; }
      .weather-timeline-head p { text-align: left !important; }
      .weather-hourly-strip { display: flex !important; grid-template-columns: none !important; gap: 8px !important; width: 100% !important; max-width: 100% !important; overflow-x: auto !important; overflow-y: hidden !important; scroll-snap-type: x mandatory !important; -webkit-overflow-scrolling: touch !important; }
      .weather-hourly-strip div { flex: 0 0 72% !important; max-width: 72% !important; scroll-snap-align: start !important; padding: 11px !important; }
      .fishing-timeline div { min-height: 142px !important; }
      .weather-five-day { display: flex !important; grid-template-columns: none !important; gap: 8px !important; width: 100% !important; max-width: 100% !important; overflow-x: auto !important; overflow-y: hidden !important; padding-bottom: 6px !important; scroll-snap-type: x mandatory !important; -webkit-overflow-scrolling: touch !important; }
      .weather-day { flex: 0 0 72% !important; max-width: 72% !important; scroll-snap-align: start !important; padding: 11px !important; }
    }
  </style>
</head>
<body>
  <header id="site-nav" class="home-hidden-nav"></header>

  <main class="container workbench-home">
    <section class="desktop-hub" aria-labelledby="weather-title">
      <aside class="hub-sidebar" aria-label="Site sections">
        <a class="hub-brand" href="../">
          <strong>Jez237</strong>
          <span>Philadelphia · Zone 7a</span>
        </a>
        <p class="sidebar-note">A living journal. A garden journal and a workbench.</p>

        <nav class="side-nav" data-site-menu data-active="weather" data-base="../"></nav>

        <div class="side-controls" aria-hidden="true">
          <span>☼</span><span>☾</span><span>⚙</span>
        </div>
      </aside>

      <div class="hub-main">
        <div class="hub-topbar weather-page-intro">
          <div>
            <h1 id="weather-title">Weather Console</h1>
            <p>ZIP-aware weather with alerts, air quality, UV index, radar, and the next few days.</p>
          </div>
          <div class="topbar-actions">
            <a href="../">Overview</a>
            <button type="button" aria-label="Menu">☰</button>
          </div>
        </div>

        <section id="philly-weather" class="below-hub weather-dashboard" aria-label="Weather dashboard">
          <figure class="weather-almanac-panel" aria-labelledby="weather-almanac-title">
            <img class="weather-almanac-art" src="almanac/latest.png" alt="Illustrated Philly 19111 weather almanac for today" loading="eager" decoding="async">
            <figcaption class="weather-almanac-copy">
              <span id="weather-almanac-date">Philly 19111</span>
              <h2 id="weather-almanac-title"><span>Today’s</span><span>Weather</span><span>Almanac</span></h2>
              <p>A daily visual plate for the forecast: temperature, rain, wind, UV, air quality, and the next few days, set apart from the live dashboard below.</p>
              <form class="weather-almanac-zip" id="weather-almanac-zip-form">
                <label for="weather-almanac-zip-input">ZIP forecast</label>
                <input id="weather-almanac-zip-input" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="19111" value="19111">
                <button type="submit">Update</button>
                <span class="weather-almanac-zip-status" id="weather-almanac-zip-status"></span>
              </form>
              <a href="almanac/latest.png">Open the full image</a>
            </figcaption>
          </figure>
          <div id="philly-weather-widget"></div>
        </section>
      </div>
    </section>

    <footer style="margin-top:60px;padding:30px 0;text-align:center;color:var(--ink-lo);font-size:13px;border-top:1px solid rgba(255,255,255,0.06);">
      <a href="https://github.com/jz237/jez237-site" target="_blank" rel="noopener" style="color:var(--brand-gold)">github.com/jz237/jez237-site</a>
    </footer>
  </main>

  <script src="../assets/app.js"></script>
  <script src="../assets/site-enhance.js" defer></script>
  <script src="../assets/side-menu.js" defer></script>
  <script src="../assets/nav.js" defer></script>
  <script>
    fetch('almanac/manifest.json', { headers: { Accept: 'application/json' } })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (!data) return;
        const date = document.getElementById('weather-almanac-date');
        const link = document.querySelector('.weather-almanac-copy a');
        if (date && data.date) date.textContent = data.location ? data.location + ' · ' + data.date : data.date;
        if (link && data.archiveImage) link.href = data.archiveImage;
      })
      .catch(() => {});
    (() => {
      const STORAGE_KEY = 'jez237-weather-place-v1';
      const form = document.getElementById('weather-almanac-zip-form');
      const input = document.getElementById('weather-almanac-zip-input');
      const status = document.getElementById('weather-almanac-zip-status');
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (saved?.zip && input) input.value = saved.zip;
      } catch (_) {}
      if (!form || !input) return;
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const zip = (input.value || '').trim().match(/^\d{5}$/)?.[0];
        if (!zip) {
          if (status) status.textContent = 'Enter a 5-digit ZIP.';
          return;
        }
        if (status) status.textContent = 'Updating forecast...';
        try {
          const res = await fetch('https://api.zippopotam.us/us/' + zip, { headers: { Accept: 'application/json' } });
          if (!res.ok) throw new Error('ZIP lookup failed');
          const data = await res.json();
          const place = data?.places?.[0];
          if (!place) throw new Error('No location found.');
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            name: place['place name'] + ', ' + place['state abbreviation'],
            lat: Number(place.latitude),
            lon: Number(place.longitude),
            zip
          }));
          location.reload();
        } catch (err) {
          if (status) status.textContent = err?.message || 'Could not update that ZIP.';
        }
      });
    })();
  </script>
  <script src="../assets/weather-widget.js?v=20260506-forecast-audit" defer></script>
</body>
</html>
