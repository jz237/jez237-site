<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="title"><title id="title">Test vials beside a log card with one line per observation: tank, date and time, test and kit, result with units, context, and next check.</title><rect width="960" height="680" rx="20" fill="#f6f5ee"/><text x="44" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="600" fill="#183c35">WRITE THE RESULT WITH ITS UNITS</text><rect x="32" y="110" width="330" height="536" rx="18" fill="#e1edf0"/><rect x="392" y="110" width="536" height="536" rx="18" fill="#fffefa" stroke="#d4dbcf" stroke-width="3"/><rect x="88" y="190" width="46" height="250" rx="20" fill="#fffefa" stroke="#183c35" stroke-width="5"/><rect x="93" y="300" width="36" height="135" rx="16" fill="#d9e6a8"/><rect x="82" y="172" width="58" height="26" rx="6" fill="#183c35"/><rect x="168" y="190" width="46" height="250" rx="20" fill="#fffefa" stroke="#183c35" stroke-width="5"/><rect x="173" y="300" width="36" height="135" rx="16" fill="#f2c58a"/><rect x="162" y="172" width="58" height="26" rx="6" fill="#183c35"/><rect x="248" y="190" width="46" height="250" rx="20" fill="#fffefa" stroke="#183c35" stroke-width="5"/><rect x="253" y="300" width="36" height="135" rx="16" fill="#e79a8f"/><rect x="242" y="172" width="58" height="26" rx="6" fill="#183c35"/><text x="60" y="500" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#183c35">Sample, reagent,</text><text x="60" y="540" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#183c35">wait time, light</text><text x="60" y="600" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#183c35">per the kit’s own steps</text><text x="424" y="180" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#183c35">Tank</text><text x="640" y="180" font-family="Arial,sans-serif" font-size="26" fill="#4a8294">Living-room tank</text><path d="M424 202h476" stroke="#d4dbcf" stroke-width="2"/><text x="424" y="252" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#183c35">Date / time</text><text x="640" y="252" font-family="Arial,sans-serif" font-size="26" fill="#4a8294">Nov 1 · 6 pm</text><path d="M424 274h476" stroke="#d4dbcf" stroke-width="2"/><text x="424" y="324" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#183c35">Test · kit</text><text x="640" y="324" font-family="Arial,sans-serif" font-size="26" fill="#4a8294">Nitrate · drops</text><path d="M424 346h476" stroke="#d4dbcf" stroke-width="2"/><text x="424" y="396" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#183c35">Result</text><text x="640" y="396" font-family="Arial,sans-serif" font-size="26" fill="#4a8294">10–20 ppm</text><path d="M424 418h476" stroke="#d4dbcf" stroke-width="2"/><text x="424" y="468" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#183c35">Context</text><text x="640" y="468" font-family="Arial,sans-serif" font-size="26" fill="#4a8294">after water change</text><path d="M424 490h476" stroke="#d4dbcf" stroke-width="2"/><text x="424" y="540" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#183c35">Next check</text><text x="640" y="540" font-family="Arial,sans-serif" font-size="26" fill="#4a8294">retest Nov 4</text><path d="M424 562h476" stroke="#d4dbcf" stroke-width="2"/><text x="424" y="630" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#183c35">Example entry; not a target value</text></svg>