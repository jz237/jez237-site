<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="title"><title id="title">Fish waste and food produce ammonia; bacteria convert it to nitrite and then nitrate, which water changes remove. A new tank needs weeks for these bacteria to build up.</title><rect width="960" height="680" rx="20" fill="#f6f5ee"/><text x="44" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="600" fill="#183c35">A NEW TANK BUILDS ITS BIOFILTER</text><rect x="40" y="130" width="190" height="230" rx="18" fill="#e1edf0"/><text x="58" y="300" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183c35">Fish waste</text><text x="58" y="340" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#183c35">&amp; food</text><rect x="270" y="130" width="190" height="230" rx="18" fill="#eee5d6"/><text x="288" y="300" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183c35">Ammonia</text><text x="288" y="340" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#183c35">most toxic</text><rect x="500" y="130" width="190" height="230" rx="18" fill="#e2ebdf"/><text x="518" y="300" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183c35">Nitrite</text><text x="518" y="340" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#183c35">also toxic</text><rect x="730" y="130" width="190" height="230" rx="18" fill="#e1edf0"/><text x="748" y="300" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183c35">Nitrate</text><text x="748" y="340" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#183c35">less toxic</text><g fill="#183c35"><ellipse cx="135" cy="205" rx="52" ry="24"/><path d="M180 205l28-20v40z"/></g><circle cx="118" cy="200" r="5" fill="#f6f5ee"/><text x="320" y="230" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183c35">NH₃</text><text x="548" y="230" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183c35">NO₂</text><text x="778" y="230" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183c35">NO₃</text><path d="M236 245h24m-10-10 10 10-10 10" fill="none" stroke="#39765e" stroke-width="6" stroke-linecap="round"/><path d="M466 245h24m-10-10 10 10-10 10" fill="none" stroke="#39765e" stroke-width="6" stroke-linecap="round"/><path d="M696 245h24m-10-10 10 10-10 10" fill="none" stroke="#39765e" stroke-width="6" stroke-linecap="round"/><path d="M480 262v118" stroke="#39765e" stroke-width="3" stroke-dasharray="6 7"/><text x="480" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#39765e">bacteria</text><path d="M710 262v118" stroke="#39765e" stroke-width="3" stroke-dasharray="6 7"/><text x="710" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#39765e">bacteria</text><path d="M825 366v44m-12-12 12 12 12-12" fill="none" stroke="#4a8294" stroke-width="6" stroke-linecap="round"/><text x="900" y="446" text-anchor="end" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#4a8294">removed by water changes</text><path d="M60 476h840" stroke="#183c35" stroke-width="3"/><text x="60" y="520" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#183c35">Weeks 1–6: stock lightly, test ammonia, nitrite and pH</text><text x="60" y="566" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#183c35">Established: nitrite falls back down</text><text x="60" y="630" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#183c35">Simplified; not to scale</text></svg>