<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141514">
  <title>Anniversary medallion · Bauder Signs</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./viewer.js" defer></script>
</head>
<body>
  <main class="gallery">
    <header class="masthead">
      <p class="wordmark">Bauder Signs</p>
      <p class="dates" aria-label="1956 to 2026"><span>1956</span><span class="date-rule" aria-hidden="true"></span><span>2026</span></p>
    </header>

    <figure class="stage" aria-label="Gold 70 Years anniversary medallion encircled by a sculpted laurel wreath">
      <div class="object">
        <div class="contact-shadow" aria-hidden="true"></div>
        <video id="turntable" width="960" height="960" loop muted playsinline preload="auto"
               poster="./medallion.webp" aria-hidden="true" disablepictureinpicture>
          <source src="./turntable.mp4?v=since1955" type="video/mp4">
        </video>
        <img class="fallback" src="./medallion.webp" alt="" width="960" height="960" hidden>
      </div>
    </figure>

    <footer class="object-label">
      <div class="caption">
        <h1>Anniversary medallion</h1>
        <a class="homepage-link" href="./homepage/#anniversary">View at homepage size</a>
      </div>
      <div class="controls" aria-label="Medallion viewer controls">
        <div class="view-options" role="group" aria-label="View angle">
          <button type="button" data-angle="0">Front</button>
          <button type="button" data-angle="90">Edge</button>
          <button type="button" data-angle="180">Reverse</button>
        </div>
        <div class="transport">
          <button class="play" id="play" type="button" aria-label="Play rotation" title="Play rotation">
            <svg class="play-glyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13L18 12z"/></svg>
            <svg class="pause-glyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 6h3v12h-3zm6 0h3v12h-3z"/></svg>
          </button>
          <input id="angle" type="range" min="0" max="360" step="1" value="349" aria-label="Rotation angle" aria-valuetext="349 degrees">
          <span id="angle-readout" aria-hidden="true">349°</span>
        </div>
      </div>
      <p class="status" role="status" hidden>The rotation could not be loaded.</p>
    </footer>
  </main>
</body>
</html>
