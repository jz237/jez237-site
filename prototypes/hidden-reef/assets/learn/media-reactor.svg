<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Media reactor saltwater filtration diagram</title>
  <desc id="desc">Educational diagram showing a pump feeding water through carbon or GFO media in a reactor chamber.</desc>
  <rect width="900" height="720" fill="#f7fbff"/>
  <rect x="34" y="34" width="832" height="652" rx="28" fill="#e8f7ff" stroke="#0f7da3" stroke-width="6"/>
  <text x="450" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#07364c">MEDIA REACTOR</text>
  <text x="450" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#236276">For carbon, GFO, phosphate remover, or specialty media</text>
  <rect x="330" y="176" width="240" height="382" rx="44" fill="#d8f6ff" stroke="#0a6d91" stroke-width="7"/>
  <rect x="358" y="306" width="184" height="152" rx="18" fill="#b47a35" stroke="#6f461c" stroke-width="5"/>
  <g fill="#6f461c">
    <circle cx="382" cy="338" r="8"/><circle cx="428" cy="356" r="7"/><circle cx="482" cy="335" r="8"/>
    <circle cx="522" cy="382" r="7"/><circle cx="398" cy="416" r="8"/><circle cx="456" cy="438" r="7"/>
    <circle cx="510" cy="424" r="8"/><circle cx="444" cy="392" r="6"/>
  </g>
  <path d="M450 540 V212" stroke="#36a9d6" stroke-width="13" stroke-dasharray="20 18" marker-end="url(#arrow)"/>
  <rect x="136" y="430" width="126" height="78" rx="14" fill="#1f7fa3"/>
  <text x="199" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#fff">FEED PUMP</text>
  <path d="M262 468 H330" stroke="#07364c" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M570 220 H746" stroke="#07364c" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="122" y="398" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#07364c">tank/sump water</text>
  <text x="604" y="191" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#07364c">polished water returns</text>
  <text x="450" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#07364c">Controlled flow keeps media effective without grinding it into dust.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#07364c"/>
    </marker>
  </defs>
</svg>
