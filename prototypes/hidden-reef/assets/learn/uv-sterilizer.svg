<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">UV sterilizer saltwater filtration diagram</title>
  <desc id="desc">Educational diagram showing water passing through a UV sterilizer body around a quartz sleeve and UV lamp.</desc>
  <rect width="900" height="720" fill="#f7fbff"/>
  <rect x="34" y="34" width="832" height="652" rx="28" fill="#e8f7ff" stroke="#0f7da3" stroke-width="6"/>
  <text x="450" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#07364c">UV STERILIZER</text>
  <text x="450" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#236276">Clarifies water and helps manage free-floating microbes</text>
  <rect x="198" y="300" width="504" height="126" rx="62" fill="#18374d" stroke="#0a6d91" stroke-width="8"/>
  <rect x="242" y="342" width="416" height="42" rx="21" fill="#d9fbff" stroke="#8aebff" stroke-width="5"/>
  <line x1="260" y1="363" x2="640" y2="363" stroke="#bb5cff" stroke-width="11" stroke-linecap="round"/>
  <g stroke="#bb5cff" stroke-width="4" opacity="0.7">
    <path d="M320 308 L282 256"/><path d="M384 300 L364 238"/><path d="M450 300 L450 226"/><path d="M516 300 L536 238"/><path d="M580 308 L618 256"/>
    <path d="M320 418 L282 472"/><path d="M384 426 L364 488"/><path d="M450 426 L450 500"/><path d="M516 426 L536 488"/><path d="M580 418 L618 472"/>
  </g>
  <rect x="112" y="332" width="92" height="62" rx="12" fill="#6ecae3" stroke="#0a6d91" stroke-width="6"/>
  <rect x="696" y="332" width="92" height="62" rx="12" fill="#6ecae3" stroke="#0a6d91" stroke-width="6"/>
  <path d="M84 363 H198" stroke="#07364c" stroke-width="9" marker-end="url(#arrow)"/>
  <path d="M702 363 H816" stroke="#07364c" stroke-width="9" marker-end="url(#arrow)"/>
  <text x="102" y="288" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#07364c">water in</text>
  <text x="672" y="288" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#07364c">water out</text>
  <text x="450" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#07364c">Flow rate and bulb age matter: too fast means weak exposure.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#07364c"/>
    </marker>
  </defs>
</svg>
