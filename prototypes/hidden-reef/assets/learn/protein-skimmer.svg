<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Protein skimmer saltwater filtration diagram</title>
  <desc id="desc">Educational diagram showing pump intake, bubble chamber, foam neck, collection cup, and clean water outlet.</desc>
  <rect width="900" height="720" fill="#f7fbff"/>
  <rect x="34" y="34" width="832" height="652" rx="28" fill="#e8f7ff" stroke="#0f7da3" stroke-width="6"/>
  <text x="450" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#07364c">PROTEIN SKIMMER</text>
  <text x="450" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#236276">Removes dissolved organics before they break down</text>
  <rect x="120" y="520" width="660" height="70" rx="12" fill="#6ecae3" stroke="#126b8f" stroke-width="5"/>
  <text x="450" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#053047">SUMP WATER LEVEL</text>
  <rect x="236" y="210" width="156" height="350" rx="54" fill="#d8f6ff" stroke="#0a6d91" stroke-width="7"/>
  <rect x="508" y="185" width="154" height="375" rx="54" fill="#d8f6ff" stroke="#0a6d91" stroke-width="7"/>
  <path d="M314 210 L314 150 L586 150 L586 185" fill="none" stroke="#0a6d91" stroke-width="7"/>
  <rect x="352" y="106" width="196" height="72" rx="18" fill="#ffffff" stroke="#0a6d91" stroke-width="6"/>
  <text x="450" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#07364c">COLLECTION CUP</text>
  <path d="M314 502 C360 450 370 318 314 240" fill="none" stroke="#36a9d6" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 18"/>
  <path d="M585 510 C526 438 524 308 584 220" fill="none" stroke="#36a9d6" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 18"/>
  <g fill="#ffffff" stroke="#34a9d6" stroke-width="3">
    <circle cx="285" cy="470" r="10"/><circle cx="333" cy="432" r="8"/><circle cx="296" cy="390" r="7"/>
    <circle cx="337" cy="352" r="9"/><circle cx="289" cy="318" r="6"/><circle cx="336" cy="280" r="7"/>
    <circle cx="554" cy="462" r="9"/><circle cx="610" cy="418" r="7"/><circle cx="556" cy="372" r="8"/>
    <circle cx="612" cy="326" r="10"/><circle cx="560" cy="278" r="6"/>
  </g>
  <rect x="116" y="376" width="112" height="72" rx="14" fill="#1f7fa3"/>
  <text x="172" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#fff">PUMP</text>
  <path d="M226 412 H236" stroke="#07364c" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M662 420 H744" stroke="#07364c" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="92" y="344" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#07364c">dirty water in</text>
  <text x="676" y="391" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#07364c">clean water out</text>
  <text x="450" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#07364c">Fine bubbles lift waste foam into the removable cup.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#07364c"/>
    </marker>
  </defs>
</svg>
