<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Filter sock and roller saltwater filtration diagram</title>
  <desc id="desc">Educational diagram showing overflow water passing through filter sock or roller fleece before entering the sump.</desc>
  <rect width="900" height="720" fill="#f7fbff"/>
  <rect x="34" y="34" width="832" height="652" rx="28" fill="#e8f7ff" stroke="#0f7da3" stroke-width="6"/>
  <text x="450" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#07364c">FILTER SOCK / ROLLER</text>
  <text x="450" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#236276">Mechanical stage that traps food, waste, and detritus</text>
  <rect x="128" y="468" width="644" height="88" rx="16" fill="#6ecae3" stroke="#0a6d91" stroke-width="6"/>
  <text x="450" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#07364c">FIRST SUMP CHAMBER</text>
  <path d="M214 168 V268" stroke="#07364c" stroke-width="12" marker-end="url(#arrow)"/>
  <rect x="154" y="268" width="120" height="208" rx="44" fill="#ffffff" stroke="#0a6d91" stroke-width="7"/>
  <path d="M174 316 H254 M174 356 H254 M174 396 H254" stroke="#c8d8df" stroke-width="8"/>
  <text x="214" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#07364c">filter sock</text>
  <path d="M614 168 V282" stroke="#07364c" stroke-width="12" marker-end="url(#arrow)"/>
  <circle cx="552" cy="294" r="52" fill="#ffffff" stroke="#0a6d91" stroke-width="7"/>
  <circle cx="676" cy="294" r="52" fill="#ffffff" stroke="#0a6d91" stroke-width="7"/>
  <path d="M552 294 C584 346 644 346 676 294" fill="none" stroke="#c8d8df" stroke-width="18" stroke-linecap="round"/>
  <rect x="574" y="350" width="80" height="126" rx="18" fill="#ffffff" stroke="#0a6d91" stroke-width="7"/>
  <path d="M614 350 V474" stroke="#c8d8df" stroke-width="14"/>
  <text x="614" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#07364c">fleece roller</text>
  <text x="450" y="652" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#07364c">Clean or replace mechanical media before trapped waste breaks down.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#07364c"/>
    </marker>
  </defs>
</svg>
