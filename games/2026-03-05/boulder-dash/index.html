<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Emerald Mine II — Browser Remaster</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><polygon points='8,1 14,5 14,11 8,15 2,11 2,5' fill='%2355dd55' stroke='%23226622'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  color:#55dd55;background:#000;z-index:10;font-weight:700;letter-spacing:2px}
#boot small{color:#397a39;margin-top:10px;font-weight:400}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="boot">LOADING EMERALD MINE II…<small>102 original caves © 1988 Kingsoft</small></div>
<script src="assets/levels.js?v=1.2.3"></script>
<script src="assets/em-map.js?v=1.2.3"></script>
<script src="assets/engine.js?v=1.2.3"></script>
<script src="assets/render.js?v=1.2.3"></script>
<script src="assets/game.js?v=1.2.3"></script>
<script>
window.addEventListener('error', e => {
  const b = document.getElementById('boot');
  if (b && b.style.display !== 'none') { b.innerHTML = 'LOAD ERROR:<br><small>' + (e.message || e.type) + '</small>'; }
});
requestAnimationFrame(() => requestAnimationFrame(() => {
  const b = document.getElementById('boot'); if (b) b.style.display = 'none';
}));
</script>
</body>
</html>
