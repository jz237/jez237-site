<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joust — Modern 3D</title>
<meta name="description" content="Joust re-imagined in real-time 3D — classic arcade rules with responsive steering and gentle flight in a volcanic 3D arena, with achievements, kill-cam, gamepad rumble and its own global leaderboard.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23ffe999'/><stop offset='1' stop-color='%23d98f16'/></linearGradient></defs><polygon points='3,10 11,7 10,12 4,13' fill='url(%23g)'/><polygon points='9,7 12,3 13,5 10,8' fill='%23eebc2e'/><polygon points='10,5 15,4 15,5 11,6' fill='%23e8ecf5'/></svg>">
<style>
@font-face{font-family:'Cinzel';src:url('assets/fonts/cinzel.woff2') format('woff2');font-weight:400 900;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gl{z-index:1}#hud{z-index:2}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  color:#7fd4ff;background:#05060f;z-index:10;font-weight:700;letter-spacing:3px}
#boot small{color:#3a5a72;margin-top:12px;font-weight:400;letter-spacing:1px}
#touchbar{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;
  padding:14px 18px;gap:10px;z-index:20;pointer-events:none}
#touchbar button{pointer-events:auto;width:72px;height:72px;border-radius:50%;font-family:inherit;font-weight:700;
  font-size:15px;color:#cfeaff;background:radial-gradient(circle at 35% 30%,rgba(30,60,90,.85),rgba(10,20,34,.85));
  border:2px solid rgba(127,212,255,.5);backdrop-filter:blur(2px);-webkit-tap-highlight-color:transparent}
#touchbar #tF{width:96px;height:96px;font-size:18px;color:#fff;
  background:radial-gradient(circle at 35% 30%,rgba(120,40,40,.9),rgba(60,16,16,.9));border-color:rgba(255,120,120,.6)}
#touchbar button:active{filter:brightness(1.5)}
#touchbar .sp{flex:1}
#rotate{display:none}
.game-tools{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));z-index:25;display:flex;gap:8px}
.game-tools.playing{top:auto;right:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(50%)}
.game-tools button,.game-tools a,#pause-menu button,#pause-menu a{font:600 12px/1.3 'Segoe UI',sans-serif;color:#dceaf8;background:#0b1421e8;border:1px solid #779bbb55;border-radius:7px;padding:10px 14px;text-decoration:none;cursor:pointer;touch-action:manipulation}
.game-tools button:hover,.game-tools a:hover,#pause-menu button:hover{background:#22374a}
button:focus-visible,a:focus-visible{outline:2px solid #a0e2ff;outline-offset:3px}
[hidden]{display:none!important}
#pause-menu{position:fixed;inset:0;z-index:24;display:flex;align-items:center;justify-content:center;background:#040812ad;backdrop-filter:blur(8px)}
.pause-panel{width:min(350px,90vw);padding:32px;background:#111b29ee;border:1px solid #668cb13d;border-radius:18px;box-shadow:0 25px 90px #0007;text-align:center;color:#c5d4e4}
.pause-panel h1{font:700 32px Cinzel,Georgia,serif;color:#f5d480;margin:0 0 10px}.pause-panel p{font-size:13px;line-height:1.6;margin:0 0 24px}.pause-panel button,.pause-panel a{display:block;width:100%;margin-top:9px}#pause-menu #resume{background:#a2d8ec;color:#081523}
#wave-pages{position:fixed;left:50%;transform:translateX(-50%);bottom:18%;display:flex;gap:18px;z-index:22}#wave-pages button{background:#0c1a2ce8;border:1px solid #729bbb66;border-radius:7px;color:#cde6f7;padding:9px 14px;touch-action:manipulation;cursor:pointer}#wave-pages button:disabled{opacity:.35;cursor:default}
#touchbar{padding-bottom:max(14px,env(safe-area-inset-bottom));padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
@media(max-height:500px){#touchbar button{width:54px;height:54px}#touchbar #tF{width:68px;height:68px}.game-tools{top:8px;right:8px}.game-tools button,.game-tools a{padding:8px 11px}.pause-panel{padding:20px}}
@media (orientation:portrait) and (pointer:coarse){
  .in-game #rotate{display:flex;align-items:center;gap:8px;position:fixed;bottom:120px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:rgba(0,0,0,.72);color:#7fd4ff;padding:7px 14px;border-radius:10px;font-size:10px;font-weight:700;
    letter-spacing:1px;z-index:30;pointer-events:none;border:1px solid rgba(127,212,255,.35)}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="rotate">↻ ROTATE TO LANDSCAPE</div>
<div id="boot">LOADING JOUST 3D…<small>same game · new world</small></div>
<nav class="game-tools" aria-label="Game controls"><a href="../" id="arena-link">← Arenas</a><button type="button" id="menu-back" hidden>← Back</button><button type="button" id="pause-button" hidden aria-label="Pause game">Ⅱ Pause</button></nav>
<nav id="wave-pages" hidden aria-label="Wave pages"><button type="button" id="wave-prev">← Previous</button><button type="button" id="wave-next">Next →</button></nav>
<div id="pause-menu" hidden role="dialog" aria-modal="true" aria-labelledby="pause-title"><div class="pause-panel"><h1 id="pause-title">Paused</h1><p>Take a breath. Your next joust can wait.</p><button type="button" id="resume">Resume flight</button><button type="button" id="restart">Restart wave · costs 1 mount</button><button type="button" id="quit">Return to title</button><a href="../">Choose another arena</a></div></div>
<script>
window.__V3 = '1.12.1';                              // modern edition version (cache-buster)
window.__V  = '2.0.4';                              // shared retro-engine assets version
window.__JOUST_AUDIO_BASE = '../retro/assets/audio/'; // reuse the bit-exact arcade SFX
window.__JOUST_THEME = 'assets/audio/theme.ogg';       // original modern title theme (menus only)
window.addEventListener('error', e => { const b = document.getElementById('boot'); if (b && b.style.display !== 'none') { b.textContent = 'Unable to start 3D: ' + (e.message || 'an asset could not load') + '. Reload, or choose Retro from Arenas.'; } });
</script>
<script src="../retro/assets/data.js?v=2.0.4"></script>
<script>
// modern-only arena airing (owner request): drop two mid shelves + their spawn pad so
// there's room to fly around. In-place splice — platformsForWave closes over these
// arrays, so reassignment would NOT work. retro/ is untouched.
(() => {
  const drop = new Set(['lowerMid', 'upperR']);
  const P = window.JOUST_DATA.PLATFORMS;
  for (let i = P.length - 1; i >= 0; i--) if (drop.has(P[i].id)) P.splice(i, 1);
  const pads = window.JOUST_DATA.SPAWN_PADS;   // upperR carried a transporter pad
  for (let i = pads.length - 1; i >= 0; i--) if (pads[i].x === 231 && pads[i].y === 121) pads.splice(i, 1);
})();
</script>
<!-- sprites.js MUST precede engine.js: the v2 engine uses the sprite pixel masks for ALL collision -->
<script src="../retro/assets/sprites.js?v=2.0.4"></script>
<script src="../retro/assets/engine.js?v=2.0.4"></script>
<script src="../retro/assets/audio.js?v=2.0.4"></script>
<script src="vendor/three.min.js?v=1.10.1"></script>
<script src="assets/runtime.js?v=1.12.1"></script>
<script src="assets/flight.js?v=1.12.1"></script>
<script src="assets/render3d.js?v=1.12.1"></script>
<script src="assets/game3d.js?v=1.12.1"></script>
</body>
</html>
