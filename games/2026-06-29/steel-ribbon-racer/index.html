<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steel Ribbon Racer</title>
    <script type="module" crossorigin src="./assets/index-DWqSF7mc.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DlIADGgh.css">
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <div id="cockpit" aria-hidden="true">
        <div class="glass-reflection"></div>
        <div class="roll top"></div>
        <div class="roll left"></div>
        <div class="roll right"></div>
        <div class="strut strut-left"></div>
        <div class="strut strut-right"></div>
        <div class="dashboard">
          <div class="gauge">
            <span>SPD</span>
            <strong id="speed">000</strong>
          </div>
          <div class="bar">
            <span>BOOST</span>
            <i id="boost"></i>
          </div>
          <div class="needle-wrap">
            <div class="ticks"></div>
            <div id="needle"></div>
          </div>
          <div class="bar danger">
            <span>DAMAGE</span>
            <i id="damage"></i>
          </div>
          <div class="gauge">
            <span>LAP</span>
            <strong id="lap">1/3</strong>
          </div>
        </div>
      </div>

      <div id="hud">
        <div><b id="position">DIV 4</b><span id="trackName">The Little Ramp</span></div>
        <div><b id="timer">00:00.0</b><span id="score">Score 0</span></div>
      </div>

      <div id="raceStrip" aria-hidden="true">
        <span>YOU<i id="playerProgress"></i></span>
        <span>RIVAL<i id="rivalProgress"></i></span>
      </div>

      <div id="centerMessage" class="hidden"></div>
      <div id="speedFx" aria-hidden="true"></div>
      <div id="damageFx" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </div>

      <div id="touchControls" aria-label="Touch driving controls">
        <div class="touch-stick steer-stick" data-stick="steer" aria-label="Steering joystick">
          <div class="stick-track"></div>
          <div class="stick-knob"></div>
          <span>STEER</span>
        </div>
        <div class="touch-right">
          <button class="boost-button" data-code="ShiftLeft" aria-label="Boost">&#9889;</button>
          <div class="touch-stick drive-stick" data-stick="drive" aria-label="Throttle and brake joystick">
            <div class="stick-track"></div>
            <div class="stick-knob"></div>
            <span>DRIVE</span>
          </div>
        </div>
      </div>

      <section id="menu" class="screen">
        <div class="logo">Steel Ribbon Racer</div>
        <p>Suspended stunt racing, cockpit terror, and expensive landings.</p>
        <button id="startBtn">Start Season</button>
        <button id="practiceBtn">Practice Run</button>
        <div class="league">
          <span>Division Four</span>
          <b>1. Crowther</b>
          <b>2. Bishop</b>
          <b>3. Maddock</b>
          <b>4. You</b>
        </div>
        <small id="best">Best score 0</small>
      </section>

      <section id="result" class="screen hidden">
        <div class="logo small">Race Complete</div>
        <p id="resultText"></p>
        <div id="resultStats" class="league"></div>
        <button id="againBtn">Race Again</button>
      </section>
    </div>
  </body>
</html>
