<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Jez237 — Game Experiments</title>
  <link rel="icon" type="image/svg+xml" href="../assets/brand.svg" />
  <link rel="stylesheet" href="../assets/styles.css" />
  <link rel="stylesheet" href="../assets/design.css" />
  <link rel="stylesheet" href="../assets/site-enhance.css" />
  <style>
    main.container { max-width: 1200px; margin: 0 auto; padding: 22px clamp(16px,3vw,40px) 80px; }

    .game-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 24px 0 26px;
    }
    .game-filters button {
      background: rgba(40,33,26,0.6);
      border: 1px solid rgba(232,197,122,0.2);
      color: var(--ink-mid);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .game-filters button:hover {
      background: rgba(232,197,122,0.12);
      border-color: rgba(232,197,122,0.4);
      color: var(--brand-gold);
      transform: translateY(-1px);
    }
    .game-filters button.active {
      background: linear-gradient(120deg, rgba(232,197,122,0.22), rgba(224,102,126,0.2));
      border-color: rgba(232,197,122,0.55);
      color: var(--ink-hi);
    }

    .game-section { margin-top: 22px; }
    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin: 18px 0 12px;
      font-family: var(--font-serif, 'Fraunces', Georgia, serif);
      color: var(--ink-hi);
    }
    .section-title h2 { margin: 0; font-size: clamp(1.35rem, 3vw, 2rem); font-weight: 500; }
    .section-title span { color: var(--ink-lo); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 20px 18px;
      border-radius: var(--r-md);
      background: var(--surf-2);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: inherit;
      transition: transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out);
      position: relative;
      overflow: hidden;
    }
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      text-decoration: none;
    }
    .game-card .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8em;
      background: linear-gradient(135deg, rgba(232,197,122,0.25), rgba(122,179,98,0.18));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: visible;
    }
    .game-card .icon-wrap > span {
      display: inline-block;
      transform-origin: center center;
      will-change: transform, filter, opacity;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.25));
    }

    /* Appropriate per-icon animations. Type picked by JS from emoji. */
    @keyframes g-thrust {
      0%   { transform: translateY(0) rotate(-2deg); }
      30%  { transform: translateY(-6px) rotate(0deg); }
      40%  { transform: translateY(-10px) translateX(1px) rotate(2deg); }
      60%  { transform: translateY(-3px) translateX(-1px) rotate(-1deg); }
      100% { transform: translateY(0) rotate(-2deg); }
    }
    @keyframes g-twinkle {
      0%,100% { transform: scale(1) rotate(0); opacity: 1; }
      40%     { transform: scale(1.25) rotate(15deg); opacity: 0.85; }
      60%     { transform: scale(0.92) rotate(-10deg); opacity: 1; }
    }
    @keyframes g-burst {
      0%,100% { transform: scale(1) rotate(0); opacity: 1; }
      40%     { transform: scale(1.35) rotate(10deg); opacity: 0.9; }
      55%     { transform: scale(0.95) rotate(-8deg); opacity: 1; }
    }
    @keyframes g-swing {
      0%,100% { transform: rotate(-18deg); }
      50%     { transform: rotate(18deg); }
    }
    @keyframes g-sway {
      0%,100% { transform: rotate(-6deg) translateY(0); }
      50%     { transform: rotate(6deg) translateY(-2px); }
    }
    @keyframes g-spin {
      0%   { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }
    @keyframes g-chug {
      0%,100% { transform: translateX(0) translateY(0); }
      25%     { transform: translateX(-2px) translateY(-1px); }
      50%     { transform: translateX(2px) translateY(0); }
      75%     { transform: translateX(-1px) translateY(1px); }
    }
    @keyframes g-wave {
      0%,100% { transform: translateY(0) rotate(-3deg); }
      25%     { transform: translateY(-2px) rotate(2deg); }
      50%     { transform: translateY(-4px) rotate(-2deg); }
      75%     { transform: translateY(-2px) rotate(3deg); }
    }
    @keyframes g-flash {
      0%,100% { transform: scale(1);    opacity: 1; }
      10%     { transform: scale(1.2);  opacity: 0.25; }
      15%     { transform: scale(0.95); opacity: 1; }
      25%     { transform: scale(1.1);  opacity: 0.5; }
      35%     { transform: scale(1);    opacity: 1; }
    }
    @keyframes g-streak {
      0%   { transform: translateX(-6px) rotate(-10deg); opacity: 0.6; }
      50%  { transform: translateX(0) rotate(0deg); opacity: 1; }
      100% { transform: translateX(6px) rotate(10deg); opacity: 0.6; }
    }
    @keyframes g-rotate-slow {
      0%   { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }
    @keyframes g-float {
      0%,100% { transform: translateY(0) rotate(-1deg); }
      50%     { transform: translateY(-4px) rotate(1deg); }
    }
    @keyframes g-shake {
      0%,100% { transform: translate(0,0) rotate(0); }
      10% { transform: translate(-1px,1px) rotate(-2deg); }
      20% { transform: translate(1px,-1px) rotate(2deg); }
      30% { transform: translate(-1px,-1px) rotate(-1deg); }
      40% { transform: translate(1px,1px) rotate(1deg); }
      50% { transform: translate(-1px,1px) rotate(-2deg); }
      60% { transform: translate(0,0) rotate(0); }
    }
    @keyframes g-hammer {
      0%,100% { transform: rotate(-10deg) translateY(0); }
      30%     { transform: rotate(12deg) translateY(-2px); }
      40%     { transform: rotate(15deg) translateY(0); }
      50%     { transform: rotate(10deg) translateY(1px); }
    }
    @keyframes g-slither {
      0%,100% { transform: translateX(-4px) skewX(-6deg); }
      50%     { transform: translateX(4px) skewX(6deg); }
    }

    .game-card .icon-wrap > span[data-anim="thrust"]      { animation: g-thrust      2.0s ease-in-out infinite; }
    .game-card .icon-wrap > span[data-anim="twinkle"]     { animation: g-twinkle     2.6s ease-in-out infinite; }
    .game-card .icon-wrap > span[data-anim="burst"]       { animation: g-burst       1.8s ease-in-out infinite; }
    .game-card .icon-wrap > span[data-anim="swing"]       { animation: g-swing       1.6s ease-in-out infinite; }
    .game-card .icon-wrap > span[data-anim="sway"]        { animation: g-sway        3.2s ease-in-out infinite; }
    .game-card .icon-wrap > span[data-anim="spin"]        { animation: g-spin        4s linear infinite; }
    .game-card .icon-wrap > span[data-anim="chug"]        { animation: g-chug        0.4s steps(4) infinite; }
    .game-card .icon-wrap > span[data-anim="wave"]        { animation: g-wave        2.8s ease-in-out infinite; }
    .game-card .icon-wrap > span[data-anim="flash"]       { animation: g-flash       2.2s ease-in-out infinite; }
    .game-card .icon-wrap > span[data-anim="streak"]      { animation: g-streak      3s ease-in-out infinite; }
    .game-card .icon-wrap > span[data-anim="rotate-slow"] { animation: g-rotate-slow 16s linear infinite; }
    .game-card .icon-wrap > span[data-anim="float"]       { animation: g-float       3.4s ease-in-out infinite; }
    .game-card .icon-wrap > span[data-anim="shake"]       { animation: g-shake       1.4s ease-in-out infinite; }
    .game-card .icon-wrap > span[data-anim="hammer"]      { animation: g-hammer      0.9s ease-in-out infinite; }
    .game-card .icon-wrap > span[data-anim="slither"]     { animation: g-slither     2.2s ease-in-out infinite; }
    /* User explicitly asked for animations — reduced-motion is ignored here. */
    /* Color variety so the grid feels playful without clashing with the site */
    .game-card:nth-child(6n+1) .icon-wrap { background: linear-gradient(135deg, rgba(77,150,255,.32), rgba(127,107,255,.2)); }
    .game-card:nth-child(6n+2) .icon-wrap { background: linear-gradient(135deg, rgba(255,217,61,.3), rgba(255,107,107,.2)); }
    .game-card:nth-child(6n+3) .icon-wrap { background: linear-gradient(135deg, rgba(107,203,119,.3), rgba(68,209,255,.2)); }
    .game-card:nth-child(6n+4) .icon-wrap { background: linear-gradient(135deg, rgba(198,107,255,.3), rgba(255,95,162,.2)); }
    .game-card:nth-child(6n+5) .icon-wrap { background: linear-gradient(135deg, rgba(255,122,0,.28), rgba(255,217,61,.2)); }
    .game-card:nth-child(6n+6) .icon-wrap { background: linear-gradient(135deg, rgba(68,209,255,.28), rgba(107,107,255,.22)); }

    .game-card .title {
      font-family: var(--font-serif, 'Fraunces', Georgia, serif);
      font-weight: 500;
      font-size: 1.05rem;
      line-height: 1.2;
      letter-spacing: -0.005em;
      color: var(--ink-hi);
    }
    .game-card .desc {
      font-size: 12.5px;
      color: var(--ink-mid);
      line-height: 1.45;
    }
    .game-card .date {
      font-size: 11px;
      color: var(--ink-lo);
      letter-spacing: 0.03em;
    }
    .game-card .tag {
      display: inline-block;
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 999px;
      width: fit-content;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .game-card .tag.featured     { background: rgba(127,149,255,0.18); color: #c8d1ff; border: 1px solid rgba(127,149,255,0.4); }
    .game-card .tag.classic      { background: rgba(255,217,61,0.18);  color: #ffe38a; border: 1px solid rgba(255,217,61,0.4); }
    .game-card .tag.experimental { background: rgba(198,107,255,0.16); color: #d7b8ff; border: 1px solid rgba(163,119,217,0.4); }
    .game-card .tag.unfinished   { background: rgba(224,102,126,0.14); color: #ffc1cd; border: 1px solid rgba(224,102,126,0.38); }
    .game-card .tag.demo         { background: rgba(68,209,255,0.16); color: #b9f3ff; border: 1px solid rgba(68,209,255,0.42); }

    .game-count {
      text-align: center;
      color: var(--ink-lo);
      font-size: 13px;
      margin-top: 28px;
      letter-spacing: 0.02em;
    }

    .game-card { position: relative; }
    .game-card .new-badge {
      position: absolute; top: 10px; right: 10px;
      background: linear-gradient(135deg, #ff4444, #ff6b00);
      color: #fff; font-size: 10px; font-weight: 800;
      padding: 2px 7px; border-radius: 999px;
      letter-spacing: .08em; text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(255,68,68,.45);
      z-index: 2;
    }
    .game-card .play-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(8,8,20,.65); border-radius: var(--r-md);
      color: #fff; font-size: 18px; font-weight: 800;
      letter-spacing: .06em; opacity: 0; transition: opacity .25s ease;
      pointer-events: none; z-index: 3;
    }
    .game-card:hover .play-overlay { opacity: 1; }

    @media (max-width: 620px) {
      main.container { padding-inline: 10px; }
      .game-filters { gap: 6px; margin: 18px 0 18px; }
      .game-filters button { padding: 7px 10px; font-size: 11px; }
      .game-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .game-card { padding: 10px 8px; gap: 6px; border-radius: 14px; align-items: center; text-align: center; }
      .game-card .icon-wrap { width: 42px; height: 42px; border-radius: 11px; font-size: 1.45em; }
      .game-card .title { font-size: 0.78rem; line-height: 1.08; min-height: 2.1em; display: flex; align-items: center; }
      .game-card .desc { display: none; }
      .game-card .date { font-size: 9px; }
      .game-card .tag { font-size: 8px; padding: 2px 6px; margin-top: 0; }
      .section-title { margin: 16px 0 8px; padding-inline: 2px; }
      .section-title h2 { font-size: 1.25rem; }
      .section-title span { font-size: 10px; }
    }

    @media (max-width: 370px) {
      .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* Match the dedicated GameMaster Arcade page while preserving this page's sections/nav. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; overflow-x: hidden; }
    html:not([data-theme="light"]), body, :root[data-theme="light"] body {
      background:
        radial-gradient(circle at 8% 8%, rgba(255,107,107,.28), transparent 18%),
        radial-gradient(circle at 24% 82%, rgba(255,217,61,.18), transparent 20%),
        radial-gradient(circle at 88% 12%, rgba(77,150,255,.24), transparent 22%),
        radial-gradient(circle at 78% 78%, rgba(107,203,119,.18), transparent 22%),
        radial-gradient(circle at 52% 100%, rgba(198,107,255,.22), transparent 26%),
        linear-gradient(180deg,#080814 0%,#100f24 42%,#15112b 100%) !important;
      color: #f2f4ff !important;
    }
    body { min-height: 100vh; position: relative; background-color: #080814 !important; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background:
        radial-gradient(circle at 8% 8%, rgba(255,107,107,.28), transparent 18%),
        radial-gradient(circle at 24% 82%, rgba(255,217,61,.18), transparent 20%),
        radial-gradient(circle at 88% 12%, rgba(77,150,255,.24), transparent 22%),
        radial-gradient(circle at 78% 78%, rgba(107,203,119,.18), transparent 22%),
        radial-gradient(circle at 52% 100%, rgba(198,107,255,.22), transparent 26%),
        linear-gradient(180deg,#080814 0%,#100f24 42%,#15112b 100%);
    }
    body.arcade-galaxy-page,
    :root[data-theme="light"] body.arcade-galaxy-page {
      background:
        radial-gradient(ellipse at 0% 48%, rgba(76,211,255,0.25), transparent 36%),
        radial-gradient(ellipse at 100% 52%, rgba(40,153,255,0.23), transparent 38%),
        linear-gradient(180deg, #020711, #061833 62%, #020711) !important;
      color: #f2f4ff !important;
    }
    body.arcade-galaxy-page::before {
      inset: -8vh -18vw -14vh;
      z-index: 0;
      background:
        linear-gradient(90deg, rgba(2,7,17,0.82), rgba(2,7,17,0.02) 17%, rgba(2,7,17,0.0) 84%, rgba(2,7,17,0.82)),
        linear-gradient(180deg, rgba(2,7,17,0.62), rgba(2,7,17,0.02) 24%, rgba(2,7,17,0.18) 70%, rgba(2,7,17,0.84)),
        url("../assets/galaxy-home-20260530.webp") center 42% / cover no-repeat;
      opacity: 0.96;
      filter: saturate(1.28) contrast(1.08);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      animation: galaxy-drift 28s ease-in-out infinite alternate;
    }
    body.arcade-galaxy-page::after {
      content: "";
      position: fixed;
      inset: -38vmax -42vmax;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(1,4,12,0.52), rgba(1,4,12,0.0) 17%, rgba(1,4,12,0.0) 83%, rgba(1,4,12,0.52)),
        radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.08), transparent 34%),
        url("../assets/galaxy-home-20260530.webp") center 50% / cover no-repeat;
      opacity: 0.3;
      filter: saturate(1.22) contrast(1.06) blur(0.4px);
      mix-blend-mode: screen;
      transform-origin: 50% 50%;
      animation: galaxy-slow-turn 210s linear infinite;
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 0 43%, rgba(0,0,0,0.72) 58%, transparent 83%);
      mask-image: radial-gradient(ellipse at 50% 50%, #000 0 43%, rgba(0,0,0,0.72) 58%, transparent 83%);
    }
    body.arcade-galaxy-page header#site-nav,
    body.arcade-galaxy-page main.container {
      position: relative;
      z-index: 1;
    }
    header#site-nav, :root[data-theme="light"] header#site-nav { background: rgba(8,8,20,.78) !important; border-bottom: 1px solid rgba(255,255,255,.08) !important; backdrop-filter: blur(14px); }
    header#site-nav .links a, :root[data-theme="light"] header#site-nav .links a { color: #cfd6ff !important; }
    header#site-nav .links a:hover, header#site-nav .links a[aria-current="page"], :root[data-theme="light"] header#site-nav .links a:hover, :root[data-theme="light"] header#site-nav .links a[aria-current="page"] { background: rgba(127,107,255,.22) !important; color: #fff !important; }

        storm: `<g class="spinny"><path class="neon" d="M50 18 C35 10 15 18 17 33 C19 49 45 50 49 34 C52 22 31 21 28 33 C26 42 40 43 41 34"/><path class="c" d="M31 23 L42 31 L31 41 L20 31Z" opacity=".55"/></g>`,
        magic: `<circle class="soft b pulse" cx="32" cy="32" r="19"/><path class="neon spinny" d="M32 14 L37 27 L51 27 L40 36 L44 50 L32 42 L20 50 L24 36 L13 27 L27 27Z"/><circle class="hot pulse" cx="32" cy="32" r="5"/>`,
        tessera: `${[[22,20],[38,20],[30,34],[46,34],[18,34]].map(([x,y],i)=>`<path class="${i%2?'b':'a'} floaty" d="M${x} ${y-8} L${x+8} ${y-4} L${x+8} ${y+5} L${x} ${y+9} L${x-8} ${y+5} L${x-8} ${y-4}Z"/>`).join('')}<path class="neon soft dash" d="M14 50 H50"/>`,
        void: `<circle class="soft a pulse" cx="32" cy="32" r="23"/><path class="neon spinny" d="M50 30 C43 13 17 15 15 33 C13 50 42 53 47 38 C51 27 28 24 25 35 C22 44 38 45 40 35"/><circle class="hot orbit" cx="20" cy="20" r="2"/><circle class="c orbit" cx="47" cy="44" r="2.5"/>`,
        web: `<g class="pulse"><path class="neon soft" d="M32 11 V54 M12 32 H53 M18 18 L47 47 M47 18 L18 47"/><circle class="neon" cx="32" cy="32" r="9"/><circle class="neon soft" cx="32" cy="32" r="19"/></g><circle class="hot floaty" cx="38" cy="27" r="4"/>`,
        joust: `<path class="trail c sweep" d="M12 44 C24 38 37 33 54 22"/><g class="thrust"><path class="hot" d="M15 34 C24 18 43 18 51 32 C39 28 31 34 24 45Z"/><path class="a" d="M25 37 L42 27 L53 32 L32 43Z"/><path class="neon" d="M18 34 C27 20 41 20 51 32 M31 39 L56 20"/></g>`
      };
      return `<svg ${common}>${art[effect] || art.star || `${bg}<path class="hot pulse" d="M32 9 L38 25 L55 25 L41 35 L46 52 L32 42 L18 52 L23 35 L9 25 L26 25Z"/>`}</svg>`;
    }
    function gameIcon(g, index) {
      const effect = iconEffect(g);
      return `
        <span class="icon-wrap" style="${iconStyle(g, index)}" aria-hidden="true">
          <span class="arcade-icon icon-${effect}">
            ${iconSvg(effect)}
          </span>
        </span>
      `;
    }

    function gameCard(g, index) {
      const isNew = g.date.startsWith('May');
      return `
        <a class="game-card" href="${BASE}${g.path}" target="_blank" rel="noopener">
          ${gameIcon(g, index)}
          ${isNew ? '<span class="new-badge">NEW</span>' : ''}
          <span class="title">${g.title}</span>
          ${g.desc ? `<span class="desc">${g.desc}</span>` : ''}
          <span class="date">${g.date}</span>
          <span class="tag ${g.status === 'unfinished' ? 'unfinished' : g.tag}">${tagLabel(g.tag, g.status)}</span>
          <span class="play-overlay">▶ Play</span>
        </a>
      `;
    }

    function renderSection(title, list) {
      if (!list.length) return '';
      return `
        <section class="game-section" aria-label="${title} games">
          <div class="section-title"><h2>${title}</h2><span>${list.length} game${list.length === 1 ? '' : 's'}</span></div>
          <div class="game-grid">${list.map(gameCard).join('')}</div>
        </section>
      `;
    }

    function render() {
      const q = (document.getElementById('game-search')?.value || '').toLowerCase().trim();
      const base = currentFilter === 'all'
        ? games
        : games.filter(g => g.tag === currentFilter || g.cat === currentFilter || g.status === currentFilter);
      const list = q
        ? base.filter(g => g.title.toLowerCase().includes(q) || (g.desc||'').toLowerCase().includes(q) || g.cat.includes(q) || g.tag.includes(q))
        : base;
      const released = list.filter(g => g.status !== 'unfinished');
      const unfinished = list.filter(g => g.status === 'unfinished');
      sections.innerHTML = renderSection('Released Games', released) + (unfinished.length ? renderSection('Unfinished Games', unfinished) : '');
      count.textContent = `${list.length} game${list.length === 1 ? '' : 's'}${currentFilter === 'all' ? '' : ' · ' + currentFilter}${q ? ' matching \"' + q + '\"' : ''}`;
      requestAnimationFrame(() => {
        document.querySelectorAll('.game-card').forEach((el,i) => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(14px)';
          el.style.transition = 'opacity .35s ease ' + (i * 0.03) + 's, transform .35s ease ' + (i * 0.03) + 's';
          requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; });
        });
      });
    }

    filters.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      currentFilter = btn.dataset.filter;
      filters.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      render();
    });

    document.getElementById('game-search')?.addEventListener('input', () => render());

    render();

    // Randomize animation-delay per icon so the grid doesn't pulse in unison
    function jitterIconDelays() {
      document.querySelectorAll('.game-card .arcade-svg .floaty, .game-card .arcade-svg .pulse, .game-card .arcade-svg .spinny, .game-card .arcade-svg .orbit, .game-card .arcade-svg .thrust, .game-card .arcade-svg .wiggle, .game-card .arcade-svg .blink, .game-card .arcade-svg .sweep, .game-card .arcade-svg .dash').forEach(el => {
        el.style.animationDelay = (-Math.random() * 4).toFixed(2) + 's';
      });
    }
    jitterIconDelays();
    // Re-jitter after each filter change (re-renders new cards)
    filters.addEventListener('click', jitterIconDelays);

    // Hero canvas animation - adapted from Night Fireworks Show
    (function(){
      const canvas=document.getElementById('hero-canvas');
      if(!canvas)return;
      const ctx=canvas.getContext('2d');
      const TAU=Math.PI*2;
      const palettes=[
        ['#fff4c7','#ffd766','#ff9e42','#ff5a36'],
        ['#fefefe','#ff8ac8','#ff5f7a','#d42b58'],
        ['#f4ffda','#b8ff7a','#5bd368','#1f9759'],
        ['#ffffff','#8fd9ff','#59a8ff','#4775ff'],
        ['#ffffff','#d7b0ff','#af76ff','#833dff'],
        ['#fff8dc','#44d1ff','#7f6bff','#ff5fa2']
      ];
      const state={w:0,h:0,dpr:1,now:0,last:0,wind:0,auto:0,rockets:[],sparks:[],smoke:[],flashes:[],embers:[],stars:[],skyline:[]};
      const rand=(min,max)=>Math.random()*(max-min)+min;
      const pick=a=>a[(Math.random()*a.length)|0];
      const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
      const lerp=(a,b,t)=>a+(b-a)*t;
      function hexToRgba(hex,alpha){
        const clean=hex.replace('#','');
        const int=parseInt(clean.length===3?clean.split('').map(p=>p+p).join(''):clean,16);
        return 'rgba('+((int>>16)&255)+','+((int>>8)&255)+','+(int&255)+','+alpha+')';
      }
      function resize(){
        const box=canvas.getBoundingClientRect();
        state.w=Math.max(1,box.width);
        state.h=Math.max(1,box.height);
        state.dpr=Math.min(window.devicePixelRatio||1,2);
        canvas.width=Math.floor(state.w*state.dpr);
        canvas.height=Math.floor(state.h*state.dpr);
        ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
        buildBackdrop();
      }
      function buildBackdrop(){
        state.stars=[];state.skyline=[];
        for(let i=0;i<70;i++){
          state.stars.push({x:Math.random()*state.w,y:Math.random()*state.h*.66,size:rand(.45,1.5),alpha:rand(.18,.75),twinkle:rand(.5,1.4)});
        }
        let x=-20;
        while(x<state.w+30){
          const width=rand(22,58),height=rand(state.h*.13,state.h*.34),lights=[];
          const rows=Math.max(1,Math.floor(height/14));
          for(let r=0;r<rows;r++){
            if(Math.random()>.38)lights.push({x:rand(4,width-7),y:8+r*12,w:rand(1.5,3.5),h:rand(2,4),a:rand(.08,.22)});
          }
          state.skyline.push({x,width,height,lights});
          x+=width-rand(4,12);
        }
      }
      function addSmoke(x,y,radius,count,tint,alpha){
        for(let i=0;i<count;i++){
          state.smoke.push({x:x+rand(-radius*.18,radius*.18),y:y+rand(-radius*.1,radius*.1),vx:rand(-10,10),vy:rand(-10,-3),radius:rand(radius*.08,radius*.2),growth:rand(7,20),alpha:rand(alpha*.35,alpha),ttl:rand(1.5,3.4),life:0,tint});
        }
      }
      function addSpark(cfg){
        state.sparks.push({x:cfg.x,y:cfg.y,vx:cfg.vx,vy:cfg.vy,drag:cfg.drag,gravity:cfg.gravity,radius:cfg.radius,color:cfg.color,glow:cfg.glow,ttl:cfg.ttl,life:0,trail:[],ember:cfg.ember||false,crackle:cfg.crackle||false,strobe:cfg.strobe||0,fadeFloor:cfg.fadeFloor||.06});
      }
      function createRocket(xRatio,targetX,targetY,heavy){
        const x=clamp(state.w*xRatio,18,state.w-18);
        const y=state.h+rand(4,18);
        const tx=targetX==null?lerp(state.w*.15,state.w*.85,xRatio):targetX;
        const ty=targetY==null?rand(state.h*.08,state.h*.45):targetY;
        const travel=Math.max(.42,(y-ty)/rand(260,360));
        const palette=pick(palettes);
        const roll=Math.random();
        const shell=roll>.76?'willow':roll>.56?'crackle':roll>.34?'ring':roll>.16?'palm':'peony';
        state.rockets.push({x,y,vx:(tx-x)/travel,vy:-rand(230,heavy?380:320),life:0,targetY:ty,fuse:rand(.62,1.05),shell,palette,size:heavy?rand(1.05,1.42):rand(.72,1.06),heavy:!!heavy,trail:[]});
      }
      function explodeRocket(rocket){
        const x=rocket.x,y=rocket.y,palette=rocket.palette,core=palette[0],size=rocket.size,style=rocket.shell;
        let layers=rocket.heavy?2:1;
        if(style==='crackle')layers=2;
        state.flashes.push({x,y,radius:rand(30,64)*size,color:core,life:0,ttl:rocket.heavy ? .34 : .24,alpha:rocket.heavy ? .2 : .14});
        addSmoke(x,y,52*size,rocket.heavy?12:7,'232,236,244',.16);
        addSmoke(x,y,28*size,rocket.heavy?7:4,'255,175,130',.11);
        for(let layer=0;layer<layers;layer++){
          const count=Math.floor((rocket.heavy?62:42)*(1-layer*.18));
          const speed=rand(54,122)*size*(1+layer*.24);
          for(let i=0;i<count;i++){
            const angle=rand(0,TAU);
            let spread=style==='ring'?rand(.78,.96):style==='palm'?Math.pow(Math.random(),1.9):style==='willow'?Math.pow(Math.random(),1.15):Math.pow(Math.random(),.72);
            const shellSpeed=speed*spread;
            let vy=Math.sin(angle)*shellSpeed+rand(-8,8);
            if(style==='ring')vy*=.48;
            if(style==='palm')vy=Math.sin(angle)*shellSpeed*.3-shellSpeed*.42;
            const color=pick(palette);
            addSpark({x,y,vx:Math.cos(angle)*shellSpeed+rand(-8,8),vy,drag:style==='willow' ? .989 : .984,gravity:style==='willow'?72:style==='palm'?88:82,radius:rand(.75,1.8)*size,color,glow:rand(8,18)*size,ttl:style==='willow'?rand(1.15,1.9):rand(.85,1.45),ember:Math.random()>.58,crackle:style==='crackle'&&Math.random()>.85,strobe:color==='#ffffff'?rand(0,18):0,fadeFloor:rand(.02,.08)});
          }
        }
        for(let i=0;i<(rocket.heavy?14:8);i++){
          state.embers.push({x:x+rand(-14,14),y:y+rand(-14,14),vx:rand(-24,24),vy:rand(6,58),radius:rand(.6,1.8)*size,life:0,ttl:rand(.65,1.7),color:pick(['#ffdf9b','#ff9f50','#ff7347','#fff8db'])});
        }
        if(rocket.heavy&&Math.random()>.62){
          for(let i=0;i<3;i++){
            const a=i/3*TAU+rand(-.12,.12);
            createRocket(x/state.w,x+Math.cos(a)*rand(45,95),y+Math.sin(a)*rand(18,58),false);
          }
        }
      }
      function updateRocket(r,dt){
        r.life+=dt;r.vx+=state.wind*dt*.45;r.x+=r.vx*dt;r.y+=r.vy*dt;r.vy+=108*dt;
        r.trail.push({x:r.x,y:r.y,age:0});
        if(r.trail.length>18)r.trail.shift();
        r.trail.forEach(p=>p.age+=dt);
        if(r.vy>=-18||r.y<=r.targetY||r.life>=r.fuse){explodeRocket(r);return false;}
        return r.x>-80&&r.x<state.w+80&&r.y<state.h+40;
      }
      function updateSpark(s,dt){
        s.life+=dt;s.vx*=s.drag;s.vy=s.vy*s.drag+s.gravity*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
        s.trail.push({x:s.x,y:s.y,age:0});
        if(s.trail.length>12)s.trail.shift();
        s.trail.forEach(p=>p.age+=dt);
        if(s.crackle&&Math.random()>.86)state.flashes.push({x:s.x,y:s.y,radius:rand(5,13),color:s.color,life:0,ttl:.12,alpha:.2});
        if(s.ember&&Math.random()>.94)addSmoke(s.x,s.y,s.glow*.45,1,'185,190,210',.08);
        return s.life<s.ttl;
      }
      function updateSmoke(p,dt){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.radius+=p.growth*dt;return p.life<p.ttl;}
      function updateFlash(f,dt){f.life+=dt;return f.life<f.ttl;}
      function updateEmber(e,dt){e.life+=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=38*dt;return e.life<e.ttl&&e.y<state.h+20;}
      function schedule(dt){
        state.auto-=dt;
        const busy=state.rockets.length+state.sparks.length*.007;
        if(state.auto<=0&&busy<3.8){
          createRocket(rand(.12,.88),null,null,Math.random()>.68);
          state.auto=rand(.18,.48);
        }
      }
      function drawBackground(){
        const bg=ctx.createLinearGradient(0,0,0,state.h);
        bg.addColorStop(0,'#06111f');
        bg.addColorStop(.52,'#081a2d');
        bg.addColorStop(1,'#10070f');
        ctx.fillStyle=bg;ctx.fillRect(0,0,state.w,state.h);
        ctx.save();
        ctx.globalCompositeOperation='screen';
        const ground=ctx.createRadialGradient(state.w*.5,state.h*1.08,0,state.w*.5,state.h*1.08,state.w*.8);
        ground.addColorStop(0,'rgba(255,137,66,.18)');
        ground.addColorStop(.45,'rgba(127,107,255,.08)');
        ground.addColorStop(1,'rgba(255,137,66,0)');
        ctx.fillStyle=ground;ctx.fillRect(0,0,state.w,state.h);
        for(const star of state.stars){
          const pulse=.55+.45*Math.sin(state.now*star.twinkle+star.x);
          ctx.globalAlpha=star.alpha*pulse;
          ctx.fillStyle='#dfe9ff';
          ctx.beginPath();ctx.arc(star.x,star.y,star.size,0,TAU);ctx.fill();
        }
        ctx.restore();
        const horizon=state.h*.8;
        ctx.fillStyle='rgba(3,7,18,.82)';
        for(const b of state.skyline){
          ctx.fillRect(b.x,horizon-b.height,b.width,b.height);
          ctx.fillStyle='rgba(255,216,141,.22)';
          for(const l of b.lights)ctx.fillRect(b.x+l.x,horizon-b.height+l.y,l.w,l.h);
          ctx.fillStyle='rgba(3,7,18,.82)';
        }
        const veil=ctx.createRadialGradient(state.w*.5,state.h*.48,state.w*.05,state.w*.5,state.h*.5,state.w*.55);
        veil.addColorStop(0,'rgba(8,8,20,.55)');
        veil.addColorStop(.65,'rgba(8,8,20,.2)');
        veil.addColorStop(1,'rgba(8,8,20,0)');
        ctx.fillStyle=veil;ctx.fillRect(0,0,state.w,state.h);
      }
      function drawSmoke(){
        for(const p of state.smoke){
          const fade=1-p.life/p.ttl;
          const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.radius);
          g.addColorStop(0,'rgba('+p.tint+','+(p.alpha*fade)+')');
          g.addColorStop(.4,'rgba('+p.tint+','+(p.alpha*fade*.45)+')');
          g.addColorStop(1,'rgba(30,35,45,0)');
          ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,TAU);ctx.fill();
        }
      }
      function drawRocket(r){
        ctx.save();ctx.globalCompositeOperation='lighter';
        for(let i=0;i<r.trail.length;i++){
          const p=r.trail[i],ratio=i/r.trail.length,alpha=ratio*.16,radius=1.5+ratio*5.5;
          const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);
          g.addColorStop(0,'rgba(255,246,219,'+alpha+')');
          g.addColorStop(.45,'rgba(255,169,89,'+(alpha*.7)+')');
          g.addColorStop(1,'rgba(255,80,25,0)');
          ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,radius,0,TAU);ctx.fill();
        }
        const glow=ctx.createRadialGradient(r.x,r.y,0,r.x,r.y,22);
        glow.addColorStop(0,'rgba(255,255,240,.55)');
        glow.addColorStop(.3,'rgba(255,200,110,.28)');
        glow.addColorStop(1,'rgba(255,110,48,0)');
        ctx.fillStyle=glow;ctx.beginPath();ctx.arc(r.x,r.y,22,0,TAU);ctx.fill();
        ctx.restore();
      }
      function drawSpark(s){
        ctx.save();ctx.globalCompositeOperation='lighter';
        for(let i=1;i<s.trail.length;i++){
          const prev=s.trail[i-1],point=s.trail[i],ratio=i/s.trail.length;
          ctx.strokeStyle=hexToRgba(s.color,ratio*.13);
          ctx.lineWidth=Math.max(.35,s.radius*ratio*.7);
          ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(point.x,point.y);ctx.stroke();
        }
        const visible=!s.strobe||((s.life*1000+s.x)%s.strobe>s.strobe*.4);
        if(visible){
          const fade=Math.max(s.fadeFloor,1-s.life/s.ttl);
          const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.glow);
          g.addColorStop(0,s.color+'88');
          g.addColorStop(.2,s.color+'44');
          g.addColorStop(.48,s.color+'14');
          g.addColorStop(1,s.color+'00');
          ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,s.glow,0,TAU);ctx.fill();
          ctx.globalAlpha=fade;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.radius,0,TAU);ctx.fill();
        }
        ctx.restore();
      }
      function drawFlash(f){
        const t=f.life/f.ttl,alpha=f.alpha*(1-t);
        ctx.save();ctx.globalCompositeOperation='screen';
        const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.radius*(1+t*.8));
        g.addColorStop(0,hexToRgba(f.color,alpha));
        g.addColorStop(.5,hexToRgba(f.color,alpha*.34));
        g.addColorStop(1,hexToRgba(f.color,0));
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.radius*(1+t*.8),0,TAU);ctx.fill();
        ctx.restore();
      }
      function drawEmber(e){
        const fade=1-e.life/e.ttl;
        ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=fade*.78;ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,TAU);ctx.fill();ctx.restore();
      }
      function loop(ts){
        if(!state.last)state.last=ts;
        const dt=Math.min(.033,(ts-state.last)/1000);
        state.last=ts;state.now+=dt;state.wind=Math.sin(state.now*.18)*5+Math.sin(state.now*.71)*2;
        schedule(dt);
        state.rockets=state.rockets.filter(r=>updateRocket(r,dt));
        state.sparks=state.sparks.filter(s=>updateSpark(s,dt));
        state.smoke=state.smoke.filter(p=>updateSmoke(p,dt));
        state.flashes=state.flashes.filter(f=>updateFlash(f,dt));
        state.embers=state.embers.filter(e=>updateEmber(e,dt));
        if(state.sparks.length>520)state.sparks.splice(0,state.sparks.length-520);
        if(state.smoke.length>140)state.smoke.splice(0,state.smoke.length-140);
        drawBackground();
        drawSmoke();
        state.flashes.forEach(drawFlash);
        state.rockets.forEach(drawRocket);
        state.sparks.forEach(drawSpark);
        state.embers.forEach(drawEmber);
        requestAnimationFrame(loop);
      }
      resize();
      window.addEventListener('resize',resize);
      for(let i=0;i<5;i++){
        explodeRocket({
          x:rand(state.w*.13,state.w*.87),
          y:rand(state.h*.1,state.h*.46),
          palette:pick(palettes),
          size:rand(.82,1.28),
          shell:pick(['peony','ring','crackle','willow','palm']),
          heavy:i%2===0,
          trail:[]
        });
      }
      for(let i=0;i<4;i++)createRocket(rand(.18,.82),null,rand(state.h*.12,state.h*.42),i===1);
      requestAnimationFrame(loop);
    })();
  </script>
  <script src="../assets/site-enhance.js" defer></script>
  <script src="../assets/nav.js" defer></script>
