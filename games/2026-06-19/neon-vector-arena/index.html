<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Vector Arena Demo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    color: #eaffff;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
    user-select: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #02030a;
    cursor: crosshair;
  }
  .hud {
    position: fixed;
    inset: 20px 22px auto 22px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    pointer-events: none;
    z-index: 3;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
    text-shadow: 0 0 5px currentColor, 0 0 13px currentColor;
  }
  .hud span {
    min-width: 88px;
    padding: 0;
    color: #dcfdff;
    font-size: clamp(10px, 2.7vw, 15px);
    line-height: 1.18;
    white-space: nowrap;
  }
  .hud span:nth-child(2) { text-align: center; color: #ffef75; }
  .hud span:nth-child(3) { min-width: 165px; text-align: right; color: #ff7bdc; }
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: grid;
    place-items: center;
    padding: 22px;
    background:
      radial-gradient(circle at 50% 42%, rgba(32, 255, 242, .14), transparent 25%),
      radial-gradient(circle at 25% 74%, rgba(255, 55, 220, .16), transparent 25%),
      linear-gradient(180deg, rgba(2, 3, 10, .2), rgba(2, 3, 10, .88));
    transition: opacity .25s ease;
  }
  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .panel {
    width: min(620px, 100%);
    text-align: center;
    padding: 26px clamp(18px, 4vw, 34px);
    border: 1px solid rgba(93, 241, 255, .45);
    border-radius: 10px;
    background: rgba(3, 7, 18, .72);
    box-shadow:
      inset 0 0 28px rgba(0, 255, 234, .12),
      0 0 34px rgba(64, 223, 255, .24),
      0 0 80px rgba(255, 61, 213, .14);
    backdrop-filter: blur(10px);
  }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(2.2rem, 9vw, 4.5rem);
    line-height: .92;
    letter-spacing: .02em;
    color: #fff;
    text-shadow:
      0 0 8px #fff,
      0 0 18px #40f7ff,
      0 0 36px #ff34cd;
  }
  .sub {
    margin: 0 auto 20px;
    max-width: 420px;
    color: #bcf8ff;
    font-weight: 800;
    line-height: 1.45;
    text-transform: uppercase;
    letter-spacing: .09em;
    font-size: clamp(12px, 2.8vw, 14px);
  }
  button {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, .8);
    border-radius: 8px;
    background: linear-gradient(135deg, #1ff6ff, #6d63ff 48%, #ff3bd1);
    color: #fff;
    font: inherit;
    font-weight: 950;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 13px 22px;
    box-shadow: 0 0 18px rgba(31, 246, 255, .45), 0 0 34px rgba(255, 59, 209, .3);
    cursor: pointer;
    touch-action: manipulation;
  }
  .fine {
    margin: 18px 0 0;
    color: rgba(229, 255, 255, .62);
    font-size: 12px;
    line-height: 1.5;
  }
  .version {
    position: fixed;
    right: 12px;
    bottom: 10px;
    z-index: 3;
    color: rgba(215, 246, 255, .46);
    font-size: 11px;
    letter-spacing: .08em;
    pointer-events: none;
  }
  @media (max-width: 600px) {
    .hud { inset: 14px 12px auto 12px; gap: 6px; }
    .hud span { min-width: 0; flex: 1; }
    .hud span:nth-child(2) { flex: .55; }
    .hud span:nth-child(3) { min-width: 140px; flex: 1.4; }
    .panel { padding-block: 22px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <span id="score">Shield: 100</span>
  <span id="wave">Wave 01</span>
  <span id="combo">Anonymous 000000 Δx1</span>
</div>
<div class="overlay" id="overlay">
  <div class="panel">
    <h1>NEON<br>VECTOR<br>ARENA</h1>
    <p class="sub">A live graphics demo: crisp wireframe enemies, clean HUD text, fast motion, cheap bloom, and shapes that fracture into smaller vector pieces.</p>
    <button id="start">Start Demo</button>
    <p class="fine">Drag anywhere to move. Shots auto-aim at the nearest threat. Survive the lightstorm.</p>
  </div>
</div>
<div class="version">v1.9</div>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const glow = document.createElement('canvas');
const gtx = glow.getContext('2d', { alpha: true });
const scoreEl = document.getElementById('score');
const waveEl = document.getElementById('wave');
const comboEl = document.getElementById('combo');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start');

let W = 0, H = 0, DPR = 1;
let running = false;
let last = 0;
let time = 0;
let spawnTimer = 0;
let score = 0;
let wave = 1;
let combo = 1;
let comboTimer = 0;
let shake = 0;
let pointer = { active: false, x: 0, y: 0, usingTouch: false };
let keys = new Set();
let enemies = [];
let shots = [];
let particles = [];
let fragments = [];
let pickups = [];
let stars = [];
let player;

const FIREFOX_PERF = /\bFirefox\//i.test(navigator.userAgent);
const GLOW_SCALE = FIREFOX_PERF ? .22 : .32;
const MAX_ENEMIES = FIREFOX_PERF ? 34 : 42;
const MAX_PARTICLES = FIREFOX_PERF ? 170 : 260;
const MAX_FRAGMENTS = FIREFOX_PERF ? 420 : 640;
const MAX_DT = FIREFOX_PERF ? .07 : .04;
const SHOT_BLAST_RADIUS = 105;
const SHOT_BLAST_FORCE = 430;
const SHOT_SPEED = 660;
const DEMO_EXTRA_SECONDS = 20;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const SIZE_TIERS = [
  { name: 'small', normal: .72, splitter: 1.0 },
  { name: 'medium', normal: 1.08, splitter: 1.45 },
  { name: 'large', normal: 1.76, splitter: 2.12 }
];
const dist2 = (a, b, c, d) => {
  const x = a - c;
  const y = b - d;
  return x * x + y * y;
};

function resize() {
  DPR = Math.min(FIREFOX_PERF ? 1 : 1.15, window.devicePixelRatio || 1);
  W = Math.floor(innerWidth * DPR);
  H = Math.floor(innerHeight * DPR);
  canvas.width = W;
  canvas.height = H;
  glow.width = Math.max(1, Math.floor(W * GLOW_SCALE));
  glow.height = Math.max(1, Math.floor(H * GLOW_SCALE));
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  gtx.setTransform(DPR * GLOW_SCALE, 0, 0, DPR * GLOW_SCALE, 0, 0);
  buildStars();
  if (player) {
    player.x = clamp(player.x, 40, innerWidth - 40);
    player.y = clamp(player.y, 68, innerHeight - 40);
  }
}

function buildStars() {
  stars = [];
  const count = Math.floor((innerWidth * innerHeight) / 5200);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      z: rand(.25, 1),
      hue: Math.random() < .5 ? 186 : rand(285, 330),
      p: Math.random() * TAU
    });
  }
}

function reset() {
  player = {
    x: innerWidth * .5,
    y: innerHeight * .58,
    vx: 0,
    vy: 0,
    r: 12,
    hp: 100 + DEMO_EXTRA_SECONDS,
    fire: 0,
    inv: 1.3,
    angle: -Math.PI / 2,
    trail: []
  };
  enemies = [];
  shots = [];
  particles = [];
  fragments = [];
  pickups = [];
  score = 0;
  wave = 1;
  combo = 1;
  comboTimer = 0;
  spawnTimer = 0;
  shake = 0;
  for (let i = 0; i < 8; i++) spawnEnemy(true);
  updateHud();
}

function updateHud() {
  scoreEl.textContent = 'Shield: ' + String(Math.max(0, Math.ceil(player?.hp ?? 100))).padStart(3, '0');
  waveEl.textContent = 'Wave ' + String(wave).padStart(2, '0');
  comboEl.textContent = 'Anonymous ' + String(Math.floor(score)).padStart(6, '0') + ' Δx' + combo;
}

function start() {
  overlay.classList.add('hidden');
  reset();
  running = true;
  last = performance.now();
  requestAnimationFrame(frame);
}

function spawnEnemy(initial = false) {
  if (!initial && enemies.length >= MAX_ENEMIES) return;
  const edge = Math.floor(Math.random() * 4);
  const pad = 34;
  let x = edge === 0 ? -pad : edge === 1 ? innerWidth + pad : rand(0, innerWidth);
  let y = edge === 2 ? -pad : edge === 3 ? innerHeight + pad : rand(0, innerHeight);
  if (initial) {
    x = rand(60, innerWidth - 60);
    y = rand(90, innerHeight - 70);
    if (dist2(x, y, player?.x || innerWidth / 2, player?.y || innerHeight / 2) < 260 * 260) x = innerWidth - x;
  }
  const typeRoll = Math.random();
  const type = typeRoll < .1 + wave * .008 ? 'splitter' : typeRoll < .36 ? 'spinner' : typeRoll < .56 ? 'dart' : 'cube';
  const baseR = type === 'splitter' ? 24 : type === 'spinner' ? 14 : type === 'dart' ? 11 : 13;
  const sizeRoll = Math.random();
  const tier = SIZE_TIERS[sizeRoll < .34 ? 0 : sizeRoll < .72 ? 1 : 2];
  const scale = (type === 'splitter' ? tier.splitter : tier.normal) * rand(.94, 1.06);
  const largeSplits = tier.name === 'large';
  const speedBase = type === 'dart' ? rand(96, 142) : type === 'splitter' ? rand(36, 58) : rand(62, 105);
  const speed = speedBase / Math.sqrt(scale);
  const hp = 1;
  enemies.push({
    x, y,
    vx: rand(-20, 20),
    vy: rand(-20, 20),
    r: baseR * scale,
    hp,
    maxHp: hp,
    type,
    scale,
    sizeTier: tier.name,
    largeSplits,
    speed: speed + wave * 2.2,
    rot: rand(0, TAU),
    spin: rand(-2.8, 2.8),
    hue: type === 'splitter' ? 54 : type === 'spinner' ? 292 : type === 'dart' ? 18 : 182,
    pulse: rand(0, TAU),
    trail: []
  });
}

function fireShot(targetAngle) {
  const spread = combo >= 8 ? .12 : 0;
  const count = combo >= 8 ? 3 : 1;
  for (let i = 0; i < count; i++) {
    const a = targetAngle + (i - (count - 1) / 2) * spread;
    shots.push({
      x: player.x + Math.cos(a) * 17,
      y: player.y + Math.sin(a) * 17,
      vx: Math.cos(a) * SHOT_SPEED,
      vy: Math.sin(a) * SHOT_SPEED,
      r: 3.2,
      hue: i === 1 ? 316 : 186,
      angle: a,
      trail: []
    });
  }
  addSpark(player.x + Math.cos(targetAngle) * 17, player.y + Math.sin(targetAngle) * 17, 6, 184, .5);
}

function nearestEnemy() {
  let best = null;
  let bd = Infinity;
  for (const e of enemies) {
    const d = dist2(player.x, player.y, e.x, e.y);
    if (d < bd) {
      best = e;
      bd = d;
    }
  }
  return best;
}

function addSpark(x, y, n, hue, force = 1) {
  if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const s = rand(40, 240) * force;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: rand(.25, .75),
      max: rand(.35, .9),
      r: rand(1, 3.4) * force,
      hue: hue + rand(-22, 22),
      kind: 'dot'
    });
  }
}

function localShapePoints(e, scale = 1) {
  const r = e.r * scale;
  if (e.type === 'dart' || e.type === 'splinter') return [[r * 1.45, 0], [-r, .75 * r], [-.42 * r, 0], [-r, -.75 * r]];
  if (e.type === 'cube') return [[-r, -r], [r, -r], [r, r], [-r, r]];
  if (e.type === 'spinner') return [[0, -r * 1.35], [r * 1.2, r * .64], [0, r * .24], [-r * 1.2, r * .64]];
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = i * TAU / 10;
    const rr = i % 2 ? r * .7 : r * 1.22;
    pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
  }
  return pts;
}

function rotatePoint(x, y, a) {
  const ca = Math.cos(a);
  const sa = Math.sin(a);
  return [x * ca - y * sa, x * sa + y * ca];
}

function worldShapePoints(e, scale = 1) {
  return localShapePoints(e, scale).map(([x, y]) => {
    const [rx, ry] = rotatePoint(x, y, e.rot);
    return [e.x + rx, e.y + ry];
  });
}

function addVectorFragments(e) {
  if (fragments.length > MAX_FRAGMENTS) fragments.splice(0, fragments.length - MAX_FRAGMENTS);
  const pts = worldShapePoints(e, 1);
  const count = e.type === 'splitter' ? 6 : e.largeSplits ? 4 : 1;
  for (let pass = 0; pass < count; pass++) {
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      const b = pts[(i + 1) % pts.length];
      const mx = (a[0] + b[0]) * .5;
      const my = (a[1] + b[1]) * .5;
      const out = Math.atan2(my - e.y, mx - e.x) + rand(-.55, .55);
      const speed = rand(90, e.type === 'splitter' || e.largeSplits ? 430 : 250);
      fragments.push({
        x: mx,
        y: my,
        vx: Math.cos(out) * speed + e.vx * .22,
        vy: Math.sin(out) * speed + e.vy * .22,
        ax: a[0] - mx,
        ay: a[1] - my,
        bx: b[0] - mx,
        by: b[1] - my,
        rot: rand(-.4, .4),
        spin: rand(-7, 7),
        hue: e.hue + rand(-10, 10),
        life: rand(.55, 1.15),
        max: rand(.75, 1.2),
        kind: 'line'
      });
      if (i % 2 === 0) {
        const [cx, cy] = rotatePoint(rand(-e.r * .34, e.r * .34), rand(-e.r * .34, e.r * .34), e.rot);
        fragments.push({
          x: mx,
          y: my,
          vx: Math.cos(out + rand(-.25, .25)) * speed * .72,
          vy: Math.sin(out + rand(-.25, .25)) * speed * .72,
          pts: [[a[0] - mx, a[1] - my], [b[0] - mx, b[1] - my], [cx, cy]],
          rot: rand(0, TAU),
          spin: rand(-8, 8),
          hue: e.hue + rand(-18, 18),
          life: rand(.42, .9),
          max: rand(.6, 1),
          kind: 'poly'
        });
      }
    }
  }
  const dust = e.type === 'splitter' || e.largeSplits ? 36 : 10;
  for (let i = 0; i < dust; i++) {
    const a = rand(0, TAU);
    const d = rand(0, e.r * 1.2);
    fragments.push({
      x: e.x + Math.cos(a) * d,
      y: e.y + Math.sin(a) * d,
      vx: Math.cos(a) * rand(120, 360),
      vy: Math.sin(a) * rand(120, 360),
      rot: rand(0, TAU),
      spin: rand(-10, 10),
      hue: e.hue + rand(-16, 16),
      life: rand(.35, .8),
      max: rand(.55, .9),
      kind: 'cross'
    });
  }
  if (fragments.length > MAX_FRAGMENTS) fragments.splice(0, fragments.length - MAX_FRAGMENTS);
}

function addHitShards(e, x, y, hue) {
  if (fragments.length > MAX_FRAGMENTS) fragments.splice(0, fragments.length - MAX_FRAGMENTS);
  const count = e.type === 'splitter' || e.largeSplits ? Math.round(clamp(e.r * .9, 18, 42)) : 6;
  for (let i = 0; i < count; i++) {
    const a = rand(0, TAU);
    const speed = rand(120, 300);
    const len = rand(4, 11);
    fragments.push({
      x: x + rand(-4, 4),
      y: y + rand(-4, 4),
      vx: Math.cos(a) * speed + e.vx * .18,
      vy: Math.sin(a) * speed + e.vy * .18,
      ax: -len * .5,
      ay: 0,
      bx: len * .5,
      by: 0,
      rot: a,
      spin: rand(-10, 10),
      hue: hue + rand(-18, 18),
      life: rand(.28, .55),
      max: rand(.42, .65),
      kind: i % 3 === 0 ? 'cross' : 'line'
    });
  }
}

function blastEnemies(x, y, force, radius, sourceVX = 0, sourceVY = 0) {
  const r2 = radius * radius;
  for (const target of enemies) {
    const dx = target.x - x;
    const dy = target.y - y;
    const d2 = dx * dx + dy * dy;
    if (d2 > r2 || d2 <= .001) continue;
    const d = Math.sqrt(d2);
    const falloff = 1 - d / radius;
    const nx = dx / d;
    const ny = dy / d;
    target.vx += nx * force * falloff + sourceVX * .09 * falloff;
    target.vy += ny * force * falloff + sourceVY * .09 * falloff;
    target.rot += falloff * rand(-1.4, 1.4);
  }
}

function explode(x, y, hue, big = false) {
  addSpark(x, y, big ? 34 : 9, hue, big ? 1.28 : .82);
  particles.push({ x, y, vx: 0, vy: 0, life: big ? .46 : .28, max: big ? .46 : .28, r: big ? 88 : 34, hue, kind: 'ring' });
  particles.push({ x, y, vx: 0, vy: 0, life: .11, max: .11, r: big ? 140 : 58, hue: 0, kind: 'flash' });
  shake = Math.max(shake, big ? 8 : 4);
}

function splitEnemy(e) {
  const maxSplit = FIREFOX_PERF ? 28 : (e.type === 'splitter' ? 36 : 28);
  const count = Math.round(clamp(e.r * (e.type === 'splitter' ? .95 : .72), 14, maxSplit));
  const childType = e.type;
  const childBaseR = childType === 'splitter' ? 8.5 : childType === 'spinner' ? 7.6 : childType === 'dart' ? 6.8 : 7.4;
  for (let i = 0; i < count && enemies.length < MAX_ENEMIES + (FIREFOX_PERF ? 20 : 32); i++) {
    const a = i * TAU / count + rand(-.18, .18);
    const burst = rand(220, 390);
    const childScale = rand(.58, .92);
    enemies.push({
      x: e.x + Math.cos(a) * rand(e.r * .45, e.r * 1.05),
      y: e.y + Math.sin(a) * rand(e.r * .45, e.r * 1.05),
      vx: Math.cos(a) * burst + e.vx * .22,
      vy: Math.sin(a) * burst + e.vy * .22,
      r: childBaseR * childScale,
      hp: 1,
      maxHp: 1,
      type: childType,
      scale: childScale,
      largeSplits: false,
      speed: rand(142, 192) + wave * 2.8,
      rot: a,
      spin: rand(-8, 8),
      hue: e.hue + rand(-10, 10),
      pulse: rand(0, TAU),
      trail: []
    });
  }
  addSpark(e.x, e.y, 60, e.hue, 1.75);
  particles.push({ x: e.x, y: e.y, vx: 0, vy: 0, life: .55, max: .55, r: Math.max(118, e.r * 4.2), hue: e.hue, kind: 'ring' });
}

function shouldSplitEnemy(e) {
  return e.largeSplits || e.r >= 18;
}

function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 22);
  comboTimer -= dt;
  if (comboTimer <= 0) combo = 1;
  const accel = 2200;
  let ax = 0, ay = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) ax -= accel;
  if (keys.has('ArrowRight') || keys.has('KeyD')) ax += accel;
  if (keys.has('ArrowUp') || keys.has('KeyW')) ay -= accel;
  if (keys.has('ArrowDown') || keys.has('KeyS')) ay += accel;
  if (pointer.active) {
    const dx = pointer.x - player.x;
    const dy = pointer.y - player.y;
    const d = Math.hypot(dx, dy) || 1;
    const pull = clamp(d / 140, 0, 1);
    ax += dx / d * accel * pull;
    ay += dy / d * accel * pull;
  }
  player.vx += ax * dt;
  player.vy += ay * dt;
  player.vx *= Math.pow(.028, dt);
  player.vy *= Math.pow(.028, dt);
  const speed = Math.hypot(player.vx, player.vy);
  if (speed > 440) {
    player.vx = player.vx / speed * 440;
    player.vy = player.vy / speed * 440;
  }
  player.x = clamp(player.x + player.vx * dt, 26, innerWidth - 26);
  player.y = clamp(player.y + player.vy * dt, 58, innerHeight - 26);
  player.inv -= dt;

  const aim = nearestEnemy();
  if (aim) player.angle = Math.atan2(aim.y - player.y, aim.x - player.x);
  player.fire -= dt;
  if (player.fire <= 0 && enemies.length) {
    player.fire = Math.max(.1, .17 - wave * .002);
    fireShot(player.angle);
  }
  player.trail.unshift({ x: player.x, y: player.y, a: player.angle });
  player.trail.length = Math.min(FIREFOX_PERF ? 11 : 18, player.trail.length);

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = Math.max(.3, .86 - wave * .012);
    spawnEnemy();
  }
  if (score > wave * 2800) wave++;

  for (const e of enemies) {
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const wobble = Math.sin(time * 3 + e.pulse) * (e.type === 'spinner' ? 90 : 28);
    e.vx += (dx / d * e.speed + Math.cos(e.rot + Math.PI / 2) * wobble - e.vx) * dt * 1.8;
    e.vy += (dy / d * e.speed + Math.sin(e.rot + Math.PI / 2) * wobble - e.vy) * dt * 1.8;
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    e.rot += e.spin * dt;
    e.pulse += dt * 4;
    e.trail.unshift({ x: e.x, y: e.y, rot: e.rot });
    e.trail.length = FIREFOX_PERF ? 5 : 9;
    if (dist2(e.x, e.y, player.x, player.y) < (e.r + player.r) ** 2 && player.inv <= 0) {
      player.hp -= e.type === 'splitter' ? 22 : e.type === 'splinter' ? 6 : 10;
      player.inv = 1.05;
      blastEnemies(player.x, player.y, SHOT_BLAST_FORCE * .7, SHOT_BLAST_RADIUS * .9);
      explode(player.x, player.y, 188, false);
      if (player.hp <= 0) {
        running = false;
        overlay.querySelector('h1').innerHTML = 'VECTOR<br>OVER';
        overlay.querySelector('.sub').textContent = 'Final score ' + Math.floor(score) + '. The arena can restart instantly.';
        startBtn.textContent = 'Restart Demo';
        overlay.classList.remove('hidden');
      }
    }
  }

  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const min = a.r + b.r + 18;
      const d2 = dx * dx + dy * dy;
      if (d2 <= .001 || d2 > min * min) continue;
      const d = Math.sqrt(d2);
      const push = (1 - d / min) * 88 * dt;
      const nx = dx / d;
      const ny = dy / d;
      a.vx -= nx * push;
      a.vy -= ny * push;
      b.vx += nx * push;
      b.vy += ny * push;
    }
  }

  for (const s of shots) {
    s.trail.unshift({ x: s.x, y: s.y });
    s.trail.length = FIREFOX_PERF ? 5 : 7;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
  }
  const shotPad = Math.max(90, Math.hypot(innerWidth, innerHeight) * .08);
  shots = shots.filter(s => s.x > -shotPad && s.x < innerWidth + shotPad && s.y > -shotPad && s.y < innerHeight + shotPad);

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    for (let j = shots.length - 1; j >= 0; j--) {
      const s = shots[j];
      if (dist2(e.x, e.y, s.x, s.y) < (e.r + s.r) ** 2) {
        shots.splice(j, 1);
        blastEnemies(s.x, s.y, SHOT_BLAST_FORCE, SHOT_BLAST_RADIUS, s.vx, s.vy);
        addHitShards(e, s.x, s.y, s.hue);
        e.hp--;
        addSpark(s.x, s.y, 5, s.hue, .55);
        if (e.hp <= 0) {
          addVectorFragments(e);
          enemies.splice(i, 1);
          const bigBreak = shouldSplitEnemy(e);
          if (bigBreak) splitEnemy(e);
          comboTimer = 2.2;
          combo = clamp(combo + 1, 1, 12);
          score += (e.type === 'splinter' ? 35 : 100 + Math.round(e.r * 4)) * combo + wave * 15;
          explode(e.x, e.y, e.hue, bigBreak);
          if (Math.random() < .08) pickups.push({ x: e.x, y: e.y, r: 9, life: 6, hue: 54 });
        }
        break;
      }
    }
  }

  for (const p of pickups) {
    p.life -= dt;
    const dx = player.x - p.x;
    const dy = player.y - p.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < 90) {
      p.x += dx / d * 220 * dt;
      p.y += dy / d * 220 * dt;
    }
    if (d < player.r + p.r) {
      score += 500 * combo;
      combo = clamp(combo + 2, 1, 12);
      comboTimer = 3;
      addSpark(p.x, p.y, 24, 54, 1.1);
      p.life = -1;
    }
  }
  pickups = pickups.filter(p => p.life > 0);

  for (const p of particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.pow(.08, dt);
    p.vy *= Math.pow(.08, dt);
  }
  particles = particles.filter(p => p.life > 0);
  if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
  for (const f of fragments) {
    f.life -= dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.vx *= Math.pow(.18, dt);
    f.vy *= Math.pow(.18, dt);
    f.rot += f.spin * dt;
  }
  fragments = fragments.filter(f => f.life > 0);
  if (fragments.length > MAX_FRAGMENTS) fragments.splice(0, fragments.length - MAX_FRAGMENTS);
  updateHud();
}

function line(c, x1, y1, x2, y2, color, width, glowWidth = 0) {
  const glowPass = c === gtx;
  c.strokeStyle = color;
  c.lineWidth = glowPass ? width * 2.7 : width;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.shadowBlur = 0;
  c.beginPath();
  c.moveTo(x1, y1);
  c.lineTo(x2, y2);
  c.stroke();
  c.shadowBlur = 0;
}

function poly(c, pts, color, width = 2, fill = null, glowWidth = 0) {
  const glowPass = c === gtx;
  c.strokeStyle = color;
  c.fillStyle = fill || 'transparent';
  c.lineWidth = glowPass ? width * 2.3 : width;
  c.lineJoin = 'round';
  c.lineCap = 'round';
  c.shadowBlur = 0;
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  if (fill) c.fill();
  c.stroke();
  c.shadowBlur = 0;
}

function drawGrid(c) {
  const w = innerWidth;
  const h = innerHeight;
  c.save();
  c.globalCompositeOperation = 'source-over';
  const grd = c.createRadialGradient(w * .5, h * .45, 0, w * .5, h * .45, Math.max(w, h) * .75);
  grd.addColorStop(0, '#07172a');
  grd.addColorStop(.56, '#030714');
  grd.addColorStop(1, '#010207');
  c.fillStyle = grd;
  c.fillRect(0, 0, w, h);

  for (const s of stars) {
    const tw = .45 + Math.sin(time * (1.2 + s.z) + s.p) * .35;
    c.fillStyle = `hsla(${s.hue},100%,${68 + s.z * 18}%,${(.18 + tw * .38) * s.z})`;
    c.fillRect(s.x, s.y, 1.2 + s.z * 1.4, 1.2 + s.z * 1.4);
    s.y += (8 + s.z * 18) / 60;
    if (s.y > h + 5) s.y = -5;
  }

  c.globalCompositeOperation = 'lighter';
  const spacing = 38;
  const off = (time * 18) % spacing;
  c.strokeStyle = 'rgba(46, 255, 121, .13)';
  c.lineWidth = 1;
  c.beginPath();
  for (let x = -spacing; x < w + spacing; x += spacing) {
    c.moveTo(x + off, 0);
    c.lineTo(x + off, h);
  }
  for (let y = -spacing; y < h + spacing; y += spacing) {
    c.moveTo(0, y + off);
    c.lineTo(w, y + off);
  }
  c.stroke();

  c.strokeStyle = 'rgba(255, 235, 54, .66)';
  c.lineWidth = 2.2;
  c.shadowColor = '#fff04d';
  c.shadowBlur = 10;
  c.strokeRect(18, 52, w - 36, h - 70);
  c.strokeStyle = 'rgba(46, 255, 121, .32)';
  c.lineWidth = 1;
  c.strokeRect(25, 59, w - 50, h - 84);
  c.shadowBlur = 0;
  c.restore();
}

function drawPlayer(c, p, ghost = false) {
  const a = p.a ?? player.angle;
  const x = p.x;
  const y = p.y;
  const alpha = ghost ? p.alpha : 1;
  const ca = Math.cos(a), sa = Math.sin(a);
  const pts = [
    [x + ca * 18, y + sa * 18],
    [x + Math.cos(a + 2.46) * 14, y + Math.sin(a + 2.46) * 14],
    [x - ca * 7, y - sa * 7],
    [x + Math.cos(a - 2.46) * 14, y + Math.sin(a - 2.46) * 14]
  ];
  c.save();
  c.globalAlpha = alpha;
  poly(c, pts, `hsla(184,100%,${ghost ? 60 : 78}%,${ghost ? .34 : 1})`, ghost ? 1.3 : 2.5, ghost ? null : 'rgba(37, 248, 255, .12)', ghost ? 8 : 18);
  line(c, x - ca * 10, y - sa * 10, x - ca * 26, y - sa * 26, `hsla(315,100%,70%,${ghost ? .2 : .9})`, ghost ? 2 : 4, ghost ? 5 : 16);
  c.beginPath();
  c.arc(x, y, ghost ? 2 : 4, 0, TAU);
  c.fillStyle = `hsla(0,100%,96%,${ghost ? .28 : 1})`;
  c.shadowBlur = 0;
  c.fill();
  c.restore();
}

function drawEnemy(c, e, ghost = false) {
  const x = e.x, y = e.y;
  const r = e.r;
  const alpha = ghost ? e.alpha : 1;
  const color = `hsla(${e.hue},100%,${ghost ? 60 : 70}%,${alpha})`;
  const hot = `hsla(${e.hue + 18},100%,82%,${alpha})`;
  c.save();
  c.translate(x, y);
  c.rotate(e.rot);
  c.globalAlpha = alpha;
  c.strokeStyle = color;
  c.lineWidth = ghost ? .9 : 1.65;
  c.lineJoin = 'miter';
  c.lineCap = 'butt';
  c.shadowBlur = 0;
  if (e.type === 'cube') {
    const skew = Math.sin(e.pulse) * r * .22;
    const pts = [[-r + skew,-r], [r,-r + skew], [r - skew,r], [-r,r - skew]];
    poly(c, pts, color, ghost ? .9 : 1.7, null, ghost ? 1 : 5);
    line(c, pts[0][0], pts[0][1], pts[2][0], pts[2][1], color, ghost ? .6 : 1, 2);
    line(c, pts[1][0], pts[1][1], pts[3][0], pts[3][1], color, ghost ? .6 : 1, 2);
    c.strokeRect(-r * .42, -r * .42, r * .84, r * .84);
  } else if (e.type === 'dart' || e.type === 'splinter') {
    const pts = localShapePoints(e);
    poly(c, pts, color, ghost ? .9 : 1.8, null, ghost ? 1 : 5);
    line(c, pts[0][0], pts[0][1], pts[2][0], pts[2][1], color, ghost ? .6 : 1, 2);
    const tailHue = e.type === 'splinter' ? 314 : 54;
    line(c, -r * 1.15, 0, -r * (e.type === 'splinter' ? 3.25 : 2.35), 0, `hsla(${tailHue},100%,76%,${alpha})`, ghost ? .7 : 1.4, ghost ? 1 : 6);
  } else if (e.type === 'spinner') {
    for (let i = 0; i < 6; i++) {
      c.save();
      c.rotate(i * TAU / 6);
      c.beginPath();
      c.moveTo(r * .2, 0);
      c.lineTo(r * 1.4, -r * .24);
      c.lineTo(r * .8, r * .42);
      c.closePath();
      c.stroke();
      c.restore();
    }
    c.beginPath();
    c.arc(0, 0, r * .55, 0, TAU);
    c.stroke();
  } else {
    const pts = localShapePoints(e);
    c.beginPath();
    pts.forEach(([px, py], i) => i ? c.lineTo(px, py) : c.moveTo(px, py));
    c.closePath();
    c.stroke();
    for (let i = 0; i < pts.length; i += 2) line(c, pts[i][0], pts[i][1], pts[(i + 4) % pts.length][0], pts[(i + 4) % pts.length][1], color, ghost ? .5 : .9, 2);
    c.beginPath();
    c.arc(0, 0, r * .52, 0, TAU);
    c.stroke();
  }
  if (!ghost) {
    c.fillStyle = hot;
    c.shadowBlur = 0;
    for (let i = 0; i < 4; i++) {
      const a = i * TAU / 4 + e.pulse * .2;
      c.fillRect(Math.cos(a) * r * .72 - 1.2, Math.sin(a) * r * .72 - 1.2, 2.4, 2.4);
    }
  }
  c.restore();
}

function drawShot(c, s) {
  const a0 = s.angle ?? Math.atan2(s.vy, s.vx);
  const hotX = Math.cos(a0);
  const hotY = Math.sin(a0);
  for (let i = s.trail.length - 1; i > 0; i--) {
    const a = i / s.trail.length;
    const tail = s.trail[i];
    const head = s.trail[i - 1];
    if (!tail || !head) continue;
    line(c, tail.x, tail.y, head.x, head.y, `hsla(${s.hue},100%,72%,${(1 - a) * .92})`, Math.max(1.1, 5.4 * (1 - a)), 8);
  }
  const color = `hsl(${s.hue},100%,82%)`;
  line(c, s.x - hotX * 18, s.y - hotY * 18, s.x + hotX * 8, s.y + hotY * 8, color, 3.2, 12);
  line(c, s.x - hotY * 4, s.y + hotX * 4, s.x + hotY * 4, s.y - hotX * 4, 'rgba(255,255,255,.95)', 1.6, 7);
  c.fillStyle = 'rgba(255,255,255,.96)';
  c.beginPath();
  c.arc(s.x + hotX * 6, s.y + hotY * 6, 2.2, 0, TAU);
  c.fill();
  c.shadowBlur = 0;
}

function drawParticle(c, p) {
  const t = clamp(p.life / p.max, 0, 1);
  if (p.kind === 'ring') {
    c.strokeStyle = `hsla(${p.hue},100%,70%,${t * .85})`;
    c.lineWidth = 3 * t;
    c.shadowBlur = 0;
    c.beginPath();
    c.arc(p.x, p.y, p.r * (1 - t), 0, TAU);
    c.stroke();
    c.shadowBlur = 0;
  } else if (p.kind === 'flash') {
    const rg = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * (1 - t));
    rg.addColorStop(0, `rgba(255,255,255,${.45 * t})`);
    rg.addColorStop(.35, `rgba(60,245,255,${.16 * t})`);
    rg.addColorStop(1, 'rgba(255,55,210,0)');
    c.fillStyle = rg;
    c.beginPath();
    c.arc(p.x, p.y, p.r * (1 - t), 0, TAU);
    c.fill();
  } else {
    c.fillStyle = `hsla(${p.hue},100%,72%,${t})`;
    c.shadowBlur = 0;
    c.save();
    c.translate(p.x, p.y);
    c.rotate((1 - t) * 3);
    const r = p.r * t;
    c.fillRect(-r, -.7, r * 2, 1.4);
    c.fillRect(-.7, -r, 1.4, r * 2);
    c.restore();
    c.shadowBlur = 0;
  }
}

function drawFragment(c, f) {
  const t = clamp(f.life / f.max, 0, 1);
  const color = `hsla(${f.hue},100%,72%,${t})`;
  c.save();
  c.translate(f.x, f.y);
  c.rotate(f.rot);
  c.strokeStyle = color;
  c.fillStyle = `hsla(${f.hue},100%,62%,${t * .1})`;
  c.lineWidth = Math.max(.8, 1.7 * t);
  c.lineCap = 'butt';
  c.lineJoin = 'miter';
  c.shadowBlur = 0;
  if (f.kind === 'line') {
    c.beginPath();
    c.moveTo(f.ax, f.ay);
    c.lineTo(f.bx, f.by);
    c.stroke();
  } else if (f.kind === 'poly') {
    c.beginPath();
    c.moveTo(f.pts[0][0], f.pts[0][1]);
    c.lineTo(f.pts[1][0], f.pts[1][1]);
    c.lineTo(f.pts[2][0], f.pts[2][1]);
    c.closePath();
    c.fill();
    c.stroke();
  } else {
    const r = 4.5 * t;
    c.beginPath();
    c.moveTo(-r, 0);
    c.lineTo(r, 0);
    c.moveTo(0, -r);
    c.lineTo(0, r);
    c.stroke();
  }
  c.restore();
}

function render() {
  const sx = shake ? rand(-shake, shake) : 0;
  const sy = shake ? rand(-shake, shake) : 0;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  gtx.setTransform(DPR * GLOW_SCALE, 0, 0, DPR * GLOW_SCALE, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  gtx.clearRect(0, 0, innerWidth, innerHeight);
  drawGrid(ctx);

  gtx.save();
  gtx.translate(sx, sy);
  gtx.globalCompositeOperation = 'lighter';
  if (!FIREFOX_PERF) {
    for (const e of enemies) {
      for (let i = e.trail.length - 1; i >= 0; i--) {
        const t = e.trail[i];
        if (!t) continue;
        drawEnemy(gtx, { ...e, x: t.x, y: t.y, rot: t.rot, alpha: (1 - i / e.trail.length) * .24 }, true);
      }
    }
    for (const t of player.trail.map((v, i) => ({ ...v, alpha: (1 - i / player.trail.length) * .32 })).reverse()) drawPlayer(gtx, t, true);
  }
  for (const s of shots) drawShot(gtx, s);
  for (const e of enemies) drawEnemy(gtx, e);
  if (!FIREFOX_PERF) for (const f of fragments) drawFragment(gtx, f);
  for (const p of pickups) {
    gtx.save();
    gtx.translate(p.x, p.y);
    gtx.rotate(time * 5);
    poly(gtx, [[0,-p.r], [p.r,0], [0,p.r], [-p.r,0]], `hsla(${p.hue},100%,72%,${clamp(p.life, 0, 1)})`, 2, 'rgba(255,235,95,.14)', 16);
    gtx.restore();
  }
  for (const p of particles) drawParticle(gtx, p);
  drawPlayer(gtx, player);
  gtx.restore();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = .74;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(glow, 0, 0, innerWidth, innerHeight);
  if (!FIREFOX_PERF) {
    ctx.globalAlpha = .24;
    ctx.drawImage(glow, 0, 0, innerWidth, innerHeight);
  }
  ctx.restore();

  ctx.save();
  ctx.translate(sx, sy);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 1;
  ctx.filter = 'none';
  for (const s of shots) drawShot(ctx, s);
  for (const e of enemies) drawEnemy(ctx, e);
  for (const f of fragments) drawFragment(ctx, f);
  for (const p of pickups) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(time * 5);
    poly(ctx, [[0,-p.r], [p.r,0], [0,p.r], [-p.r,0]], `hsla(${p.hue},100%,72%,${clamp(p.life, 0, 1)})`, 1.5, 'rgba(255,235,95,.08)', 0);
    ctx.restore();
  }
  for (const p of particles) drawParticle(ctx, p);
  drawPlayer(ctx, player);

  if (player.inv > 0) {
    ctx.strokeStyle = `rgba(255,255,255,${.25 + Math.sin(time * 24) * .16})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r + 16 + Math.sin(time * 14) * 3, 0, TAU);
    ctx.stroke();
  }

  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillRect(18, innerHeight - 18, clamp(player.hp, 0, 100) * 1.6, 3);
  ctx.fillStyle = 'rgba(255,68,220,.75)';
  ctx.fillRect(18 + clamp(player.hp, 0, 100) * 1.6, innerHeight - 18, (100 - clamp(player.hp, 0, 100)) * 1.6, 3);
}

function frame(now) {
  if (!running) return;
  const dt = Math.min(MAX_DT, (now - last) / 1000 || .016);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

function setPointer(e, active) {
  const touch = e.changedTouches ? e.changedTouches[0] : e;
  pointer.x = touch.clientX;
  pointer.y = touch.clientY;
  pointer.active = active;
  pointer.usingTouch = !!e.changedTouches;
}

startBtn.addEventListener('click', start);
startBtn.addEventListener('touchend', e => { e.preventDefault(); start(); }, { passive: false });
window.addEventListener('resize', resize);
window.addEventListener('pointerdown', e => { setPointer(e, true); });
window.addEventListener('pointermove', e => { if (pointer.active || e.pointerType === 'mouse') setPointer(e, pointer.active); });
window.addEventListener('pointerup', e => { setPointer(e, false); });
window.addEventListener('pointercancel', e => { setPointer(e, false); });
window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
window.addEventListener('keydown', e => {
  keys.add(e.code);
  if (!running && (e.code === 'Space' || e.code === 'Enter')) start();
});
window.addEventListener('keyup', e => keys.delete(e.code));

resize();
reset();
render();
</script>
</body>
