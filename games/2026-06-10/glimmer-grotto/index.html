<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14100c">
<title>Glimmer Grotto — a cozy mining idyll</title>
<style>
  :root{
    --gold:#ffd87f; --amber:#e8a33d; --ink:#f0e6d2; --ink-dim:#b8a888;
    --panel-edge:#6b4226;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#14100c;touch-action:none;
    font-family:Georgia,'Times New Roman',serif;color:var(--ink);
    -webkit-user-select:none;user-select:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hidden{display:none !important}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;
    padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
            calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
  .chip{display:inline-flex;align-items:center;gap:7px;background:rgba(20,14,8,.72);
    border:1px solid rgba(232,163,61,.35);border-radius:999px;padding:5px 13px 5px 8px;
    font-size:15px;letter-spacing:.02em;backdrop-filter:blur(3px);text-shadow:0 1px 2px #000}
  .chip img{width:22px;height:22px;image-rendering:pixelated}
  #hudTop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  #hudLeft{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
  #hudRight{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  #energyChip{min-width:148px}
  #energyBar{flex:1;height:9px;border-radius:5px;background:#2b2014;overflow:hidden;
    border:1px solid rgba(232,163,61,.3);min-width:70px}
  #energyFill{height:100%;width:100%;border-radius:5px;
    background:linear-gradient(90deg,#e8a33d,#ffd87f);transition:width .25s ease}
  #bagChip.full{border-color:#e0667e;color:#ffc1cd}
  .iconbtn{pointer-events:auto;cursor:pointer;width:42px;height:42px;border-radius:12px;
    background:rgba(20,14,8,.72);border:1px solid rgba(232,163,61,.35);
    display:flex;align-items:center;justify-content:center;font-size:19px;
    color:var(--gold);backdrop-filter:blur(3px)}
  .iconbtn img{width:26px;height:26px;image-rendering:pixelated}
  .iconbtn:active{transform:scale(.93)}
  #depthChip{font-variant-numeric:tabular-nums}

  /* ---------- touch controls ---------- */
  #touchUI{position:fixed;inset:0;pointer-events:none;z-index:11}
  #joyZone{position:absolute;left:0;bottom:0;width:46%;height:62%;pointer-events:auto}
  #joy{position:absolute;width:128px;height:128px;opacity:.62;display:none}
  #joy img.base{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  #joy img.thumb{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;image-rendering:pixelated}
  .tbtn{position:absolute;pointer-events:auto;width:88px;height:88px;opacity:.66}
  .tbtn img{width:100%;height:100%;image-rendering:pixelated}
  .tbtn:active{opacity:.95;transform:scale(.95)}
  #btnDig{right:calc(20px + env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom))}
  #btnJump{right:calc(116px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom))}
  #btnAct{right:calc(20px + env(safe-area-inset-right));bottom:calc(200px + env(safe-area-inset-bottom));width:72px;height:72px}

  /* ---------- panels ---------- */
  .panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;
    width:min(540px,92vw);max-height:84vh;overflow:auto;pointer-events:auto;
    border:14px solid transparent;border-image:url("assets/ui_panel.png") 60 fill / 24px repeat;
    padding:18px 20px;image-rendering:auto;box-shadow:0 18px 60px rgba(0,0,0,.7)}
  .panel h2{font-size:23px;color:var(--gold);margin-bottom:4px;font-weight:500;letter-spacing:.03em}
  .panel .sub{font-size:13px;color:var(--ink-dim);margin-bottom:14px}
  .panel .close{position:absolute;right:8px;top:4px;background:none;border:none;color:var(--ink-dim);
    font-size:24px;cursor:pointer;font-family:inherit;padding:4px 8px}
  .panel .close:hover{color:var(--gold)}

  .shopRow{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid rgba(232,163,61,.14)}
  .shopRow img{width:44px;height:44px;image-rendering:pixelated;flex:none}
  .shopRow .info{flex:1;min-width:0}
  .shopRow .name{font-size:16px;color:var(--ink)}
  .shopRow .desc{font-size:12.5px;color:var(--ink-dim);line-height:1.35}
  .buyBtn{flex:none;font-family:inherit;font-size:14px;cursor:pointer;color:#2b2014;
    background:linear-gradient(180deg,#ffd87f,#e8a33d);border:1px solid #8a5a33;border-radius:9px;
    padding:7px 13px;display:flex;align-items:center;gap:6px;text-shadow:none}
  .buyBtn img{width:16px;height:16px}
  .buyBtn:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
  .buyBtn.owned{background:#3a2f22;color:var(--ink-dim);border-color:#3a2f22}

  #journalGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .jCard{background:rgba(20,14,8,.5);border:1px solid rgba(232,163,61,.18);border-radius:10px;
    padding:10px 6px;text-align:center;min-height:108px}
  .jCard img{width:44px;height:44px;image-rendering:pixelated;margin-bottom:6px}
  .jCard .nm{font-size:12.5px;color:var(--ink)}
  .jCard .fl{font-size:10.5px;color:var(--ink-dim);line-height:1.3;margin-top:3px}
  .jCard.locked{opacity:.45;filter:grayscale(1) brightness(.6)}
  .jCard.locked .nm::after{content:"?"}
  .jCard.locked .nm{color:var(--ink-dim)}

  /* ---------- toasts ---------- */
  #toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    z-index:25;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{display:flex;align-items:center;gap:9px;background:rgba(24,17,10,.88);
    border:1px solid rgba(255,216,127,.45);color:var(--gold);border-radius:999px;
    padding:8px 18px;font-size:15px;text-shadow:0 1px 2px #000;
    animation:toastIn .45s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .toast img{width:24px;height:24px;image-rendering:pixelated}
  .toast.bye{animation:toastOut .5s ease both}
  @keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.85)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.92)}}

  /* ---------- title / loading ---------- */
  #title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 110%,#3a2818 0%,#14100c 60%);
    text-align:center;padding:20px;transition:opacity .8s ease}
  #title.fade{opacity:0;pointer-events:none}
  #title h1{font-size:clamp(34px,8vw,58px);font-weight:500;color:var(--gold);letter-spacing:.04em;
    text-shadow:0 0 34px rgba(232,163,61,.45),0 3px 0 #6b4226}
  #title .tag{color:var(--ink-dim);font-size:clamp(14px,3vw,17px);font-style:italic;margin-top:-6px}
  #title img.heroMiner{width:104px;height:auto;image-rendering:pixelated;
    filter:drop-shadow(0 0 24px rgba(255,216,127,.35));animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  #beginBtn{font-family:inherit;font-size:19px;letter-spacing:.05em;cursor:pointer;color:#2b2014;
    background:linear-gradient(180deg,#ffd87f,#e8a33d);border:2px solid #8a5a33;border-radius:14px;
    padding:13px 44px;margin-top:8px;box-shadow:0 6px 24px rgba(232,163,61,.3)}
  #beginBtn:active{transform:scale(.96)}
  #beginBtn:disabled{filter:grayscale(.7) brightness(.7)}
  #ctrlHint{color:var(--ink-dim);font-size:13.5px;line-height:1.7;max-width:430px}
  #ctrlHint b{color:var(--ink)}
  #loadBar{width:min(300px,70vw);height:8px;border-radius:5px;background:#2b2014;overflow:hidden;
    border:1px solid rgba(232,163,61,.3)}
  #loadFill{height:100%;width:0%;background:linear-gradient(90deg,#e8a33d,#ffd87f);transition:width .2s}

  #restHint{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:12;pointer-events:none;color:var(--gold);font-size:15px;text-shadow:0 1px 3px #000;
    background:rgba(24,17,10,.78);border:1px solid rgba(255,216,127,.4);border-radius:999px;
    padding:7px 18px;opacity:0;transition:opacity .3s}
  #restHint.show{opacity:1}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hudTop">
    <div id="hudLeft">
      <span class="chip" id="gemChip"><img src="assets/gem_amber.png" alt=""><span id="gemCount">0</span></span>
      <span class="chip" id="bagChip"><img src="assets/icon_bag.png" alt=""><span id="bagCount">0/12</span></span>
      <span class="chip" id="energyChip"><img src="assets/icon_energy.png" alt="">
        <span id="energyBar"><span id="energyFill"></span></span></span>
    </div>
    <div id="hudRight">
      <span class="chip" id="depthChip">0 m</span>
      <div style="display:flex;gap:7px;pointer-events:auto">
        <button class="iconbtn" id="journalBtn" title="Journal (J)"><img src="assets/icon_journal.png" alt="Journal"></button>
        <button class="iconbtn" id="soundBtn" title="Sound (M)">♪</button>
      </div>
    </div>
  </div>
</div>

<div id="touchUI" class="hidden">
  <div id="joyZone"><div id="joy"><img class="base" src="assets/joystick_base.png" alt="">
    <img class="thumb" src="assets/joystick_thumb.png" alt=""></div></div>
  <div class="tbtn" id="btnDig"><img src="assets/btn_dig.png" alt="dig"></div>
  <div class="tbtn" id="btnJump"><img src="assets/btn_jump.png" alt="jump"></div>
  <div class="tbtn" id="btnAct"><img src="assets/btn_action.png" alt="interact"></div>
</div>

<div id="restHint"></div>
<div id="toasts"></div>

<div id="shopPanel" class="panel hidden">
  <button class="close" data-close="shopPanel">×</button>
  <h2>Pemberley's Provisions</h2>
  <div class="sub">“Take your time, dear. The gems aren't going anywhere.”</div>
  <div id="shopRows"></div>
</div>

<div id="journalPanel" class="panel hidden">
  <button class="close" data-close="journalPanel">×</button>
  <h2>Field Journal</h2>
  <div class="sub" id="journalSub">A keepsake of everything beautiful you've unearthed.</div>
  <div id="journalGrid"></div>
</div>

<div id="title">
  <img class="heroMiner" src="assets/miner.png" alt="">
  <h1>Glimmer Grotto</h1>
  <div class="tag">a cozy mining idyll — dig slow, look closely, rest often</div>
  <div id="loadBar"><div id="loadFill"></div></div>
  <button id="beginBtn" disabled>waking the lanterns…</button>
  <div id="ctrlHint"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
