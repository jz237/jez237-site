  ctx.fillStyle=`rgba(216,240,222,${alpha})`;
  const lx=lookA!==null?Math.cos(lookA)*1.1:0;
  const ly=lookA!==null?Math.sin(lookA)*1.1:0;
  for(const s of[-1,1]){
    ctx.beginPath();
    ctx.ellipse(x+s*gap/2+lx,y+ly,size,size*1.45*Math.max(blink,0.05),0,0,TAU);
    ctx.fill();
  }
}

/* ---------------- post fx ---------------- */
function post(){
  ctx.setTransform(1,0,0,1,0,0);
  const danger=Tension.danger;
  /* chromatic ghosting when stalked */
  const ab=Math.max(danger-0.45,0)*1.4+(P.hurtT>0?0.3:0);
  if(ab>0.03){
    abx.setTransform(1,0,0,1,0,0);
    abx.clearRect(0,0,abC.width,abC.height);
    abx.drawImage(cv,0,0);
    ctx.globalCompositeOperation='screen';
    const off=(1.5+ab*5)*VIEW.px;
    ctx.globalAlpha=ab*0.3;
    ctx.drawImage(abC,off,0);
    ctx.drawImage(abC,-off,off*0.4);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }
  /* desaturation: dying light, injury, slow-mo */
  let desat=0;
  if(P.oil<=0)desat=0.45;
  if(P.hurtT>0)desat=Math.max(desat,P.hurtT*0.5);
  if(P.slowT>0)desat=Math.max(desat,0.55);
  if(Game.state==='dying')desat=Math.max(desat,clamp(Game.dieT,0,0.8));
  if(desat>0.02){
    ctx.globalCompositeOperation='saturation';
    ctx.fillStyle=`rgba(128,128,128,${clamp(desat,0,1)})`;
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.globalCompositeOperation='source-over';
  }
  /* hurt flash */
  if(P.hurtT>0.6){
    ctx.fillStyle=`rgba(140,10,5,${(P.hurtT-0.6)*0.5})`;
    ctx.fillRect(0,0,cv.width,cv.height);
  }
  /* vignette + heartbeat pulse */
  if(vigC){
    ctx.globalAlpha=0.78+Tension.beatPulse*0.16*(0.3+danger)+danger*0.12;
    ctx.drawImage(vigC,0,0);
    ctx.globalAlpha=1;
  }
  /* film grain */
  const g=GRAIN[(Game.t*24|0)%3];
  ctx.globalCompositeOperation='overlay';
  ctx.globalAlpha=0.08+danger*0.07;
  const gs=192*VIEW.px;
  const gox=-((Game.t*977|0)%192)*VIEW.px,goy=-((Game.t*1371|0)%192)*VIEW.px;
  for(let x=gox;x<cv.width;x+=gs)for(let y=goy;y<cv.height;y+=gs)
    ctx.drawImage(g,x,y,gs,gs);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}

/* ---------------- HUD + UI ---------------- */
function drawHUD(){
  screenSpace(ctx,1);
  const a=Tension.danger>0.3?0.95:0.66;
  const X=18,Y=64;
  ctx.font='10px "Courier New",monospace';
  ctx.textAlign='left';
  /* lantern + oil bar */
  ctx.strokeStyle=`rgba(200,190,160,${a*0.8})`;ctx.lineWidth=1.4;
  ctx.strokeRect(X,Y,8,11);
  ctx.beginPath();ctx.arc(X+4,Y-1,3.4,Math.PI,0);ctx.stroke();
  const low=P.oil<22;
  const barFl=low?(0.5+0.5*vnoise(Game.t*9,2)):1;
  ctx.fillStyle=P.oil>0?`rgba(255,196,110,${a*barFl})`:`rgba(180,60,40,${a*(0.4+0.4*Math.sin(Game.t*6))})`;
  ctx.fillRect(X+2,Y+2+(7-P.oil/100*7),4,P.oil/100*7);
  ctx.strokeStyle=`rgba(200,190,160,${a*0.55})`;
  ctx.strokeRect(X+16,Y+2,108,7);
  ctx.fillStyle=`rgba(255,196,110,${a*barFl})`;
  ctx.fillRect(X+17.5,Y+3.5,105*P.oil/100,4);
  /* flares */
  for(let i=0;i<P.flares;i++){
    ctx.fillStyle=`rgba(220,80,55,${a})`;
    ctx.save();ctx.translate(X+20+i*13,Y+22);ctx.rotate(-0.5);
    ctx.fillRect(-1.6,-5,3.2,10);
    ctx.fillStyle=`rgba(230,220,200,${a})`;ctx.fillRect(-1.6,-5,3.2,2.6);
    ctx.restore();
  }
  /* depth */
  const depth=Math.max(0,Math.round((P.y-World.startY)/14));
  ctx.fillStyle=`rgba(170,185,195,${a})`;
  ctx.font='12px "Courier New",monospace';
  ctx.fillText('-'+depth+' m',X+138,Y+10);
  /* heart line */
  const hx=X+16,hy2=Y+40,hw=92;
  ctx.strokeStyle=`rgba(${150+Tension.danger*105|0},${190-Tension.danger*130|0},${170-Tension.danger*120|0},${a})`;
  ctx.lineWidth=1.2;
  ctx.beginPath();
  for(let i=0;i<=hw;i+=2){
    const ph=((Game.t*2+i*0.013)%1+1)%1;
    let yo=0;
    const pk=Tension.beatPulse*clamp(1-Math.abs(i-hw*0.55)/8,0,1);
    yo-=pk*9;
    yo+=Math.sin(i*0.5+Game.t*3)*0.5;
    i===0?ctx.moveTo(hx+i,hy2+yo):ctx.lineTo(hx+i,hy2+yo);
  }
  ctx.stroke();
}

function circleBtn(b,pressed,alpha){
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);
  ctx.fillStyle=`rgba(140,160,175,${pressed?0.3:0.13*alpha})`;
  ctx.fill();
  ctx.strokeStyle=`rgba(170,190,205,${pressed?0.7:0.3*alpha})`;
  ctx.lineWidth=1.6;ctx.stroke();
}
function drawTouchUI(){
  if(!Input.touch)return;
  screenSpace(ctx,1);
  const L=Input.layout();
  /* joystick */
  const jx=Input.joy.active?Input.joy.bx:L.joyHome.x;
  const jy=Input.joy.active?Input.joy.by:L.joyHome.y;
  ctx.beginPath();ctx.arc(jx,jy,52,0,TAU);
  ctx.strokeStyle=`rgba(170,190,205,${Input.joy.active?0.5:0.22})`;
  ctx.lineWidth=1.6;ctx.stroke();
  ctx.beginPath();ctx.arc(jx+Input.joy.dx,jy+Input.joy.dy,22,0,TAU);
  ctx.fillStyle=`rgba(170,190,205,${Input.joy.active?0.35:0.14})`;ctx.fill();
  /* buttons */
  circleBtn(L.jump,Input.jumpId!==-1,1);
  circleBtn(L.grap,P.rope.on,1);
  circleBtn(L.flare,false,1);
  ctx.fillStyle='rgba(190,205,215,0.6)';
  ctx.font='10px "Courier New",monospace';ctx.textAlign='center';
  /* jump chevron */
  ctx.strokeStyle='rgba(190,205,215,0.65)';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.moveTo(L.jump.x-11,L.jump.y+5);ctx.lineTo(L.jump.x,L.jump.y-8);ctx.lineTo(L.jump.x+11,L.jump.y+5);ctx.stroke();
  /* rope hook */
  ctx.lineWidth=2.2;
  ctx.beginPath();ctx.moveTo(L.grap.x,L.grap.y-10);ctx.lineTo(L.grap.x,L.grap.y+3);
  ctx.arc(L.grap.x-4,L.grap.y+3,4,0,Math.PI*0.9);ctx.stroke();
  /* flare icon */
  ctx.save();ctx.translate(L.flare.x,L.flare.y);ctx.rotate(-0.5);
  ctx.fillStyle='rgba(220,90,60,0.7)';ctx.fillRect(-2.4,-8,4.8,16);
  ctx.fillStyle='rgba(235,225,205,0.8)';ctx.fillRect(-2.4,-8,4.8,4);
  ctx.restore();
}
function drawSysButtons(){
  screenSpace(ctx,1);
  const L=Input.layout();
  /* pause */
  ctx.strokeStyle='rgba(170,185,195,0.4)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(L.pause.x,L.pause.y,15,0,TAU);ctx.stroke();
  ctx.fillStyle='rgba(170,185,195,0.5)';
  ctx.fillRect(L.pause.x-5,L.pause.y-6,3.4,12);
  ctx.fillRect(L.pause.x+2,L.pause.y-6,3.4,12);
  /* mute */
  ctx.strokeStyle=Au.muted?'rgba(190,90,80,0.6)':'rgba(170,185,195,0.4)';
  ctx.beginPath();ctx.arc(L.mute.x,L.mute.y,15,0,TAU);ctx.stroke();
  ctx.fillStyle=Au.muted?'rgba(190,90,80,0.7)':'rgba(170,185,195,0.55)';
  ctx.beginPath();
  ctx.moveTo(L.mute.x-7,L.mute.y-3);ctx.lineTo(L.mute.x-2,L.mute.y-3);
  ctx.lineTo(L.mute.x+3,L.mute.y-8);ctx.lineTo(L.mute.x+3,L.mute.y+8);
  ctx.lineTo(L.mute.x-2,L.mute.y+3);ctx.lineTo(L.mute.x-7,L.mute.y+3);
  ctx.closePath();ctx.fill();
  if(Au.muted){
    ctx.strokeStyle='rgba(190,90,80,0.8)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(L.mute.x+6,L.mute.y-5);ctx.lineTo(L.mute.x+12,L.mute.y+5);ctx.stroke();
  }
}

function drawLore(){
  if(Lore.t>6)return;
  Lore.t+=1/60;
  const k=Math.min(Lore.t*2,1)*Math.min((6-Lore.t),1);
  screenSpace(ctx,1);
  ctx.font='italic 15px Georgia,serif';
  ctx.textAlign='center';
  const y=VIEW.h-(Input.touch?210:90);
  const w=Math.min(VIEW.w-60,560);
  ctx.fillStyle=`rgba(0,0,0,${k*0.55})`;
  ctx.fillRect(VIEW.w/2-w/2,y-26,w,46);
  ctx.fillStyle=`rgba(212,206,188,${k*0.92})`;
  ctx.fillText(Lore.txt,VIEW.w/2,y,w-26);
}

function bigVeil(alpha){
  screenSpace(ctx,1);
  ctx.fillStyle=`rgba(0,0,0,${alpha})`;
  ctx.fillRect(0,0,VIEW.w,VIEW.h);
}
function titleFog(){
  screenSpace(ctx,1);
  for(let i=0;i<4;i++){
    const x=((vnoise(i*9,1.1)*1.3+Game.t*0.011*(i%2?1:-1))%1.3+1.3)%1.3*VIEW.w-VIEW.w*0.15;
    const y=VIEW.h*(0.2+0.22*i);
    const g=ctx.createRadialGradient(x,y,0,x,y,260);
    g.addColorStop(0,'rgba(40,52,66,0.13)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,VIEW.w,VIEW.h);
  }
}
function drawTitle(){
  bigVeil(1);
  titleFog();
  const cx2=VIEW.w/2,cy2=VIEW.h*0.36;
  /* faint mouth-of-cave glow */
  const g=ctx.createRadialGradient(cx2,cy2+30,0,cx2,cy2+30,VIEW.h*0.55);
  g.addColorStop(0,'rgba(38,48,62,0.5)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,VIEW.w,VIEW.h);
  ctx.textAlign='center';
  if(Game.showStory){drawStory();return}
  const T='HOLLOW DEEP';
  const fs=Math.min(64,VIEW.w/9);
  ctx.font=`${fs}px Georgia,serif`;
  let x=cx2-(T.length-1)*fs*0.36;
  for(let i=0;i<T.length;i++){
    const fl=0.6+0.4*vnoise(Game.t*3+i*13.7,i*3.3);
    const dim=vnoise(Game.t*0.4+i*7,9)<0.06?0.18:1;
    ctx.fillStyle=`rgba(196,186,160,${fl*dim*0.92})`;
    ctx.fillText(T[i],x,cy2);
    x+=fs*0.72;
  }
  ctx.font='italic 15px Georgia,serif';
  ctx.fillStyle='rgba(150,158,166,0.8)';
  ctx.fillText('He went down three days ago.',cx2,cy2+44);
  /* THE STORY button */
  const bw=170,bh=38,bx=cx2-bw/2,by=cy2+66;
  Game.storyBtn={x:bx,y:by,w:bw,h:bh};
  const bp=0.5+0.22*Math.sin(Game.t*1.6);
  ctx.strokeStyle=`rgba(196,186,160,${bp})`;
  ctx.lineWidth=1;
  ctx.strokeRect(bx,by,bw,bh);
  ctx.font='13px Georgia,serif';
  ctx.fillStyle=`rgba(206,198,176,${0.55+bp*0.4})`;
  ctx.fillText('T H E   S T O R Y',cx2,by+24);
  const pl=0.45+0.45*Math.sin(Game.t*2.2);
  ctx.font='13px "Courier New",monospace';
  ctx.fillStyle=`rgba(190,200,210,${pl})`;
  ctx.fillText(Input.touch?'— tap to descend —':'— press any key to descend —',cx2,VIEW.h*0.62);
  ctx.fillStyle='rgba(120,130,140,0.75)';
  ctx.font='11px "Courier New",monospace';
  const lines=Input.touch?
    ['joystick  move / climb','buttons  jump · rope · flare','touch anywhere  aim the rope','running makes noise']:
    ['A D  move      SPACE  jump','hold LMB  rope (aim with mouse)','E / RMB  flare      SHIFT  run','running makes noise'];
  lines.forEach((l,i)=>ctx.fillText(l,cx2,VIEW.h*0.62+26+i*16));
  ctx.fillStyle='rgba(110,118,126,0.6)';
  ctx.fillText('headphones recommended',cx2,VIEW.h*0.62+26+lines.length*16+10);
}
const STORY=[
  'Three days ago your brother Mark went down into the Hollow — a cave with no mapped bottom. The rescue team turned back at the second shaft when their lanterns kept guttering out. You didn\'t.',
  'Your lantern is your life. Oil is scarce, the light shrinks as it burns, and what lives down here was old before anything up there had eyes.',
  'It will not cross your light\'s core — but it learns the edges. It hears running. It hears rockfall. In darkness, it comes.',
  'Flares drive it back. Stillness in lamplight slows your heart. The relics of the ones who came before mark the way down — six of them, if you dare to read.',
  'Descend. Find the camp at the bottom of the world. Find Mark — and pray the thing wearing the dark hasn\'t found him first.'
];
function wrapLines(c,text,maxW){
  const words=text.split(' '),out=[];let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(c.measureText(t).width>maxW&&line){out.push(line);line=w}
    else line=t;
  }
  if(line)out.push(line);
  return out;
}
function drawStory(){
  const cx2=VIEW.w/2;
  const maxW=Math.min(VIEW.w-70,520);
  ctx.font='italic 14px Georgia,serif';
  /* measure first so the panel hugs the text */
  let total=0;
  const paras=STORY.map(p=>{const ls=wrapLines(ctx,p,maxW);total+=ls.length*20+14;return ls});
  let y=Math.max(VIEW.h*0.5-total/2+10,VIEW.h*0.18);
  const py0=y-34;
  ctx.fillStyle='rgba(2,3,5,0.82)';
  ctx.fillRect(cx2-maxW/2-24,py0,maxW+48,total+78);
  ctx.strokeStyle='rgba(196,186,160,0.3)';ctx.lineWidth=1;
  ctx.strokeRect(cx2-maxW/2-24,py0,maxW+48,total+78);
  ctx.textAlign='center';
  ctx.font='17px Georgia,serif';
  ctx.fillStyle='rgba(196,186,160,0.92)';
  ctx.fillText('T H E   S T O R Y',cx2,y-6);
  y+=22;
  ctx.font='italic 14px Georgia,serif';
  for(const ls of paras){
    ctx.fillStyle='rgba(192,186,170,0.88)';
    for(const l of ls){ctx.fillText(l,cx2,y);y+=20}
    y+=14;
  }
  const pl=0.45+0.45*Math.sin(Game.t*2.2);
  ctx.font='11px "Courier New",monospace';
  ctx.fillStyle=`rgba(170,180,190,${pl})`;
  ctx.fillText(Input.touch?'— tap to return —':'— any key to return —',cx2,y+4);
}
function drawIntro(){
  const t=Game.introT;
  const L=['Day three.','The rescue team turned back at the second shaft.','Mark is still down there.'];
  screenSpace(ctx,1);
  ctx.textAlign='center';
  ctx.font='italic 16px Georgia,serif';
  L.forEach((l,i)=>{
    const k=clamp((t-i*1.7)*1.2,0,1)*clamp((7.2-t)*0.9,0,1);
    if(k>0){
      ctx.fillStyle=`rgba(200,194,176,${k*0.9})`;
      ctx.fillText(l,VIEW.w/2,VIEW.h*0.24+i*26);
    }
  });
  const hk=clamp((t-5.2)*1.2,0,1)*clamp((7.6-t)*0.9,0,1);
  if(hk>0){
    ctx.font='11px "Courier New",monospace';
    ctx.fillStyle=`rgba(150,160,170,${hk*0.85})`;
    ctx.fillText('keep the lantern fed — the dark is patient',VIEW.w/2,VIEW.h*0.24+92);
  }
}
function drawDying(){
  const t=Game.dieT;
  if(Game.deathCause==='taken'){
    bigVeil(clamp(t*1.8,0,1));
    /* the eyes rush you */
    const k=clamp(t/0.9,0,1);
    screenSpace(ctx,1);
    const gap=lerp(18,170,k*k),sz=lerp(3,30,k*k);
    ctx.fillStyle=`rgba(216,240,222,${clamp(t*3,0,1)*(1-clamp((t-1.4)*3,0,1))})`;
    for(const s of[-1,1]){
      ctx.beginPath();
      ctx.ellipse(VIEW.w/2+s*gap/2,VIEW.h/2,sz,sz*1.4,0,0,TAU);
      ctx.fill();
    }
  }else{
    bigVeil(clamp(t*0.8,0,0.95));
  }
}
function drawDead(){
  bigVeil(0.86);
  titleFog();
  const cx2=VIEW.w/2;
  const msg=Game.deathCause==='taken'?'THE DARK TAKES YOU':
            Game.deathCause==='fall'?'BROKEN ON THE ROCKS':'CRUSHED IN THE DARK';
  ctx.textAlign='center';
  ctx.font=`${Math.min(38,VIEW.w/16)}px Georgia,serif`;
  ctx.fillStyle='rgba(186,60,48,0.88)';
  ctx.fillText(msg,cx2,VIEW.h*0.38,VIEW.w-36);
  ctx.font='13px "Courier New",monospace';
  ctx.fillStyle='rgba(170,180,190,0.85)';
  ctx.fillText(`depth reached  ${Math.round(Game.maxD)} m`,cx2,VIEW.h*0.38+38);
  ctx.fillText(`relics  ${P.relics} / 6      time  ${fmtTime(Game.runT)}`,cx2,VIEW.h*0.38+58);
  const pl=0.45+0.45*Math.sin(Game.t*2.2);
  ctx.fillStyle=`rgba(190,200,210,${pl})`;
  ctx.fillText(Input.touch?'— tap to descend again —':'— press R to descend again —',cx2,VIEW.h*0.38+102);
}
function drawEndingText(){
  const t=Game.endT;
  const L=[
    [1,'You found his camp at the bottom of the world.'],
    [3.6,'The bedroll is cold. The lantern is dry.'],
    [6.4,'On the rock, in chalk: "I\'m sorry. It wanted a trade."'],
    [9.6,'Behind you, something exhales.']
  ];
  screenSpace(ctx,1);
  ctx.textAlign='center';
  ctx.font='italic 16px Georgia,serif';
  L.forEach(([t0,l],i)=>{
    const k=clamp((t-t0)*1.1,0,1);
    if(k>0){
      ctx.fillStyle=`rgba(204,198,180,${k*0.92})`;
      ctx.fillText(l,VIEW.w/2,VIEW.h*0.2+i*26);
    }
  });
  bigVeil(clamp((t-11.5)/2.5,0,1));
}
function drawWon(){
  bigVeil(0.92);
  const cx2=VIEW.w/2;
  ctx.textAlign='center';
  ctx.font=`${Math.min(36,VIEW.w/16)}px Georgia,serif`;
  ctx.fillStyle='rgba(196,186,160,0.92)';
  ctx.fillText('YOU REACHED THE BOTTOM',cx2,VIEW.h*0.34,VIEW.w-36);
  ctx.font='italic 14px Georgia,serif';
  ctx.fillStyle='rgba(150,158,166,0.85)';
  ctx.fillText('Nothing that deep ever lets go.',cx2,VIEW.h*0.34+32);
  ctx.font='13px "Courier New",monospace';
  ctx.fillStyle='rgba(170,180,190,0.85)';
  ctx.fillText(`relics  ${P.relics} / 6      time  ${fmtTime(Game.runT)}`,cx2,VIEW.h*0.34+66);
  const pl=0.45+0.45*Math.sin(Game.t*2.2);
  ctx.fillStyle=`rgba(190,200,210,${pl})`;
  ctx.fillText(Input.touch?'— tap to descend again —':'— press R to descend again —',cx2,VIEW.h*0.34+108);
}
function fmtTime(s){
  const m=s/60|0,ss=s%60|0;
  return m+':'+(ss<10?'0':'')+ss;
}

/* ---------------- master render ---------------- */
function render(){
  if(Game.state==='title'){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
    screenSpace(ctx,1);
    drawTitle();
    drawSysButtons();
    return;
  }
  drawScene();
  drawLights();
  /* composite: scene x light */
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(sceneC,0,0);
  ctx.globalCompositeOperation='multiply';
  ctx.drawImage(liteC,0,0,liteC.width,liteC.height,0,0,cv.width,cv.height);
  ctx.globalCompositeOperation='source-over';
  drawCreatureBody();
  glowPass();
  post();
  /* state overlays */
  if(Game.state==='dying')drawDying();
  if(Game.state==='dead'){drawDead();drawSysButtons();return}
  if(Game.state==='ending')drawEndingText();
  if(Game.state==='won'){drawWon();drawSysButtons();return}
  drawHUD();
  drawLore();
  if(Game.state==='intro')drawIntro();
  drawTouchUI();
  drawSysButtons();
  if(Game.paused){
    bigVeil(0.6);
    screenSpace(ctx,1);
    ctx.textAlign='center';
    ctx.font='22px Georgia,serif';
    ctx.fillStyle='rgba(196,186,160,0.9)';
    ctx.fillText('PAUSED',VIEW.w/2,VIEW.h*0.42);
    ctx.font='12px "Courier New",monospace';
    ctx.fillStyle='rgba(160,170,180,0.8)';
    ctx.fillText(Input.touch?'tap the pause button to resume':'P / ESC to resume · M mute · R restart',VIEW.w/2,VIEW.h*0.42+28);
  }
}
</script>

<script>
'use strict';
/* ---------------- game state ---------------- */
const Game={
  state:'title',t:0,runT:0,paused:false,
  seed:(Math.random()*1e9)|0,
  timescale:1,flick:1,
  dieT:0,deathCause:'',introT:0,endT:0,maxD:0,
  showStory:false,storyBtn:null,
  titleClick(x,y){ /* true = consumed by the story UI, don't start the game */
    if(this.state!=='title')return false;
    if(this.showStory){this.showStory=false;return true}
    const b=this.storyBtn;
    if(b&&x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){this.showStory=true;return true}
    return false;
  },
  anyInput(){
    Au.init();Au.resume();
    if(this.state==='title'){
      if(this.showStory){this.showStory=false;return}
      this.newGame();return;
    }
    if(this.state==='dead'||this.state==='won'){
      if(Input.anyTap||Input.restartTap){Input.anyTap=false;Input.restartTap=false;this.newGame()}
    }
    Input.anyTap=false;
  },
  togglePause(){
    if(this.state!=='play'&&this.state!=='intro')return;
    this.paused=!this.paused;
  },
  newGame(){
    this.seed=(Math.random()*1e9)|0;
    World.gen(this.seed);
    P.reset(World.startX,World.startY);
    Cr.reset();Tension.reset();
    flares.length=0;Particles.clear();
    Watchers.length=0;FloatTxts.length=0;
    Lore.t=99;this.maxD=0;this.runT=0;
    Cam.x=P.x;Cam.y=P.y;Cam.trauma=0;
    this.paused=false;this.timescale=1;
    this.state='intro';this.introT=0;
  },
  die(cause){
    if(this.state!=='play')return;
    this.deathCause=cause;this.state='dying';this.dieT=0;
    P.rope.on=false;
    Cam.trauma=1;
    if(cause==='taken'){Au.shriek(1);Au.stinger(1)}
    else Au.rock(true,0,1);
  },
  startEnding(){
    if(this.state!=='play')return;
    this.state='ending';this.endT=0;
    Tension.v=20;
    Au.stinger(0.7);
  },
  update(dt){
    this.t+=dt;
    /* lantern flicker (global so light + flame agree) */
    let f=0.86+0.14*vnoise(this.t*6.3,44.4);
    if(P.oil<=0)f=0.55+0.45*vnoise(this.t*10,5.5);
    else if(P.oil<24&&vnoise(this.t*1.9,99)>0.74)f*=0.5+0.32*vnoise(this.t*22,7.1);
    this.flick=f;
    switch(this.state){
      case 'intro':
        this.introT+=dt;
        this.sim(dt);
        if(this.introT>8)this.state='play';
        break;
      case 'play':
        this.sim(dt);
        if(hyp(P.x-World.campX,P.y-World.campY)<130)this.startEnding();
        break;
      case 'dying':
        this.dieT+=dt;
        this.timescale=0.45;
        Particles.update(dt);Cam.update(dt);
        if(this.dieT>(this.deathCause==='taken'?2.0:1.7)){
          this.state='dead';this.timescale=1;
        }
        break;
      case 'ending':
        this.endT+=dt;
        Particles.update(dt);Drips.update(dt);Cam.update(dt);
        Au.tick(dt);Tension.beatPulse=Math.max(0,Tension.beatPulse-dt*3);
        /* slow creep of the camera toward the camp */
        Cam.x+=(World.campX-Cam.x)*dt*0.6;
        Cam.y+=(World.campY-40-Cam.y)*dt*0.6;
        if(this.endT>14)this.state='won';
        break;
      case 'dead': case 'won': case 'title':
        break;
    }
  },
  sim(dt){
    this.runT+=dt;
    this.timescale=P.slowT>0?0.38:1;
    P.update(dt);
    updateFlares(dt);
    Particles.update(dt);
    updateStals(dt);
    Drips.update(dt);
    Cr.update(dt);
    WatcherSys.update(dt);
    Tension.update(dt);
    Au.tick(dt);
    Cam.update(dt);
    if(Input.restartTap){Input.restartTap=false;this.newGame()}
  }
};

/* ---------------- resize / perf ---------------- */
function resize(){
  VIEW.w=innerWidth;VIEW.h=innerHeight;
  VIEW.dpr=Math.min(devicePixelRatio||1,1.75);
  VIEW.px=VIEW.dpr*VIEW.rs;
  const W=Math.max(2,Math.round(VIEW.w*VIEW.px)),H=Math.max(2,Math.round(VIEW.h*VIEW.px));
  cv.width=W;cv.height=H;
  sceneC.width=W;sceneC.height=H;
  abC.width=W;abC.height=H;
  liteC.width=Math.max(2,Math.round(W*LS));liteC.height=Math.max(2,Math.round(H*LS));
  ltmpC.width=liteC.width;ltmpC.height=liteC.height;
  /* vignette */
  vigC=document.createElement('canvas');vigC.width=W;vigC.height=H;
  const vx=vigC.getContext('2d');
  const g=vx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(0.7,'rgba(0,0,0,0.34)');
  g.addColorStop(1,'rgba(0,0,0,0.84)');
  vx.fillStyle=g;vx.fillRect(0,0,W,H);
}
addEventListener('resize',resize);

/* dynamic perf scaling */
const Perf={ema:16,t:0,fps:60,
  note(ms){this.ema=this.ema*0.95+ms*0.05;this.fps=1000/Math.max(this.ema,0.1)},
  check(){
    this.t++;
    if(this.t%90)return;
    if(this.ema>21&&VIEW.rs>0.6){VIEW.rs=Math.max(0.6,VIEW.rs-0.15);resize()}
    else if(this.ema<11.5&&VIEW.rs<1){VIEW.rs=Math.min(1,VIEW.rs+0.1);resize()}
  }
};

/* ---------------- main loop: fixed-step accumulator ---------------- */
const STEP=1/120;
let last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(dt>0.1)dt=0.1;
  Perf.note(dt*1000);Perf.check();
  Input.poll();
  if(!Game.paused){
    acc+=dt*Game.timescale;
    let n=0;
    while(acc>=STEP&&n<8){Game.update(STEP);acc-=STEP;n++}
    if(n===8)acc=0;
  }
  render();
}
document.addEventListener('visibilitychange',()=>{acc=0;last=0});

/* ---------------- debug hooks (harmless) ---------------- */
window.__g={
  Game,P,Cr,World,Tension,Au,Cam,Input,Perf,flares,Particles,
  start(){Game.anyInput();Game.state='play'},
  tp(m){ /* teleport to ~depth in meters along the main path, settled on a floor */
    const y=World.startY+m*14;
    let best=World.pathPts[0];
    for(const pp of World.pathPts)if(Math.abs(pp.y-y)<Math.abs(best.y-y))best=pp;
    P.x=best.x;P.y=best.y;
    for(let d=0;d<500;d+=4)if(World.solid(P.x,P.y+d)){P.y=P.y+d-13;break}
    P.vx=0;P.vy=0;Cam.x=P.x;Cam.y=P.y;
  },
  oil(n){P.oil=n},
  ten(n){Tension.v=n},
  steps(n){for(let i=0;i<n;i++)Game.update(STEP)}
};

/* ---------------- boot ---------------- */
resize();
requestAnimationFrame(frame);
</script>
