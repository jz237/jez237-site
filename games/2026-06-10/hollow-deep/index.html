      const mkTex=()=>{
        const t=gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D,t);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
        return t;
      };
      this.texScene=mkTex();this.texField=mkTex();this.texExtra=mkTex();
      gl.uniform1i(this.u.uScene,0);
      gl.uniform1i(this.u.uField,1);
      gl.uniform1i(this.u.uExtra,2);
      this.canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();this.on=false;this.fail=true});
      this.on=true;
    }catch(e){this.fail=true;this.on=false}
  },
  resize(w,h){
    if(!this.gl)return;
    /* lighting is low-frequency: render under full res, upscale on composite */
    this.canvas.width=Math.max(2,Math.round(w*this.GS));
    this.canvas.height=Math.max(2,Math.round(h*this.GS));
    this.gl.viewport(0,0,this.canvas.width,this.canvas.height);
    extraC.width=Math.max(2,Math.round(w*EX));
    extraC.height=Math.max(2,Math.round(h*EX));
  },
  uploadField(){
    const gl=this.gl;if(!gl)return;
    const FW=World.W+1,FH=World.H+1;
    const data=new Uint8Array(FW*FH);
    for(let i=0;i<data.length;i++)data[i]=clamp(World.F[i]*255,0,255);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D,this.texField);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,FW,FH,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,data);
    this.fieldDirty=false;
  },
  render(){
    const gl=this.gl;
    if(this.fieldDirty)this.uploadField();
    gl.useProgram(this.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,this.texScene);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,sceneC);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D,this.texExtra);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,extraC);
    /* lights: lantern + nearest flares */
    const Lp=[],Lc=[];
    const fl=Game.flick;
    Lp.push(P.lightX,P.lightY,P.lightR());
    if(P.oil>0)Lc.push(1.12*fl,0.84*fl,0.52*fl);
    else Lc.push(0.55*fl,0.3*fl,0.16*fl);
    const fs2=[...flares].sort((a,b)=>hyp(a.x-P.x,a.y-P.y)-hyp(b.x-P.x,b.y-P.y)).slice(0,4);
    for(const f of fs2){
      const R=flareLight(f);
      Lp.push(f.x,f.y,R);
      Lc.push(1.15,0.42,0.2);
    }
    while(Lp.length<15)Lp.push(0,0,0);
    while(Lc.length<15)Lc.push(0,0,0);
    const depth=clamp((Cam.y-World.startY)/(World.H*CELL),0,1);
    const dk=Math.pow(depth,0.55);
    gl.uniform2f(this.u.uRes,this.canvas.width,this.canvas.height);
    gl.uniform2f(this.u.uCam,Cam.x+Cam.sx,Cam.y+Cam.sy);
    gl.uniform2f(this.u.uFieldSize,World.W+1,World.H+1);
    gl.uniform1f(this.u.uScale,VIEW.px*Cam.zoom*this.GS);
    gl.uniform1f(this.u.uCell,CELL);
    gl.uniform1f(this.u.uTime,Game.t);
    gl.uniform1f(this.u.uSteps,this.steps);
    gl.uniform1i(this.u.uNL,1+fs2.length);
    gl.uniform3fv(this.u.uLpos,Lp);
    gl.uniform3fv(this.u.uLcol,Lc);
    gl.uniform3f(this.u.uAmbient,lerp(13,3,dk)/255,lerp(17,4,dk)/255,lerp(26,8,dk)/255);
    /* water rects near the view */
    const vr=viewRect(80);
    const Wr=[];let nw=0;
    for(const w of World.water){
      if(nw>=4)break;
      if(w.x>vr.r||w.x+w.w<vr.l||w.y>vr.b||w.y+w.h<vr.t)continue;
      Wr.push(w.x,w.y,w.w,w.h);nw++;
    }
    while(Wr.length<16)Wr.push(0,0,0,0);
    gl.uniform1i(this.u.uNW,nw);
    gl.uniform4fv(this.u.uWater,Wr);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
};
/* the soft lights GL doesn't march: fungus, daylight, camp, overflow flares */
function eLight(x,y,R,stops){
  const g=ectx.createRadialGradient(x,y,R*0.05,x,y,R);
  for(const[t,c]of stops)g.addColorStop(t,c);
  ectx.fillStyle=g;
  ectx.beginPath();ectx.arc(x,y,R,0,TAU);ectx.fill();
}
function drawExtraLights(){
  ectx.setTransform(1,0,0,1,0,0);
  ectx.clearRect(0,0,extraC.width,extraC.height);
  applyCam(ectx,EX);
  ectx.globalCompositeOperation='lighter';
  if(Cam.y<1600){
    eLight(World.mouthX,-260,1050,[
      [0,'rgba(170,190,205,0.85)'],[0.55,'rgba(110,130,150,0.35)'],[1,'rgba(0,0,0,0)']
    ]);
  }
  const vr=viewRect(120);
  for(const fg of World.fungi){
    if(fg.x<vr.l||fg.x>vr.r||fg.y<vr.t||fg.y>vr.b)continue;
    const pul=0.55+0.45*Math.sin(Game.t*0.9+fg.ph);
    const col=fg.hue===2?'255,96,44':fg.hue?'150,255,190':'110,225,255';
    eLight(fg.x,fg.y,fg.hue===2?42+fg.r*5:55+fg.r*6,[
      [0,`rgba(${col},${(fg.hue===2?0.26:0.34)*pul})`],[1,'rgba(0,0,0,0)']
    ]);
  }
  if(Math.abs(World.campX-Cam.x)<900&&Math.abs(World.campY-Cam.y)<700){
    const pul=0.6+0.4*vnoise(Game.t*3,8.8);
    eLight(World.campX+28,World.campY+30,130,[
      [0,`rgba(255,120,60,${0.5*pul})`],[1,'rgba(0,0,0,0)']
    ]);
  }
  /* flares past the 4 the shader marches */
  const fs2=[...flares].sort((a,b)=>hyp(a.x-P.x,a.y-P.y)-hyp(b.x-P.x,b.y-P.y)).slice(4);
  for(const f of fs2){
    const R=flareLight(f);
    eLight(f.x,f.y,R,[[0,'rgba(255,160,110,0.95)'],[0.35,'rgba(255,90,50,0.65)'],[1,'rgba(0,0,0,0)']]);
  }
  ectx.globalCompositeOperation='source-over';
}

function lightWithShadows(wx,wy,R,stops,intensity){
  /* draw one occluded light into liteC via ltmpC */
  ltcx.setTransform(1,0,0,1,0,0);
  ltcx.clearRect(0,0,ltmpC.width,ltmpC.height);
  applyCam(ltcx,LS);
  const g=ltcx.createRadialGradient(wx,wy,R*0.04,wx,wy,R);
  for(const[t,c]of stops)g.addColorStop(t,c);
  ltcx.fillStyle=g;
  ltcx.beginPath();ltcx.arc(wx,wy,R,0,TAU);ltcx.fill();
  /* carve shadows */
  ltcx.globalCompositeOperation='destination-out';
  ltcx.fillStyle='rgba(0,0,0,0.93)';
  World.segsNear(wx,wy,R*0.98,segScratch);
  for(let i=0;i<segScratch.length;i++){
    const s=segScratch[i];
    /* only segments whose open face points at the light */
    if((wx-s.ax)*s.nx+(wy-s.ay)*s.ny<=0)continue;
    /* stretch each end a hair so adjacent quads overlap (kills AA seam spokes) */
    let ex=s.bx-s.ax,ey=s.by-s.ay;
    const el=hyp(ex,ey)||1;ex/=el;ey/=el;
    const ax=s.ax-ex*1.5,ay=s.ay-ey*1.5,bx=s.bx+ex*1.5,by=s.by+ey*1.5;
    let d1x=ax-wx,d1y=ay-wy;
    let d2x=bx-wx,d2y=by-wy;
    const l1=hyp(d1x,d1y)||1,l2=hyp(d2x,d2y)||1;
    const k=R*2.2;
    ltcx.beginPath();
    ltcx.moveTo(ax,ay);
    ltcx.lineTo(bx,by);
    ltcx.lineTo(bx+d2x/l2*k,by+d2y/l2*k);
    ltcx.lineTo(ax+d1x/l1*k,ay+d1y/l1*k);
    ltcx.closePath();ltcx.fill();
  }
  ltcx.globalCompositeOperation='source-over';
  /* composite into light buffer */
  lctx.setTransform(1,0,0,1,0,0);
  lctx.globalCompositeOperation='lighter';
  lctx.globalAlpha=intensity;
  lctx.drawImage(ltmpC,0,0);
  lctx.globalAlpha=1;
  lctx.globalCompositeOperation='source-over';
}
function plainLight(wx,wy,R,stops,alpha=1){
  applyCam(lctx,LS);
  lctx.globalCompositeOperation='lighter';
  lctx.globalAlpha=alpha;
  const g=lctx.createRadialGradient(wx,wy,R*0.05,wx,wy,R);
  for(const[t,c]of stops)g.addColorStop(t,c);
  lctx.fillStyle=g;
  lctx.beginPath();lctx.arc(wx,wy,R,0,TAU);lctx.fill();
  lctx.globalAlpha=1;
  lctx.globalCompositeOperation='source-over';
}

function drawScene(){
  const vr=viewRect(60);
  screenSpace(sctx,1);
  sctx.clearRect(0,0,VIEW.w,VIEW.h);
  /* abyss gradient backdrop */
  const depth=clamp((Cam.y-World.startY)/(World.H*CELL),0,1);
  const bg=sctx.createLinearGradient(0,0,0,VIEW.h);
  bg.addColorStop(0,`rgb(${14-depth*8|0},${18-depth*11|0},${27-depth*16|0})`);
  bg.addColorStop(1,`rgb(${7-depth*4|0},${9-depth*6|0},${14-depth*9|0})`);
  sctx.fillStyle=bg;
  sctx.fillRect(0,0,VIEW.w,VIEW.h);
  /* parallax rock layers */
  for(const[img,f,al]of[[World.plx2,0.32,0.55],[World.plx1,0.58,0.7]]){
    if(!img)continue;
    sctx.globalAlpha=al;
    const ox=((-(Cam.x+Cam.sx)*f*Cam.zoom)%512+512)%512-512;
    const oy=((-(Cam.y+Cam.sy)*f*Cam.zoom)%512+512)%512-512;
    for(let x=ox;x<VIEW.w;x+=512)for(let y=oy;y<VIEW.h;y+=512)
      sctx.drawImage(img,x,y);
    sctx.globalAlpha=1;
  }
  applyCam(sctx,1);
  /* terrain chunks */
  const c0x=Math.floor(vr.l/CHUNK),c1x=Math.floor(vr.r/CHUNK);
  const c0y=Math.floor(vr.t/CHUNK),c1y=Math.floor(vr.b/CHUNK);
  for(let cy=c0y;cy<=c1y;cy++)for(let cx=c0x;cx<=c1x;cx++){
    if(cx<0||cy<0||cx*CHUNK>=World.W*CELL||cy*CHUNK>=World.H*CELL)continue;
    /* keep 1px of pad: bilinear filtering needs real neighbor texels at the edge */
    sctx.drawImage(World.getChunk(cx,cy),15,15,CHUNK+2,CHUNK+2,cx*CHUNK-1,cy*CHUNK-1,CHUNK+2,CHUNK+2);
  }
  /* water bodies */
  for(const w of World.water){
    if(w.x>vr.r||w.x+w.w<vr.l||w.y>vr.b||w.y+w.h<vr.t)continue;
    const g=sctx.createLinearGradient(0,w.y,0,w.y+w.h);
    g.addColorStop(0,'rgba(34,66,74,0.58)');
    g.addColorStop(1,'rgba(8,16,22,0.85)');
    sctx.fillStyle=g;
    sctx.fillRect(w.x,w.y,w.w,w.h);
  }
  /* the rope you came in on */
  if(vr.t<300){
    sctx.strokeStyle='rgba(120,104,78,0.8)';sctx.lineWidth=2;
    sctx.beginPath();sctx.moveTo(World.mouthX-20,0);
    sctx.quadraticCurveTo(World.mouthX-26,70,World.mouthX-18,128);
    sctx.stroke();
    sctx.fillStyle='rgba(120,104,78,0.8)';
    sctx.beginPath();sctx.arc(World.mouthX-18,128,3,0,TAU);sctx.fill();
  }
  /* the camp at the bottom */
  drawCamp(vr);
  /* pickups */
  for(const pk of World.pickups){
    if(pk.taken||pk.x<vr.l||pk.x>vr.r||pk.y<vr.t||pk.y>vr.b)continue;
    const bob=pk.type==='stone'?0:Math.sin(Game.t*2+pk.ph)*2;
    sctx.save();sctx.translate(pk.x,pk.y+bob);
    if(pk.type==='oil'){
      sctx.fillStyle='#1f1a12';
      sctx.fillRect(-5,-9,10,12);
      sctx.fillStyle='rgba(255,190,90,0.92)';
      sctx.fillRect(-4,-5,8,7);
      sctx.fillStyle='#3a3226';
      sctx.fillRect(-2,-12,4,4);
    }else if(pk.type==='flare'){
      sctx.save();sctx.rotate(-0.5);
      sctx.fillStyle='#6e1f1a';sctx.fillRect(-2.5,-9,5,18);
      sctx.fillStyle='#d8d2c0';sctx.fillRect(-2.5,-9,5,4);
      sctx.restore();
    }else if(pk.type==='stone'){
      sctx.fillStyle='#565d68';
      sctx.beginPath();sctx.arc(-3,-2,3.2,0,TAU);sctx.fill();
      sctx.fillStyle='#49505a';
      sctx.beginPath();sctx.arc(2.5,-1,2.7,0,TAU);sctx.fill();
      sctx.fillStyle='#5e6570';
      sctx.beginPath();sctx.arc(0,-4.5,2.4,0,TAU);sctx.fill();
    }else{
      sctx.fillStyle='rgba(208,222,212,0.9)';
      sctx.beginPath();sctx.arc(0,-8,3.4,0,TAU);sctx.fill();
      sctx.fillRect(-2.6,-6,5.2,10);
      sctx.fillStyle='rgba(120,140,130,0.9)';
      sctx.fillRect(-4.6,-2,9.2,2);
    }
    sctx.restore();
  }
  /* loose stalactites */
  for(const s of World.stals){
    if(s.x<vr.l-40||s.x>vr.r+40||s.y<vr.t-120||s.y>vr.b+120)continue;
    const ox=s.state===1?Math.sin(Game.t*58)*1.6:0;
    const g=sctx.createLinearGradient(s.x,s.y,s.x,s.y+s.len);
    g.addColorStop(0,'rgba(64,72,86,0.96)');g.addColorStop(1,'rgba(36,40,52,0.94)');
    sctx.fillStyle=g;
    sctx.beginPath();
    sctx.moveTo(s.x-s.w/2+ox,s.y);
    sctx.lineTo(s.x+s.w/2+ox,s.y);
    sctx.lineTo(s.x+ox*1.4,s.y+s.len);
    sctx.closePath();sctx.fill();
  }
  /* rope */
  if(P.rope.on){
    const hx=P.x+P.face*7,hy=P.y-5;
    const d=hyp(P.x-P.rope.anx,P.y-P.rope.any);
    const sag=clamp((P.rope.len-d)*0.5,0,40);
    const mx2=(hx+P.rope.anx)/2,my2=(hy+P.rope.any)/2+sag;
    sctx.strokeStyle='rgba(150,128,94,0.9)';sctx.lineWidth=1.6;
    sctx.beginPath();sctx.moveTo(P.rope.anx,P.rope.any);
    sctx.quadraticCurveTo(mx2,my2,hx,hy);sctx.stroke();
    sctx.fillStyle='rgba(170,150,110,1)';
    sctx.beginPath();sctx.arc(P.rope.anx,P.rope.any,2.6,0,TAU);sctx.fill();
  }else if(P.rope.missT>0){
    P.rope.missT-=1/60;
    sctx.strokeStyle=`rgba(150,128,94,${P.rope.missT*2})`;sctx.lineWidth=1;
    sctx.beginPath();sctx.moveTo(P.x+P.face*7,P.y-5);
    sctx.lineTo(P.rope.mx,P.rope.my);sctx.stroke();
  }
  /* flares (bodies) */
  for(const f of flares){
    sctx.save();sctx.translate(f.x,f.y);sctx.rotate(f.rot);
    sctx.fillStyle='#5e1d18';sctx.fillRect(-2,-7,4,14);
    sctx.restore();
  }
  /* stones in flight */
  for(const s of stones){
    sctx.save();sctx.translate(s.x,s.y);sctx.rotate(s.rot);
    sctx.fillStyle='#59606b';
    sctx.fillRect(-2.6,-2.2,5.2,4.4);
    sctx.restore();
  }
  /* puffballs: pale swollen things on the fungal floors */
  for(const pf of World.puffs){
    if(pf.state===1||pf.x<vr.l||pf.x>vr.r||pf.y<vr.t||pf.y>vr.b)continue;
    const br=1+Math.sin(Game.t*1.6+pf.ph)*0.06;
    const g2=sctx.createRadialGradient(pf.x-pf.r*0.3,pf.y-pf.r*0.4,1,pf.x,pf.y,pf.r*br);
    g2.addColorStop(0,'rgba(196,214,176,0.95)');
    g2.addColorStop(0.7,'rgba(134,158,116,0.9)');
    g2.addColorStop(1,'rgba(86,108,76,0.85)');
    sctx.fillStyle=g2;
    sctx.beginPath();sctx.ellipse(pf.x,pf.y,pf.r*br,pf.r*0.82*br,0,0,TAU);sctx.fill();
    sctx.fillStyle='rgba(220,240,200,0.5)';
    for(let k=0;k<3;k++){
      sctx.beginPath();sctx.arc(pf.x+Math.sin(pf.ph+k*2.4)*pf.r*0.5,pf.y-pf.r*0.2+Math.cos(pf.ph+k*1.7)*pf.r*0.3,0.9,0,TAU);sctx.fill();
    }
  }
  /* bone chimes: someone hung the dead up to listen */
  for(const ch of World.chimes){
    if(ch.x<vr.l-40||ch.x>vr.r+40||ch.y<vr.t-80||ch.y>vr.b+80)continue;
    const sw=Math.sin(Game.t*1.1+ch.ph)*2+ch.sway*Math.sin(Game.t*16)*7;
    sctx.strokeStyle='rgba(150,140,120,0.55)';
    sctx.lineWidth=1;
    for(let k=-1;k<=1;k++){
      const bx=ch.x+k*5,tipX=bx+sw*(0.6+k*0.2),tipY=ch.y+ch.len*(0.8+Math.abs(k)*0.18);
      sctx.beginPath();sctx.moveTo(bx,ch.y);
      sctx.quadraticCurveTo(bx+sw*0.4,ch.y+ch.len*0.5,tipX,tipY);
      sctx.stroke();
      sctx.fillStyle='rgba(205,198,180,0.8)';
      sctx.fillRect(tipX-1.4,tipY,2.8,7+Math.abs(k)*2);
      sctx.fillRect(tipX-2.2,tipY+2.6,4.4,1.6);
    }
  }
  /* Mark's chalk, scrawled on the floor */
  sctx.font='italic 9px Georgia,serif';
  sctx.textAlign='center';
  for(const n of World.notes){
    if(n.x<vr.l||n.x>vr.r||n.y<vr.t||n.y>vr.b)continue;
    sctx.fillStyle='rgba(225,220,205,0.62)';
    sctx.fillText(n.txt,n.x,n.y);
  }
  /* particles, smoke first */
  for(const p of Particles.list){
    const k=1-p.t/p.life;
    if(p.type==='smoke'||p.type==='breath'){
      sctx.fillStyle=p.type==='breath'?`rgba(190,205,215,${0.12*k})`:`rgba(40,40,46,${0.25*k})`;
      sctx.beginPath();sctx.arc(p.x,p.y,p.r,0,TAU);sctx.fill();
    }
  }
  drawPlayer();
  for(const p of Particles.list){
    const k=1-p.t/p.life;
    switch(p.type){
      case 'dust':
        sctx.fillStyle=`rgba(150,148,140,${0.34*k})`;
        sctx.beginPath();sctx.arc(p.x,p.y,p.r,0,TAU);sctx.fill();break;
      case 'debris':
        sctx.save();sctx.translate(p.x,p.y);sctx.rotate(p.rot);
        sctx.fillStyle=`rgba(70,76,90,${0.95*Math.min(1,k*3)})`;
        sctx.fillRect(-p.r,-p.r*0.7,p.r*2,p.r*1.4);
        sctx.restore();break;
      case 'drop':
        sctx.fillStyle=`rgba(160,200,220,0.75)`;
        sctx.fillRect(p.x-0.7,p.y-3,1.4,4.5);break;
      case 'splash':
        sctx.fillStyle=`rgba(150,195,215,${0.6*k})`;
        sctx.beginPath();sctx.arc(p.x,p.y,p.r,0,TAU);sctx.fill();break;
    }
  }
  /* water surface + ripples */
  for(const w of World.water){
    if(w.x>vr.r||w.x+w.w<vr.l||w.y>vr.b||w.y+w.h<vr.t)continue;
    for(let i=w.ripples.length-1;i>=0;i--){
      const rp=w.ripples[i];rp.t+=1/60;
      if(rp.t>1.6)w.ripples.splice(i,1);
    }
    sctx.strokeStyle='rgba(150,205,215,0.45)';
    sctx.lineWidth=1.4;
    sctx.beginPath();
    const x0=Math.max(w.x,vr.l),x1=Math.min(w.x+w.w,vr.r);
    for(let x=x0;x<=x1;x+=7){
      let y=w.y+Math.sin(x*0.045+Game.t*1.8)*1.4;
      for(const rp of w.ripples){
        const dd=Math.abs(x-rp.x);
        y+=Math.sin(Math.max(0,rp.t*9-dd*0.06))*rp.amp*Math.exp(-dd*0.012-rp.t*2.2);
      }
      x===x0?sctx.moveTo(x,y):sctx.lineTo(x,y);
    }
    sctx.stroke();
  }
  /* volumetric air-scatter: the lantern's halo hangs in the damp air
     (canvas fallback only — the shader computes true in-scatter) */
  if(!GLR.on&&P.oil>0){
    const sg=sctx.createRadialGradient(P.lightX,P.lightY,4,P.lightX,P.lightY,P.lightR()*0.85);
    sg.addColorStop(0,`rgba(255,200,120,${0.16*Game.flick})`);
    sg.addColorStop(0.45,`rgba(220,150,80,${0.07*Game.flick})`);
    sg.addColorStop(1,'rgba(0,0,0,0)');
    sctx.fillStyle=sg;
    sctx.beginPath();sctx.arc(P.lightX,P.lightY,P.lightR()*0.85,0,TAU);sctx.fill();
  }
  if(!GLR.on)for(const f of flares){
    const R=flareLight(f);
    const sg=sctx.createRadialGradient(f.x,f.y,2,f.x,f.y,R*0.8);
    sg.addColorStop(0,'rgba(255,120,60,0.2)');
    sg.addColorStop(1,'rgba(0,0,0,0)');
    sctx.fillStyle=sg;
    sctx.beginPath();sctx.arc(f.x,f.y,R*0.8,0,TAU);sctx.fill();
  }
  /* dust motes (drift in the air, lit later by multiply) */
  for(const m of Particles.motes){
    sctx.fillStyle='rgba(190,190,180,0.35)';
    sctx.beginPath();sctx.arc(m.x,m.y,m.r,0,TAU);sctx.fill();
  }
  /* floating pickup texts */
  sctx.font='10px Georgia,serif';
  sctx.textAlign='center';
  for(let i=FloatTxts.length-1;i>=0;i--){
    const ft=FloatTxts[i];ft.t+=1/60;
    if(ft.t>1.6){FloatTxts.splice(i,1);continue}
    sctx.fillStyle=`rgba(${ft.col},${clamp(1.6-ft.t,0,1)})`;
    sctx.fillText(ft.txt,ft.x,ft.y-ft.t*16);
  }
}

function drawCamp(vr){
  const cx2=World.campX,cy2=World.campY;
  if(cx2<vr.l-300||cx2>vr.r+300||cy2<vr.t-300||cy2>vr.b+300)return;
  /* find floor under camp */
  let fy=cy2;
  for(let d=0;d<260;d+=4)if(World.solid(cx2,cy2+d)){fy=cy2+d-2;break}
  sctx.save();sctx.translate(cx2,fy);
  /* tent */
  sctx.fillStyle='#27313a';
  sctx.beginPath();sctx.moveTo(-46,0);sctx.lineTo(-22,-30);sctx.lineTo(2,0);sctx.closePath();sctx.fill();
  sctx.strokeStyle='#3a4754';sctx.lineWidth=1.4;
  sctx.beginPath();sctx.moveTo(-22,-30);sctx.lineTo(-22,0);sctx.stroke();
  /* bedroll */
  sctx.fillStyle='#2e2620';
  sctx.fillRect(12,-5,30,5);
  /* dead lantern */
  sctx.strokeStyle='#4e4636';sctx.lineWidth=1.6;
  sctx.strokeRect(50,-12,9,12);
  sctx.beginPath();sctx.arc(54.5,-13,4,Math.PI,0);sctx.stroke();
  /* chalk on the wall */
  sctx.fillStyle='rgba(222,218,204,0.62)';
  sctx.font='italic 13px Georgia,serif';sctx.textAlign='center';
  sctx.fillText("I ' M   S O R R Y",6,-52);
  sctx.restore();
}

function drawPlayer(){
  const c=sctx;
  c.save();
  c.translate(P.x,P.y+2);
  const lean=clamp(P.vx/400,-0.3,0.3);
  c.rotate(lean*0.5);
  c.scale(P.face,1);
  const wp=P.walkPhase*2;
  const la=P.grounded&&Math.abs(P.vx)>26?Math.sin(wp)*0.55:(P.grounded?0:0.3);
  const lb=P.grounded&&Math.abs(P.vx)>26?Math.sin(wp+Math.PI)*0.55:(P.grounded?0:-0.45);
  /* legs */
  c.strokeStyle='#1c2026';c.lineWidth=3.4;c.lineCap='round';
  c.beginPath();c.moveTo(0,2);c.lineTo(Math.sin(la)*7,10);c.stroke();
  c.beginPath();c.moveTo(0,2);c.lineTo(Math.sin(lb)*7,10);c.stroke();
  /* torso */
  c.fillStyle='#262d36';
  c.beginPath();c.ellipse(0,-4,5,8,0,0,TAU);c.fill();
  /* backpack */

  c.beginPath();c.arc(2,-13,4,0,TAU);c.fill();
  c.fillStyle='#4e4536';
  c.beginPath();c.arc(2,-14,4.4,Math.PI*0.95,Math.PI*2.05);c.fill();
  /* lantern arm */
  c.strokeStyle='#262d36';c.lineWidth=3;
  c.beginPath();c.moveTo(2,-7);c.lineTo(9,-2+P.bob*0.5);c.stroke();
  /* rope arm */
  if(P.rope.on){
    c.beginPath();c.moveTo(0,-8);c.lineTo(6,-16);c.stroke();
  }
  /* lantern */
  c.save();c.translate(10,-2+P.bob*0.5);c.rotate(-lean*0.8+Math.sin(Game.t*1.3)*0.08);
  c.strokeStyle='#54493a';c.lineWidth=1.4;
  c.strokeRect(-3.2,-1,6.4,8);

function drawCreatureBody(){
  if(!Cr.awake)return;
  if(World.solid(Cr.x,Cr.y))return;
  const d=hyp(Cr.x-P.x,Cr.y-P.y);
  if(d>820)return;
  applyCam(ctx,1);
  const t=Game.t;
  for(let i=0;i<6;i++){
    const ox=(vnoise(t*1.1+i*7.3,i*3.1)-0.5)*36;
    const oy=(vnoise(t*1.3+i*4.7,i*9.2)-0.5)*30;
    const r=15+vnoise(t*0.8+i,5.5)*17;
    const g=ctx.createRadialGradient(Cr.x+ox,Cr.y+oy,1,Cr.x+ox,Cr.y+oy,r);
    g.addColorStop(0,'rgba(2,2,4,0.92)');
    g.addColorStop(1,'rgba(2,2,4,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(Cr.x+ox,Cr.y+oy,r,0,TAU);ctx.fill();
  }
  /* tendrils */
  ctx.strokeStyle='rgba(3,3,6,0.55)';
  ctx.lineCap='round';
  for(let i=0;i<5;i++){
    const a=i/5*TAU+t*0.4;
    const ln=34+vnoise(t*1.6+i*11,2.2)*30;
    ctx.lineWidth=3.5-i*0.4;
    ctx.beginPath();
    ctx.moveTo(Cr.x,Cr.y);
    ctx.quadraticCurveTo(
      Cr.x+Math.cos(a)*ln*0.5+(vnoise(t*2+i,8)-0.5)*22,
      Cr.y+Math.sin(a)*ln*0.5+(vnoise(t*2.2+i,4)-0.5)*22,
      Cr.x+Math.cos(a)*ln,Cr.y+Math.sin(a)*ln);
    ctx.stroke();
  }
}

function drawLights(){
  lctx.setTransform(1,0,0,1,0,0);
  lctx.globalCompositeOperation='source-over';
  /* ambient: deeper = darker (fast early falloff, near-black at the bottom) */
  const depth=clamp((Cam.y-World.startY)/(World.H*CELL),0,1);
  const dk=Math.pow(depth,0.55);
  const aR=lerp(13,3,dk),aG=lerp(17,4,dk),aB=lerp(26,8,dk);
  lctx.fillStyle=`rgb(${aR|0},${aG|0},${aB|0})`;
  lctx.fillRect(0,0,liteC.width,liteC.height);
  applyCam(lctx,LS);
  /* daylight at the mouth */
  if(Cam.y<1600){
    plainLight(World.mouthX,-260,1050,[
      [0,'rgba(170,190,205,0.85)'],[0.55,'rgba(110,130,150,0.35)'],[1,'rgba(0,0,0,0)']
    ]);
  }
  /* the lantern */
  const LR=P.lightR();
  const fl=Game.flick;
  lightWithShadows(P.lightX,P.lightY,LR,[
    [0,`rgba(255,234,185,${0.99*fl})`],
    [0.22,`rgba(255,206,135,${0.93*fl})`],
    [0.52,`rgba(215,145,75,${0.58*fl})`],
    [0.82,`rgba(130,80,45,${0.22*fl})`],
    [1,'rgba(0,0,0,0)']
  ],1);
  /* close-range bounce so the spelunker is never swallowed whole */
  plainLight(P.x,P.y,84,[
    [0,`rgba(255,214,150,${0.5*fl})`],[1,'rgba(0,0,0,0)']
  ]);
  /* flares: 2 nearest get true shadows */
  const fs=[...flares].sort((a,b)=>hyp(a.x-P.x,a.y-P.y)-hyp(b.x-P.x,b.y-P.y));
  for(let i=0;i<fs.length;i++){
    const f=fs[i],R=flareLight(f);
    const stops=[[0,'rgba(255,160,110,0.95)'],[0.35,'rgba(255,90,50,0.65)'],[1,'rgba(0,0,0,0)']];
    if(i<2)lightWithShadows(f.x,f.y,R,stops,1);
    else plainLight(f.x,f.y,R,stops);
  }
  /* fungus glow */
  const vr=viewRect(120);
  for(const fg of World.fungi){
    if(fg.x<vr.l||fg.x>vr.r||fg.y<vr.t||fg.y>vr.b)continue;
    const pul=0.55+0.45*Math.sin(Game.t*0.9+fg.ph);
    const col=fg.hue===2?'255,96,44':fg.hue?'150,255,190':'110,225,255';
    plainLight(fg.x,fg.y,fg.hue===2?42+fg.r*5:55+fg.r*6,[
      [0,`rgba(${col},${(fg.hue===2?0.26:0.34)*pul})`],[1,'rgba(0,0,0,0)']
    ]);
  }
  /* camp ember */
  if(Math.abs(World.campX-Cam.x)<900&&Math.abs(World.campY-Cam.y)<700){
    const pul=0.6+0.4*vnoise(Game.t*3,8.8);
    plainLight(World.campX+28,World.campY+30,130,[
      [0,`rgba(255,120,60,${0.5*pul})`],[1,'rgba(0,0,0,0)']
    ]);
  }
}

function glowPass(){
  applyCam(ctx,1);
  ctx.globalCompositeOperation='screen';
  /* lantern flame */
  if(P.oil>0){
    const fx=P.lightX,fy=P.lightY;
    const g=ctx.createRadialGradient(fx,fy,0,fx,fy,12);
    g.addColorStop(0,`rgba(255,240,200,${0.95*Game.flick})`);
    g.addColorStop(0.4,`rgba(255,180,90,${0.5*Game.flick})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(fx,fy,12,0,TAU);ctx.fill();
  }
  /* flare cores + sparks */
  for(const f of flares){
    const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,16);
    g.addColorStop(0,'rgba(255,220,180,0.95)');
    g.addColorStop(0.35,'rgba(255,90,40,0.7)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(f.x,f.y,16,0,TAU);ctx.fill();
  }
  for(const p of Particles.list){
    if(p.type==='spark'){
      const k=1-p.t/p.life;
      ctx.fillStyle=`rgba(255,${160+k*60|0},90,${k})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
    }else if(p.type==='spore'){
      const k=1-p.t/p.life;
      ctx.fillStyle=`rgba(150,255,170,${0.55*k})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
    }
  }
  /* fungus cores */
  const vr=viewRect(60);
  for(const fg of World.fungi){
    if(fg.x<vr.l||fg.x>vr.r||fg.y<vr.t||fg.y>vr.b)continue;
    const pul=0.5+0.5*Math.sin(Game.t*0.9+fg.ph);
    const col=fg.hue===2?'255,120,60':fg.hue?'170,255,205':'140,235,255';
    ctx.fillStyle=`rgba(${col},${0.35+0.3*pul})`;
    ctx.beginPath();ctx.arc(fg.x,fg.y,fg.r*0.8,0,TAU);ctx.fill();
  }
  /* pickup glints: supplies catch the eye in the dark */
  for(const pk of World.pickups){
    if(pk.taken)continue;
    if(pk.x<vr.l||pk.x>vr.r||pk.y<vr.t||pk.y>vr.b)continue;
    const pul=0.4+0.6*Math.abs(Math.sin(Game.t*1.4+pk.ph));
    if(pk.type==='relic'){
      ctx.fillStyle=`rgba(200,235,215,${0.25*pul})`;
      ctx.beginPath();ctx.arc(pk.x,pk.y-6,9,0,TAU);ctx.fill();
    }else{
      const col=pk.type==='oil'?'255,200,110':'255,110,70';
      ctx.fillStyle=`rgba(${col},${0.16*pul})`;
      ctx.beginPath();ctx.arc(pk.x,pk.y-3,7,0,TAU);ctx.fill();
      ctx.fillStyle=`rgba(${col},${0.5*pul})`;
      ctx.fillRect(pk.x-1,pk.y-4,2,2);
    }
  }
  /* watcher eye-glints */
  for(const w of Watchers){
    const a=w.gone?clamp(1-w.t/w.life,0,1):clamp(w.t*2,0,1)*(0.35+0.4*vnoise(Game.t*7+w.x,3));
    drawEyes(w.x,w.y,5.5,1.6,a*0.8,0);
  }
  /* creature eyes */
  if(Cr.awake&&!World.solid(Cr.x,Cr.y)){
    const d=hyp(Cr.x-P.x,Cr.y-P.y);
    if(d<860){
      const blink=Cr.blink>0?0.12:1;
      const inten=clamp(1.25-d/700,0.25,1);
      drawEyes(Cr.x,Cr.y-4,Cr.eyeGap,3.1,inten,blink,Math.atan2(P.y-Cr.y,P.x-Cr.x));
    }
  }
  /* the watching passage: eyes open in the walls, one by one */
  if(World.setp&&World.setp.done&&World.setp.t<11){
    const sp=World.setp;
    for(const e of sp.eyes){
      let a;
      if(sp.t<6.4)a=clamp((sp.t-e.delay)*1.4,0,1)*0.8; /* slow open */
      else a=0; /* the knock: all gone at once */
      if(a>0.01){
        const look=Math.atan2(P.y-e.y,P.x-e.x);
        drawEyes(e.x,e.y,6.5,1.9,a,1,look);
      }
    }
  }
  /* ending: the eyes open everywhere */
  if(Game.state==='ending'&&Game.endT>8){
    const k=clamp((Game.endT-8)/4,0,1);
    const RE=mulberry32(World.seed+9);
    for(let i=0;i<11;i++){
      const a=RE()*TAU,dd=180+RE()*320;
      const ex=World.campX+Math.cos(a)*dd,ey=World.campY-30+Math.sin(a)*dd*0.6;
      if(World.solid(ex,ey))continue;
      const ka=clamp(k*1.4-i*0.09,0,1);
      drawEyes(ex,ey,8+RE()*7,2+RE()*1.6,ka*0.85,1);
    }
  }
  ctx.globalCompositeOperation='source-over';
}
function drawEyes(x,y,gap,size,alpha,blink=1,lookA=null){
  if(alpha<=0.01)return;
  const g=ctx.createRadialGradient(x,y,0,x,y,gap*2.6);
  g.addColorStop(0,`rgba(190,230,200,${alpha*0.33})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(x,y,gap*2.6,0,TAU);ctx.fill();
  ctx.fillStyle=`rgba(216,240,222,${alpha})`;
  const lx=lookA!==null?Math.cos(lookA)*1.1:0;
  const ly=lookA!==null?Math.sin(lookA)*1.1:0;
  for(const s of[-1,1]){
    ctx.beginPath();
    ctx.ellipse(x+s*gap/2+lx,y+ly,size,size*1.45*Math.max(blink,0.05),0,0,TAU);
    ctx.fill();
  }
}

/* ---------------- post fx ---------------- */
const bloomC=document.createElement('canvas'),bctx=bloomC.getContext('2d');
const BLOOM_OK=typeof bctx.filter==='string';
function post(){
  ctx.setTransform(1,0,0,1,0,0);
  const danger=Tension.danger;
  /* bloom: flame cores, flares, fungus and eyes haze outward */
  if(BLOOM_OK&&!Perf.lowFx){
    const bw=Math.max(2,cv.width>>2),bh=Math.max(2,cv.height>>2);
    if(bloomC.width!==bw||bloomC.height!==bh){bloomC.width=bw;bloomC.height=bh}
    bctx.setTransform(1,0,0,1,0,0);
    bctx.clearRect(0,0,bw,bh);
    bctx.filter='blur(4px)';
    bctx.drawImage(cv,0,0,bw,bh);
    bctx.filter='none';
    ctx.globalCompositeOperation='screen';
    ctx.globalAlpha=0.28;
    ctx.drawImage(bloomC,0,0,bw,bh,0,0,cv.width,cv.height);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }
  /* chromatic ghosting when stalked */
  const ab=Math.max(danger-0.45,0)*1.4+(P.hurtT>0?0.3:0);
  if(ab>0.03){
    abx.setTransform(1,0,0,1,0,0);
    abx.clearRect(0,0,abC.width,abC.height);
    abx.drawImage(cv,0,0);
    ctx.globalCompositeOperation='screen';
    const off=(1.5+ab*5)*VIEW.px;
    ctx.globalAlpha=ab*0.3;
    ctx.drawImage(abC,off,0);
    ctx.drawImage(abC,-off,off*0.4);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }
  /* desaturation: dying light, injury, slow-mo */
  let desat=0;
  if(P.oil<=0)desat=0.45;
  if(P.hurtT>0)desat=Math.max(desat,P.hurtT*0.5);
  if(P.slowT>0)desat=Math.max(desat,0.55);
  if(Game.state==='dying')desat=Math.max(desat,clamp(Game.dieT,0,0.8));
  if(desat>0.02){
    ctx.globalCompositeOperation='saturation';
    ctx.fillStyle=`rgba(128,128,128,${clamp(desat,0,1)})`;
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.globalCompositeOperation='source-over';
  }
  /* hurt flash */
  if(P.hurtT>0.6){
    ctx.fillStyle=`rgba(140,10,5,${(P.hurtT-0.6)*0.5})`;
    ctx.fillRect(0,0,cv.width,cv.height);
  }
  /* vignette + heartbeat pulse */
  if(vigC){
    ctx.globalAlpha=0.78+Tension.beatPulse*0.16*(0.3+danger)+danger*0.12;
    ctx.drawImage(vigC,0,0);
    ctx.globalAlpha=1;
  }
  /* film grain */
  const g=GRAIN[(Game.t*24|0)%3];
  ctx.globalCompositeOperation='overlay';
  ctx.globalAlpha=0.08+danger*0.07;
  const gs=192*VIEW.px;
  const gox=-((Game.t*977|0)%192)*VIEW.px,goy=-((Game.t*1371|0)%192)*VIEW.px;
  for(let x=gox;x<cv.width;x+=gs)for(let y=goy;y<cv.height;y+=gs)
    ctx.drawImage(g,x,y,gs,gs);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}

function drawHUD(){

  const X=18,Y=64;

  ctx.strokeRect(X,Y,8,11);
  ctx.beginPath();ctx.arc(X+4,Y-1,3.4,Math.PI,0);ctx.stroke();
  const low=P.oil<22;
  const barFl=low?(0.5+0.5*vnoise(Game.t*9,2)):1;
  ctx.fillStyle=P.oil>0?`rgba(255,196,110,${a*barFl})`:`rgba(180,60,40,${a*(0.4+0.4*Math.sin(Game.t*6))})`;
  ctx.fillRect(X+2,Y+2+(7-P.oil/100*7),4,P.oil/100*7);
  ctx.strokeStyle=`rgba(200,190,160,${a*0.55})`;
  ctx.strokeRect(X+16,Y+2,108,7);
  ctx.fillStyle=`rgba(255,196,110,${a*barFl})`;
  ctx.fillRect(X+17.5,Y+3.5,105*P.oil/100,4);
  /* flares */
  for(let i=0;i<P.flares;i++){
    ctx.fillStyle=`rgba(220,80,55,${a})`;
    ctx.save();ctx.translate(X+20+i*13,Y+22);ctx.rotate(-0.5);
    ctx.fillRect(-1.6,-5,3.2,10);
    ctx.fillStyle=`rgba(230,220,200,${a})`;ctx.fillRect(-1.6,-5,3.2,2.6);
    ctx.restore();
  }
  for(let i=0;i<P.stones;i++){
    ctx.fillStyle=`rgba(150,158,170,${a*0.9})`;
    ctx.beginPath();ctx.arc(X+104+i*11,Y+22,3.2,0,TAU);ctx.fill();
  }
  /* depth */
  const depth=Math.max(0,Math.round((P.y-World.startY)/14));
  ctx.fillStyle=`rgba(170,185,195,${a})`;
  ctx.font='12px "Courier New",monospace';
  ctx.fillText('-'+depth+' m',X+138,Y+10);
  /* heart line */
  const hx=X+16,hy2=Y+40,hw=92;
  ctx.strokeStyle=`rgba(${150+Tension.danger*105|0},${190-Tension.danger*130|0},${170-Tension.danger*120|0},${a})`;
  ctx.lineWidth=1.2;
  ctx.beginPath();
  for(let i=0;i<=hw;i+=2){
    const ph=((Game.t*2+i*0.013)%1+1)%1;
    let yo=0;
    const pk=Tension.beatPulse*clamp(1-Math.abs(i-hw*0.55)/8,0,1);
    yo-=pk*9;
    yo+=Math.sin(i*0.5+Game.t*3)*0.5;
    i===0?ctx.moveTo(hx+i,hy2+yo):ctx.lineTo(hx+i,hy2+yo);
  }
  ctx.stroke();
}

function wrapLines(c,text,maxW){
  const words=text.split(' '),out=[];let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(c.measureText(t).width>maxW&&line){out.push(line);line=w}
    else line=t;
  }
  if(line)out.push(line);
  return out;
}

function drawScoresBlock(cx2,y){
  ctx.textAlign='center';

    ctx.fillStyle='rgba(186,178,158,0.85)';

      ctx.beginPath();ctx.moveTo(sx+sw/2-6,dn+4);ctx.lineTo(sx+sw/2+6,dn+4);ctx.lineTo(sx+sw/2,dn+12);ctx.closePath();ctx.fill();
    }
    y=dn+26;
    const bw=104,bh=26;
    const carve={x:cx2-bw-8,y,w:bw,h:bh},pass={x:cx2+8,y,w:bw,h:bh};
    ctx.font='12px Georgia,serif';
    ctx.strokeStyle='rgba(196,186,160,0.6)';
    ctx.strokeRect(carve.x,carve.y,carve.w,carve.h);

    ctx.strokeStyle='rgba(196,186,160,0.28)';

  y+=8;

  ctx.font='12px "Courier New",monospace';
  if(b==='offline'){
    ctx.fillStyle='rgba(130,140,150,0.7)';

  if(!b){
    ctx.fillStyle='rgba(130,140,150,0.7)';
    ctx.fillText('listening…',cx2,y+18);
    return y+30;
  }
  if(!b.length){
    ctx.fillStyle='rgba(130,140,150,0.7)';

  for(let i=0;i<b.length;i++){

    ctx.fillStyle=me?'rgba(255,200,120,0.95)':won?'rgba(196,186,160,0.9)':'rgba(160,168,178,0.8)';
    const label=won?'the bottom':(r.score+' m');
    ctx.fillText(`${String(i+1).padStart(2,' ')}  ${r.name}   ${label.padStart(10,' ')}`,cx2,y+18+i*17);
  }
  return y+18+b.length*17;
}
function fmtTime(s){
  const m=s/60|0,ss=s%60|0;

}

/* ---------------- master render ---------------- */
function render(){
  if(Game.state==='title'){

  drawHUD();

  if(Game.zoneT<5&&Game.zone>0){

    ctx.fillStyle=`rgba(186,178,158,${k*0.85})`;
    ctx.fillText('— '+ZONES[Game.zone].name+' —',VIEW.w/2,VIEW.h*0.3);
  }
  if(Game.state==='intro')drawIntro();
  drawTouchUI();
  drawSysButtons();
  if(Game.paused){
    bigVeil(0.6);
    screenSpace(ctx,1);
    ctx.textAlign='center';
    ctx.font='22px Georgia,serif';
    ctx.fillStyle='rgba(196,186,160,0.9)';
    ctx.fillText('PAUSED',VIEW.w/2,VIEW.h*0.42);
    ctx.font='12px "Courier New",monospace';
    ctx.fillStyle='rgba(160,170,180,0.8)';
    ctx.fillText(Input.touch?'tap the pause button to resume':'P / ESC to resume · M mute · R restart',VIEW.w/2,VIEW.h*0.42+28);
  }
}

<script>
'use strict';
/* ---------------- persistent records (site build — storage allowed) ---------------- */
const Store={
  d:{bestDepth:0,bestWinTime:0,mostRelics:0,runs:0,muted:false,initials:''},
  load(){try{const s=JSON.parse(localStorage.getItem('hollowdeep_v1'));if(s)Object.assign(this.d,s)}catch(e){}},
  save(){try{localStorage.setItem('hollowdeep_v1',JSON.stringify(this.d))}catch(e){}}
};
Store.load();
/* ---------------- global scores: those who went before ---------------- */
const Scores={
  API:'https://game-scores.jez237.workers.dev/scores/hollow-deep',
  board:null,state:'idle',pend:null,sel:0,initials:['M','R','K'],ui:null,
  offer(depth,won){
    this.pend={depth,won,time:Game.runT,relics:P.relics};
    this.state='entry';this.sel=0;
    const ini=((Store.d.initials||'MRK')+'AAA').slice(0,3).toUpperCase();
    this.initials=ini.split('');
    this.board=null;
    this.fetchBoard();
  },
  async fetchBoard(){
    try{
      const r=await fetch(this.API);
      const d=await r.json();
      this.board=(Array.isArray(d)?d:(d.scores||[]))
        .map(s=>({name:String(s.initials||s.name||'???').slice(0,3).toUpperCase(),score:s.score|0,extra:String(s.extra||'')}))
        .sort((a,b)=>b.score-a.score).slice(0,8);
    }catch(e){this.board='offline'}
  },
  cycle(slot,dir){
    const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const i=A.indexOf(this.initials[slot]);
    this.initials[slot]=A[((i<0?0:i)+dir+26)%26];
  },
  type(ch){
    this.initials[this.sel]=ch;
    this.sel=Math.min(2,this.sel+1);
  },
  async submit(){
    if(!this.pend||this.state!=='entry')return;
    this.state='sending';
    const name=this.initials.join('');
    Store.d.initials=name;Store.save();
    try{
      await fetch(this.API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({initials:name,score:this.pend.depth,
          extra:(this.pend.won?'WIN ':'')+fmtTime(this.pend.time)+' r'+this.pend.relics})});
      this.board=null;this.fetchBoard();
    }catch(e){}
    this.state='done';
  },
  skip(){if(this.state==='entry')this.state='skipped'},
  active(){return this.state==='entry'||this.state==='sending'},
  click(x,y){ /* returns true if consumed */
    const u=this.ui;
    if(!u||!this.active())return false;
    if(this.state==='sending')return true;
    for(let i=0;i<3;i++){
      if(x>u.slots[i].x&&x<u.slots[i].x+u.sw&&y>u.up-14&&y<u.up+12){this.sel=i;this.cycle(i,1);return true}
      if(x>u.slots[i].x&&x<u.slots[i].x+u.sw&&y>u.dn-12&&y<u.dn+14){this.sel=i;this.cycle(i,-1);return true}
      if(x>u.slots[i].x&&x<u.slots[i].x+u.sw&&y>u.up&&y<u.dn){this.sel=i;return true}
    }
    if(x>u.carve.x&&x<u.carve.x+u.carve.w&&y>u.carve.y&&y<u.carve.y+u.carve.h){this.submit();return true}
    if(x>u.pass.x&&x<u.pass.x+u.pass.w&&y>u.pass.y&&y<u.pass.y+u.pass.h){this.skip();return true}
    return true; /* swallow stray taps while entry is open */
  },
  key(e){ /* returns true if consumed */
    if(!this.active())return false;
    if(this.state==='sending')return true;
    const c=e.code;
    if(c.startsWith('Key')&&c.length===4){this.type(c[3]);return true}
    if(c==='ArrowLeft'){this.sel=Math.max(0,this.sel-1);return true}
    if(c==='ArrowRight'){this.sel=Math.min(2,this.sel+1);return true}
    if(c==='ArrowUp'){this.cycle(this.sel,1);return true}
    if(c==='ArrowDown'){this.cycle(this.sel,-1);return true}
    if(c==='Backspace'){this.sel=Math.max(0,this.sel-1);return true}
    if(c==='Enter'||c==='NumpadEnter'){this.submit();return true}
    if(c==='Escape'){this.skip();return true}
    return true;
  }
};
/* ---------------- game state ---------------- */
const Game={
  state:'title',t:0,runT:0,paused:false,
  seed:(Math.random()*1e9)|0,
  timescale:1,flick:1,
  dieT:0,deathCause:'',introT:0,endT:0,maxD:0,
  showStory:false,storyBtn:null,
  titleClick(x,y){ /* true = consumed by the story UI, don't start the game */
    if(this.state!=='title')return false;
    if(this.showStory){this.showStory=false;return true}
    const b=this.storyBtn;
    if(b&&x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){this.showStory=true;return true}
    return false;
  },
  anyInput(){
    Au.init();Au.resume();
    if(this.state==='title'){
      if(this.showStory){this.showStory=false;return}
      this.newGame();return;
    }
    if(this.state==='dead'||this.state==='won'){
      if((Input.anyTap||Input.restartTap)&&!Scores.active()){Input.anyTap=false;Input.restartTap=false;this.newGame()}
    }
    Input.anyTap=false;Input.restartTap=false;
  },
  togglePause(){
    if(this.state!=='play'&&this.state!=='intro')return;
    this.paused=!this.paused;
  },
  newGame(){
    this.seed=(Math.random()*1e9)|0;
    World.gen(this.seed);
    GLR.fieldDirty=true;
    P.reset(World.startX,World.startY);
    Cr.reset();Tension.reset();Hints.reset();
    flares.length=0;stones.length=0;Particles.clear();
    Watchers.length=0;FloatTxts.length=0;
    Lore.t=99;this.maxD=0;this.runT=0;
    this.zone=0;this.zoneT=99;this.newRecord=false;this.scored=false;
    Cam.x=P.x;Cam.y=P.y;Cam.trauma=0;
    this.paused=false;this.timescale=1;
    this.state='intro';this.introT=0;
  },
  recordRun(won){
    if(this.scored)return;
    this.scored=true;
    const d=Math.round(this.maxD);
    Store.d.runs++;
    this.newRecord=d>Store.d.bestDepth;
    Store.d.bestDepth=Math.max(Store.d.bestDepth,d);
    Store.d.mostRelics=Math.max(Store.d.mostRelics,P.relics);
    if(won&&(!Store.d.bestWinTime||this.runT<Store.d.bestWinTime))Store.d.bestWinTime=this.runT;
    Store.save();
    Scores.offer(d,won);
  },
  die(cause){
    if(this.state!=='play')return;
    this.deathCause=cause;this.state='dying';this.dieT=0;
    P.rope.on=false;
    Cam.trauma=1;
    this.recordRun(false);
    if(cause==='taken'){Au.shriek(1);Au.stinger(1)}
    else Au.rock(true,0,1);
  },
  startEnding(){
    if(this.state!=='play')return;
    this.state='ending';this.endT=0;
    Tension.v=20;
    this.recordRun(true);
    Au.stinger(0.7);
  },
  update(dt){
    this.t+=dt;
    /* lantern flicker (global so light + flame agree) */
    let f=0.86+0.14*vnoise(this.t*6.3,44.4);
    if(P.oil<=0)f=0.55+0.45*vnoise(this.t*10,5.5);
    else if(P.oil<24&&vnoise(this.t*1.9,99)>0.74)f*=0.5+0.32*vnoise(this.t*22,7.1);
    this.flick=f;
    switch(this.state){
      case 'intro':
        this.introT+=dt;
        this.sim(dt);
        if(this.introT>8)this.state='play';
        break;
      case 'play':
        this.sim(dt);
        if(hyp(P.x-World.campX,P.y-World.campY)<130)this.startEnding();
        break;
      case 'dying':
        this.dieT+=dt;
        this.timescale=0.45;
        Particles.update(dt);Cam.update(dt);
        if(this.dieT>(this.deathCause==='taken'?2.0:1.7)){
          this.state='dead';this.timescale=1;
        }
        break;
      case 'ending':
        this.endT+=dt;
        Particles.update(dt);Drips.update(dt);Cam.update(dt);
        Au.tick(dt);Tension.beatPulse=Math.max(0,Tension.beatPulse-dt*3);
        /* slow creep of the camera toward the camp */
        Cam.x+=(World.campX-Cam.x)*dt*0.6;
        Cam.y+=(World.campY-40-Cam.y)*dt*0.6;
        if(this.endT>14)this.state='won';
        break;
      case 'dead': case 'won': case 'title':
        break;
    }
  },
  sim(dt){
    this.runT+=dt;
    this.timescale=P.slowT>0?0.38:1;
    P.update(dt);
    updateFlares(dt);
    updateStones(dt);
    Particles.update(dt);
    updateStals(dt);
    updateHazards(dt);
    updateSetpiece(dt);
    Drips.update(dt);
    Cr.update(dt);
    WatcherSys.update(dt);
    Tension.update(dt);
    Au.tick(dt);
    Cam.update(dt);
    /* zone transitions: name the deep as it swallows you */
    const z=zoneAt(P.y);
    if(z!==this.zone&&this.state==='play'){
      if(z>this.zone){this.zoneT=0;Au.zoneBoom()}
      this.zone=z;
    }
    if(this.zoneT<99)this.zoneT+=dt;
    if(Input.restartTap){Input.restartTap=false;this.newGame()}
  }
};

/* ---------------- resize / perf ---------------- */
function resize(){
  VIEW.w=innerWidth;VIEW.h=innerHeight;
  VIEW.dpr=Math.min(devicePixelRatio||1,1.75);
  VIEW.px=VIEW.dpr*VIEW.rs;
  const W=Math.max(2,Math.round(VIEW.w*VIEW.px)),H=Math.max(2,Math.round(VIEW.h*VIEW.px));
  cv.width=W;cv.height=H;
  sceneC.width=W;sceneC.height=H;
  abC.width=W;abC.height=H;
  liteC.width=Math.max(2,Math.round(W*LS));liteC.height=Math.max(2,Math.round(H*LS));
  ltmpC.width=liteC.width;ltmpC.height=liteC.height;
  GLR.init();
  if(GLR.gl&&!GLR.fail){GLR.resize(W,H);GLR.on=!GLR.perfOff}
  /* vignette */
  vigC=document.createElement('canvas');vigC.width=W;vigC.height=H;
  const vx=vigC.getContext('2d');
  const g=vx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(0.7,'rgba(0,0,0,0.34)');
  g.addColorStop(1,'rgba(0,0,0,0.84)');
  vx.fillStyle=g;vx.fillRect(0,0,W,H);
}
addEventListener('resize',resize);

/* dynamic perf scaling */
const Perf={ema:16,t:0,fps:60,lowFx:false,
  note(ms){this.ema=this.ema*0.95+ms*0.05;this.fps=1000/Math.max(this.ema,0.1)},
  check(){
    this.t++;
    if(this.t%90)return;
    if(this.ema>21){
      /* degrade in order: march quality -> resolution -> GL off -> bloom off */
      if(GLR.on&&GLR.steps>14)GLR.steps=14;
      else if(VIEW.rs>0.6){VIEW.rs=Math.max(0.6,VIEW.rs-0.15);resize()}
      else if(GLR.on){GLR.on=false;GLR.perfOff=true}
      else this.lowFx=true;
    }else if(this.ema<11.5&&VIEW.rs<1){VIEW.rs=Math.min(1,VIEW.rs+0.1);resize()}
  }
};

/* ---------------- main loop: fixed-step accumulator ---------------- */
const STEP=1/120;
let last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(dt>0.1)dt=0.1;
  Perf.note(dt*1000);Perf.check();
  Input.poll();
  if(!Game.paused){
    acc+=dt*Game.timescale;
    let n=0;
    while(acc>=STEP&&n<8){Game.update(STEP);acc-=STEP;n++}
    if(n===8)acc=0;
  }
  if(!Game.halt)render();
}
document.addEventListener('visibilitychange',()=>{acc=0;last=0});

/* ---------------- debug hooks (harmless) ---------------- */
window.__g={
  Game,P,Cr,World,Tension,Au,Cam,Input,Perf,flares,Particles,stones,GLR,Scores,
  halt(v){Game.halt=v},
  start(){Game.anyInput();Game.state='play'},
  tp(m){ /* teleport to ~depth in meters along the main path, settled on a floor */
    const y=World.startY+m*14;
    let best=World.pathPts[0];
    for(const pp of World.pathPts)if(Math.abs(pp.y-y)<Math.abs(best.y-y))best=pp;
    P.x=best.x;P.y=best.y;
    for(let d=0;d<500;d+=4)if(World.solid(P.x,P.y+d)){P.y=P.y+d-13;break}
    P.vx=0;P.vy=0;Cam.x=P.x;Cam.y=P.y;
  },
  oil(n){P.oil=n},
  ten(n){Tension.v=n},
  steps(n){for(let i=0;i<n;i++)Game.update(STEP)}
};

/* ---------------- boot ---------------- */
resize();
requestAnimationFrame(frame);
</script>
