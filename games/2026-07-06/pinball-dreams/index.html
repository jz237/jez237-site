/* ════════════════════ AUDIO ════════════════════ */
const audio = (() => {
  let ac = null, master, sfxG, musG, musicOn = false, musicTimer = 0, nextNote = 0, bar = 0;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ac.createDynamicsCompressor();
    master.threshold.value = -14; master.ratio.value = 8;
    master.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.gain.value = save.opts.sfx ? 0.5 : 0; sfxG.connect(master);
    musG = ac.createGain(); musG.gain.value = save.opts.music ? 0.16 : 0; musG.connect(master);
  }
  function vol() { if (!ac) return; sfxG.gain.value = save.opts.sfx ? 0.5 : 0; musG.gain.value = save.opts.music ? 0.16 : 0; }
  function osc(type, f0, f1, t0, dur, g0, curve) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(g0, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(curve || sfxG); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(t0, dur, g0, fc, q) {
    const len = Math.max(1, (dur * ac.sampleRate) | 0), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fc; f.Q.value = q || 1;
    const g = ac.createGain(); g.gain.setValueAtTime(g0, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(sfxG); src.start(t0); src.stop(t0 + dur);
  }
  const FX = {
    flip: t => { osc('square', 95, 55, t, 0.07, 0.5); noise(t, 0.045, 0.5, 2400, 0.8); },
    flipUp: t => { noise(t, 0.03, 0.25, 1800, 1); },
    bumper: t => { const p = rnd(0.94, 1.06); osc('sine', 640 * p, 210, t, 0.14, 0.9); osc('square', 320 * p, 120, t, 0.09, 0.3); noise(t, 0.03, 0.6, 3200, 1); },
    sling: t => { osc('sine', 260, 110, t, 0.09, 0.8); noise(t, 0.035, 0.6, 1500, 1); },
    roll: t => { osc('sine', 1180, 1180, t, 0.10, 0.4); osc('sine', 1770, 1770, t + 0.03, 0.09, 0.25); },
    inlane: t => { osc('sine', 880, 880, t, 0.10, 0.4); osc('sine', 1320, 1320, t + 0.04, 0.10, 0.3); },
    target: t => { osc('square', 190, 90, t, 0.08, 0.55); noise(t, 0.03, 0.7, 2000, 1); },
    bank: t => { [440, 550, 660, 880].forEach((f, i) => osc('triangle', f, f, t + i * 0.07, 0.14, 0.5)); },
    ramp: t => { noise(t, 0.28, 0.45, 900, 0.5); osc('sine', 330, 990, t, 0.3, 0.35); },
    launch: t => { osc('sine', 70, 240, t, 0.18, 0.8); noise(t, 0.22, 0.5, 700, 0.6); },
    drain: t => { osc('sawtooth', 300, 60, t, 0.5, 0.4); osc('sine', 150, 40, t, 0.55, 0.5); },
    saucer: t => { osc('sine', 520, 260, t, 0.16, 0.6); osc('sine', 780, 390, t + 0.05, 0.16, 0.4); },
    lock: t => { [220, 277, 330].forEach(f => osc('triangle', f, f, t, 0.5, 0.4)); noise(t, 0.06, 0.5, 800, 1); },
    mball: t => { [262, 330, 392, 523, 659, 784].forEach((f, i) => osc('square', f, f, t + i * 0.09, 0.22, 0.3)); },
    jackpot: t => { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => osc('square', f, f, t + i * 0.08, 0.2, 0.35)); noise(t, 0.4, 0.3, 4000, 0.5); },
    extra: t => { [392, 523, 659, 880].forEach((f, i) => osc('triangle', f, f * 1.01, t + i * 0.1, 0.3, 0.45)); },
    warn: t => { osc('square', 110, 110, t, 0.22, 0.55); },
    tilt: t => { osc('square', 82, 40, t, 0.9, 0.6); osc('square', 55, 30, t, 0.9, 0.4); },
    skill: t => { [660, 880, 1100, 1320].forEach((f, i) => osc('sine', f, f, t + i * 0.06, 0.16, 0.4)); },
    click: t => { osc('sine', 700, 500, t, 0.05, 0.3); },
    over: t => { [392, 330, 262, 196].forEach((f, i) => osc('triangle', f, f, t + i * 0.18, 0.35, 0.45)); },
    bonus: t => { osc('sine', 990, 990, t, 0.07, 0.35); },
    plunger: t => { noise(t, 0.05, 0.3, 500, 1); },
  };
  function play(name) { if (!ac || !save.opts.sfx) return; try { FX[name](ac.currentTime); } catch (e) {} }
  /* dreamy pad + arp loop: Am9 / Fmaj7 / Cmaj7 / G6 */
  const CHORDS = [
    [110, 220, 261.6, 329.6, 493.9],
    [87.3, 174.6, 220, 261.6, 329.6],
    [130.8, 261.6, 329.6, 392, 493.9],
    [98, 196, 246.9, 293.7, 392],
  ];
  function schedMusic() {
    if (!ac || !musicOn) return;
    const BAR = 2.4;
    while (nextNote < ac.currentTime + 0.3) {
      const ch = CHORDS[bar % 4], t = nextNote;
      for (let v = 0; v < ch.length; v++) {
        [-6, 6].forEach(det => {
          const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
          o.type = 'sawtooth'; o.frequency.value = ch[v]; o.detune.value = det;
          f.type = 'lowpass'; f.frequency.value = 750; f.Q.value = 0.6;
          g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.045, t + 0.7);
          g.gain.setValueAtTime(0.045, t + BAR - 0.6); g.gain.linearRampToValueAtTime(0.0001, t + BAR);
          o.connect(f); f.connect(g); g.connect(musG); o.start(t); o.stop(t + BAR + 0.05);
        });
      }
      const seq = [4, 2, 3, 4, 2, 3, 4, 3];
      for (let i = 0; i < 8; i++) {
        const f = ch[seq[i] % ch.length] * 2, tt = t + i * BAR / 8;
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.09, tt); g.gain.exponentialRampToValueAtTime(0.001, tt + 0.26);
        o.connect(g); g.connect(musG); o.start(tt); o.stop(tt + 0.3);
      }
      nextNote += BAR; bar++;
    }
  }
  function startMusic() { if (!ac) return; musicOn = true; nextNote = Math.max(nextNote, ac.currentTime + 0.05); if (!musicTimer) musicTimer = setInterval(schedMusic, 90); }
  function stopMusic() { musicOn = false; }
  return { init, play, vol, startMusic, stopMusic };
})();

/* ════════════════════ TABLE GEOMETRY ════════════════════ */
const ARC = { cx: 272, cy: 352, R: 250, Ri: 210 };
const T = { segs: [], gates: [], slings: [], bumpers: [], rollovers: [], targets: [], fins: [] };

function seg(ax, ay, bx, by, o) { const s = Object.assign({ ax, ay, bx, by, e: 0.32, kind: 'wall' }, o || {}); T.segs.push(s); return s; }

(function buildTable() {
  const { cx, cy, R, Ri } = ARC;
  // outer arch 180° → 0°
  let prev = null;
  for (let a = 180; a >= -0.1; a -= 5) {
    const r = a * Math.PI / 180, p = [cx + R * Math.cos(r), cy - R * Math.sin(r)];
    if (prev) seg(prev[0], prev[1], p[0], p[1], { e: 0.4, kind: 'arch' });
    prev = p;
  }
  // side walls
  seg(22, 352, 22, 800);                             // left wall
  seg(22, 800, 158, 940);                            // left outlane funnel
  seg(522, 352, 522, 952);                           // right outer wall (plunger lane)
  seg(482, 952, 522, 952, { e: 0.15 });              // plunger lane floor
  seg(482, 430, 482, 952);                           // plunger lane inner wall
  // inner arch (plunger channel guide) 0° → 55°
  prev = null;
  for (let a = 0; a <= 55.1; a += 5) {
    const r = a * Math.PI / 180, p = [cx + Ri * Math.cos(r), cy - Ri * Math.sin(r)];
    if (prev) seg(prev[0], prev[1], p[0], p[1], { e: 0.4, kind: 'inner' });
    prev = p;
  }
  seg(482, 352, 482, 430);                           // join inner arch base to lane wall
  // right outlane funnel
  seg(482, 800, 346, 940);
  // lane guides (inlane / outlane separators)
  seg(78, 720, 78, 840); seg(78, 840, 168, 908);
  seg(426, 720, 426, 840); seg(426, 840, 336, 908);
  // one-way gate at channel exit (pass moving left, block re-entry)
  T.gates.push({ ax: 392, ay: 180, bx: 389, by: 131 });
  // top rollover lane fins (hang from arch)
  [[140, 140, 205], [190, 116, 196], [240, 105, 196], [290, 103, 196]].forEach(([x, y0, y1]) => {
    T.fins.push(seg(x, y0, x, y1, { e: 0.25, kind: 'fin' }));
  });
  // ramp entrance guides
  seg(150, 420, 150, 540, { kind: 'rampG' });
  seg(190, 420, 190, 540, { kind: 'rampG' });
  // slingshots: [face, back, bottom]
  const slL = { face: seg(112, 776, 176, 868, { kind: 'slingface', e: 0.4 }), cool: 0, flash: 0, side: 0 };
  seg(112, 776, 112, 868); seg(112, 868, 176, 868);
  const slR = { face: seg(392, 776, 328, 868, { kind: 'slingface', e: 0.4 }), cool: 0, flash: 0, side: 1 };
  seg(392, 776, 392, 868); seg(392, 868, 328, 868);
  T.slings.push(slL, slR);
  // pop bumpers
  T.bumpers.push({ x: 170, y: 330, r: 28, cool: 0, flash: 0 });
  T.bumpers.push({ x: 285, y: 285, r: 28, cool: 0, flash: 0 });
  T.bumpers.push({ x: 235, y: 410, r: 28, cool: 0, flash: 0 });
  // rollovers: 3 top lanes (Z Z Z), 2 inlanes, 2 outlanes
  T.rollovers.push({ x: 165, y: 176, r: 13, id: 'z0', cool: 0 });
  T.rollovers.push({ x: 215, y: 176, r: 13, id: 'z1', cool: 0 });
  T.rollovers.push({ x: 265, y: 176, r: 13, id: 'z2', cool: 0 });
  T.rollovers.push({ x: 95, y: 820, r: 12, id: 'inL', cool: 0 });
  T.rollovers.push({ x: 409, y: 820, r: 12, id: 'inR', cool: 0 });
  T.rollovers.push({ x: 50, y: 830, r: 12, id: 'outL', cool: 0 });
  T.rollovers.push({ x: 454, y: 830, r: 12, id: 'outR', cool: 0 });
  // DREAM drop targets on left wall (faces at x=52, hit from the right)
  'DREAM'.split('').forEach((ch, i) => {
    T.targets.push({ x: 52, y0: 460 + i * 36, y1: 488 + i * 36, ch, up: true, flash: 0 });
  });
})();

const SAUCER = { x: 405, y: 310, r: 17, cool: 0 };
const RAMP_PATH = [[170,450],[168,380],[158,310],[155,240],[170,180],[205,140],[255,120],[310,122],[360,140],[400,175],[428,225],[442,285],[448,360],[448,450],[444,540],[432,620],[414,672]];
const RAMP_LEN = (() => { let L = 0; for (let i = 1; i < RAMP_PATH.length; i++) L += Math.hypot(RAMP_PATH[i][0] - RAMP_PATH[i-1][0], RAMP_PATH[i][1] - RAMP_PATH[i-1][1]); return L; })();
function rampPoint(d) {
  let acc = 0;
  for (let i = 1; i < RAMP_PATH.length; i++) {
    const l = Math.hypot(RAMP_PATH[i][0] - RAMP_PATH[i-1][0], RAMP_PATH[i][1] - RAMP_PATH[i-1][1]);
    if (acc + l >= d) { const t = (d - acc) / l; return [lerp(RAMP_PATH[i-1][0], RAMP_PATH[i][0], t), lerp(RAMP_PATH[i-1][1], RAMP_PATH[i][1], t)]; }
    acc += l;
  }
  return RAMP_PATH[RAMP_PATH.length - 1].slice();
}

/* ─── leaderboard ─── */
async function fetchGlobal() {
  if (globalScores && performance.now() - globalFetchedAt < 30000) return;
  try {
    const r = await fetch(LB_URL, { signal: AbortSignal.timeout(5000) });
    globalScores = (await r.json()).slice(0, 10); globalFetchedAt = performance.now();
  } catch (e) { globalScores = globalScores || []; }
}
async function postGlobal(initials, sc, jp) {
  try {
    await fetch(LB_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initials, score: sc, level: jp }) });
    globalFetchedAt = -1e9; fetchGlobal();
  } catch (e) {}
}

/* ════════════════════ BALLS ════════════════════ */
function spawnPlungerBall() {
  const b = { x: 502, y: 938, vx: 0, vy: 0, inPlunger: true, onRamp: null, trail: [] };
  G.balls.push(b); G.plungerBall = b;
  return b;
}
function award(pts, addBonus) {
  if (G.tilted) return;
  G.score += pts;
  if (addBonus) G.bonusUnits += addBonus;
  if (!G.ebScoreGiven && G.score >= 75000000) { G.ebScoreGiven = true; giveExtraBall('75 MILLION!'); }
}
function giveExtraBall(reason) {
  G.extraBalls++; audio.play('extra');
  dmdMsg('EXTRA BALL', reason, 2.2);
}
function firstSwitch(id) {
  if (!G.skillArmed) return;
  G.skillArmed = false;
  if (id === 'z' + G.skillLane) {
    award(G.skillValue, 4); audio.play('skill');
    dmdMsg('SKILL SHOT', fmt(G.skillValue), 2);
    burst(T.rollovers[G.skillLane].x, T.rollovers[G.skillLane].y, '#7df9ff', 26);
    G.skillValue += 500000;
  }
}

/* ════════════════════ SWITCH HANDLERS ════════════════════ */
function hitBumper(bp) {
  const lit = G.bonusX >= 2;
  award(lit ? 100000 : 25000, 1);
  audio.play('bumper'); bp.flash = 1;
  burst(bp.x, bp.y, lit ? '#ff5fa2' : '#7df9ff', 10);
  firstSwitch('bump');
}
function hitSling(sl) {
  award(5050, 1); audio.play('sling'); sl.flash = 1; firstSwitch('sling');
}
function hitRollover(r) {
  firstSwitch(r.id);
  if (r.id[0] === 'z') {
    const i = +r.id[1];
    audio.play('roll');
    if (!G.zLit[i]) { G.zLit[i] = true; award(50000, 2); }

/* ════════════════════ PHYSICS ════════════════════ */
function collideSeg(b, s) {
  const dx = s.bx - s.ax, dy = s.by - s.ay;
  const L2 = dx * dx + dy * dy;
  let t = L2 > 0 ? ((b.x - s.ax) * dx + (b.y - s.ay) * dy) / L2 : 0;
  t = clamp(t, 0, 1);
  const px = s.ax + dx * t, py = s.ay + dy * t;
  let nx = b.x - px, ny = b.y - py;
  const d = Math.hypot(nx, ny);
  if (d >= BALL_R || d === 0) return false;
  nx /= d; ny /= d;
  b.x = px + nx * BALL_R; b.y = py + ny * BALL_R;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    const e = Math.abs(vn) < 90 ? 0.05 : s.e;
    b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
    // tangential friction
    const tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty;
    b.vx -= vt * 0.02 * tx; b.vy -= vt * 0.02 * ty;
  }
  return true;
}
function collideFlipper(b, f, dt) {
  const dirx = Math.cos(f.a), diry = Math.sin(f.a);
  const dx = dirx * f.len, dy = diry * f.len;
  let t = ((b.x - f.px) * dx + (b.y - f.py) * dy) / (f.len * f.len);
  t = clamp(t, 0, 1);
  const px = f.px + dx * t, py = f.py + dy * t;
  const r = lerp(f.r0, f.r1, t) + BALL_R;
  let nx = b.x - px, ny = b.y - py;
  const d = Math.hypot(nx, ny);
  if (d >= r || d === 0) return;
  nx /= d; ny /= d;
  b.x = px + nx * r; b.y = py + ny * r;
  // surface velocity from rotation
  const rx = px - f.px, ry = py - f.py;
  const svx = f.w * -ry, svy = f.w * rx;
  const rvx = b.vx - svx, rvy = b.vy - svy;
  const vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    const moving = Math.abs(f.w) > 1;
    const e = moving ? 0.45 : (Math.abs(vn) < 100 ? 0.04 : 0.28);
    b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
    const tx = -ny, ty = nx, vt = (b.vx - svx) * tx + (b.vy - svy) * ty;
    b.vx -= vt * 0.03 * tx; b.vy -= vt * 0.03 * ty;
  }
}
function physBall(b, dt) {
  if (b.onRamp) {
    b.onRamp.d += b.onRamp.spd * dt;
    const p = rampPoint(b.onRamp.d);
    b.x = p[0]; b.y = p[1];
    if (b.onRamp.d >= RAMP_LEN) { b.onRamp = null; b.vx = 10; b.vy = 240; }
    return;
  }
  b.vy += GRAV * dt;
  const sp = Math.hypot(b.vx, b.vy);
  if (sp > MAXV) { b.vx *= MAXV / sp; b.vy *= MAXV / sp; }
  b.vx *= (1 - 0.02 * dt); b.vy *= (1 - 0.02 * dt);
  b.x += b.vx * dt; b.y += b.vy * dt;

  // walls (2 relaxation passes)
  for (let pass = 0; pass < 2; pass++) {
    for (const s of T.segs) {
      if (s.kind === 'slingface') continue;
      collideSeg(b, s);
    }
  }
  // one-way gates
  for (const g of T.gates) {
    if (b.vx > 0) collideSeg(b, Object.assign({ e: 0.3 }, g));
  }
  // slings
  for (const sl of T.slings) {
    if (collideSeg(b, sl.face) && sl.cool <= 0 && G.state === 'play' && !G.tilted) {
      const s = sl.face;
      let nx = s.by - s.ay, ny = -(s.bx - s.ax);
      const L = Math.hypot(nx, ny); nx /= L; ny /= L;
      if (sl.side === 0) { if (nx < 0) { nx = -nx; ny = -ny; } } else { if (nx > 0) { nx = -nx; ny = -ny; } }
      if (ny > 0) { ny = -Math.abs(ny); }
      b.vx = b.vx * 0.3 + nx * 880; b.vy = b.vy * 0.3 + ny * 880 - 140;
      sl.cool = 0.12; hitSling(sl);
    }
  }
  // bumpers
  for (const bp of T.bumpers) {
    const dx = b.x - bp.x, dy = b.y - bp.y, d = Math.hypot(dx, dy), rr = bp.r + BALL_R;
    if (d < rr && d > 0) {
      const nx = dx / d, ny = dy / d;
      b.x = bp.x + nx * rr; b.y = bp.y + ny * rr;
      const vt = b.vx * -ny + b.vy * nx;
      b.vx = nx * 1050 + -ny * vt * 0.4; b.vy = ny * 1050 + nx * vt * 0.4;

    }
  }
  // drop targets
  for (const tg of T.targets) {
    if (!tg.up) continue;
    if (collideSeg(b, { ax: tg.x, ay: tg.y0, bx: tg.x, by: tg.y1, e: 0.3 })) {
      if (G.state === 'play' && !G.tilted) hitTarget(tg);
    }
  }
  // flippers
  for (const f of flippers) collideFlipper(b, f, dt);
  // rollovers (edge trigger)
  for (const r of T.rollovers) {
    const d = Math.hypot(b.x - r.x, b.y - r.y);
    if (d < r.r + BALL_R * 0.6) {
      if (r.cool <= 0 && G.state === 'play' && !G.tilted) { r.cool = 0.5; hitRollover(r); }
    }
  }
  // ramp sensor
  if (!b.onRamp && b.vy < -380 && b.y < 470 && b.y > 435 && Math.abs(b.x - 170) < 17) enterRamp(b);
  // saucer: catches slow balls, deflects fast ones like a post
  if (!b.onRamp) {
    const dx = b.x - SAUCER.x, dy = b.y - SAUCER.y, d = Math.hypot(dx, dy);
    if (d < SAUCER.r) {
      const sp = Math.hypot(b.vx, b.vy);
      if (SAUCER.cool <= 0 && sp < 520) { enterSaucer(b); return; }
      if (d > 0) {
        const nx = dx / d, ny = dy / d;
        b.x = SAUCER.x + nx * SAUCER.r; b.y = SAUCER.y + ny * SAUCER.r;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= 1.5 * vn * nx; b.vy -= 1.5 * vn * ny; }
      }
    }
  }

}
function removeBall(b) { const i = G.balls.indexOf(b); if (i >= 0) G.balls.splice(i, 1); if (G.plungerBall === b) G.plungerBall = null; }

/* ════════════════════ FLIPPER UPDATE ════════════════════ */
function updateFlippers(dt) {
  for (const f of flippers) {
    const target = (f.pressed && !G.tilted) ? f.upA : f.restA;
    const dir = Math.sign(target - f.a);
    const speed = (f.pressed && !G.tilted) ? 26 : 15;
    if (dir !== 0) {
      const na = f.a + dir * speed * dt;
      if ((dir > 0 && na >= target) || (dir < 0 && na <= target)) { f.w = (target - f.a) / dt; f.a = target; }
      else { f.a = na; f.w = dir * speed; }
    } else f.w = 0;
  }
}

/* ════════════════════ DRAIN / BALL FLOW ════════════════════ */
function drainCheck() {

    const b = G.balls[i];

}
function onDrain() {

    }

}
function endOfBall() {

  // bonus tally

}

function startBall(announce) {

/* ════════════════════ NUDGE / TILT ════════════════════ */
function nudge(dx) {
  if (G.state !== 'play' || G.tilted) return;
  for (const b of G.balls) {
    if (b.onRamp || b.inPlunger) continue;
    b.vx += dx * 120 + rnd(-15, 15);
    b.vy -= 85;
  }
  G.shake = 0.22; G.shakeX = dx;
  G.tiltHeat += 1.15;
  if (G.tiltHeat > 3.2 && !G.tilted) {

    flippers.forEach(f => { f.pressed = false; });
  } else if (G.tiltHeat > 2 && G.tiltWarn < 2) {

/* ════════════════════ PARTICLES ════════════════════ */
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(60, 340);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rnd(0.3, 0.7), t: 0, color, r: rnd(1.2, 3) });
  }
  if (particles.length > 400) particles.splice(0, particles.length - 400);
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt; if (p.t > p.life) { particles.splice(i, 1); continue; }
    p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

/* ════════════════════ UPDATE ════════════════════ */
let lastT = 0, acc = 0;
function update(dt) {
  if (G.state === 'play') {
    G.saveTimer = Math.max(0, G.saveTimer - dt);
    G.mbSaveTimer = Math.max(0, G.mbSaveTimer - dt);
    G.hurry = Math.max(0, G.hurry - dt);
    G.tiltHeat = Math.max(0, G.tiltHeat - 0.45 * dt);
    if (G.autoQueue > 0) {
      G.autoTimer -= dt;
      if (G.autoTimer <= 0 && !G.plungerBall && !G.balls.some(b => b.inPlunger)) {
        G.autoQueue--; G.autoTimer = 1.2;
        spawnPlungerBall();
        setTimeout(() => { if (G.plungerBall && G.state === 'play') launch(rnd(0.82, 0.95)); }, 350);
      }
    }
    // reclaim a ball that fell back down the plunger lane after a weak launch
    if (!G.plungerBall) {
      for (const b of G.balls) {
        if (b.inPlunger && b.y > 925 && Math.abs(b.vy) < 40 && !b.onRamp) { G.plungerBall = b; break; }
      }
    }
    updateFlippers(dt);
    const h = dt / SUB;
    for (let s = 0; s < SUB; s++) {
      for (const b of [...G.balls]) physBall(b, h);
      // ball-ball
      for (let i = 0; i < G.balls.length; i++) for (let j = i + 1; j < G.balls.length; j++) {
        const a = G.balls[i], c = G.balls[j];
        if (a.onRamp || c.onRamp) continue;
        const dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy), rr = BALL_R * 2;
        if (d < rr && d > 0) {
          const nx = dx / d, ny = dy / d, pen = (rr - d) / 2;
          a.x -= nx * pen; a.y -= ny * pen; c.x += nx * pen; c.y += ny * pen;
          const rvn = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
          if (rvn < 0) { const imp = -rvn * 0.95; a.vx -= imp * nx; a.vy -= imp * ny; c.vx += imp * nx; c.vy += imp * ny; }
        }
      }
    }
    drainCheck();
    for (const b of G.balls) { b.trail.push([b.x, b.y]); if (b.trail.length > 9) b.trail.shift(); }
    SAUCER.cool = Math.max(0, SAUCER.cool - dt);
    for (const bp of T.bumpers) { bp.cool -= dt; bp.flash = Math.max(0, bp.flash - 3.5 * dt); }
    for (const sl of T.slings) { sl.cool -= dt; sl.flash = Math.max(0, sl.flash - 4 * dt); }
    for (const r of T.rollovers) r.cool -= dt;
    for (const tg of T.targets) tg.flash = Math.max(0, tg.flash - 3 * dt);
    // plunger pull physics: ball follows plunger tip
    if (G.plungerBall && G.plungerPull > 0) {
      G.plungerBall.y = Math.max(G.plungerBall.y, 938);
    }
  } else if (G.state === 'bonus') {
    const A = G.bonusAnim;
    A.t += dt;
    const dur = 2.0;
    const k = clamp(A.t / dur, 0, 1);
    const val = Math.round(A.total * k);
    if (!G.tilted) { G.score += val - A.given; A.given = val; }
    if (A.t > 0.25 && ((A.t * 9) | 0) !== (((A.t - dt) * 9) | 0)) audio.play('bonus');
    if (A.t > dur + 0.9) { G.bonusAnim = null; nextBallOrOver(); }
  }
  G.msgT = Math.max(0, G.msgT - dt);
  if (G.msgT <= 0) G.msg = null;
  G.shake = Math.max(0, G.shake - dt);
  G.kickerAnim = Math.max(0, G.kickerAnim - dt);
  G.attractT += dt;
  updateParticles(dt);
}

/* ════════════════════ RENDER ════════════════════ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let DPR = 1, scale = 1, ox = 0, oy = 0;
let staticLayer = null;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(innerWidth * DPR);
  canvas.height = Math.round(innerHeight * DPR);
  scale = Math.min(innerWidth / VW, innerHeight / VH);
  ox = (innerWidth - VW * scale) / 2;
  oy = (innerHeight - VH * scale) / 2;
  renderStatic();
}
window.addEventListener('resize', resize);

function pfPath(g) {
  // playfield outline for clip: arch + walls
  g.beginPath();
  g.moveTo(22, VH);
  g.lineTo(22, 352);
  for (let a = 180; a >= 0; a -= 6) {
    const r = a * Math.PI / 180;
    g.lineTo(ARC.cx + ARC.R * Math.cos(r), ARC.cy - ARC.R * Math.sin(r));
  }
  g.lineTo(522, VH);
  g.closePath();
}
function neonStroke(g, w1, c1, w2, c2) {
  g.lineCap = 'round'; g.lineJoin = 'round';

  g.strokeStyle = c2; g.lineWidth = w2; g.stroke();
}
function renderStatic() {

  staticLayer.width = canvas.width; staticLayer.height = canvas.height;
  const g = staticLayer.getContext('2d');
  g.setTransform(scale * DPR, 0, 0, scale * DPR, ox * DPR, oy * DPR);
  // cabinet backdrop

  g.strokeStyle = 'rgba(125,249,255,0.10)'; g.lineWidth = 30; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
  g.strokeStyle = 'rgba(125,249,255,0.5)'; g.lineWidth = 2;
  g.beginPath();
  for (let d = 0; d <= RAMP_LEN; d += 8) { const p = rampPoint(d), q = rampPoint(Math.min(RAMP_LEN, d + 4)); const dx = q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy)||1; const nx=-dy/L*15, ny=dx/L*15; if(d===0) g.moveTo(p[0]+nx,p[1]+ny); else g.lineTo(p[0]+nx,p[1]+ny); }
  g.stroke();
  g.beginPath();
  for (let d = 0; d <= RAMP_LEN; d += 8) { const p = rampPoint(d), q = rampPoint(Math.min(RAMP_LEN, d + 4)); const dx = q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy)||1; const nx=dy/L*15, ny=-dx/L*15; if(d===0) g.moveTo(p[0]+nx,p[1]+ny); else g.lineTo(p[0]+nx,p[1]+ny); }

/* ─── DMD ─── */
const dmd = document.createElement('canvas');
const DMDW = 148, DMDH = 30, DOT = 4;
dmd.width = DMDW * DOT; dmd.height = DMDH * DOT;
const dg = dmd.getContext('2d');
let dmdCache = '';
function dmdText(str, x, y, sc, color) {
  str = String(str).toUpperCase();
  for (const ch of str) {
    const gl = FONT[ch] || FONT['?'];
    for (let r = 0; r < 7; r++) {
      const row = gl[r];
      for (let c = 0; c < 5; c++) {
        if (row & (16 >> c)) {
          dg.fillStyle = color;
          dg.fillRect((x + c * sc) * DOT + 0.5, (y + r * sc) * DOT + 0.5, sc * DOT - 1.4, sc * DOT - 1.4);
        }
      }
    }
    x += 6 * sc;
  }
}
function dmdWidth(str, sc) { return String(str).length * 6 * sc - sc; }
function renderDMD() {
  let l1, l2, flash = false;
  if (G.state === 'play' || G.state === 'bonus' || G.state === 'paused') {
    if (G.state === 'bonus' && G.bonusAnim) {
      const A = G.bonusAnim;
      l1 = fmt(Math.round(A.total * clamp(A.t / 2.0, 0, 1)));
      l2 = 'BONUS ' + fmt(A.bonus) + ' X' + A.x;
    } else if (G.msg) { l1 = G.msg; l2 = G.msg2 || fmt(G.score); flash = true; }
    else {
      l1 = fmt(G.score);
      l2 = 'BALL ' + G.ball + '  X' + G.bonusX + (G.multiball ? '  MULTIBALL' : (G.saveTimer > 0 ? '  SAVE ' + Math.ceil(G.saveTimer) : ''));
      if (G.state === 'paused') { l1 = 'PAUSED'; l2 = fmt(G.score); }
    }
  } else if (G.state === 'title') {
    const alt = (G.attractT % 6) < 3;
    l1 = alt ? 'PINBALL DREAMS' : fmt(save.hi);
    l2 = alt ? 'PRESS ENTER / TAP' : 'HIGH SCORE';
  } else if (G.state === 'hsentry') {
    l1 = G.hsInitials; l2 = 'ENTER INITIALS'; flash = true;
  } else if (G.state === 'over') {
    const alt = (G.attractT % 4) < 2;
    l1 = alt ? 'GAME OVER' : fmt(G.score);
    l2 = alt ? '' : 'FINAL SCORE';
  } else { l1 = 'PINBALL DREAMS'; l2 = ''; }
  const key = l1 + '|' + l2 + '|' + G.state + '|' + (flash ? ((G.attractT * 4) | 0) % 2 : 'x') + '|' + (G.state === 'hsentry' ? G.hsPos + ((G.attractT * 3 | 0) % 2) : '');
  if (key === dmdCache) return; dmdCache = key;
  dg.fillStyle = '#0a0510'; dg.fillRect(0, 0, dmd.width, dmd.height);
  // unlit dot grid
  dg.fillStyle = 'rgba(120,70,140,0.13)';
  for (let y = 0; y < DMDH; y++) for (let x = 0; x < DMDW; x++) dg.fillRect(x * DOT + 1, y * DOT + 1, DOT - 2, DOT - 2);
  const hot = flash && (((G.attractT * 4) | 0) % 2) ? '#ffe14d' : '#ff9d3a';
  let s1 = 2, w1 = dmdWidth(l1, 2);
  if (w1 > DMDW) { s1 = 1; w1 = dmdWidth(l1, 1); }
  dmdText(l1, Math.max(0, (DMDW - w1) >> 1), s1 === 2 ? 2 : 6, s1, hot);
  if (G.state === 'hsentry') {
    // underline current position
    const x0 = ((DMDW - w1) >> 1) + G.hsPos * 12;
    if (((G.attractT * 3) | 0) % 2) { dg.fillStyle = '#ffe14d'; dg.fillRect(x0 * DOT, 17 * DOT, 10 * DOT, DOT * 1.2); }
  }
  if (l2) {
    const w2 = dmdWidth(l2, 1);
    dmdText(l2, Math.max(0, (DMDW - w2) >> 1), 21, 1, '#c46a2a');
  }
}

/* ─── lamps ─── */
function drawLamp(g, x, y, r, color, on, pulse) {
  const a = on ? (pulse ? 0.55 + 0.45 * Math.sin(G.attractT * 7 + x) : 0.9) : 0.13;
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.globalAlpha = a;
  g.fillStyle = color;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  if (on) {
    g.globalAlpha = a * 0.4;
    g.beginPath(); g.arc(x, y, r * 2.4, 0, TAU); g.fill();
  }
  g.restore();
  g.globalAlpha = 1;
}
function drawFlipper(g, f) {
  const dirx = Math.cos(f.a), diry = Math.sin(f.a);
  const tx = f.px + dirx * f.len, ty = f.py + diry * f.len;
  g.save();
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(f.px, f.py); g.lineTo(tx, ty);
  g.strokeStyle = 'rgba(125,249,255,0.35)'; g.lineWidth = (f.r0 + 4) * 2; g.stroke();
  const grd = g.createLinearGradient(f.px, f.py - 10, f.px, f.py + 10);
  grd.addColorStop(0, '#e8f6ff'); grd.addColorStop(0.5, '#9fb8de'); grd.addColorStop(1, '#5a6e96');
  g.beginPath(); g.moveTo(f.px, f.py); g.lineTo(tx, ty);
  g.strokeStyle = grd; g.lineWidth = f.r0 * 2 - 2; g.stroke();
  g.beginPath(); g.moveTo(f.px, f.py); g.lineTo(tx, ty);
  g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 3; g.stroke();
  g.fillStyle = '#30407a';
  g.beginPath(); g.arc(f.px, f.py, 5, 0, TAU); g.fill();
  g.restore();
}
function drawBall(g, b, elevated) {
  // trail
  if (!elevated) for (let i = 0; i < b.trail.length; i++) {
    const t = i / b.trail.length;
    g.globalAlpha = t * 0.22;
    g.fillStyle = '#9fd0ff';
    g.beginPath(); g.arc(b.trail[i][0], b.trail[i][1], BALL_R * t * 0.9, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  const r = elevated ? BALL_R * 1.18 : BALL_R;
  if (elevated) {
    g.fillStyle = 'rgba(0,0,0,0.45)';
    g.beginPath(); g.ellipse(b.x + 6, b.y + 10, r * 0.9, r * 0.5, 0, 0, TAU); g.fill();
  }
  const grd = g.createRadialGradient(b.x - r * 0.35, b.y - r * 0.35, r * 0.1, b.x, b.y, r);
  grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.35, '#dceaff'); grd.addColorStop(0.8, '#8496b8'); grd.addColorStop(1, '#4a5878');
  g.fillStyle = grd;
  g.beginPath(); g.arc(b.x, b.y, r, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.9)';
  g.beginPath(); g.arc(b.x - r * 0.35, b.y - r * 0.4, r * 0.22, 0, TAU); g.fill();
}

function render() {
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, canvas.width, canvas.height);
  let shx = 0, shy = 0;
  if (G.shake > 0) { shx = G.shakeX * G.shake * 26 * Math.sin(G.shake * 55); shy = -G.shake * 18 * Math.sin(G.shake * 70); }
  g.setTransform(scale * DPR, 0, 0, scale * DPR, (ox + shx) * DPR, (oy + shy) * DPR);
  // static
  g.setTransform(DPR, 0, 0, DPR, shx * DPR, shy * DPR);
  g.drawImage(staticLayer, 0, 0, canvas.width, canvas.height, 0, 0, innerWidth, innerHeight);
  g.setTransform(scale * DPR, 0, 0, scale * DPR, (ox + shx) * DPR, (oy + shy) * DPR);

  /* lamps + dynamic table */
  const pulse = true;
  // top lane Z lamps + skill flash
  for (let i = 0; i < 3; i++) {
    const r = T.rollovers[i];
    const skill = G.state === 'play' && G.skillArmed && G.skillLane === i && (((G.attractT * 5) | 0) % 2 === 0);
    drawLamp(g, r.x, r.y, 8, skill ? '#ffe14d' : '#7df9ff', G.zLit[i] || skill, pulse);
    g.fillStyle = G.zLit[i] ? '#e5ffff' : 'rgba(125,249,255,0.55)';
    g.font = '700 13px "Courier New",monospace'; g.textAlign = 'center';
    g.fillText('Z', r.x, r.y - 14);
  }
  // inlane/outlane lamps
  drawLamp(g, 95, 820, 6, '#7df9ff', G.hurry > 0, pulse);
  drawLamp(g, 409, 820, 6, '#7df9ff', G.hurry > 0, pulse);
  // DREAM targets
  for (const tg of T.targets) {
    const cy = (tg.y0 + tg.y1) / 2;
    if (tg.up) {
      g.fillStyle = '#c792ff';
      g.fillRect(tg.x - 4, tg.y0, 5, tg.y1 - tg.y0);
      g.fillStyle = 'rgba(199,146,255,0.35)';
      g.fillRect(tg.x - 7, tg.y0, 3, tg.y1 - tg.y0);
    }
    if (tg.flash > 0) { g.globalAlpha = tg.flash; g.fillStyle = '#fff'; g.fillRect(tg.x - 6, tg.y0 - 2, 9, tg.y1 - tg.y0 + 4); g.globalAlpha = 1; }
    g.fillStyle = tg.up ? 'rgba(199,146,255,0.9)' : 'rgba(199,146,255,0.28)';
    g.font = '700 12px "Courier New",monospace'; g.textAlign = 'left';
    g.fillText(tg.ch, tg.x + 8, cy + 4);
  }
  // lock / EB lamps at saucer
  drawLamp(g, SAUCER.x - 26, SAUCER.y - 24, 6, '#ffd23a', G.lockLit, pulse);
  g.fillStyle = G.lockLit ? '#ffe9a0' : 'rgba(255,210,60,0.4)';
  g.font = '700 9px "Courier New",monospace'; g.textAlign = 'center';
  g.fillText('LOCK', SAUCER.x - 26, SAUCER.y - 36);
  drawLamp(g, SAUCER.x + 24, SAUCER.y - 24, 6, '#5dff8f', G.ebLit, pulse);
  g.fillStyle = G.ebLit ? '#c9ffdc' : 'rgba(93,255,143,0.4)';
  g.fillText('EB', SAUCER.x + 24, SAUCER.y - 36);
  // kicker anim
  if (G.kickerAnim > 0) {
    g.globalAlpha = G.kickerAnim;
    g.strokeStyle = '#c792ff'; g.lineWidth = 3;
    g.beginPath(); g.arc(SAUCER.x, SAUCER.y, SAUCER.r + 8 * (1 - G.kickerAnim), 0, TAU); g.stroke();
    g.globalAlpha = 1;
  }
  // ramp arrow lamp
  const rampHot = G.multiball && G.jackpotLit;
  const rampOn = rampHot || G.hurry > 0;
  g.save();
  g.translate(170, 508);
  g.globalAlpha = rampOn ? 0.6 + 0.4 * Math.sin(G.attractT * 8) : 0.3;
  g.fillStyle = rampHot ? '#ffd23a' : '#7df9ff';
  g.beginPath(); g.moveTo(0, -16); g.lineTo(11, 4); g.lineTo(4, 4); g.lineTo(4, 16); g.lineTo(-4, 16); g.lineTo(-4, 4); g.lineTo(-11, 4); g.closePath(); g.fill();
  g.globalAlpha = 1;
  g.restore();
  // bumper flashes
  for (const bp of T.bumpers) {
    if (bp.flash > 0) {
      g.globalAlpha = bp.flash;
      g.fillStyle = '#7df9ff';
      g.beginPath(); g.arc(bp.x, bp.y, bp.r * (1 + (1 - bp.flash) * 0.4), 0, TAU); g.fill();
      g.globalAlpha = 1;
    }
    g.fillStyle = G.bonusX >= 2 ? 'rgba(255,255,255,0.95)' : 'rgba(200,220,255,0.7)';
    g.font = '700 11px "Courier New",monospace'; g.textAlign = 'center';
    g.fillText(G.bonusX >= 2 ? '100K' : '25K', bp.x, bp.y + 4);
  }
  // sling flashes
  for (const sl of T.slings) {
    if (sl.flash > 0) {
      g.globalAlpha = sl.flash * 0.85;
      g.fillStyle = '#ff5fa2';
      g.beginPath();
      if (sl.side === 0) { g.moveTo(112, 776); g.lineTo(176, 868); g.lineTo(112, 868); }
      else { g.moveTo(392, 776); g.lineTo(328, 868); g.lineTo(392, 868); }
      g.closePath(); g.fill();
      g.globalAlpha = 1;
    }
  }
  // multiplier lamps
  const XS = [2, 3, 4, 6, 8];
  for (let i = 0; i < 5; i++) {
    const x = 202 + i * 25;
    drawLamp(g, x, 748, 5, '#ff9d3a', G.bonusX >= XS[i], false);
    g.fillStyle = G.bonusX >= XS[i] ? '#ffd9a8' : 'rgba(255,157,58,0.4)';
    g.font = '700 9px "Courier New",monospace'; g.textAlign = 'center';
    g.fillText(XS[i] + 'X', x, 764);
  }
  // ball save lamp
  if (G.state === 'play' && (G.saveTimer > 0 || G.mbSaveTimer > 0)) {
    drawLamp(g, 252, 930, 7, '#5dff8f', true, true);
    g.fillStyle = '#c9ffdc'; g.font = '700 9px "Courier New",monospace'; g.textAlign = 'center';
    g.fillText('SAVE', 252, 916);
  }
  // locked ball indicators
  for (let i = 0; i < G.locked; i++) {
    g.fillStyle = '#9fd0ff';
    g.beginPath(); g.arc(SAUCER.x - 8 + i * 16, SAUCER.y + 34, 5, 0, TAU); g.fill();
  }
  // flippers
  for (const f of flippers) drawFlipper(g, f);
  // plunger
  const pl = G.plungerPull;
  g.fillStyle = '#30407a';
  g.fillRect(494, 952 + pl * 26, 16, 40);
  g.fillStyle = '#8ba7ff';
  g.fillRect(496, 948 + pl * 26, 12, 6);
  // balls
  for (const b of G.balls) drawBall(g, b, !!b.onRamp);
  // particles
  g.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    g.globalAlpha = 1 - p.t / p.life;
    g.fillStyle = p.color;
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  // tilt overlay
  if (G.tilted) {
    g.fillStyle = 'rgba(120,10,20,0.18)';
    pfPath(g); g.fill();
  }
  // DMD
  renderDMD();
  g.imageSmoothingEnabled = true;
  g.drawImage(dmd, 60, 8, 440, 88);

  /* screens */
  if (G.state === 'title') drawTitle(g);
  else if (G.state === 'help') drawHelp(g);
  else if (G.state === 'scores') drawScores(g);
  else if (G.state === 'over' || G.state === 'hsentry') drawOver(g);
  else if (G.state === 'paused') drawPaused(g);
  else if (G.state === 'play' && G.plungerBall && G.gameStarted) {
    g.fillStyle = 'rgba(160,190,255,' + (0.5 + 0.3 * Math.sin(G.attractT * 4)) + ')';
    g.font = '700 13px "Courier New",monospace'; g.textAlign = 'center';
    g.fillText(isTouch ? 'HOLD & DRAG DOWN TO LAUNCH' : 'HOLD DOWN/SPACE - RELEASE TO LAUNCH', 252, 560);
  }
}
function dim(g, a) { g.fillStyle = 'rgba(3,3,12,' + a + ')'; g.fillRect(-60, -60, VW + 120, VH + 120); }
function neonText(g, txt, x, y, size, c1, c2) {
  g.font = '700 ' + size + 'px "Courier New",monospace';
  g.textAlign = 'center';
  g.fillStyle = c2; g.globalAlpha = 0.35;
  g.fillText(txt, x, y + 2);
  g.fillText(txt, x + 2, y);
  g.globalAlpha = 1;
  g.fillStyle = c1;
  g.fillText(txt, x, y);
}
let menuZones = [];
function drawMenu(g, items, y0, sel) {
  menuZones = [];
  items.forEach((it, i) => {
    const y = y0 + i * 46;
    const on = i === sel;
    if (on) {
      g.fillStyle = 'rgba(125,249,255,0.10)';
      g.fillRect(120, y - 25, 264, 36);
      g.strokeStyle = 'rgba(125,249,255,0.5)'; g.lineWidth = 1;
      g.strokeRect(120, y - 25, 264, 36);
    }
    g.font = '700 19px "Courier New",monospace'; g.textAlign = 'center';
    g.fillStyle = on ? '#e8fdff' : 'rgba(160,190,255,0.75)';
    g.fillText((on ? '▸ ' : '') + it + (on ? ' ◂' : ''), 252, y);
    menuZones.push({ x: 100, y: y - 27, w: 304, h: 40, i });
  });
}
function drawTitle(g) {
  dim(g, 0.72);
  const t = G.attractT;
  g.save();
  g.translate(252, 250);
  g.rotate(Math.sin(t * 0.7) * 0.02);
  neonText(g, 'PINBALL', 0, 0, 58, '#7df9ff', '#1c9aa8');
  neonText(g, 'DREAMS', 0, 62, 58, '#ff5fa2', '#a82464');
  g.restore();
  g.fillStyle = 'rgba(200,220,255,0.6)';
  g.font = '13px "Courier New",monospace'; g.textAlign = 'center';
  g.fillText('a love letter to the 1992 Amiga classic', 252, 348);
  drawMenu(g, ['PLAY', 'HIGH SCORES', 'HOW TO PLAY',
    'SOUND: ' + (save.opts.sfx ? 'ON' : 'OFF'), 'MUSIC: ' + (save.opts.music ? 'ON' : 'OFF')], 430, G.menuSel);
  g.fillStyle = 'rgba(160,190,255,0.5)';
  g.font = '12px "Courier New",monospace';
  g.fillText(isTouch ? 'tap to choose' : '↑↓ + ENTER  ·  flippers also work', 252, 680);
  g.fillStyle = 'rgba(120,140,200,0.45)';
  g.fillText('v' + VERSION, 252, 706);
  // glinting ball
  const bx = 252 + Math.sin(t * 0.9) * 150, by = 760 + Math.cos(t * 1.3) * 30;
  drawBall(g, { x: bx, y: by, trail: [] }, false);
}
function drawHelp(g) {
  dim(g, 0.85);
  neonText(g, 'HOW TO PLAY', 252, 150, 30, '#7df9ff', '#1c9aa8');
  const L = [
    ['FLIP', isTouch ? 'touch left / right half' : 'SHIFT keys, Z / ?, or ← →'],
    ['PLUNGER', isTouch ? 'drag down, release' : 'hold ↓ or SPACE, release'],
    ['NUDGE', isTouch ? 'swipe up (careful: TILT!)' : 'A / L / ↑  (careful: TILT!)'],
    ['', ''],
    ['ZZZ LANES', 'roll all 3 to raise BONUS X'],
    ['DREAM', 'drop all 5 targets to light LOCK'],
    ['CLOUD', 'lock 2 balls for MULTIBALL'],
    ['JACKPOT', 'shoot the ramp in multiball'],
    ['RAMP', '4 ramps light EXTRA BALL'],
    ['INLANES', 'HURRY UP: ramp scores 2X'],
    ['SKILL SHOT', 'launch into the flashing lane'],
    ['BONUS', 'everything counts at ball end'],
  ];
  g.textAlign = 'left'; g.font = '700 15px "Courier New",monospace';
  L.forEach((row, i) => {
    const y = 210 + i * 34;
    g.fillStyle = '#ff9dc8'; g.fillText(row[0], 92, y);
    g.fillStyle = 'rgba(200,220,255,0.85)'; g.fillText(row[1], 218, y);
  });
  g.textAlign = 'center';
  g.fillStyle = 'rgba(160,190,255,0.6)'; g.font = '13px "Courier New",monospace';
  g.fillText('press any key / tap to go back', 252, 680);
}
function drawScores(g) {
  dim(g, 0.85);
  neonText(g, 'HIGH SCORES', 252, 140, 30, '#ffd23a', '#8a6a10');
  g.font = '700 15px "Courier New",monospace';
  g.textAlign = 'center';
  g.fillStyle = '#7df9ff'; g.fillText('— LOCAL —', 252, 185);
  g.textAlign = 'left';
  const loc = save.scores.slice(0, 5);
  if (!loc.length) { g.fillStyle = 'rgba(200,220,255,0.5)'; g.fillText('no dreams recorded yet', 170, 220); }
  loc.forEach((s, i) => {
    const y = 218 + i * 30;
    g.fillStyle = 'rgba(200,220,255,0.9)';
    g.fillText((i + 1) + '. ' + s.initials, 150, y);
    g.textAlign = 'right'; g.fillText(fmt(s.score), 410, y); g.textAlign = 'left';
  });
  g.textAlign = 'center';
  g.fillStyle = '#ff5fa2'; g.fillText('— GLOBAL —', 252, 400);
  g.textAlign = 'left';
  if (!globalScores) { g.fillStyle = 'rgba(200,220,255,0.5)'; g.fillText('fetching…', 200, 435); }
  else if (!globalScores.length) { g.fillStyle = 'rgba(200,220,255,0.5)'; g.fillText('be the first dreamer', 180, 435); }
  else globalScores.slice(0, 8).forEach((s, i) => {
    const y = 433 + i * 28;
    g.fillStyle = 'rgba(255,200,220,0.9)';
    g.fillText((i + 1) + '. ' + (s.initials || '???'), 150, y);
    g.textAlign = 'right'; g.fillText(fmt(s.score || 0), 410, y); g.textAlign = 'left';
  });
  g.textAlign = 'center';
  g.fillStyle = 'rgba(160,190,255,0.6)'; g.font = '13px "Courier New",monospace';
  g.fillText('press any key / tap to go back', 252, 690);
}
function drawOver(g) {
  dim(g, 0.6);
  neonText(g, 'GAME OVER', 252, 260, 40, '#ff5fa2', '#a82464');
  g.fillStyle = '#e8fdff'; g.font = '700 26px "Courier New",monospace'; g.textAlign = 'center';
  g.fillText(fmt(G.score), 252, 320);
  if (G.state === 'hsentry') {
    g.fillStyle = '#ffd23a'; g.font = '700 20px "Courier New",monospace';
    g.fillText('NEW HIGH SCORE!', 252, 380);
    for (let i = 0; i < 3; i++) {
      const x = 200 + i * 52, on = i === G.hsPos;
      g.fillStyle = on ? 'rgba(125,249,255,0.15)' : 'rgba(60,70,120,0.3)';
      g.fillRect(x - 20, 400, 40, 52);
      g.strokeStyle = on ? '#7df9ff' : '#3a4a8a'; g.lineWidth = 2;
      g.strokeRect(x - 20, 400, 40, 52);
      g.fillStyle = on ? '#fff' : '#9fb8de'; g.font = '700 30px "Courier New",monospace';
      g.fillText(G.hsInitials[i], x, 438);
    }
    g.fillStyle = 'rgba(160,190,255,0.7)'; g.font = '13px "Courier New",monospace';
    g.fillText(isTouch ? 'flip halves = change · tap here = next' : 'flippers/arrows change · ENTER confirms', 252, 490);
    menuZones = [{ x: 150, y: 390, w: 204, h: 110, i: -2 }];
  } else {
    if (G.jackpots > 0) { g.fillStyle = '#ffd23a'; g.font = '700 15px "Courier New",monospace'; g.fillText(G.jackpots + ' JACKPOT' + (G.jackpots === 1 ? '' : 'S'), 252, 360); }
    g.fillStyle = 'rgba(200,220,255,' + (0.5 + 0.35 * Math.sin(G.attractT * 4)) + ')';
    g.font = '700 17px "Courier New",monospace';
    g.fillText(isTouch ? 'TAP TO DREAM AGAIN' : 'PRESS ENTER TO DREAM AGAIN', 252, 430);
    g.fillStyle = 'rgba(160,190,255,0.6)'; g.font = '13px "Courier New",monospace';
    g.fillText(isTouch ? 'long-press for menu' : 'ESC for menu', 252, 464);
  }
}
function drawPaused(g) {
  dim(g, 0.55);
  neonText(g, 'PAUSED', 252, 400, 40, '#7df9ff', '#1c9aa8');
  drawMenu(g, ['RESUME', 'RESTART', 'QUIT TO MENU'], 470, G.menuSel);
}

/* ════════════════════ INPUT ════════════════════ */
let isTouch = false;
const held = { l: false, r: false, plunge: false };
function setFlipper(side, down) {
  const f = flippers[side];
  if (down && !f.pressed && G.state === 'play' && !G.tilted) {
    audio.play('flip');
    // lane change
    if (G.state === 'play') {
      const z = G.zLit;
      if (side === 0) G.zLit = [z[1], z[2], z[0]];
      else G.zLit = [z[2], z[0], z[1]];
    }
  } else if (!down && f.pressed) audio.play('flipUp');
  f.pressed = down;
}
function menuMove(d, items) { G.menuSel = (G.menuSel + d + items) % items; audio.play('click'); }
function menuAction() {
  audio.init();
  if (G.state === 'title') {
    audio.play('click');
    if (G.menuSel === 0) startGame();
    else if (G.menuSel === 1) { G.state = 'scores'; fetchGlobal(); }
    else if (G.menuSel === 2) G.state = 'help';
    else if (G.menuSel === 3) { save.opts.sfx ^= 1; persist(); audio.vol(); }
    else if (G.menuSel === 4) { save.opts.music ^= 1; persist(); audio.vol(); if (save.opts.music) audio.startMusic(); else audio.stopMusic(); }
  } else if (G.state === 'paused') {
    audio.play('click');
    if (G.menuSel === 0) G.state = 'play';
    else if (G.menuSel === 1) startGame();
    else { G.state = 'title'; G.menuSel = 0; audio.stopMusic(); }
  }
}
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const c = e.code;
  audio.init();
  if (G.state === 'title' || G.state === 'paused') {
    const n = G.state === 'title' ? 5 : 3;
    if (c === 'ArrowUp' || c === 'ShiftLeft' || c === 'KeyZ' || c === 'ArrowLeft') menuMove(-1, n);
    else if (c === 'ArrowDown' || c === 'ShiftRight' || c === 'Slash' || c === 'ArrowRight') menuMove(1, n);
    else if (c === 'Enter' || c === 'Space') menuAction();
    else if (c === 'Escape' && G.state === 'paused') G.state = 'play';
    e.preventDefault(); return;
  }
  if (G.state === 'help' || G.state === 'scores') { G.state = 'title'; audio.play('click'); e.preventDefault(); return; }
  if (G.state === 'hsentry') {
    if (/^Key[A-Z]$/.test(c)) {
      const ch = c[3];
      G.hsInitials = G.hsInitials.substring(0, G.hsPos) + ch + G.hsInitials.substring(G.hsPos + 1);
      G.hsPos = Math.min(2, G.hsPos + 1);
    } else if (c === 'ArrowUp' || c === 'ShiftLeft') {
      const ch = G.hsInitials.charCodeAt(G.hsPos);
      G.hsInitials = G.hsInitials.substring(0, G.hsPos) + String.fromCharCode(ch >= 90 ? 65 : ch + 1) + G.hsInitials.substring(G.hsPos + 1);
    } else if (c === 'ArrowDown' || c === 'ShiftRight' || c === 'Slash') {
      const ch = G.hsInitials.charCodeAt(G.hsPos);
      G.hsInitials = G.hsInitials.substring(0, G.hsPos) + String.fromCharCode(ch <= 65 ? 90 : ch - 1) + G.hsInitials.substring(G.hsPos + 1);
    } else if (c === 'ArrowRight') G.hsPos = Math.min(2, G.hsPos + 1);
    else if (c === 'ArrowLeft') G.hsPos = Math.max(0, G.hsPos - 1);
    else if (c === 'Enter' || c === 'Space') { if (G.hsPos >= 2) commitInitials(); else G.hsPos++; }
    else if (c === 'Backspace') G.hsPos = Math.max(0, G.hsPos - 1);
    audio.play('click');
    e.preventDefault(); return;
  }
  if (G.state === 'over') {
    if (c === 'Enter' || c === 'Space') startGame();
    else if (c === 'Escape') { G.state = 'title'; G.menuSel = 0; audio.stopMusic(); }
    e.preventDefault(); return;
  }
  if (G.state === 'bonus') {
    if (c === 'Enter' || c === 'Space' || c === 'ShiftLeft' || c === 'ShiftRight') {
      const A = G.bonusAnim;
      if (A && A.t < 2.0) { if (!G.tilted) G.score += A.total - A.given; A.given = A.total; A.t = 2.0; }
    }
    e.preventDefault(); return;
  }
  // play
  if (c === 'ShiftLeft' || c === 'KeyZ' || c === 'ArrowLeft') { held.l = true; setFlipper(0, true); }
  else if (c === 'ShiftRight' || c === 'Slash' || c === 'ArrowRight') { held.r = true; setFlipper(1, true); }
  else if (c === 'ArrowDown' || c === 'Space') { held.plunge = true; if (G.plungerBall) audio.play('plunger'); }
  else if (c === 'KeyA') nudge(1);
  else if (c === 'KeyL' || c === 'Quote') nudge(-1);
  else if (c === 'ArrowUp' || c === 'KeyW') nudge(rnd(-0.3, 0.3));
  else if (c === 'Escape' || c === 'KeyP') { G.state = 'paused'; G.menuSel = 0; }
  e.preventDefault();
});
window.addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'ShiftLeft' || c === 'KeyZ' || c === 'ArrowLeft') { held.l = false; setFlipper(0, false); }
  else if (c === 'ShiftRight' || c === 'Slash' || c === 'ArrowRight') { held.r = false; setFlipper(1, false); }
  else if (c === 'ArrowDown' || c === 'Space') {
    held.plunge = false;
    if (G.state === 'play' && G.plungerBall && G.plungerPull > 0.04) launch(G.plungerPull);
    G.plungerPull = 0;
  }
});

/* pointer */
const touches = new Map();
function toV(e) { return [(e.clientX - ox) / scale, (e.clientY - oy) / scale]; }
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  audio.init();
  if (e.pointerType !== 'mouse') isTouch = true;
  const [vx, vy] = toV(e);
  if (G.state === 'title' || G.state === 'paused') {
    for (const z of menuZones) if (vx >= z.x && vx <= z.x + z.w && vy >= z.y && vy <= z.y + z.h) { G.menuSel = z.i; menuAction(); return; }
    return;
  }
  if (G.state === 'help' || G.state === 'scores') { G.state = 'title'; audio.play('click'); return; }
  if (G.state === 'over') { startGame(); return; }
  if (G.state === 'hsentry') {
    if (vy > 390 && vy < 500) { if (G.hsPos >= 2) commitInitials(); else G.hsPos++; audio.play('click'); }
    else if (vx < VW / 2) {
      const ch = G.hsInitials.charCodeAt(G.hsPos);
      G.hsInitials = G.hsInitials.substring(0, G.hsPos) + String.fromCharCode(ch >= 90 ? 65 : ch + 1) + G.hsInitials.substring(G.hsPos + 1);
    } else {
      const ch = G.hsInitials.charCodeAt(G.hsPos);
      G.hsInitials = G.hsInitials.substring(0, G.hsPos) + String.fromCharCode(ch <= 65 ? 90 : ch - 1) + G.hsInitials.substring(G.hsPos + 1);
    }
    return;
  }
  if (G.state === 'bonus') {
    const A = G.bonusAnim;
    if (A && A.t < 2.0) { if (!G.tilted) G.score += A.total - A.given; A.given = A.total; A.t = 2.0; }
    return;
  }
  if (G.state !== 'play') return;
  // pause button (top-right corner)
  if (vx > VW - 50 && vy < 50) { G.state = 'paused'; G.menuSel = 0; return; }
  const t = { x0: e.clientX, y0: e.clientY, t0: performance.now(), side: vx < VW / 2 ? 0 : 1, plunging: false, flipped: false };
  // plunger: if ball waiting, touches on right lane area (or anywhere lower-right) start a pull
  if (G.plungerBall && vx > VW * 0.55) { t.plunging = true; audio.play('plunger'); }
  else { setFlipper(t.side, true); t.flipped = true; }
  touches.set(e.pointerId, t);
});
canvas.addEventListener('pointermove', e => {
  const t = touches.get(e.pointerId);
  if (!t) return;
  if (t.plunging) {
    G.plungerPull = clamp((e.clientY - t.y0) / (160 * scale), 0, 1);
  } else if (!t.nudged && (t.y0 - e.clientY) > 70 && performance.now() - t.t0 < 220) {
    t.nudged = true;
    nudge(t.side === 0 ? 1 : -1);
  }
});
function endPointer(e) {
  const t = touches.get(e.pointerId);
  if (!t) return;
  touches.delete(e.pointerId);
  if (t.plunging) {
    if (G.state === 'play' && G.plungerBall && G.plungerPull > 0.04) launch(G.plungerPull);
    G.plungerPull = 0;
  } else if (t.flipped) setFlipper(t.side, false);
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
window.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.state === 'play') { G.state = 'paused'; G.menuSel = 0; }
});

/* keyboard plunger pull */
function updPlunger(dt) {
  if (G.state === 'play' && G.plungerBall && held.plunge) G.plungerPull = clamp(G.plungerPull + dt * 1.4, 0, 1);
}

/* ════════════════════ MAIN LOOP ════════════════════ */
function frame(t) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = t;
  let dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  if (G.state !== 'paused') {
    updPlunger(dt);
    update(dt);
  } else G.attractT += dt;
  render();
}
resize();
fetchGlobal();
document.getElementById('boot').style.display = 'none';
requestAnimationFrame(frame);

/* test hooks */
window.__pd = { G, T, SAUCER, flippers, startGame, launch, spawnPlungerBall, nudge, get state() { return G.state; } };
</script>
</body>
