<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Night Fireworks Show</title>
<meta name="description" content="Two fireworks demos: the classic 2D night show, and Harbour Nocturne, a real-time 3D display over a harbour with physically timed sound.">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#02060d;color:#f7f3ea;overflow:hidden}
.top{position:fixed;left:0;right:0;top:0;z-index:2;height:calc(42px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#081425,#050b16);border-bottom:1px solid rgba(197,225,255,0.14);font-family:"Trebuchet MS",Verdana,sans-serif}
.name{font:700 15px/1 Georgia,"Times New Roman",serif;letter-spacing:.02em;white-space:nowrap}
.tabs{display:flex;gap:3px;padding:3px;border-radius:999px;background:rgba(255,255,255,0.04);border:1px solid rgba(197,225,255,0.14)}
.tabs a{display:block;padding:7px 13px;border-radius:999px;color:#c4d0df;text-decoration:none;font:600 12px/1 "Trebuchet MS",Verdana,sans-serif;letter-spacing:.03em;white-space:nowrap}
.tabs a:hover{color:#fff}
.tabs a.on{color:#fff;background:linear-gradient(180deg,rgba(255,217,135,0.34),rgba(255,108,47,0.16));box-shadow:0 0 16px rgba(255,185,97,0.18)}
.tabs a:focus-visible{outline:2px solid #ffd48d;outline-offset:1px}
.fs{margin-left:auto;appearance:none;background:transparent;border:1px solid rgba(197,225,255,0.18);color:#c4d0df;border-radius:999px;padding:6px 12px;font:600 12px/1 "Trebuchet MS",Verdana,sans-serif;letter-spacing:.03em;cursor:pointer;white-space:nowrap}
.fs:hover{color:#fff;border-color:rgba(255,230,190,0.4)}
.fs:focus-visible{outline:2px solid #ffd48d;outline-offset:1px}
.back{margin-left:auto;color:#c4d0df;font-size:12px;text-decoration:none;white-space:nowrap}
.fs + .back{margin-left:10px}
.back:hover{color:#fff}
iframe{position:fixed;left:0;right:0;bottom:0;top:calc(42px + env(safe-area-inset-top,0px));width:100%;height:calc(100% - 42px - env(safe-area-inset-top,0px));border:0;display:block;background:#02060d}
@media (max-width:620px){
  .name,.back .w{display:none}
  .tabs{flex:1}
  .tabs a{flex:1;text-align:center;padding:7px 6px}
  .tabs .w,.fs .w{display:none}
  .fs{padding:6px 9px}
}
</style>
</head>
<body>
<div class="top">
  <span class="name">Night Fireworks Show</span>
  <nav class="tabs" aria-label="Choose a demo">
    <a href="#demo1" data-d="1">Demo 1<span class="w"> · Classic 2D</span></a>
    <a href="#demo2" data-d="2">Demo 2<span class="w"> · 3D Harbour</span></a>
  </nav>
  <button class="fs" id="fs" type="button" aria-label="Full screen">&#x26F6;<span class="w"> Full screen</span></button>
  <a class="back" href="../../" target="_top">← <span class="w">Games</span></a>
</div>
<iframe id="demo" allow="autoplay; fullscreen" title="Fireworks demo"></iframe>
<script>
(() => {
  const frame = document.getElementById('demo');
  const tabs = document.querySelectorAll('.tabs a');
  function show() {
    const d = location.hash === '#demo1' ? '1' : '2';
    const src = `demo${d}/` + (d === '2' ? location.search : '');
    if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
    tabs.forEach(a => a.classList.toggle('on', a.dataset.d === d));
    document.title = d === '1' ? 'Night Fireworks Show · Demo 1' : 'Night Fireworks Show · Demo 2 · Harbour Nocturne';
  }
  frame.addEventListener('load', () => { try { frame.contentWindow.focus(); } catch (e) {} });
  const fs = document.getElementById('fs');
  const req = frame.requestFullscreen || frame.webkitRequestFullscreen;
  if (!req || !(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fs.remove();
  else fs.onclick = () => { try { const p = req.call(frame, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (e) {} };
  addEventListener('hashchange', show);
  show();
})();
</script>
</body>
</html>
