<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Harbour Nocturne · 3D Fireworks</title>
<meta name="description" content="A real-time 3D fireworks display over a harbour at night: physically timed sound, drifting lit smoke, reflections on the water, a bridge waterfall and a city skyline.">
<style>
:root{
  --panel:rgba(8,14,26,0.5);
  --panel-border:rgba(197,225,255,0.2);
  --text:#f7f3ea;
  --muted:#b9c6d6;
  --accent:#ffd48d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#020409;color:var(--text)}
body{font-family:Georgia,"Times New Roman",serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.glass{background:var(--panel);border:1px solid var(--panel-border);border-radius:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 18px 50px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.06)}
.title{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 13px 9px;max-width:min(64vw,400px);pointer-events:none;transition:opacity .6s}
.eyebrow{display:block;font:600 11px/1.2 "Trebuchet MS",Verdana,sans-serif;text-transform:uppercase;letter-spacing:.18em;color:var(--accent);margin-bottom:6px}
h1{margin:0;font-size:clamp(18px,3.2vw,28px);line-height:1;font-weight:700;letter-spacing:.02em}
.meta{margin-top:6px;color:var(--muted);font:500 11px/1.4 "Trebuchet MS",Verdana,sans-serif}
.meta b{color:var(--text);font-weight:600}
.bar{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;max-width:min(54vw,560px);padding:9px}
button{appearance:none;border:1px solid rgba(255,239,207,0.18);background:linear-gradient(180deg,rgba(255,228,170,0.16),rgba(255,134,74,0.08));color:var(--text);border-radius:999px;min-height:38px;padding:0 13px;font:600 12.5px/1 "Trebuchet MS",Verdana,sans-serif;letter-spacing:.03em;cursor:pointer;white-space:nowrap}
button:hover{border-color:rgba(255,230,190,0.4)}
button.on{background:linear-gradient(180deg,rgba(255,217,135,0.36),rgba(255,108,47,0.16));box-shadow:0 0 18px rgba(255,185,97,0.2)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.picker{position:fixed;right:12px;top:calc(70px + env(safe-area-inset-top,0px));display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px;width:min(92vw,400px);z-index:5}
.picker.show{display:grid}
.picker button{min-height:34px;font-size:12px;padding:0 8px}
.picker .lbl{grid-column:1/-1;font:600 10.5px/1 "Trebuchet MS",Verdana,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);padding:4px 2px 2px}
.caption{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font:italic 500 clamp(14px,1.8vw,19px)/1.3 Georgia,serif;color:#fff6e6;text-shadow:0 1px 12px rgba(0,0,0,0.8);pointer-events:none;opacity:0;transition:opacity .9s;max-width:70vw}
.caption small{display:block;font:600 10.5px/1.4 "Trebuchet MS",Verdana,sans-serif;font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:.9}
.caption.show{opacity:1}
.hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 14px;border-radius:999px;font:500 12px/1.2 "Trebuchet MS",Verdana,sans-serif;color:#dfe7f2;pointer-events:none;transition:opacity 1s;white-space:nowrap}
.sound{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 22px;border-radius:999px;font:600 14px/1.2 "Trebuchet MS",Verdana,sans-serif;pointer-events:none;transition:opacity .6s}
.stats{position:fixed;left:12px;top:calc(110px + env(safe-area-inset-top,0px));font:500 11px/1.45 ui-monospace,Consolas,monospace;color:#cfe3ff;background:rgba(0,0,0,0.45);padding:6px 8px;border-radius:8px;white-space:pre;pointer-events:none;display:none}
.fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font:500 15px/1.5 "Trebuchet MS",Verdana,sans-serif}
.fail a{color:var(--accent)}
.hide{opacity:0!important}
@media (max-width:760px){
  .bar{left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:none;justify-content:center;gap:5px;padding:7px}
  button{min-height:34px;padding:0 10px;font-size:11.5px}
  .picker{left:8px;right:8px;width:auto;top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .caption{bottom:calc(var(--barH,112px) + 18px + env(safe-area-inset-bottom,0px))}
  .hint{bottom:calc(var(--barH,112px) + 18px + env(safe-area-inset-bottom,0px));white-space:normal;width:max-content;max-width:86vw;text-align:center}
  .title{max-width:calc(100vw - 24px)}
  .title.faded{opacity:0}
}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="gl" aria-label="3D fireworks display over a harbour at night. Tap the sky to launch a shell."></canvas>
<div class="title glass" id="title">
  <span class="eyebrow">Demo 2 · real-time 3D</span>
  <h1>Harbour Nocturne</h1>
  <div class="meta" id="meta"><b id="act">Overture</b> · sound reaches you at 343 m/s, about 2.6 s after the light</div>
</div>
<div class="bar glass" id="bar">
  <button id="autoBtn" class="on" type="button">Auto show</button>
  <button id="viewBtn" type="button">View: Terrace</button>
  <button id="shellBtn" type="button">Shell: Random</button>
  <button id="finaleBtn" type="button">Finale</button>
  <button id="slowBtn" type="button">Slow motion</button>
  <button id="longBtn" type="button">Long exposure</button>
  <button id="soundBtn" class="on" type="button">Sound: On</button>
  <button id="photoBtn" type="button">Photo</button>
</div>
<div class="picker glass" id="picker"></div>
<div class="caption" id="caption"></div>
<div class="hint glass" id="hint">Tap the sky to fire a shell · drag to look around · scroll or pinch to zoom</div>
<div class="sound glass hide" id="soundHint">Tap anywhere for sound</div>
<div class="stats" id="stats"></div>
<div class="fail" id="fail"><div>This demo needs WebGL 2, which this browser does not offer.<br><a href="../demo1/" target="_top">Open Demo 1 · Classic 2D</a></div></div>
<script type="module" src="./js/main.js?v=1"></script>
</body>
</html>
