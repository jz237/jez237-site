<script>
"use strict";
/* MARBLE MADNESS — practice build. Clean-room recreation: all code + art original.
   Engine: axonometric per-cell heightfield, painter-order prerender, fixed-step physics,
   dynamic (animated) wave bands, multi-race chain with time carryover, Steelie rival AI. */
const VERSION = '0.5.0';
const QA = new URLSearchParams(location.search).has('qa');

/* ---------- projection basis (trimetric-ish; tune vs reference later) ---------- */
const AXx = 15, AXy = 3;      // +v (across course) screen delta
const AUx = -6, AUy = 10;     // +u (down course) screen delta
const AZ  = 16;               // pixels per height unit
const DET = AXx*AUy - AUx*AXy;
function projX(v,u){ return v*AXx + u*AUx; }
function projY(v,u,z){ return v*AXy + u*AUy - z*AZ; }
function screenToGrid(sx,sy){ return { dv:(AUy*sx - AUx*sy)/DET, du:(-AXy*sx + AXx*sy)/DET }; }

/* ---------- course builder ---------- */
const NORMAL=0, GOAL=1;
const ABYSS=-2.5;
let CV=0, CU=0, cells=null, dynBand=null, decorFn=null, simT=0;
function newGrid(cv,cu){ CV=cv; CU=cu; dynBand=null; decorFn=null; hazards=[];
  cells=new Array(CU); for(let u=0;u<CU;u++) cells[u]=new Array(CV).fill(null); }
function put(v,u,h00,h10,h01,h11,o){ cells[u][v]={h00,h10,h01,h11,type:(o&&o.type)||NORMAL,tint:(o&&o.tint)||null,tex:(o&&o.tex)||null}; }
function carve(v0,u0,v1,u1){ for(let u=u0;u<=u1;u++)for(let v=v0;v<=v1;v++) cells[u][v]=null; }
function slab(v0,u0,v1,u1,h,o){ for(let u=u0;u<=u1;u++)for(let v=v0;v<=v1;v++) put(v,u,h,h,h,h,o); }
function rampU(v0,u0,v1,u1,hTop,hBot,o){ const n=(u1+1-u0);
  for(let u=u0;u<=u1;u++){ const a=hTop+(hBot-hTop)*(u-u0)/n, b=hTop+(hBot-hTop)*(u+1-u0)/n;
    for(let v=v0;v<=v1;v++) put(v,u,a,a,b,b,o); } }
function rampV(v0,u0,v1,u1,hL,hR,o){ const n=(v1+1-v0);
  for(let v=v0;v<=v1;v++){ const a=hL+(hR-hL)*(v-v0)/n, b=hL+(hR-hL)*(v+1-v0)/n;
    for(let u=u0;u<=u1;u++) put(v,u,a,b,a,b,o); } }
function waves(v0,u0,v1,u1,hTop,hBot,amp,perV,perU,o){
  const f=(v,u)=>{ const t=(u-u0)/(u1+1-u0);
    const eased=Math.min(1,Math.min(u-u0,(u1+1)-u)/2.2);
    return hTop+(hBot-hTop)*t + amp*Math.max(0,eased)*Math.sin(v*Math.PI*2/perV)*Math.sin(u*Math.PI*2/perU); };
  for(let u=u0;u<=u1;u++)for(let v=v0;v<=v1;v++) put(v,u,f(v,u),f(v+1,u),f(v,u+1),f(v+1,u+1),o);
}
function pyramid(v,u,base,peak,o){ const oo=o||{};
  put(v,u,  base,base,base,peak,oo); put(v+1,u,  base,base,peak,base,oo);
  put(v,u+1,base,peak,base,base,oo); put(v+1,u+1,peak,base,base,base,oo); }
/* animated band: cells must ALSO be authored (static shape ~ t=0) for prerender bounds */
function dynWaves(v0,u0,v1,u1,hTop,hBot,amp,perV,perU,speed,o){
  dynBand={v0,u0,v1,u1,hTop,hBot,amp,perV,perU,speed,tint:(o&&o.tint)||null,tex:(o&&o.tex)||null};
  waves(v0,u0,v1,u1,hTop,hBot,amp,perV,perU,o);
}
function dynH(v,u,t){ const b=dynBand;
  const tt=(u-b.u0)/(b.u1+1-b.u0);
  const easeU=Math.min(1,Math.min(u-b.u0,(b.u1+1)-u)/2.2);
  const easeV=Math.min(1,Math.min(v-b.v0,(b.v1+1)-v)/1.2);
  const eased=Math.max(0,Math.min(easeU,easeV));
  return b.hTop+(b.hBot-b.hTop)*tt + b.amp*eased*Math.sin(v*Math.PI*2/b.perV + t*b.speed*0.7)*Math.sin(u*Math.PI*2/b.perU + t*b.speed);
}
function inDyn(v,u){ return dynBand && v>=dynBand.v0 && v<dynBand.v1+1 && u>=dynBand.u0 && u<dynBand.u1+1; }
function cellAt(v,u){ const iu=Math.floor(u), iv=Math.floor(v);
  if(iu<0||iu>=CU||iv<0||iv>=CV) return null; return cells[iu][iv]; }
let hazards=[];              // per-race entities: muncher | acid | hill | tube
function hillsAt(v,u){ let dh=0;
  for(const h of hazards){ if(h.type!=='hill') continue;
    const dv=v-h.cv, du=u-h.cu, q=(dv*dv+du*du)/(2*h.sig*h.sig);
    if(q<9) dh+=h.amp*Math.exp(-q); }
  return dh; }
function groundH(v,u){ const c=cellAt(v,u); if(!c) return NaN;
  let base;
  if(inDyn(v,u)){
    const iv=Math.floor(v), iu=Math.floor(u), fv=v-iv, fu=u-iu;
    const a=dynH(iv,iu,simT)*(1-fv)+dynH(iv+1,iu,simT)*fv;
    const b=dynH(iv,iu+1,simT)*(1-fv)+dynH(iv+1,iu+1,simT)*fv;
    base=a*(1-fu)+b*fu;
  } else {
    const fv=v-Math.floor(v), fu=u-Math.floor(u);
    base=(c.h00*(1-fv)+c.h10*fv)*(1-fu) + (c.h01*(1-fv)+c.h11*fv)*fu;
  }
  return base+hillsAt(v,u); }

/* ---------- races ---------- */
function buildPractice(){ newGrid(24,88);
  const RED={tint:'#b34852'}, DARK={tint:'#79809f'}, GRID={tex:'grid'};
  waves(3,0,20,13,12,12,0.55,7,9,GRID);
  rampU(3,14,20,19,12,10,GRID);
  slab(3,20,20,27,10);
  pyramid(5,21,10,12.2); pyramid(17,21,10,12.2);
  slab(8,22,15,24,12.6,RED);
  slab(10,22,11,24,10);  slab(13,22,14,24,10);
  slab(8,22,8,24,12.6,RED); slab(12,22,12,24,12.6,RED); slab(15,22,15,24,12.6,RED);
  waves(3,28,20,43,10,5,0.6,6,8,GRID);
  rampU(3,44,20,50,5,4);
  slab(16,45,19,49,5.6,RED);
  slab(14,51,17,51,4,DARK);
  slab(3,51,13,51,5,DARK);
  rampV(4,52,17,56,2.5,4,DARK);
  slab(4,57,7,57,2.5,DARK);
  slab(8,57,17,57,4.8,DARK);
  rampV(4,58,17,62,2.5,1,DARK);
  slab(14,63,17,63,1,DARK);
  slab(3,63,13,63,3.6,DARK);
  slab(3,52,3,63,6,DARK); slab(18,52,18,63,6,DARK);
  rampU(3,64,18,72,1,0.5);
  slab(19,64,19,72,3); slab(2,64,2,72,3);
  rampU(2,73,13,77,0.5,0);
  slab(2,78,13,82,0);
  slab(3,78,12,79,0,{type:GOAL});
  slab(14,73,14,83,2.5); slab(1,73,1,83,2.5); slab(2,83,13,83,2.5);
  decorFn=(g,ox,oy)=>{
    g.strokeStyle='rgba(240,244,255,.85)'; g.lineWidth=2.5; g.setLineDash([8,6]); g.beginPath();
    for(let i=0;i<=30;i++){ const v=3.4+(20.4-3.4)*i/30; const h=groundH(v,8);
      const x=projX(v,8)+ox, y=projY(v,8,isNaN(h)?12:h+0.03)+oy;
      if(i===0) g.moveTo(x,y); else g.lineTo(x,y); }
    g.stroke(); g.setLineDash([]);
    goalText(g,8,75.6,0.28,ox,oy);
  };
}
function buildBeginner(){ newGrid(26,110);
  const GRID={tex:'grid'}, PINK={tint:'#c95f9d'}, TEAL={tex:'grid',tint:'#79b6b9'};
  // start plateau with box obstacles
  slab(3,0,22,8,14,GRID);
  slab(5,2,7,3,15.2,GRID); slab(16,4,18,5,15.2,GRID); slab(10,6,11,7,15.2,GRID);
  // terraces with offset ramps (fall risk at edges)
  slab(3,9,22,9,14,GRID);
  rampU(6,10,9,11,14,12); slab(3,12,22,12,12,GRID); slab(3,10,5,11,12,GRID); slab(10,10,22,11,12,GRID);
  rampU(16,13,19,14,12,10); slab(3,15,22,15,10,GRID); slab(3,13,15,14,10,GRID); slab(20,13,22,14,10,GRID);
  // split level: main path + side platform over void channel
  slab(3,16,12,24,10,GRID);
  slab(15,16,22,24,10,GRID);
  slab(13,19,14,20,10,GRID);                       // bridge between halves
  // pyramid zone
  slab(3,25,22,31,10,GRID);
  pyramid(6,26,10,12); pyramid(12,26,10,12); pyramid(18,26,10,12);
  // narrow to right-side channel, then pink slide down
  slab(14,32,21,38,10,GRID);
  rampU(15,39,20,46,10,4,PINK);
  slab(14,39,14,46,12,PINK); slab(21,39,21,46,12,PINK);   // slide walls
  // lower deck, twin narrow bridges over the big void
  slab(3,47,22,56,4,GRID);
  rampU(5,57,6,60,4,3); rampU(17,57,18,60,4,3);           // two 2-wide bridges
  slab(3,61,22,64,3,GRID);
  // steelie zone
  slab(3,65,22,74,3,GRID);
  slab(8,68,9,69,4.2,GRID); slab(15,71,16,72,4.2,GRID);
  // descent to the waves
  rampU(3,75,22,80,3,1.2,GRID);
  slab(3,81,22,82,1.2,GRID);
  // ANIMATED wave floor with central pit
  dynWaves(3,83,22,98,1.2,0.6,0.5,6,7,2.2,TEAL);
  carve(11,88,14,91);
  // goal apron
  rampU(3,99,22,102,0.6,0.2);
  slab(3,103,22,106,0.2);
  slab(4,104,21,105,0.2,{type:GOAL});
  slab(2,99,2,107,2.2); slab(23,99,23,107,2.2); slab(3,107,22,107,2.2);
  decorFn=(g,ox,oy)=>{ goalText(g,12.5,101.2,0.45,ox,oy); };
}
function buildIntermediate(){ newGrid(26,100);
  const CHK={tex:'check',tint:'#c98a52'}, CHKD={tex:'check',tint:'#a06a3c'}, PINK={tint:'#c95f9d'}, GRN={tint:'#5fae62'};
  // twin start spurs (1P uses left) merging onto a deck
  slab(4,0,8,4,14,CHK); slab(17,0,21,4,14,CHK);
  rampU(4,5,8,8,14,12,CHK); rampU(17,5,21,8,14,12,CHK);
  slab(3,9,22,14,12,CHK);
  // mesa maze: raised blocks over the deck, channels between
  slab(3,15,22,30,12,CHK);
  slab(4,16,8,19,14,CHKD); slab(12,16,16,18,14,CHKD); slab(19,16,22,20,14,CHKD);
  slab(3,22,7,26,14,CHKD); slab(11,21,15,25,14,CHKD); slab(18,23,22,27,14,CHKD);
  hazards.push({type:'muncher',v:9.5,u:20,homeV:9.5,homeU:20,phase:0,state:'idle',hopT:0,tv:9.5,tu:20});
  hazards.push({type:'muncher',v:16.5,u:27,homeV:16.5,homeU:27,phase:1.4,state:'idle',hopT:0,tv:16.5,tu:27});
  // acid gauntlet
  slab(3,31,22,38,12,CHK);
  for(const [av,au,dv,du] of [[6,33,3.1,1.3],[12,35,-2.6,1.7],[18,33,2.2,-1.5],[9,37,-2.9,-1.2]])
    hazards.push({type:'acid',v:av,u:au,dv,du,zone:{v0:4,v1:21,u0:31.5,u1:37.5},r:1.05,wob:Math.random()*6});
  // split descent: left ramp down, right balcony with pink drop tube
  rampU(3,39,12,46,12,7,CHK);
  slab(13,39,22,46,12,CHK);
  slab(15,40,18,43,12.01,PINK);
  carve(16,41,17,42);
  hazards.push({type:'tube',rect:{v0:16,v1:18,u0:41,u1:43},exit:{v:17,u:48},busyT:0});
  slab(3,47,22,54,7,CHK);
  // moving green hills zone
  rampU(3,55,22,57,7,5.5,CHK);
  slab(3,58,22,70,5.5,GRN);
  hazards.push({type:'hill',cv:7,cu:61,dV:2.2,dU:0,amp:2.1,sig:2.1,zone:{v0:4,v1:21,u0:59,u1:69}});
  hazards.push({type:'hill',cv:15,cu:64,dV:-1.8,dU:0.5,amp:2.3,sig:2.3,zone:{v0:4,v1:21,u0:59,u1:69}});
  hazards.push({type:'hill',cv:11,cu:67,dV:2.6,dU:-0.4,amp:1.8,sig:1.9,zone:{v0:4,v1:21,u0:59,u1:69}});
  // descent with two more acid pools
  rampU(3,71,22,78,5.5,3,CHK);
  for(const [av,au,dv,du] of [[8,74,2.4,1.1],[16,76,-2.2,0.9]])
    hazards.push({type:'acid',v:av,u:au,dv,du,zone:{v0:4,v1:21,u0:71.5,u1:77.5},r:1.0,wob:Math.random()*6});
  // final checkered ramp + goal
  rampU(3,79,22,86,3,1,CHK);
  slab(3,87,22,92,1,CHK);
  rampU(3,93,22,95,1,0.2,CHK);
  slab(3,96,22,99,0.2,CHK);
  slab(4,97,21,98,0.2,{type:GOAL});
  slab(2,93,2,99,2.2); slab(23,93,23,99,2.2); slab(3,99,22,99,2.4);
  decorFn=(g,ox,oy)=>{ goalText(g,12.5,94.6,0.6,ox,oy); };
}
function goalText(g,v,u,z,ox,oy){
  const t=document.createElement('canvas'); t.width=240; t.height=56; const tg=t.getContext('2d');
  tg.font='900 44px "Arial Black",Arial,sans-serif'; tg.textAlign='center'; tg.textBaseline='middle';
  tg.lineJoin='round'; tg.strokeStyle='#3a0d12'; tg.lineWidth=9; tg.strokeText('GOAL',120,30);
  tg.fillStyle='#e33049'; tg.fillText('GOAL',120,30);
  const cx=projX(v,u)+ox, cy=projY(v,u,z)+oy, sc=1/22;
  g.setTransform(AXx*sc,AXy*sc,AUx*sc,AUy*sc,cx,cy); g.drawImage(t,-120,-28); g.setTransform(1,0,0,1,0,0);
}
const RACES=[
  { name:'PRACTICE RACE', time:60, start:[11.5,4], build:buildPractice, steelie:null },
  { name:'BEGINNER RACE', time:60, start:[12.5,3], build:buildBeginner,
    steelie:{ v:18, u:68, triggerU:62 } },
  { name:'INTERMEDIATE RACE', time:35, start:[6.5,1], build:buildIntermediate,
    steelie:{ v:12, u:56, triggerU:48 } },
];

/* ---------- prerender ---------- */
function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function baseRGB(c){ if(c.tint) return hex2rgb(c.tint);
  const avg=(c.h00+c.h10+c.h01+c.h11)/4;
  return avg>=13.9?[176,188,232]:[160,174,222]; }
function topColor(c){
  const s=(c.h01+c.h11-c.h00-c.h10)/2; const [r,g,b]=baseRGB(c);
  const k=1 + Math.max(-1.2,Math.min(0,s))*-0.13 + Math.min(1.2,Math.max(0,s))*-0.08;
  return `rgb(${Math.round(r*k)},${Math.round(g*k)},${Math.round(b*k)})`;
}
function wallColor(c,f){ const [r,g,b]=baseRGB(c);
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`; }
let off,offX,offY,offW,offH;
function drawCellC(g,v,u,ox,oy,c){
  const x00=projX(v,u)+ox,   y00=projY(v,u,c.h00)+oy;
  const x10=projX(v+1,u)+ox, y10=projY(v+1,u,c.h10)+oy;
  const x01=projX(v,u+1)+ox, y01=projY(v,u+1,c.h01)+oy;
  const x11=projX(v+1,u+1)+ox,y11=projY(v+1,u+1,c.h11)+oy;
  const S=(u+1<CU)?cells[u+1][v]:null;
  const sA=S?S.h00:ABYSS, sB=S?S.h10:ABYSS;
  if(c.h01>sA+0.01||c.h11>sB+0.01){ g.fillStyle=wallColor(c,0.32); g.beginPath();
    g.moveTo(x01,y01); g.lineTo(x11,y11);
    g.lineTo(x11,projY(v+1,u+1,Math.min(sB,c.h11))+oy); g.lineTo(x01,projY(v,u+1,Math.min(sA,c.h01))+oy);
    g.closePath(); g.fill(); }
  const E=(v+1<CV)?cells[u][v+1]:null;
  const eA=E?E.h00:ABYSS, eB=E?E.h01:ABYSS;
  if(c.h10>eA+0.01||c.h11>eB+0.01){ g.fillStyle=wallColor(c,0.54); g.beginPath();
    g.moveTo(x10,y10); g.lineTo(x11,y11);
    g.lineTo(x11,projY(v+1,u+1,Math.min(eB,c.h11))+oy); g.lineTo(x10,projY(v+1,u,Math.min(eA,c.h10))+oy);
    g.closePath(); g.fill(); }
  if(c.type===GOAL){
    for(let i=0;i<3;i++)for(let j=0;j<3;j++){ const v0=v+i/3,v1=v+(i+1)/3,u0=u+j/3,u1=u+(j+1)/3;
      g.fillStyle=((i+j)%2)?'#e8ecf8':'#12141f'; g.beginPath();
      g.moveTo(projX(v0,u0)+ox,projY(v0,u0,c.h00)+oy); g.lineTo(projX(v1,u0)+ox,projY(v1,u0,c.h00)+oy);
      g.lineTo(projX(v1,u1)+ox,projY(v1,u1,c.h00)+oy); g.lineTo(projX(v0,u1)+ox,projY(v0,u1,c.h00)+oy);
      g.closePath(); g.fill(); }
  } else if(c.tex==='check'){
    const [r,gg,b]=baseRGB(c);
    const s=(c.h01+c.h11-c.h00-c.h10)/2;
    const k=1 + Math.max(-1.2,Math.min(0,s))*-0.13 + Math.min(1.2,Math.max(0,s))*-0.08;
    const c1=`rgb(${Math.round(r*k)},${Math.round(gg*k)},${Math.round(b*k)})`;
    const c2=`rgb(${Math.round(r*k*0.74)},${Math.round(gg*k*0.72)},${Math.round(b*k*0.7)})`;
    const hAt=(fv,fu)=>(c.h00*(1-fv)+c.h10*fv)*(1-fu)+(c.h01*(1-fv)+c.h11*fv)*fu;
    const par=(Math.floor(v)+Math.floor(u))%2;
    for(let i=0;i<2;i++)for(let j=0;j<2;j++){

  // goal
  const c=cellAt(player.v,player.u);
  if(c&&c.type===GOAL&&player.grounded){ carryTime=Math.max(0,timeLeft); state='goal'; stateT=0; Snd.goal();
    if(document.pointerLockElement===cv&&document.exitPointerLock) document.exitPointerLock(); }
}

/* ---------- render ---------- */
function marbleScreen(m){ return { x:projX(m.v,m.u)+offX-camX, y:projY(m.v,m.u,m.z)+offY-camY-m.r*AZ*0.55 }; }
function updateCam(){
  const px=projX(player.v,player.u)+offX, py=projY(player.v,player.u,player.z)+offY;
  const tx=Math.max(0,Math.min(offW-640,px-320)), ty=Math.max(0,Math.min(offH-400,py-170));
  if(!camInit){ camX=tx; camY=ty; camInit=true; }
  camX+=(tx-camX)*0.14; camY+=(ty-camY)*0.14;
}
function drawMarbleG(g,m){
  const p=marbleScreen(m); const r=m.r*14;
  const h=groundH(m.v,m.u);
  if(!isNaN(h)){ const sy=projY(m.v,m.u,h)+offY-camY; const k=Math.max(0.35,1-(m.z-h)*0.12);
    g.fillStyle='rgba(6,8,18,.38)'; g.beginPath();
    g.ellipse(projX(m.v,m.u)+offX-camX,sy-2,r*0.95*k,r*0.4*k,0,0,Math.PI*2); g.fill(); }
  const grad=g.createRadialGradient(p.x-r*0.38,p.y-r*0.45,r*0.12,p.x,p.y,r*1.05);
  if(m.kind==='steelie'){ grad.addColorStop(0,'#cfd3e2'); grad.addColorStop(0.25,'#6a7086');
    grad.addColorStop(0.6,'#2b2f40'); grad.addColorStop(1,'#0b0d16'); }
  else { grad.addColorStop(0,'#eef2ff'); grad.addColorStop(0.28,'#aebdf5');
    grad.addColorStop(0.62,'#5a70d8'); grad.addColorStop(1,'#26336e'); }
  g.fillStyle=grad; g.beginPath(); g.arc(p.x,p.y,r,0,Math.PI*2); g.fill();
  g.strokeStyle='rgba(12,16,40,.55)'; g.lineWidth=1; g.stroke();
  g.fillStyle='rgba(255,255,255,.9)'; g.beginPath(); g.arc(p.x-r*0.42,p.y-r*0.48,r*0.16,0,Math.PI*2); g.fill();
}
function redrawFront(g,m){
  const mu=Math.floor(m.u), px=projX(m.v,m.u)+offX;
  for(let u=mu+1;u<Math.min(CU,mu+5);u++)for(let v=0;v<CV;v++){ const c=cells[u][v]; if(!c) continue;
    const cx=projX(v+0.5,u)+offX; if(Math.abs(cx-px)>90) continue;
    const ch=Math.max(c.h00,c.h10,c.h01,c.h11); if(ch<=m.z+0.2) continue;
    g.save(); g.translate(-camX,-camY);
    if(inDyn(v,u)){ const dc=dynCellAt(v,u); if(dc) drawCellC(g,v,u,offX,offY,dc); }
    else drawCell(g,v,u,offX,offY);
    g.restore(); }
}
function hillCellC(v,u){ const c=cells[u][v]; if(!c) return null;
  return {h00:c.h00+hillsAt(v,u),h10:c.h10+hillsAt(v+1,u),h01:c.h01+hillsAt(v,u+1),
          h11:c.h11+hillsAt(v+1,u+1),type:c.type,tint:c.tint,tex:c.tex}; }
function drawAcid(g,h){
  const gh=groundH(h.v,h.u); if(isNaN(gh)) return;
  const px=projX(h.v,h.u)+offX-camX, py=projY(h.v,h.u,gh+0.02)+offY-camY;
  const r=h.r*(1+Math.sin(h.wob*3)*0.07);
  g.save(); g.setTransform(AXx,AXy,AUx,AUy,px,py);
  const rg=g.createRadialGradient(0,0,r*0.15,0,0,r);
  rg.addColorStop(0,'#b8f08c'); rg.addColorStop(0.5,'#59a844'); rg.addColorStop(1,'#2c6d2a');
  g.fillStyle=rg; g.beginPath(); g.arc(0,0,r,0,Math.PI*2); g.fill();
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle='rgba(220,255,190,.55)';
  const bx=px+Math.sin(h.wob*5)*4, by=py-2;
  g.beginPath(); g.arc(bx,by,1.6,0,Math.PI*2); g.fill();
  g.restore();
}
function drawMuncher(g,h){
  const gh=groundH(h.v,h.u); if(isNaN(gh)) return;
  const k=(h.state==='hop')?Math.sin(Math.min(1,h.hopK)*Math.PI):0;
  const px=projX(h.v,h.u)+offX-camX;
  const sy=projY(h.v,h.u,gh)+offY-camY;
  const py=projY(h.v,h.u,gh+k*0.85)+offY-camY;
  g.fillStyle='rgba(6,10,8,.35)'; g.beginPath();
  g.ellipse(px,sy-1,12*(1-k*0.3),5*(1-k*0.3),0,0,Math.PI*2); g.fill();
  const sq=1+Math.sin(h.phase*4)*0.07+(h.state==='hop'?0.2:0);
  for(let i=0;i<3;i++){
    const rr=11-i*2.6, yy=py-7-i*7.5*sq;
    const grd=g.createRadialGradient(px-3,yy-3,1,px,yy,rr+2);
    grd.addColorStop(0,'#c9f3a0'); grd.addColorStop(0.5,'#6fc258'); grd.addColorStop(1,'#2f7a34');
    g.fillStyle=grd; g.beginPath(); g.ellipse(px,yy,rr,rr*0.8,0,0,Math.PI*2); g.fill();
  }
  const ey=py-7-2*7.5*sq;
  g.fillStyle='#12240f'; g.beginPath();
  g.arc(px-3,ey-2,1.6,0,Math.PI*2); g.arc(px+3,ey-2,1.6,0,Math.PI*2); g.fill();
}
function text(g,s,x,y,size,color,align,font){
  g.font=`900 ${size}px ${font||'"Courier New",monospace'}`; g.textAlign=align||'center'; g.textBaseline='middle';
  g.fillStyle='rgba(0,0,0,.75)'; g.fillText(s,x+2,y+2); g.fillStyle=color; g.fillText(s,x,y);
}
function render(dt){
  const g=ctx2; g.clearRect(0,0,640,400);
  if(state==='title'){ renderTitle(g); return; }
  updateCam();
  g.drawImage(off,camX,camY,640,400,0,0,640,400);
  // animated wave band redraw (only cells near viewport)
  if(dynBand){ g.save(); g.translate(-camX,-camY);
    for(let u=dynBand.u0;u<=dynBand.u1;u++){
      if(projY(12,u,3)+offY<camY-40||projY(12,u,-1)+offY>camY+460) continue;
      for(let v=dynBand.v0;v<=dynBand.v1;v++){ const dc=dynCellAt(v,u); if(dc) drawCellC(g,v,u,offX,offY,dc); } }
    g.restore(); }
  // moving hills: redraw affected cells with field-displaced corners
  const hills=hazards.filter(h=>h.type==='hill');
  if(hills.length){ g.save(); g.translate(-camX,-camY);
    const seen=new Set(), list=[];
    for(const h of hills){ const R=Math.ceil(h.sig*3);
      for(let u=Math.max(0,Math.floor(h.cu)-R);u<=Math.min(CU-1,Math.floor(h.cu)+R);u++)
        for(let v=Math.max(0,Math.floor(h.cv)-R);v<=Math.min(CV-1,Math.floor(h.cv)+R);v++){
          const key=u*1000+v; if(seen.has(key)) continue; seen.add(key); list.push([u,v]); } }
    list.sort((a,b)=>(a[0]-b[0])||(a[1]-b[1]));
    for(const [u,v] of list){ const hc=hillCellC(v,u); if(hc) drawCellC(g,v,u,offX,offY,hc); }
    g.restore(); }
  for(const h of hazards) if(h.type==='acid') drawAcid(g,h);
  // marbles + munchers back-to-front
  const ents=[];
  for(const m of marbles) if(m.active&&!m.hidden&&(m.alive||(m.kind==='player'&&m.deathKind==='fall'&&stateT<0.9)))
    ents.push({k:m.v+m.u,m});
  for(const h of hazards) if(h.type==='muncher') ents.push({k:h.v+h.u,h});
  ents.sort((a,b)=>a.k-b.k);
  for(const e of ents){ if(e.m){ drawMarbleG(g,e.m); redrawFront(g,e.m); } else drawMuncher(g,e.h); }
  for(const s of shards){ s.t+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=460*dt;
    g.globalAlpha=Math.max(0,1-s.t/1.1); g.fillStyle=s.col||'#c9d6ff';
    g.beginPath(); g.arc(s.x,s.y,s.r,0,Math.PI*2); g.fill(); g.globalAlpha=1; }
  shards=shards.filter(s=>s.t<1.1);
  // HUD
  text(g,'SCORE',60,22,15,'#9fb0e8','center');
  text(g,String(score).padStart(6,'0'),60,42,20,'#eef2ff','center');
  text(g,'TIME',580,22,15,timeLeft<=6?'#ff7a8a':'#9fb0e8','center');
  text(g,String(Math.ceil(timeLeft)),580,46,30,timeLeft<=6?'#ff4a60':'#eef2ff','center');
  if(state==='ready'){ stateT+=dt;
    text(g,RACES[raceIdx].name,320,150,30,'#ffd23a');
    text(g,'GET READY!',320,196,20,'#eef2ff');
    if(stateT>1.5){ state='race'; stateT=0; Snd.ready(2); } }
  if(state==='race'&&!player.alive){
    const dm={shatter:'SMASHED!',fall:'OFF THE EDGE!',eaten:'GULPED!',dissolved:'DISSOLVED!'};
    text(g,dm[player.deathKind]||'OUCH!',320,168,22,'#ff97a5'); }
  if(state==='race'&&paused){ text(g,'PAUSED',320,180,30,'#eef2ff'); text(g,'press P or click',320,214,14,'#9fb0e8'); }
  if(state==='goal'){ stateT+=dt;
    text(g,'RACE COMPLETE!',320,150,32,'#ffd23a');
    if(timeLeft>0&&stateT>0.8){ const take=Math.min(timeLeft,dt*16); timeLeft-=take; score+=Math.round(take*100);
      if(Math.random()<dt*22) Snd.count(); }
    text(g,'TIME BONUS  '+String(Math.ceil(timeLeft)).padStart(2,'0')+'  ×100',320,196,16,'#c8d2f8');
    if(timeLeft<=0.01&&stateT>2.4){
      if(raceIdx+1<RACES.length){ loadRace(raceIdx+1); }
      else {
        text(g,'AERIAL RACE is under construction in this build',320,246,14,'#9fb0e8');
        if(stateT>5.2){ state='title'; stateT=0; } } } }
  if(state==='timeup'){ stateT+=dt;
    text(g,"TIME'S UP",320,160,34,'#ff4a60');
    text(g,'FINAL SCORE  '+score,320,206,18,'#eef2ff');
    text(g,'click / space to retry',320,244,14,'#9fb0e8'); }
}
let demoT=0;
function renderTitle(g){
  demoT+=1/60;
  g.fillStyle='#04050c'; g.fillRect(0,0,640,400);
  g.globalAlpha=0.16; if(off) g.drawImage(off,offW/2-380,60,760,475,0,0,640,400); g.globalAlpha=1;
  const grad=g.createLinearGradient(0,86,0,190);
  grad.addColorStop(0,'#ffe08a'); grad.addColorStop(0.45,'#ff9a3d'); grad.addColorStop(1,'#e0333d');
  g.font='900 64px "Arial Black",Arial,sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.lineJoin='round';
  g.strokeStyle='#1a0508'; g.lineWidth=10; g.strokeText('MARBLE',320,120); g.strokeText('MADNESS',320,186);
  g.fillStyle=grad; g.fillText('MARBLE',320,120); g.fillText('MADNESS',320,186);
  text(g,'A M I G A   T R I B U T E',320,232,13,'#9fb0e8');
  text(g,'PRACTICE BUILD v'+VERSION+' — 3 races · Steelie, munchers, acid pools, moving hills',320,258,12,'#66708f');
  if(Math.floor(demoT*1.6)%2===0) text(g,'CLICK  OR  PRESS  SPACE',320,300,18,'#ffd23a');
  text(g,'arrows / WASD roll the marble · click = mouse trackball · drag on touch · gamepad stick',320,338,12,'#8d97b8');
  text(g,'reach the GOAL before the clock runs out — big drops smash the marble',320,358,12,'#8d97b8');
}

/* ---------- main loop ---------- */
let last=performance.now(), acc=0, autoStep=true;
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.25) dt=0.25;
  if(autoStep){ acc+=dt; while(acc>=STEP){ physics(STEP); acc-=STEP; } }
  Snd.roll(Math.hypot(player.vv,player.vu),player.grounded&&player.alive&&state==='race');
  render(dt);
  requestAnimationFrame(frame);
}
loadRace(0); state='title';
requestAnimationFrame(frame);
console.log('[marble-madness] practice build v'+VERSION);

/* ---------- QA hooks ---------- */
if(QA){
  window.__qa={
    version:VERSION,
    get state(){ return state; }, get race(){ return raceIdx; },
    get pos(){ return {v:player.v,u:player.u,z:player.z}; },
    get vel(){ return {vv:player.vv,vu:player.vu,vz:player.vz}; },
    get steelie(){ return {active:steelie.active,alive:steelie.alive,v:steelie.v,u:steelie.u}; },
    get timeLeft(){ return timeLeft; }, get score(){ return score; }, get deaths(){ return deaths; },
    get carry(){ return carryTime; }, get lastDeath(){ return lastDeath; },
    start(){ startGame(); state='race'; },
    loadRace(i){ carryTime=0; loadRace(i); state='race'; },
    warp(v,u){ player.v=v; player.u=u; const h=groundH(v,u); player.z=isNaN(h)?6:h;
      player.vv=0;player.vu=0;player.vz=0;player.grounded=!isNaN(h); },
    input(gv,gu){ qaInp=(gv===null)?null:{v:gv,u:gu}; },
    lift(dz){ player.z+=dz; player.grounded=false; player.vz=0; player.dropIn=false; },
    hold(dir,on){ keys[dir]=!!on; },
    setTime(t){ timeLeft=t; },
    get hazards(){ return hazards.map(h=>({t:h.type,v:+(h.v??h.cv??0).toFixed(1),u:+(h.u??h.cu??0).toFixed(1)})); },
    get hidden(){ return player.hidden; },
    step(ms){ autoStep=false; const n=Math.round(ms/1000/STEP); for(let i=0;i<n;i++) physics(STEP); render(STEP*n); },
    auto(on){ autoStep=on; last=performance.now(); acc=0; }
  };
}
</script>
</body>
