<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive water review</title><style>body{margin:0;background:#102d39;color:#ecf9ff;font:13px system-ui}nav{position:absolute;top:10px;left:10px;z-index:2;background:#102d39db;padding:10px;border-radius:8px;max-width:90vw}button{padding:8px;margin:2px}output{display:block}canvas{display:block}</style></head><body><nav><button id="contact">Hull contact</button><button id="close">Hood beads</button><button id="wet">Splash craft</button><button id="dry">Dry finish</button><button id="pulse">Wave against wall</button><button id="pause">Pause</button><output id="status"></output></nav><script type="module">
import * as T from '../vendor/three.module.js';import {makeSky,makeOcean,shared} from '../ocean.js';import {makeJetSki} from '../jetski.js';import {makeCraftBeads} from '../water-beads.js';import {wave,craftFields} from '../simulation.js';import {cloudScene} from '../weather-light.js';import {createLocalWater,moveLocalWater,disturbLocalWater,stepLocalWater,setLocalWater} from '../local-water.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene(),camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,1200);scene.add(new T.HemisphereLight(0xc9e5f3,0x64716d,1.5));const sun=new T.DirectionalLight(0xffe0b5,3);sun.position.set(-30,50,-70);scene.add(sun);makeSky(scene);const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(scene,.05,.1,1500).texture;pmrem.dispose();document.body.append(renderer.domElement);
const ocean=makeOcean(renderer,scene,camera),v=makeJetSki(scene,{salvage:false}),beads=makeCraftBeads(v.boat),field=createLocalWater((x,z)=>Math.abs(x-5)<.7&&Math.abs(z)<8);moveLocalWater(field,0,0);setLocalWater(field);const wall=new T.Mesh(new T.BoxGeometry(1.4,5,16),new T.MeshStandardMaterial({color:0x7e8c85,roughness:.85}));wall.position.set(5,-.6,0);scene.add(wall);cloudScene(scene);
const r={x:0,z:0,heading:0,turn:.6,speed:20,hydro:{y:0,wet:1,impact:0,landingId:0,bowWet:1,sternWet:1}};let time=10,last=performance.now(),paused=false,hold=Infinity,mode='contact';
function view(m){mode=m;wall.visible=m==='pulse';v.boat.visible=m!=='pulse';if(m==='close'){camera.position.set(1.25,1.4,2.5);camera.lookAt(0,.65,1);}else if(m==='pulse'){camera.position.set(-8,5,8);camera.lookAt(2,0,0);}else{camera.position.set(-5,3.4,5);camera.lookAt(0,.3,0);}}
document.querySelector('#contact').onclick=()=>view('contact');document.querySelector('#close').onclick=()=>view('close');document.querySelector('#wet').onclick=()=>{r.hydro.impact=9;r.hydro.landingId++;beads.update(r,0,.01);};document.querySelector('#dry').onclick=()=>beads.reset();document.querySelector('#pulse').onclick=()=>{view('pulse');disturbLocalWater(field,1,0,2,1.1);paused=false;hold=time+1.4;};document.querySelector('#pause').onclick=()=>paused=!paused;view('contact');
function frame(now){const dt=paused?0:Math.min(.05,(now-last)/1000);last=now;time+=dt;if(time>=hold){paused=true;hold=Infinity;}shared.time.value=time;shared.storm.value=0;stepLocalWater(field,dt);Object.assign(craftFields[0],{...r,power:mode==='contact'?1:0,bowWet:1,sternWet:1});ocean.mat.uniforms.craft.value.set(0,0,0,craftFields[0].power);r.hydro.y=wave(0,0,time);v.boat.position.y=r.hydro.y+.03;beads.update({...r,speed:mode==='close'?0:20},0,dt);if(mode==='close'){camera.position.y=r.hydro.y+1.4;camera.lookAt(0,r.hydro.y+.65,1);}if(Math.floor(time*60)%60===0)cloudScene(scene);ocean.syncWake();ocean.updateFoam(dt,0,0);ocean.render();document.querySelector('#status').textContent=JSON.stringify({mode,wet:+beads.state.wet.toFixed(3),finishes:beads.count,energy:+field.energy.toFixed(5),paused});requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
