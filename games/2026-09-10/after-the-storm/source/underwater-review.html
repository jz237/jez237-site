<!doctype html><html><head><meta charset="utf-8"><title>Underwater scenery review</title><style>body{margin:0;background:#143a46;color:white;font:14px system-ui}nav{position:absolute;z-index:2;top:10px;left:10px;padding:10px;background:#102933dd;border-radius:8px}button{padding:9px;margin:3px}canvas{display:block}output{display:block}</style></head><body><nav>Underwater scenery review · same game water and habitats<br><button id="above">Above water</button><button id="below">Underwater detail</button><button id="next">Next habitat</button><button id="disturb">Pass a rider</button><output id="status"></output></nav><script type="module">
import * as T from '../vendor/three.module.js';
import {makeOcean,makeSky,shared} from '../ocean.js';
import {makeCourseWorld} from '../course-world.js';
import {getCourse} from '../courses.js';
import {habitatSites} from '../underwater-life.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);document.body.append(renderer.domElement);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(52,innerWidth/innerHeight,.1,1500);scene.add(new T.HemisphereLight(0xc0e8ff,0x647052,2.3));const sun=new T.DirectionalLight(0xffecc4,3);sun.position.set(-50,100,-60);scene.add(sun);makeSky(scene);const course=getCourse('greyhaven'),ocean=makeOcean(renderer,scene,camera);ocean.setVenue(course);ocean.setQuality('medium');const world=makeCourseWorld(scene,course,ocean),sites=habitatSites(course);let index=0,below=false,disturb=0,time=0,previous=performance.now();
function frameSite(){const p=sites[index];camera.position.set(p.x+5,below?p.y+2.1:7,p.z+8);camera.lookAt(p.x,p.y+1,p.z);document.querySelector('#status').textContent=`Habitat ${index+1}/${sites.length} · bed ${p.y.toFixed(1)}m · ${below?'detail inspection':'through the game water'}`;}
document.querySelector('#above').onclick=()=>{below=false;frameSite();};document.querySelector('#below').onclick=()=>{below=true;frameSite();};document.querySelector('#next').onclick=()=>{index=(index+1)%sites.length;frameSite();};document.querySelector('#disturb').onclick=()=>{disturb=4;};frameSite();
function animate(now){const dt=Math.min(.1,(now-previous)/1000);previous=now;time+=dt;shared.time.value=time;shared.storm.value=.12;const p=sites[index];disturb=Math.max(0,disturb-dt);world.update(time,.12,null,Infinity,disturb?[{x:p.x+(2-disturb)*8,z:p.z,speed:20,hydro:{wet:1,impact:4}}]:[]);ocean.mat.uniforms.craft.value.set(p.x,p.z,0,0);ocean.updateFoam(dt,p.x,p.z);if(below){ocean.mesh.visible=false;renderer.render(scene,camera);ocean.mesh.visible=true;}else ocean.render();requestAnimationFrame(animate);}requestAnimationFrame(animate);
</script></body></html>
