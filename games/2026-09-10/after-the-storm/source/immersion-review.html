<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shore wash and cloud review</title><style>body{margin:0;background:#173c45;color:white;font:14px system-ui}nav{position:absolute;z-index:5;top:10px;left:10px;padding:10px;background:#17303de6;border-radius:8px}button{padding:9px;margin:3px}output{display:block;max-width:440px}canvas{display:block}</style></head><body><nav>Shallow basin, rock and drainage channel<br><button id="wash">Incoming wash</button><button id="ebb">Wave recedes</button><button id="surf">Breaking surf</button><button id="inspect">Inspect next breaker</button><button id="cloud">Advance weather</button><button id="pause">Pause</button><output id="status"></output></nav><script type="module">
import {makeCurlingBreakers} from '../curling-breakers.js';import * as T from '../vendor/three.module.js';import {makeSky,makeOcean,makeTerrain,shared,skyColors} from '../ocean.js';import {makeShoreWash} from '../shore-wash.js';import {makeCrestSpray} from '../crest-spray.js';import {surfStrength} from '../surf-waves.js';import {cloudScene,weatherUniforms} from '../weather-light.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);const scene=new T.Scene(),camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,1500);camera.position.set(19,8,19);camera.lookAt(6,.3,0);scene.add(new T.HemisphereLight(0xcbe7f3,0x817053,1.1));const sun=new T.DirectionalLight(0xffedcf,3);sun.position.set(-50,60,-60);scene.add(sun);skyColors.skySun.value.copy(sun.position).normalize();makeSky(scene);const generator=new T.PMREMGenerator(renderer);scene.environment=generator.fromScene(scene,.05,.1,1500).texture;generator.dispose();
const bed=(x,z)=>x*.05-.31*Math.exp(-((x-9)**2/13+z*z/14))-.1*Math.exp(-((z-1.5*Math.sin(x*.35))**2/1.5))*Math.exp(-((x-5)**2)/50);
const course={ground:bed,rocks:[{x:4,z:2,r:1.4,type:'rock'}]};makeTerrain(scene,bed,{sand:0xd8c99c});const rock=new T.Mesh(new T.IcosahedronGeometry(1.4,2),new T.MeshStandardMaterial({color:0x666f61,roughness:.7}));rock.position.set(4,.35,2);rock.scale.y=.65;scene.add(rock);cloudScene(scene);
const ocean=makeOcean(renderer,scene,camera),wash=makeShoreWash(scene),spray=makeCrestSpray(scene);wash.reset(course);const breakers=makeCurlingBreakers(scene);breakers.reset(course);const N=512,data=new Uint8Array(N*N*4);for(let z=0;z<N;z++)for(let x=0;x<N;x++){const h=bed((x/(N-1)-.5)*920,(z/(N-1)-.5)*920),v=Math.round(T.MathUtils.clamp((h+16)/100,0,1)*65535),i=(z*N+x)*4;data[i]=v>>8;data[i+1]=v&255;data[i+3]=255;}const map=new T.DataTexture(data,N,N,T.RGBAFormat);map.minFilter=map.magFilter=T.LinearFilter;map.needsUpdate=true;ocean.mat.uniforms.terrainMap.value=map;ocean.mat.uniforms.customTerrain.value=1;ocean.mat.uniforms.craft.value.set(0,0,0,0);
let time=0,last=performance.now(),paused=false,armed=false,ebb=false,cloudOffset=0;surfStrength.value=.35;shared.seaLevel.value=.5;document.querySelector('#inspect').onclick=()=>{armed=true;paused=false;surfStrength.value=1;};document.querySelector('#surf').onclick=()=>{shared.seaLevel.value=.1;surfStrength.value=1;camera.position.set(-12,3,16);camera.lookAt(-20,0,-3);};document.querySelector('#wash').onclick=()=>{ebb=false;shared.seaLevel.value=.5;surfStrength.value=.35;};document.querySelector('#ebb').onclick=()=>{ebb=true;shared.seaLevel.value=-.35;surfStrength.value=0;};document.querySelector('#pause').onclick=()=>paused=!paused;document.querySelector('#cloud').onclick=()=>time+=40;
function frame(now){let dt=Math.min(.15,(now-last)/1000);last=now;if(paused)dt=0;time+=dt;shared.time.value=time;shared.storm.value=.2;weatherUniforms.weatherTime.value=time+cloudOffset;wash.update(time,.2,camera.position,'high');spray.update(time,.2,camera.position,'high');breakers.update(time,.2,camera.position,'high');if(armed&&breakers.inspect(camera)){paused=true;armed=false;}ocean.updateFoam(dt,6,0);ocean.render();document.querySelector('#status').textContent=(ebb?'Receded wave · ':'Incoming water · ')+JSON.stringify(wash.stats)+' · spray '+spray.stats.alive+' · breakers '+JSON.stringify(breakers.stats);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
