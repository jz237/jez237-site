<!doctype html><html><head><meta charset="utf-8"><title>Wave wash and drying review</title><style>body{margin:0;background:#153a46;color:white;font:14px system-ui}nav{position:absolute;top:12px;left:12px;z-index:2;padding:12px;background:#153038dd;border-radius:10px}button{padding:10px;margin:3px}output{display:block}canvas{display:block}</style></head><body><nav>Shoreline wetness · actual terrain material and wave history<br><button id="waves">Wave wash</button><button id="drain">Drain beach</button><button id="quality">Change graphics</button><output id="status"></output></nav><script type="module">
import * as T from '../vendor/three.module.js';import {makeOcean,makeTerrain,makeSky,shared} from '../ocean.js';import {surfStrength} from '../surf-waves.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.append(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,1500);camera.position.set(12,6,17);camera.lookAt(0,.1,0);scene.add(new T.HemisphereLight(0xcbe7f3,0x817053,1.2));const sun=new T.DirectionalLight(0xffedcf,3);sun.position.set(-50,60,-60);scene.add(sun);makeSky(scene);
const floor=(x,z)=>x*.15+Math.sin(z*.21)*.07;makeTerrain(scene,floor,{sand:0xd8c99c});const ocean=makeOcean(renderer,scene,camera);ocean.setQuality('high');const n=512,data=new Uint8Array(n*n*4);for(let z=0;z<n;z++)for(let x=0;x<n;x++){const h=floor((x/(n-1)-.5)*920,(z/(n-1)-.5)*920),v=Math.round(T.MathUtils.clamp((h+16)/100,0,1)*65535),i=(z*n+x)*4;data[i]=v>>8;data[i+1]=v&255;data[i+3]=255;}const map=new T.DataTexture(data,n,n,T.RGBAFormat);map.minFilter=map.magFilter=T.LinearFilter;map.needsUpdate=true;ocean.mat.uniforms.terrainMap.value=map;ocean.mat.uniforms.customTerrain.value=1;ocean.mat.uniforms.craft.value.set(0,0,0,0);
let time=0,last=performance.now(),draining=false,dryTime=0;surfStrength.value=.9;document.querySelector('#waves').onclick=()=>{draining=false;surfStrength.value=.9;shared.seaLevel.value=0;};document.querySelector('#drain').onclick=()=>{draining=true;dryTime=0;surfStrength.value=0;shared.seaLevel.value=0;};document.querySelector('#quality').onclick=()=>ocean.setQuality(ocean.quality==='high'?'low':'high');
function frame(now){const dt=Math.min(1,(now-last)/1000);last=now;time+=dt;if(draining)dryTime+=dt;shared.time.value=time;shared.storm.value=draining?0:.12;ocean.updateFoam(dt,0,0);ocean.render();document.querySelector('#status').textContent=draining?`Drying ${dryTime.toFixed(1)} seconds · ${ocean.quality}`:`Waves washing beach · ${ocean.quality}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
