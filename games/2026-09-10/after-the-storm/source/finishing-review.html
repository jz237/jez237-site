<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coastal finishing review</title><style>body{margin:0;background:#173b46;color:white;font:14px system-ui}nav{position:absolute;z-index:5;top:10px;left:10px;padding:10px;background:#102933e8;border-radius:8px}button{padding:8px;margin:2px}canvas{display:block}output{display:block}</style></head><body><nav>Coastal finishing review<br><button id="beach">Beach grove</button><button id="pines">Lake pines</button><button id="port">Port waterline</button><button id="landing">Heavy landing</button><button id="pause">Pause</button><output id="status"></output></nav><script type="module">
import {cloudScene} from '../weather-light.js';import * as T from '../vendor/three.module.js';import {makeOcean,makeSky,shared} from '../ocean.js';import {makeCourseWorld} from '../course-world.js';import {getCourse} from '../courses.js';import {makeFinishingEffects} from '../finishing-effects.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(52,innerWidth/innerHeight,.1,1800);scene.fog=new T.FogExp2(0xa3b7b6,.0015);scene.add(new T.HemisphereLight(0xcbe7f3,0x817053,1.4));const sun=new T.DirectionalLight(0xffedcf,3);sun.position.set(-50,70,-60);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-160,right:160,top:160,bottom:-160,far:500});scene.add(sun,sun.target);makeSky(scene);
const ocean=makeOcean(renderer,scene,camera),effects=makeFinishingEffects(scene);let world,course,time=0,last=performance.now(),paused=false,holdAt=Infinity;
function load(id){course=getCourse(id);ocean.setVenue(course);ocean.resetFoam();world?.dispose();world=makeCourseWorld(scene,course,ocean);effects.reset(course);cloudScene(scene);if(id==='port'){camera.position.set(-143,1.8,102);camera.lookAt(-150,-.1,110);}else if(id==='greyhaven'){camera.position.set(77,7,45);camera.lookAt(120,7,-10);}else{camera.position.set(-100,8,20);camera.lookAt(-155,9,-30);}const c=world.root.userData.sceneryCounts;document.querySelector('#status').textContent=course.name+' · '+c.trees+' trees · '+c.grass+' grass clusters · '+JSON.stringify(world.root.userData.waterlineDetail);}
document.querySelector('#port').onclick=()=>load('port');document.querySelector('#beach').onclick=()=>load('greyhaven');document.querySelector('#pines').onclick=()=>load('reed');document.querySelector('#pause').onclick=()=>paused=!paused;document.querySelector('#landing').onclick=()=>{paused=false;holdAt=time+.28;camera.position.set(56,3,30);camera.lookAt(60,0,20);effects.landing({x:60,z:20,vx:0,vz:-18,speed:25,heading:Math.PI,hydro:{impact:11}},camera.position);};load('greyhaven');
function frame(now){let dt=Math.min(.1,(now-last)/1000);last=now;if(paused)dt=0;time+=dt;if(time>=holdAt){paused=true;holdAt=Infinity;}shared.time.value=time;shared.storm.value=.12;world.update(time,.12,null,Infinity,[],[1,camera.position]);effects.update(time,.12,camera.position,'high');ocean.mat.uniforms.craft.value.set(camera.position.x,camera.position.z,0,0);ocean.updateFoam(dt,camera.position.x,camera.position.z);ocean.render();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
