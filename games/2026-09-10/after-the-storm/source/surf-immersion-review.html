<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surf immersion review</title><style>body{margin:0;background:#12313c;color:#ecf9ff;font:13px system-ui}nav{position:absolute;top:10px;left:10px;z-index:2;background:#102d39da;padding:10px;border-radius:8px;max-width:90vw}button{padding:9px;margin:2px}output{display:block;max-width:75vw}canvas{display:block}</style></head><body><nav><button id="breaker">Inspect breaking lip</button><button id="shore">Shoreline and pools</button><button id="pause">Pause / resume</button><output id="status"></output></nav><script type="module">
import * as T from '../vendor/three.module.js';import {makeSky,makeOcean,shared,skyColors} from '../ocean.js';import {makeCourseWorld} from '../course-world.js';import {getCourse} from '../courses.js';import {createRace} from '../race-core.js';import {makeCurlingBreakers} from '../curling-breakers.js';import {makeCrestSpray} from '../crest-spray.js';import {shoreSites} from '../shoreline-life.js';import {cloudScene} from '../weather-light.js';import {wave} from '../simulation.js';
const c=getCourse('greyhaven'),state=createRace({course:c,seaState:'surf'}),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene(),camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,1800);scene.add(new T.HemisphereLight(0xc9e5f3,0x64716d,1.4));const sun=new T.DirectionalLight(0xffe0b5,3);sun.position.set(-50,90,-100);scene.add(sun);makeSky(scene);const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(scene,.04,.1,1500).texture;pmrem.dispose();document.body.append(renderer.domElement);const ocean=makeOcean(renderer,scene,camera),world=makeCourseWorld(scene,c,ocean),breakers=makeCurlingBreakers(scene),spray=makeCrestSpray(scene);breakers.reset(c);cloudScene(scene);let time=0,last=performance.now(),paused=false,mode='breaker',seeking=true;
function view(m){mode=m;paused=false;seeking=m==='breaker';if(m==='breaker'){camera.position.set(-60,4,-15);camera.lookAt(-35,0,0);}else{const p=shoreSites(c).find((p,i)=>i%3===0&&p.y<1.1)||shoreSites(c)[0];camera.position.set(p.x-p.nx*9+p.nz*5,p.y+3,p.z-p.nz*9-p.nx*5);camera.lookAt(p.x,p.y+.2,p.z);}}
document.querySelector('#breaker').onclick=()=>view('breaker');document.querySelector('#shore').onclick=()=>view('shore');document.querySelector('#pause').onclick=()=>paused=!paused;view('breaker');
function frame(now){const dt=paused?0:Math.max(0,Math.min(.05,(now-last)/1000));last=now;time+=dt;shared.time.value=time;shared.storm.value=.3;ocean.mat.uniforms.craft.value.set(camera.position.x,camera.position.z,0,0);world.update(time,.3,null,Infinity,[],[1,camera.position]);breakers.update(time,.3,camera.position,'high');spray.update(time,.3,camera.position,'high');if(seeking&&breakers.inspect(camera)){seeking=false;paused=true;}ocean.updateFoam(dt,camera.position.x,camera.position.z);ocean.render();document.querySelector('#status').textContent=JSON.stringify({mode,time:+time.toFixed(2),paused,breakers:breakers.stats,shoreline:world.root.userData.shorelineLife,crestSpray:spray.stats});requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
