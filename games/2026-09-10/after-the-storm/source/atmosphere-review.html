<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continuous sky and rain front review</title><style>body{margin:0;background:#1a3444;font:14px system-ui;color:white}canvas{display:block}nav{position:fixed;z-index:3;top:12px;left:12px;background:#123a49df;padding:12px;border-radius:8px}button{padding:9px;margin:3px}output{display:block;margin:6px}</style></head><body><nav><button data-t="0">Clear sky</button><button data-t="120">Approaching rain</button><button data-t="195">Front arriving</button><button data-t="270">Behind front</button><button id="orbit">Turn view</button><output></output></nav><script type="module">
import * as T from '../vendor/three.module.js';import {makeSky,shared,skyColors} from '../ocean.js';import {weatherUniforms} from '../weather-light.js';import {frontEnabled,frontAt} from '../weather-front.js';
const scene=new T.Scene(),renderer=new T.WebGLRenderer({antialias:true}),camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,2000);renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1));renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const sky=makeSky(scene);sky.material.uniforms.skySteps.value=32;frontEnabled.value=1;skyColors.skyHorizon.value.setHex(0xb2dce9);skyColors.skyZenith.value.setHex(0x187fc0);skyColors.skySun.value.set(-.35,.32,-.9).normalize();camera.position.set(0,3,0);let time=0,angle=0;function render(){const x=.86*Math.cos(angle)+.51*Math.sin(angle),z=-.51*Math.cos(angle)+.86*Math.sin(angle);camera.lookAt(x*300,95,z*300);shared.time.value=time;shared.storm.value=.18;weatherUniforms.weatherTime.value=time;weatherUniforms.weatherStorm.value=.18;weatherUniforms.weatherSun.value.copy(skyColors.skySun.value);renderer.render(scene,camera);document.querySelector('output').textContent=JSON.stringify({time,front:frontAt(0,0,time),steps:sky.material.uniforms.skySteps.value});}document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{time=Number(b.dataset.t);render()});document.querySelector('#orbit').onclick=()=>{angle+=Math.PI/2;render()};onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();render()};render();
</script></body></html>
